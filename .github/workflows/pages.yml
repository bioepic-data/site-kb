name: Build and publish site browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install project and validation tools
        run: python -m pip install -e . pytest linkml "linkml-term-validator>=0.3.0"
      - name: Lint schema
        # Existing documentation and enum-naming warnings remain visible; errors fail CI.
        run: linkml-lint --ignore-warnings src/site_kb/schema
      - name: Check schema and Python model generation
        run: |
          gen-project --config-file config.yaml -d tmp src/site_kb/schema/site_kb.yaml
          gen-project -d src/site_kb/datamodel -I python src/site_kb/schema/site_kb.yaml
          gen-pydantic src/site_kb/schema/site_kb.yaml > src/site_kb/datamodel/site_kb_pydantic.py
      - name: Test
        run: |
          python -m pytest -q
          node --test tests/web.test.cjs
      - name: Validate examples and reject counterexamples
        run: |
          mkdir -p examples/output
          linkml-run-examples \
            --input-formats json --input-formats yaml \
            --output-formats json --output-formats yaml \
            --counter-example-input-directory tests/data/invalid \
            --input-directory tests/data/valid \
            --output-directory examples/output \
            --schema src/site_kb/schema/site_kb.yaml
      - name: Assemble and validate database
        run: |
          python -m site_kb.scripts.build_db
          linkml-validate -s src/site_kb/schema/site_kb.yaml -C SiteCollection db/sites/sites.yaml
          for file in db/curated/variable_mappings/*.yaml; do
            [ -f "$file" ] || continue
            linkml-validate -s src/site_kb/schema/site_kb.yaml -C VariableMappingCollection "$file"
          done
          for file in db/profiles/*.yaml; do
            [ -f "$file" ] || continue
            linkml-validate -s src/site_kb/schema/site_kb.yaml -C MeasurementProfileCollection "$file"
          done
      - name: Validate ontology identifiers and labels
        run: |
          python -m site_kb.scripts.prepare_term_sources
          linkml-term-validator validate-schema src/site_kb/schema/site_kb.yaml -c conf/oak_config.yaml
          linkml-term-validator validate-data db/sites/sites.yaml -s src/site_kb/schema/site_kb.yaml -t SiteCollection -c conf/oak_config.yaml
          for file in db/profiles/*.yaml; do
            [ -f "$file" ] || continue
            linkml-term-validator validate-data "$file" -s src/site_kb/schema/site_kb.yaml -t MeasurementProfileCollection -c conf/oak_config.yaml
          done
          for file in db/curated/variable_mappings/*.yaml; do
            [ -f "$file" ] || continue
            linkml-term-validator validate-data "$file" -s src/site_kb/schema/site_kb.yaml -t VariableMappingCollection -c conf/oak_config.yaml
          done
      - name: Validate evidence quotations against reference cache
        run: linkml-reference-validator validate data db/sites/sites.yaml --schema src/site_kb/schema/site_kb.yaml --target-class SiteCollection --config .linkml-reference-validator.yaml --no-full-text
      - name: Render static browser
        run: python -m site_kb.scripts.render_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
