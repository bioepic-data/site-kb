  variable_notes: BADM declarations and published BASE variables are separate evidence
    types; reported flux species are not concentration variables. BASE entries require
    positive reported coverage in at least one year. Years are availability summaries,
    not continuous monitoring claims. Quality flags, footprint diagnostics, and timekeeping
    columns are excluded from property declarations.
