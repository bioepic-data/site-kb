  description: "Mt Halla San is in Jeju Island, the only volcanic subtropical island,\
    \ in South Korea. Every year the island is hit by several typhoons. It has shaped\
    \ unique environmental characteristics and biodiversity.  \r\nIn addition the\
    \ mountain is one of the most popular vacation sites with growing ecological concern."
