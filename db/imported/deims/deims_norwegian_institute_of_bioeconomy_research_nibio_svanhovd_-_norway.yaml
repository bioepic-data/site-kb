  description: Svanhovd is located beside the Pasvik river, in the middle of the wedge
    of Norwegian land separating Russia and Finland in the north. It is where the
    eastern Siberian taiga meets the western Boreal forest. Many characteristic species
    of plants, animals, birds and insects are found at this intersection. The station
    have approx. 25 employeees, laboratories, field equipment and lodgings and conference
    facilities for guests.
