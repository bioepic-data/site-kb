  description: "The Grabenegg Field Station (Alpenvorland), Lower Austria, is an agricultural\
    \ research site of the Austrian Agency for Health and Food Safety (AGES). It is\
    \  representative of productive soils managed as arable land. The site is located\
    \ in the Alpenvorland and the soil described as Gleyic Cambisol (WRB). Cultivated\
    \ crops and research topics are similar to the site Fuchsenbigl. The following\
    \ long-term field experiments are still conducted:\r\n• Long term mineral K-fertilisation\
    \ (since 1954), long-term P fertilisation (different P-forms, since 1954)\r\n\
    • Removal/return of crop residues, P-fertilisation (since 1986)\r\nSoil data,\
    \ e.g. pH, Corg, Nt, plant available nutrients (P, K), texture, potential N mineralisation,\
    \ are collected at irregular intervals, crop data each year."
