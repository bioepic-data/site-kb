sites:
- id: site_kb:deims-kanumazawa_riparian_research_forest_-_japan
  name: Kanumazawa Riparian Research Forest - Japan
  network_registrations:
  - network: DEIMS
    network_id: 1a478db9-aab4-4287-88c9-49c0461dc72a
    network_url: https://deims.org/1a478db9-aab4-4287-88c9-49c0461dc72a
    name: Kanumazawa Riparian Research Forest - Japan
  location:
    latitude: 39.1103
    longitude: 140.855
    country: Japan
    elevation_meters: 440.0
  description: 'A 4.71-ha site in a beech-dominated landscape, with montane creek
    stand (2.48 ha) as well as adjacent terrace stand (1.08 ha) and steep slope connecting
    between them.  Deciduous species-mixed stand, without evidence for logging, under
    temperate climate with heavy snow (max. depth: 1.8 m) in winter.  Characterized
    by canopy breakage and fluvial transport of sedimentation, as well as bumpy ground
    surface with a mixture of boulders and deep soils.  As a result, a diverse array
    of tree species coexist, with rich ground layer vegetation, in the riparian stand,
    whereas beech is the dominant species in the terrace stand.  Intensive monitoring
    for seedfall and tree community dynamics since 1990''s.'
