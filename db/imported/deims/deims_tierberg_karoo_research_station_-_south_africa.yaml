  description: Tierberg Karoo Research Station (TKRS) is a Long Term Ecological Research
    field facility available for use by organisations involved in research and tertiary
    education in the natural sciences. The field site comprises 100 ha of natural
    Karoo shrubland situated in the Karoo Biome. The field site has been fenced to
    exclude domestic livestock since July 1987. Studies of plant, bird and small mammal
    populations at this site have contributed substantially to present conceptual
    understanding of ecological process in the Karoo and provide valuable baselines
    for research.
