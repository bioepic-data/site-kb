sites:
- id: site_kb:deims-fürstenfeld_ff_-_austria
  name: Fürstenfeld (FF) - Austria
  network_registrations:
  - network: DEIMS
    network_id: 27da6893-2a06-4385-a935-901cb2bbdf70
    network_url: https://deims.org/27da6893-2a06-4385-a935-901cb2bbdf70
    name: Fürstenfeld (FF) - Austria
  location:
    latitude: 47.08548
    longitude: 16.07491
    country: Austria
    elevation_meters: 320.0
  description: The site is situated in the East Styrian lowlands and hills, the woodland
    community being an Oak-Hornbeam forest and was established in 1997. The main research
    questions center around (site) water balance and different patterns of water consumption
    of different tree species. In order to address the research questions, the site
    is instrumented with on-line registering climate stations as well as on-line soil
    water content measurements, soil temperature measurements as well as sap flow
    measurements. These data are complemented with data on soil physics, rooting densities,
    stand growth and LAI. Main results demonstrate very clear seasonal patterns, which
    may lead to drought stress of conifers (Norway spruce) resulting in unstable stands
    prone to secondary (f.e. insect) damage. So far the site has been used by three
    national and 2 international projects.
