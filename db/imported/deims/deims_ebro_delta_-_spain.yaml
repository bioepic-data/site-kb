  description: This is one of the most vast and important wetland in the western Mediterranean.
    It also holds one of the most important fishing grounds for fisheries. It has
    international importance for the flora, especially halophilous and aquatic communities
    including a large number of rare and threatened species. Several endemic and threatened
    fish species can be found here. Particularly important is the waterbird community
    reaching 56000 breeding pairs of several species and more than 200000 individuals
    wintering here, including species coming from northern Europe. Among the breeding
    species, the site holds more than 60% of total world population of the Audouin's
    gull, a threatened endemic seabird of the Mediterranean region.
