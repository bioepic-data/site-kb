  description: 'Konza Prairie Biological Station (KONZ) is a terrestrial NEON field
    site located in the Flint Hills region of Kansas just 10 km (6 mi.) south of Manhattan,
    KS. The 34.6 km2 (8550 acre) site at the Konza Prairie Biological Station is hosted
    by The Nature Conservancy and Kansas State University. The surrounding region
    consists of grasslands, forests, and agricultural land cover types and includes
    the largest remaining areas of unplowed tallgrass prairie in North America. KONZ
    is part of the NEON Prairie Peninsula Domain (D06), which stretches from Kansas
    through Nebraska and Iowa to southern Minnesota, and moves east to encompass Illinois
    and most of Indiana. The Domain hosts four other NEON field sites: two aquatic
    and two additional terrestrial, all of which are located in Kansas. KONZ is located
    just 5 km (~3 miles) east of the KONA terrestrial site. The two sites provide
    a contrast between more pristine prairie at KONZ and heavily impacted agricultural
    land at KONA within the same area. Land use and land use management are key grand
    challenge themes for this Domain.'
