    country: Austria
    elevation_meters: 492.0
  description: "The site Klausen-Leopoldsdorf is part of the European Level II Forest\
    \ Monitoring System in the frame of the International Co-operative Programme on\
    \ Assessment and Monitoring of Air Pollution Effects on Forests (ICP Forests).\
    \ The site was established in 1995 and is, since 2006, part of the LTER Austria\
    \ network. It is situated in a homogenous 80 years-old managed beech stand about\
    \ 20km west of Vienna.\r\nThe LTER-CWN research area in Klausenleopoldsdorf is\
    \ divided into 3 subplots: a measuring weir, a dendrometer/sapflow measuring facility\
    \ and GHG-chambers for measuring the fluxes of CO2 and other relevant GHG´s. All\
    \ 3 subplots were installed in 2019 to collect high-resolution data. The measuring\
    \ weir is located at about 475m a.s.l and the other subplots (denrometer/sapflow,\
    \ GHG measuring chambers) are located at about 510m a.s.l. The observed catchment\
    \ of the measuring weir has an area of 46 hectares. The dominating soil types\
    \ in the catchment are Planosoils and Stagnosols. The subplots are situated in\
    \ the near vicinity of the ICP-forest plot."
