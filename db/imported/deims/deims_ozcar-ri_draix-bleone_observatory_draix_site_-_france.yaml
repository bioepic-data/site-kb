  description: "Draix site is part of Draix-Bleone observatory, located in the French\
    \ South Alps, upstream of Digne, on the left side of the Bleone. \r\n\r\nDraix\
    \ site was equipped in 1983 to study mountain erosion and sediment transport.\
    \ It is composed of 4 catchments, which are equipped to measure water and sediment\
    \ fluxes, at spatial scales ranging from 0.001 km2 to 1 km2, with contrasted land\
    \ cover. These catchments are entirely situated on black marls that are very sensitive\
    \ to weathering and erosion, resulting into a badland topography. One catchment\
    \ was reforested at the end of the XIXth century whereas the other are mostly\
    \ denuded. This site is characterized by intense erosion and intermittent sediment\
    \ fluxes. \r\n\r\nThe variables that are monitored on the long-term include rainfall\
    \ and meteorology, high-frequency water discharge and suspended sediment concentration\
    \ (1-10 minutes), event-scale bedload transport, and some physico-chemical properties\
    \ of stream water and sediments."
