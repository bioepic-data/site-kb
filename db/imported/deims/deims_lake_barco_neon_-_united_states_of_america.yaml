  description: "Barco lake a core aquatic site is situated within Ordway-Swisher Biological\
    \ Station (OSBS) in Putman County, Barco Lake is an oligotrophic (i.e., has low\
    \ nutrient levels) acidic seepage lake in the mantled karst, a landscape formed\
    \ by the dissolution of soluble rocks, of north central Florida. Common animals\
    \ include tiger salamander, barking treefrog, spadefoot toad, gopher frog, gopher\
    \ tortoise, worm lizard, fence lizard, mole skink, indigo snake, coachwhip snake,\
    \ pine snake, short-tailed snake, crowned snake, eastern diamondback rattlesnake,\
    \ bobwhite, ground dove, red-headed woodpecker, rufous-sided towhee, fox squirrel\
    \ and pocket gopher. Barco Lake is an important breeding areas for terrestrial\
    \ amphibians, including the threatened gopher frog, as well as many unusual or\
    \ endemic insects, as well as an important watering holes for a number of mammals\
    \ and birds, including ducks and wading birds.  This site has one meteorological\
    \ station located in the riparian area and one meteorological station above water\
    \ on a buoy. The met stations are outfitted with the a subset of the same sensors\
    \ used at terrestrial sites. Measurements include wind speed and direction, air\
    \ temperature, barometric pressure, relative humidity, shortwave radiation, and\
    \ PAR.This site has one buoy-mounted sensor station and an inlet station and outlet\
    \ station. At the buoy, the automated instrument measurements are: PAR at water\
    \ surface, PAR below water surface, temperature at a specific depth in surface\
    \ water, water quality (specific conductivity, chlorophyll a, dissolved oxygen\
    \ content, pH turbidity, and fDOM), and nitrate. At the inlet and outlet stations,\
    \ the measurements are: PAR below water surface, elevation of surface water, and\
    \ temperature in surface water. Eight groundwater wells throughout the site collect\
    \ specific conductivity, water tempertaure, and elevation of groundwater.\r\n\r\
    \n\r\n Total data products planned for this site: 75"
