  description: "The Desert Uplands Plot Network is located in the Northern Desert\
    \ Uplands of Queensland, Australia with each of the 50 (originally 60) bird monitoring\
    \ plots 1 ha in size, and located at least 1 km from any other site, 500 m from\
    \ any water point and 50 m from the nearest access track.\r\n\r\nAs at June 2016,\
    \ temporal visits have been conducted in 2004, 2005, 2006, 2008, 2013 and 2014.\r\
    \n\r\nBetween 2012 and 2018 the Desert Uplands Plot Network was a member of Long\
    \ Term Ecological Research Network (LTERN), Australia, a facility of the Australian\
    \ Government's Terrestrial Ecosystem Research Network (TERN)."
