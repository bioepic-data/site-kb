  description: The spruce and beech stands under study are located in the Czech Republic
    in the Ore Mountains near the German border, close to the village of Načetín (50_35026”
    N, 13_15014” E). Both of the stands lie close to each other (ca. 700 m), so they
    are exposed to the same geological and climatic conditions. The average annual
    temperature is 7.1 _C and average annual precipitation is 1110 mm (2005–2017).
    Paragneiss underlies both stands, which are sloped to the north-west. The dominant
    soil type is dystric cambisol. The spruce stand lies at an elevation of 784ma.s.l.
    and it is covered by 80 years old monoculture of Norway spruce (Picea abies).
    The beech stand is situated at an elevation of 823 m a.s.l. and it is composed
    predominantly of European beech trees (Fagus sylvatica) that are approximately
    140 years old.
