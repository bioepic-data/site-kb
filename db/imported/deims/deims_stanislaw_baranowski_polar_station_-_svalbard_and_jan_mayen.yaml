  description: 'The station was built in 1971 below the site on the lateral moraine
    of the Werenskiold Glacier, where a meteorological station was established in
    1970. The building was assembled from wooden, ready-made elements that were prepared
    earlier in Wrocław, Poland and transported to Spitsbergen on the ship. The initiator
    of the construction of the facility was Dr Stanisław Baranowski (glaciologist).
    Over the years the station overcome multiple renovations and modification and
    currently provides basic logistical resources: accomodation and storage facilities
    for research groups working in the area. The station supports fieldwork in number
    of scientific disciplines. The key areas of research are geomorphological (including
    permafrost studies), glaciological, climatological, geological and ecological
    studies. Both, long term and short term projects are carried out at the station.'
  status: ACTIVE
