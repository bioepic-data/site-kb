  description: 'MEDYCYSS observatory (Hérault, France) is a mediterranean karstic
    hydrosystem, located between Hérault and Vidourle rivers with a 1200 km2 area.
    The territory consists of several sites of observation and experimentation with
    three hydrographic networks in interaction with the karst system: the Lez, the
    Mosson and the Coulazou.'
