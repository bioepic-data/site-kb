  description: The Northeast US Shelf (NES) ecosystem spans the Middle Atlantic Bight
    and Gulf of Maine, is a large portion of the NW Atlantic Shelves Province, and
    is in a coastal biome. The waters over the NES provide an array of ecosystem services
    including fishing, energy development, shipping, waste disposal, recreation, and
    conservation. The NES ecosystem, like other productive temperate shelf ecosystems,
    is characterized by strong seasonality along with high levels of variability in
    physical forcing at timescales from days to decades, including climate impacts.
