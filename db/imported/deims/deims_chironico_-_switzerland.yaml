  description: "The forest site \"Chironico\" has been installed in 1995 as part of\
    \ the Swiss Long-term Forest Ecosystem Research Programme LWF. The programme investigates\
    \ anthropogenic and natural forces on the long-term health of the forests and\
    \ the potential risks to humans. For this, a profound understanding of the relationship\
    \ between processes, causes and effects in the ecosystem are necessary.\r\n\r\n\
    The objectives of the LWF research programme include (i) early detection and a\
    \ representative assessment of changes in forest condition, (ii) determination\
    \ of external influences, both from anthropogenic and natural sources such as\
    \ element inputs and climate and their effect on the forest ecosystem, (iii) development\
    \ of indicators to assess the condition of the forest, (iv) integrated risk assessment\
    \ based on different stress scenarios, and (v) extended platform for internal\
    \ and external research projects. \r\n\r\nThe LWF research programme provides,\
    \ on the one hand, long-term data series from the last 20 years, together with\
    \ a scientific interpretation to national and international policy makers. On\
    \ the other hand, the available data and latest LWF infrastructure provide an\
    \ attractive scientific platform for collaboration with both national and international\
    \ partners.\r\n\r\nThe site is located next to Chironico in the canton of Ticino,\
    \ within a natural, coniferous forest stand which mainly consists of 160-180 year-old\
    \ spruce (Picea abies), and 140-160 year-old European silver fir (Abies alba)\
    \ trees. Among others, the site is equipped with two meteorological measurement\
    \ stations; one is located within the forest stand, the second is co-located in\
    \ the nearby open-field, allowing to measure the forest stand effect on micro-climate.\r\
    \nThe following parameters are being measured (starting-end year): Atmospheric\
    \ deposition (throughfall and bulk deposition) (2000-today), Circular vegetation\
    \ plots (1996-today), Crown Condition Assessment (1996-today), Deadwood survey\
    \ (1995, 2005), Diameter and Height measurements (1999-today), Foliar analyses\
    \ (1997 (spruce)-today), Leaf area index (LAI) (1997-today), Lichens (2004-today),\
    \ Manual circumference band measurement (2001-today), Meteorological measurements\
    \ (2000-today), O3 Injuries (2002-today), Ozone visible injury assessment (2002-today),\
    \ Passive sampling of NH3 (2000), Passive sampling of NO2 (2000), Passive sampling\
    \ of O3 (2002-2004), Permanent vegetation quadrats (1996-today), Phenological\
    \ observations (2000-today), Soil matrix chemistry (1998-today), Soil morphology\
    \ (1998-today), Tree core sampling (1824-1996), Tree crown measurements (1996-today),\
    \ Soil solution chemistry (lysimeters) (1999-today), Deadwood sampling (2009-today)."
