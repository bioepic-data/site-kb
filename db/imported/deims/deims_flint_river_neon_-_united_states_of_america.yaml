  description: The Flint River (FLNT) is an aquatic site situated at the headwaters
    of the Flint River south of Atlanta, GA in the Piedmont Lowlands. FLNT is located
    on within the Jones Ecological Research Center, a 117 km2 (29,000 acre) reserve
    privately owned and managed by the Robert W. Woodruff Foundation. The Flint River
    shapes 20.9 km (13 miles) of the eastern property boundary of the Center. The
    Flint River is a non-wadeable river flowing 554 km (344 mi.) through Georgia into
    Lake Seminole at the confluence of the Chattahoochee River. It is part of the
    ACF basin, ultimately feeding into the Apalachicola River and into the Gulf of
    Mexico. The sampling site is located at the southern extent of the watershed near
    the confluence with Ichawaynochaway Creek. The site is encompassed within the
    NEON Southeast Domain that is bounded by the Atlantic Ocean on the east and the
    Gulf of Mexico to the west. The surrounding region is a patchwork of forest, grassland,
    and wetland communities embedded in a matrix that is increasingly dominated by
    a fast-growing human population. The Domain hosts five other NEON field sites,
    including two additional aquatic sites and three terrestrial sites, located in
    Florida and Georgia. It is colocated with the JERC terrestrial field site.
