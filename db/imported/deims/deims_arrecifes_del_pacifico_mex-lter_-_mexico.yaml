  description: 'Arrecifes coralinos y rocosos del Pacífico Mexicano desde Baja California
    hasta Chiapas. El trabajo se desarrolla en cuatro principales regiones: Sur del
    Golfo de California, Islas Revillagigedo, Bahía de Banderas y Bahías de Huatulco.
    Cabo Pulmo es el de mayor extensión. Tiene registradas 67 especies de corales
    en 368 localidades.'
