  description: Lewis Run (LEWI) is an aquatic NEON field site located about 60 miles
    west of Washington, D.C. in Clarke County, Virginia. Lewis Run is a small wadeable
    stream that drains a 11.9 km2 (2940 acre) watershed. The majority of the stream
    reach flows past and through land managed by Casey Trees, a nonprofit organization
    that raises trees for planting in and around the Washington, D.C. area. The surrounding
    region is characterized by general land use types including successional fields,
    pastures, woodlands, and small ponds. This site is located within NEON's Mid-Atlantic
    Domain (D02), a densely populated region bounded by the Atlantic Ocean on the
    east and stretching down the Eastern Seaboard from southern New Jersey to northern
    Georgia. The Mid-Atlantic Domain includes one other aquatic site and two terrestrial
    sites. LEWI is located near the BLAN terrestrial site.
