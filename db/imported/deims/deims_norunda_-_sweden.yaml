  description: The Norunda research station, with ICOS code SE-Nor, is located in
    the southern part of the boreal forest zone (the nearest town is Uppsala, about
    25 km to the South). The area is flat with small-scale variations in altitude
    and the site is dominated by Norway spruce and Scots pine with a small fraction
    of birch trees, and the shrub layer is dominated by blueberry, cranberry, moss,
    and flowers. The soils are sandy-loamy tills with high content of stones and blocks.
  status: ACTIVE
