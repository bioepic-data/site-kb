  description: The Rocky Mountain National Park (RMNP) field site is a terrestrial
    NEON site located 70 km (43.5 mi.) northwest of Denver, CO near Rocky Mountain
    National Park. The RMNP site is 46.5 km2 (11490 acres) and includes National Park
    and Forest Service land in the foothills of Colorado. As a mid-elevation site
    at 2750 m (9022 ft.) on the east side of the Continental Divide, the site is aptly
    situated to investigate the chemical climate (i.e., pollution) generated along
    the Front Range as well as dust deposition produced and transported from the Great
    Basin to higher elevations. The NEON tower and corresponding TOS plots are located
    in a property that is owned by the National Park Service but outside of Rocky
    Mountain National Park’s core boundaries. TOS distributed plots are located within
    the Roosevelt National Forest, managed by the U.S. Forest Service. The area is
    a popular destination for hiking, camping, shooting, and other recreational activities.
    The site is part of NEON's Central Plain Domain (D10), although it is physically
    located within the borders of NEON's Southern Rockies & Colorado Plateau Domain
    (D13). D10 has two other terrestrial sites and one aquatic site. The RMNP site
    is not colocated with an aquatic site.
