  description: BONA is a terrestrial NEON field site located in central Alaska, northeast
    of Fairbanks, AK. It is in the Caribou-Poker Creeks Research Watershed and contained
    within the Bonanza Creek LTER research area. The land at the Bonanza Creek LTER
    site is managed by the University of Alaska and has been set aside for scientific
    study. Parts of the NEON site also overlap land managed by the Alaska Department
    of Natural Resources. The 49.6 km2 (12,300 acre) site features a mix of hardwood
    forest, shrubland, wetlands, and scattered permafrost. The Caribou-Poker Creeks
    Research Watershed spans an elevation of 200 - 773 m (650 - 2500 ft.), with valleys
    and steep mountains within the watershed. BONA is one of four NEON sites (three
    terrestrial and one aquatic) in the Alaskan Taiga Domain (D19), which comprises
    Alaska’s interior and the Alaska Peninsula. It is colocated with the aquatic site
    CARI.
