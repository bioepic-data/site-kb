  description: "The research activities in the lagoon, as well as the understanding\
    \ of natural phenomena, are directed to the study of the ecological effects of\
    \ the major pressures acting on the system, including which the input of nutrients\
    \ from agricultural and urban sources, industrial activity and port (Porto Marghera,\
    \ Venice Maritime Station, the commercial port in\r\nChioggia), the release of\
    \ pollutants accumulated in sediments, the intense traffic ships and smaller boats,,\
    \ the morphological trivialization.\r\nIn recent decades the Tapes philippinarum\
    \ has generated problems related to collection techniques.\r\nIs focusing attention\
    \ to the increasing presence of alien species both plant that animals."
