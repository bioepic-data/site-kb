sites:
- id: site_kb:deims-bucegi-piatra_craiului_national_park_-_romania
  name: Bucegi-Piatra Craiului National Park - Romania
  network_registrations:
  - network: DEIMS
    network_id: 4050c5c8-fccc-4a3c-af65-7507a064d5f5
    network_url: https://deims.org/4050c5c8-fccc-4a3c-af65-7507a064d5f5
    name: Bucegi-Piatra Craiului National Park - Romania
  location:
    latitude: 45.4333
    longitude: 25.3333
    country: Romania
    elevation_meters: 700.0
  description: "The site is located in the south-central part of Romania, in the Bucegi\
    \ and Piatra-Craiului Mts of the Southern Carpathians.\r\nBucegi - Piatra Craiului\
    \  are located in the Romanian southern Carpathians (Bucegi NP (32.500 ha) and\
    \ Piatra-Craiului NP (13.800 ha). In 2003, these areas were nominated as two ILTER\
    \ Sites and in 2008 as LTER - Europe sites (Bucegi - Piatra Craiului). The diversity\
    \ and vast richness of Bucegi - Piatra Craiului vegetation, with many endemic\
    \ species and rich fauna which includes endangered species and unique plant communities\
    \ like chamois, bear, lynx and wolf  were the main reasons for the natural and\
    \ national park designated status of Bucegi - Piatra Craiului."
