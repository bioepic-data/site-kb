  description: More than half is covered by plantations of Cryptomeria japonica and
    Chamaecyparis obtusa. In natural forest areas, Abies firma and Tsuga sieboldii
    are dominant. In the deciduous broad-leaved forests located over 950m above see
    level, Fagus crenata is observed.
