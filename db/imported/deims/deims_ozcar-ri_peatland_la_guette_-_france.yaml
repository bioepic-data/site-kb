  description: This is a peatland located in Sologne, 80 km south of Orléans. La Guette
    peatland is one of the four sites of the SNO Tourbières (CNRS). All the sites
    of the SNO Tourbières are part of OZCAR (French Observatory on the critical zone).
    The site was hydrologicaly disturbed. Restoration works took place in 2014. A
    labeling procedure has began to become associated site of ICOS.
