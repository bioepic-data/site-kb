  description: "The history of the Kainuu Research Station started when the aquaculture\
    \ activities was initiated in 1935. The main parts of the present station were\
    \ built in 1994. Since 2002 the station was equipped to focus on experimental\
    \ fish and aquatic ecology research. The station operates and is open for visitors\
    \ throughout the year. The station has 14 beds, a laboratory, an auditorium, workshops,\
    \ and internet access.\r\n\r\nThe station provides excellent opportunities to\
    \ carry out ecological, environmental or management related research in laboratory\
    \ and on a semi-natural scale. The research facilities include both indoor and\
    \ outdoor set-ups of streams, indoor pools, outdoor pools, and combined stream-pool\
    \ systems with video arrays and PIT-telemetry devices for observing and monitoring\
    \ purposes. Water (max 750 l/s) for the streams and pools is taken from Lake Kivesjärvi\
    \ (surface area 27 km2, mean water pH 6.7, oxygen 9.2 mg/l, total P 17.0 µg/l,\
    \ and conductivity 3.5 mS/m)."
  status: ACTIVE
