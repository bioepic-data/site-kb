  description: The Forest of Meerdaal is situated on the Belgian loess belt about
    25 km south-east of Brussels. It is an ancient woodland site, previously managed
    as coppice with standards, well known history (up to the middle ages). It is managed
    as multifunctional forest containing strict forest reserves with dense sampling
    grid (measured every decade). its proximity to the university make it an ideal
    research subject. Over the years many different studies have been conducted and
    documented.
