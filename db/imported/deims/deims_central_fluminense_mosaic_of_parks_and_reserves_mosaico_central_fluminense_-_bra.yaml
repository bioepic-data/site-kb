    name: Central Fluminense Mosaic of Parks and Reserves (Mosaico Central Fluminense)
      - Brazil
  location:
    latitude: -22.471718
    longitude: -42.909328
    country: Brazil
    elevation_meters: 700.0
  description: 'Covers an elevational gradient from 0 to 2,200 m in the Serra dos
    Órgãos mountain range, with high elevation grasslands (campos de altitude), cloud
    and lowland rainforests in the Atlantic Forest biome. In the lowlands it includes
    fragmented landscapes due to deforestation occurred in the last 500 years, with
    a variety of land uses in the matrix were fragments are inserted. Long term studies
    and monitoring actions focus on the effects two main factors: effects of climate
    change and land use. Presents high species richness, embracing a National Park
    (Parque Nacional da Serra dos Órgãos), a state park (Parque Estadual dos Três
    Picos), a private reserve (Reserva Ecológica Guapiaçu), and other federal and
    state protected areas.'
