  description: "The Yatsugatake-Kawakami Forest of Mountain Science Center, University\
    \ of Tsukuba, consists of three forest areas: the Yatsugatake Forest (80 ha) located\
    \ in Minamimaki, Nagano Prefecture, Japan, the \"Megumi-no-Mori\" (14 ha) on the\
    \ campus where the administration building is located, and the Kawakami Forest\
    \ (189 ha) located in Kawakami, Nagano Prefecture, Japan.\r\nThe Yatsugatake Forest\
    \ is 1400-1450 m above sea level, and the Megumi-no-Mori is 1350 m above sea level.\
    \ The forest is characterized by gentle slopes without remarkably topographic\
    \ change and a mosaic of secondary deciduous broad-leaved forest dominated by\
    \ oak (Quercus crispula) and Asian black birch (Betula davurica）, and intermediate\
    \ moor characterized by thatch herb (Moliniopsis japonica) and Japanese alder\
    \ (Alnus japonica). Rare plants such as primrose (Primula sieboldii) and drosera\
    \ (Drosera rotundifolia) are also found here. Black soil is distributed throughout\
    \ the Yatsugatake Forest and Megumi-no-Mori.\r\nThe Kawakami Forest is located\
    \ between 1360 and 1700 m above sea level. 70% of the forest area is planted with\
    \ Japanese larch (Larix kaempferi). The rest is a secondary deciduous broadleaf\
    \ forest dominated by oak and birch. Some of the forests are dominated by a beech\
    \ (Fagus crenata) stand, a natural Sawara cypress (Chamaecyparis pisifera) stand,\
    \ and spruce (Picea alcokiana) stand. The forest is covered with brown and black\
    \ soils, and the topography of the forest is more varied than that of the Yatsugatake\
    \ Forest, including ridges and valleys. In the Kawakami Forest, an ecological\
    \ survey of forest mammals is also being conducted.\r\nAt these three forests,\
    \ education and research are conducted on ecological surveys of trees, rare plants,\
    \ and wildlife (population dynamics and conservation ecology), forest meteorological\
    \ observations, and artificial forest management and operation."
