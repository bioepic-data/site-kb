  description: The Loobos site (ICOS code NL-Loo) is located near Kootwijk, on the
    Veluwe. The forest was planted around the year 1909 on sand dunes to fight sandstorms
    and also for the wood to serve in the mines in Limburg (Southern NL). The forest
    has been growing since then and was exposed to very little management. In all
    directions the forest extends for more than 1.5 km.
