  description: Hailun Agricultural Ecological Station located in Hailun city, Heilongjiang
    province, was established in 1978, briefly named Hailun Agro-ecosystem Station.
    The main research fields at that time were the optimal management of agriculture
    and advanced technology utilization in agricultural production. Chinese ecosystem
    research network(CERN) established in 1988 selected Hailun station as one of its
    components. The objective of Hailun station was to study the agro-ecosystem and
    sustainable development of agriculture in black soil zone in Northease China.
    Also, Hailun station was considered as one of components, when national field
    research net was built in 2005.
