    name: Hölstein - Switzerland
  location:
    latitude: 47.4384813
    longitude: 7.7761411
    country: Switzerland
    elevation_meters: 540.0
  description: The Hölstein site is located in in the eastern part of the Swiss Jura
    mountains (47°26’16.4’’, 7°46’31.1’’; 540 m a.s.l.), in a mixed, temperate forest
    with an exceptionally high biodiversity and a vigorous tree regeneration. The
    research plot has a size of 1.6 ha and comprises 540 mature trees. The main tree
    species are Fagus sylvatica and Picea abies with an admixture of Abies alba, Quercus
    petraea, Pinus sylvestris, Acer pseudoplatanus, Carpinus betulus, Fraxinus excelsior
    and Sorbus torminalis. A canopy crane is installed in the center of the research
    area to access the tree canopies for in situ measurements and for sampling of
    leaf material. Rainout shelters will be installed in 2019 for conducting a long-term
    throughfall exclusion experiment.
