    country: Germany
    elevation_meters: 150.0
  description: "In the framework of TERENO \"terrestrial observatories\" are set up\
    \ in selected German regions for climate and landuse change studies. The Harz/Central\
    \ German Lowland Observatory is one of these observatories that are equipped with\
    \ a combination of in situ measuring instruments and ground-based, airborne and\
    \ satellite-borne remote sensing techniques. Additionally a network of biodiversity\
    \ observation plots is installed. Within the Harz/Central German Lowland observatory\
    \ the climate feedback experiment SoilCan using a lysimeter network will be realized.\
    \ Soil monoliths with different vegetation are transplanted along the existing\
    \ natural gradient in temperature and precipitation within the four TERENO observatories.\
    \ Within the Harz/Central German Lowland observatory three main intensive test\
    \ sites have been selected: Sauerbach, 27 ha, forest/agriculture, Schäferbach,\
    \ 27 ha, agriculture, Selke Catchment, forest/agriculture. Instrumentation and\
    \ surveys enable: Dense Soil Moisture Monitoring, Groundwater Monitoring, Runoff\
    \ and Solute Monitoring, Eddy covariance tower (CO2, NO2, CH4, available end 2011),\
    \ Geophysical Monitoring (ERT, GPR, EM), Airborne Monitoring using Hyperspectrum\
    \ Imagery (flight campaigns), Soil Respiration Monitoring (available end 2011),\
    \ Climate station, Deposition station (available end 2011), Biodiversity Assessment,\
    \ DTS-observation of groundwater-surface water interactions (Distributed Temperature\
    \ Sensing, using fiberoptics and temperaturprobes), Vadose Zone Monitoring System\
    \ (in-situ soil water budget observation), Rainscanner (small weather radar, available\
    \ end 2011). At the GCEF in Bad Lauchstädt opportunities will be given to manipulate\
    \ climate change and land environment, from which visiting scientists may benefit.\
    \ This infrastructure is available since 2013.\r\n\r\nThe monitoring, observation,\
    \ and research activities within the Harz/Central German Lowland Observatory are\
    \ organized in four main platforms:\r\n1. Hydrological Platform: catchment of\
    \ the river Bode (shape on the map)\r\n2. Biodiversity Platform (green dots on\
    \ the map)\r\n3. Floodplain Platform (pink dots on the map) \r\n4. Urban Platform:\
    \ the city of Leipzig as focus area"
