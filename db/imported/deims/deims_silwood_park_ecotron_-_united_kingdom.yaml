  description: “The Ecotron” is a unique facility for controlled environment ecological
    experiments, designed to bridge the gap between the complexity of real field communities
    and the simplicity of laboratory or greenhouse studies. The facility has been
    extensively described in the scientific literature and includes 16 separate walk-in
    chambers with computer-controlled climatic conditions. Recent modifications of
    the facility allow it to emulate real weather data (temperature, humidity, light,
    rainfall and water table) for large mesocosms (up to 130 x 85 x 40cm).
  status: ACTIVE
