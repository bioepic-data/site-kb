  description: Acid alpine grassland on a ridge extending westward from the summit
    of Mount Kralova Hola in Low Tatra Mountains, Slovakia. Vegetation at the site
    belong to the alliance Juncion trifidi and it is dominated by graminoid species,
    including Oreochloa disticha, Festuca supina and Agrostis rupestris, with lower
    cover of forb and dwarf shrub species.
