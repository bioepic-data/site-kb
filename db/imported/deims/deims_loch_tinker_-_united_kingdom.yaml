  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. Named Lochan a''
    Cheaird on historic maps, Loch Tinker lies at 418 m altitude and drains an adjacent
    catchment to the east of Loch Chon in the Trossachs region of central Scotland.
    The loch receives drainage from seepage through the catchment blanket peats and
    from the steep slopes to the south and east, although the main stream in this
    area is naturally captured just a few metres downstream of the loch outflow. The
    loch drains to the north east via the Allt Glasahoile which falls steeply to Loch
    Katrine. The loch (surface area 11.1 ha) has an irregular shoreline and the generally
    shallow (mean depth 3.5 m) bathymetry includes two distinct sub-basins reaching
    a maximum depth of 9.8 m. Three small islands are located towards the southern
    end of the loch. Some data managed by UK ECN Data Centre. Note: The area is the
    size of the catchment.'
