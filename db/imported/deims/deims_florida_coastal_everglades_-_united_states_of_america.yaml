  description: The majority of Florida Coastal Everglades LTER sites are located in
    freshwater marsh, estuarine mangroves, seagrass estuary ecosystems in Everglades
    National Park. Everglades National Park covers approximately 4300 km² of south
    Florida and is part of the greater Everglades ecosystem which extends north to
    Lake Okeechobee and the Kissimmee River.
