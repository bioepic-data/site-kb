    country: Switzerland
    elevation_meters: 615.0
  description: As the largest contiguous pine forest in Switzerland, the Pfyn forest
    in Canton Valais (46° 18' N, 7° 36' E, 615 m ASL) offers the best conditions for
    such measurements.  In light of this, a WSL research team installed a long-term
    experiment of 20 years duration in the Pfyn forest.  The average temperature here
    is 9.2°C, the yearly accumulated precipitation is 657 mm (average 1961-1990).
    The pines in the middle of the forest are about 100 years old and 10.8 m high.
    The test area has 876 trees covering 1.2 ha divided into 8 plots of 1'000 m2 each
    (Image 4). Between the months of April and October four of these plots are irrigated
    by a sprinkler system providing an additional 700 mm of water, annually. In the
    other four plots, the trees grow under natural, hence relatively dry conditions.
