  description: "The Three Parks Savanna Fire-Effects Plot Network extends across three\
    \ national parks (Kakadu, Litchfield and Nitmiluk) in the Top End of the Northern\
    \ Territory. The fire monitoring program comprises two complementary components:\
    \ satellite based mapping of fire events and on-ground assessment of change in\
    \ biota at a set of permanent plots.\r\n\r\nTemporal visits are as follows:\r\n\
    \r\n• 6 months (fire occurrence),\r\n• 4 months (fire mapping),\r\n• 5 years (vegetation),\
    \ \r\n• opportunistic (fauna).\r\n\r\nBetween 2012 and 2018 the Three Parks Savanna\
    \ Fire-Effects Plot Network was a member of Long Term Ecological Research Network\
    \ (LTERN), Australia, a facility of the Australian Government's Terrestrial Ecosystem\
    \ Research Network (TERN)."
