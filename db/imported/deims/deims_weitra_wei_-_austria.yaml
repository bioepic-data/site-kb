- id: site_kb:deims-weitra_wei_-_austria
  name: Weitra (WEI) - Austria
  network_registrations:
  - network: DEIMS
    network_id: 9d008e2a-5b49-4ffe-b73a-87da4ab8ee31
    network_url: https://deims.org/9d008e2a-5b49-4ffe-b73a-87da4ab8ee31
    name: Weitra (WEI) - Austria
  location:
    latitude: 48.68009675
    longitude: 14.74073625
    country: Austria
    elevation_meters: 900.0
  description: "The site was established in 2000 and is situated in Waldviertel (northern\
    \ Lower Austria), the current stand being a Norway spruce monoculture. The bedrock\
    \ is poor in nutrients and further nutrient loss from litter raking as well as\
    \ anthropogenic furtherance of conifers has led to unstable monocultures and the\
    \ disappearance of deciduous species. The main research questions center around\
    \ reintroduction of deciduous species, soil amelioration and nutrient cycling.\r\
    \nThe site is instrumented with climate stations as well as on-line soil water\
    \ content measurements and soil temperature measurements. Further data include\
    \ detailed chemical soil analyses, tracer experiment data, growth data and LAI\
    \ measurements. In 2007 a large part of the stand was broken by wind (Cyrill).\
    \ Currently measurements aim to quantify and qualify the effects of the windthrow\
    \ to soils and rejuvenation. To date, the site has hosted 2 international and\
    \ 3 national projects."
