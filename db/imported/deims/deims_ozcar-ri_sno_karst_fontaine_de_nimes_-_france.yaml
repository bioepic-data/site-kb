  description: "Le bassin d’alimentation de la Fontaine de Nîmes, d’une superficie\
    \ d’environ 55 km2 se situe dans les Garrigues nîmoises avec une partie de bassin\
    \ avale située en contexte urbain. La Fontaine de Nîmes est suivie par le BRGM\
    \ depuis 1998, et ce point d’eau appartient au réseau de suivi quantitatif des\
    \ eaux souterraines (convention BRGM/ONEMA) pour répondre aux objectifs de la\
    \ Directive Cadre sur l’Eau (portail ADES - www.ades.eaufrance.fr).\r\nLes mesures\
    \ hydrodynamiques et physicochimiques réalisées à la source, dans les eaux de\
    \ surface (cadereaux), en forage ou en cavités, complétées par des campagnes géochimiques\
    \ ont permis de décrire les mécanismes à l’origine de la genèse ou de l’atténuation\
    \ des crues éclair en contexte karstique méditerranéen (Maréchal et al. 2008 ;\
    \ Maréchal et al. 2009). Une modélisation numérique a permis d’améliorer la prévision\
    \ des crues (Fleury et al. 2013). Des essais de traçage complémentaires ont également\
    \ été menés (Maréchal et al.2010).\r\n\r\nLe réseau de suivi hydrodynamique s’appuie\
    \ sur les données suivantes:\r\n- Débit (8 stations hydrométriques sur les 5 cadereaux\
    \ et 1 station sur la Fontaine de Nîmes) \r\n- Piézométrie (8 stations piézométriques)\
    \ \r\n- Pluviométrie (9 stations pluviométriques) \r\n- Hydrochimie (campagnes\
    \ spatiales sur le bassin d’alimentation)\r\n\r\nDepuis 2012, le dispositif de\
    \ mesure a été complété par un fluorimètre mesurant en continu (15 min) les variations\
    \ de fluorescence naturelle associées au transport de matière organique naturelle\
    \ dissoute et particulaire. Ce suivi en continu est complété par des campagnes\
    \ spatiales permettant de quantifer le Carbone Organique Total et de définir la\
    \ signature spectrale (matrice 3D excitation/émission) des composés fluorescents."
  notes: 'Biogeographical region: mediterranean'
  status: ACTIVE
