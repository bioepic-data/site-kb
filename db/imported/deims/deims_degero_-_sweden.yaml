  description: The station Degero, with ICOS code SE-Deg, is located in the northern
    Sweden boreal region, about 70 km west of the Gulf of Bothnia, NW of the city
    Umea, situated on highland between the major rivers, Ume and Vindeln River. The
    site is an oligotrophic mire consisting of a rather complex system of interconnected
    smaller mires, divided by islets and ridges of glacial till. The area around the
    Eddy Covariance tower is dominated by flat lawn plants communities with bog moss
    dominating the bottom layer.
  status: ACTIVE
