  description: Qianyanzhou Agricultural Experimental Station of Red Soil and Hilly
    Land, was founded as a pilot experimental site for ecological recovery in South
    China In 1983. In 1985, it was selected as an Integrated Development Demonstration
    Base of Mountain-Lake-River Project of Jiangxi Province. In 1992, as an international
    experiment station, it was nominated by MAB as a training center of UND Jiangxi
    Project. Qianyanzhou Station became a member of CERN in 1991 and a member of ChinaFLUX
    in 2002.
