  description: This site was established on a tall, Japanese native grass (Miscanthus
    sinensis) pasture in 1982. Three different treatments (cutting, cattle grazing
    and abundoning) has been carried out. Vegetational characteristics is investigated
    on 60 locations (20 locations x 3 treatments, 2 m x 2 m each) in late August to
    early September.
