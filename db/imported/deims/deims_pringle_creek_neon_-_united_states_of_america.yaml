  description: Pringle Creek (PRIN) is an aquatic NEON field site located in Wise
    County, Texas, about 3.8 km (2.4 mi.) west of Alvord, TX. The site is hosted by
    the U.S. Forest Service. The stream is deeply incised and is mostly pool and run,
    with one riffle section. It drains a watershed of 48.9 km2 (12,000 acres) of mixed
    oak forest, savanna, and riparian woodland with portions protected by the Caddo-LBJ
    National Grassland. PRIN is part of NEON's Southern Plains Domain (D11), which
    stretches over the central sections of Texas and Oklahoma and includes portions
    of southern Kansas and southern New Mexico. D11 has three other NEON field sites,
    including one additional aquatic and two terrestrial sites, located in Texas and
    Oklahoma. PRIN is colocated with the NEON LBJ National Grassland (CLBJ) terrestrial
    field site.
