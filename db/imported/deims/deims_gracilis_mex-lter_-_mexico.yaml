    elevation_meters: 500.0
  description: "Los sitios están localizados a lo largo del bioma de pastizal semiárido\
    \ que se extiende desde el norte del estado de Chihuahua, hasta la subprovincia\
    \ geográfica de los Llanos de Ojuelos en el noreste de Jalisco. Todos exhiben\
    \ una vegetación de pastizal semiárido dominado por gramíneas cortas del género\
    \ Bouteloua. La topografía se caracteriza por llanuras, mientras los suelos predominantes\
    \ están clasificados como xerosol háplico asociado a litosol y xerosol háplico\
    \ asociado con litosol y planosol éutrico; estos suelos\r\nson someros (menos\
    \ de 50 cm de profundidad). El tipo de uso histórico ha sido de pastoreo, aunque\
    \ existen algunas áreas donde se realizó agricultura de temporal."
