  description: Ashoro Research Forest is located in Ashoro town (143° E, 43°33′′14′′N),
    eastern Hokkaido, with a forest area of 3,713 hectares. The topography is hilly
    with an altitude ranging from 114 m to 471 m above sea level. The nature of soil
    is almost of the tuff strata derived from the Neogene Period and the horizontal
    alternate strata of sandstone and shale. The natural vegetation consists of cool-temperate
    deciduous broad-leaved tree species represented by Quercus crispula and Acer mono.
    The area of artificial forest is about 1260 hectares and main species planted
    is Larix kaempferi. Other tree species such as Abies sachalinensis,Picea glehni,
    Picea abies, broad-leaved species are also planted.
