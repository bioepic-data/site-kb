    country: France
  description: The Hesse site is beech forest plot equipped since 1996 with an eddy
    covariance system to measure continuously (half-hourly) the net fluxes of CO2,
    H2O and energy exchanged between ecosystem and atmosphere. Supplementary sensors
    provide the main meteorological data (temperature, humidity, radiation) and edaphic
    status (soil water content, soil temp.). Additional field campaigns give information
    about ecosystem characteristics evolution (Leaf Area Index, trees growth, fine
    roots biomass), carbon allocation to ecosystem compartments (soil and stem CO2
    efflux, heterotrophic respiration) and their isotopic signature (13C).
  notes: 'Biogeographical region: continental'
  status: ACTIVE
