  description: The Monte Bondone station, ICOS code IT-MBo, is located on a mountain
    plateau, Viote del Monte Bondone, on eastern Italian Alps (Trentino Alto Adige
    region) at 1550 m above sea level. The area is managed as an extensive meadow
    with low mineral fertilisation and is cut annually in mid-July. The canopy is
    dominated by Festuca rubra (L.), Nardus stricta (L.), and Trifolium sp. (L.).
