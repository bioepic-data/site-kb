  description: Restinga semideciduous broadleaf forest with trees varying between
    4 and 10 meters tall growing on nutrient-poor white sand soils distributed parallel
    to the Atlantic coastline. Mean annual temperature is 26oC and mean annual precipitation
    is 1746mm, concentrated between March and August. Dry season length (months <
    100 mm) experience considerable interannual variation (3-9 months) and averages
    6.2 months.
