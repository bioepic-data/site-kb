  description: "Mt. Jumbongsan site has housed the KLTER(Korea Long Term Ecological\
    \ Research) station run by Ministry of Environment and National Institute of Ecology\
    \ since 2004. Mt. Jumbongsan is located between Mt. Soraksan and Mt. Bangtaesan\
    \ and stretches over Gangwon-do, Baekdudaegan in the Korean Peninsula. \r\nThe\
    \ well-preserved old-growth hardwood forest represents the vegetation of Mt. Jumbongsan\
    \ within the core of Mt. Soraksan Biosphere Reserve designated by UNESCO in 1982.\
    \ Qurecus mongolica and Lindera obtusiloba are the dominant species in the tree\
    \ and shrub layer, respectively. Research equipment in the site consists of a\
    \ flux tower, soil respiration measuring system and a V-notch weir. The flux tower\
    \ is set for measuring the flow of CO2 and the photosynthesis rate and microclimate\
    \ of the canopy layer in the area, and the soil respiration measurement system\
    \ for studying correlation between the amount of CO2 from soil microbes and roots\
    \ of plants and the soil temperature, and lastly the V-notch weir for measuring\
    \ the portion material flow running through a mountain valley and hydrological\
    \ studies. Altogether, we are conducting the study of interactions among various\
    \ taxa using information produced from the equipment."
