  description: Lago Alchichica se localiza a una elevación de 2300 msnm con una profundidad
    62 m y es de agua salobre.Habitan organismos endémicos y se encuentran rocas calizas
    de particular interés por los microorganismos que viven en ellas. Se encuentra
    en la Cuenca Oriental de Puebla.
