  description: Röbäcksdalen research station was established 1954 and contains a field
    station and a dairy barn. The field station offers the ability to perform field
    research in a variety of areas such as agricultural science, biology, agroecology,
    soil science and environmental science. At the infrastructure it is possible to
    do research in a variety of areas such as animal science, agricultural science,
    ecology, phenology, climatology, geochemistry, biology, agroecology, soil science
    and environmental science. Visitors and users of the infrastructure can get access
    to the land and a stream collecting drainage and surface runoff-water from the
    area, animals in the dairy facility, workshop, machines, measuring equipment and
    techniques, personnel, laboratories and working stations. All data that is gathered
    within the infrastructure can also be available for the user, most of with is
    continuously collected data, data from feeding trials, climate data, soil data,
    data from water samples of runoff-water, data from the catchment area around the
    station as well as GIS data and data from different long-term-trials. The predominant
    soil type at the experimental fields is sandy-silt, which is characterized by
    good water holding capacity and high capillarity, hence the crops seldom suffer
    from drought here. The humus content is high (3-6%) which means that the soil
    is not so dense, something that otherwise might be a problem for this soil type.
    Sandy soil is present in limited areas. We are active in four different locations
    in northern Sweden. At Röbäcksdalen we manage the station and on the other sites
    we collaborate with Lantmännen Lantbruk at Lännäs (Västernorrland), Torsta AB
    at Ås (Jämtland) and Hushållningssällskapet Norrbotten och Västerbotten at Öjebyn
    (Norrbotten). The dairy barn was built in 2006 and has around 105 dairy cows of
    the breed Swedish red. The barn can e.g. be used for feed trials and among the
    equipment are two Greenfeed units that measure greenhouse gases (GHG) produced
    by the animals. The inclusion of the barn also offers farm scale studies of e.g.
    production of GHG or N or P flows.
