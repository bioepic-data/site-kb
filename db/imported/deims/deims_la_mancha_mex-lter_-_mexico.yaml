  description: Ubicada al final de la cuenca del Río Actopan (ladera oriente del Cofre
    de Perote con fragmentos de bosque mesófilo de montaña, agroecosistemas y poblados),
    La Mancha es el último refugio de selva mediana subcaducifolia  en la vertiente
    del Golfo. Contiene otros importantes ecosistemas costeros (manglar, dunas, selva
    baja, arrecifes, laguna costera), y es sitio de paso y descanso de aves migratorias.
    Presenta alta biodiversidad y una dinámica ecosistémica compleja. Es la zona costera
    del Golfo de México más estudiada en el país. Sitio RAMSAR desde 2005. Se localizan
    los últimos relictos de selva desarrollada sobre suelos arenosos y es ruta de
    aves migratorias rapaces mas importante a nivel mundial.
