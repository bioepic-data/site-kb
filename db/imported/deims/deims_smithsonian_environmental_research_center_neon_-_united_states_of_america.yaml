  description: Smithsonian Environmental Research Center (SERC) is a terrestrial NEON
    field site located in Anne Arundel county, Maryland on the Rhode River, a sub-estuary
    of the Chesapeake Bay. The 10.7 km2 (2650 acre) site is encompassed within and
    hosted by The Smithsonian Environmental Research Center, a research and educational
    center run by the Smithsonian Institution. This site is located within NEON's
    Mid-Atlantic Domain (D02), a densely populated region bounded by the Atlantic
    Ocean on the east and stretching down the Eastern Seaboard from southern New Jersey
    to northern Georgia. The Mid-Atlantic Domain includes two other terrestrial sites
    and two aquatic sites.
