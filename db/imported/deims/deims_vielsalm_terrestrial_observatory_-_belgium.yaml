  name: Vielsalm Terrestrial Observatory - Belgium
  network_registrations:
  - network: DEIMS
    network_id: c4c1c0ca-5a43-4d19-ab50-34dad0af44e8
    network_url: https://deims.org/c4c1c0ca-5a43-4d19-ab50-34dad0af44e8
    name: Vielsalm Terrestrial Observatory - Belgium
  location:
    latitude: 50.305068
    longitude: 5.998052
    country: Belgium
    elevation_meters: 493.0
  description: 'The site is a mixed mature forest composed mainly of Fagus Sylvatica,
    Pseudotsuga menziesii and Picea abies. The soil (100-150 cm deep) is a silty and
    stony soil with B structural horizon composed by schist and phyllades. Fluxes
    of CO2 and water vapour and micrometeorological measurements are performed above
    the forest by an eddy-covariance system installed on a tower since 1996. During
    the successive measurement years, several complementary campaigns have been organised
    : forest inventory, automatic soil respiration measurements, advection, ecosystem
    water budget, diffusion of CO2 and stable isotopes in soil, volatile organic compounds
    fluxes, soil carbon content inventory, monthly evolution of nitrogen deposition...  Research
    activities are carried out by the University of Liège (GxABT) and the Université
    catholique de Louvain (UCL) within the ICOS infrastructure.'
