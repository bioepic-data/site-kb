  description: Os estudos estão sendo realizados no Parque Nacional de São Joaquim
    (PNSJ) e um no Parque Estadual do Acaraí (PAEAC). Essas duas UCs representam alguns
    dos ecossistemas da região sul do Brasil protegidos por lei, mas carentes de estudos
    de longo prazo que associem paisagem e biodiversidade. Em conjunto elas representam
    um gradiente ecológico que abrange desde ecossistemas costeiros, situados ao nível
    do mar, até as matas nebulares, localizadas em altitudes superiores a 1400m. Os
    dois módulos instalados no PNSJ, estão em áreas com relevo irregular que variam
    de 1000 a 1800m de altitude, onde os remanescentes de Matas de Araucárias, Campos
    de Altitude e Matas Nebulares dominam a paisagem. Por outro lado, o módulo do
    PAEAC destaca-e por ser o único módulo inteiramente inserido na região de Restingas
    e Florestas de Terras Baixas, representando o mais importante remanescente contínuo
    de ecossistemas costeiros em Santa Catarina. Condições estas que os torna susceptíveis
    as alterações climáticas e, portanto áreas prioritárias para o desenvolvimento
    de estudos ecológicos em longo prazo.
  status: ACTIVE
