    elevation_meters: -20.0
  description: The Site is located on the northeast Brazilian coast, East Brazil LME,
    and includes the seascape extending from the coast to the continental slope. The
    coastal area is formed by an ecosystem complex including remnantes of Atlantic
    forest,  mangroves, seagrass beds and coraline reefs. These ecosystems are interconnected
    along the seascape over the typically carbonatic shelf, with widths around 18
    nautical miles. Along the shelf, submerged channels related to continental drainage
    in glacial periods, and submerged reefs, form habitats responsible for supporting
    resources exploited by intense fishing activity. The outermost portion of the
    continental shelf, considered as an area of significant biological and ecological
    interest (EBSA), is a biodiversity hotspot, home to reef fish spawning aggregations,
    and higher fish yield associated with evidence of sub-surface upwellings. These
    seascape support complex ecological processes, subject to intense use, in an area
    recognized as a priority for conservation. The presence of Marine Protected Areas
    reflects this characteristic, both for the need to protect these environments,
    and for the socio-economic importance, with two protected areas for sustainable
    use (APAs) and one for Integrated Protection (Park), organized in mosaic.
