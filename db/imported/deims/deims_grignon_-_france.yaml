  description: The station Grignon, having ICOS code FR-Gri, is located 1 Km east
    of the namesake tows, about 40 Km west of Paris, in a plateau situated close to
    a farm cattle. The site is a large cropland field (19 ha) located in the suburb
    of Paris and it is exposed to heavy atmospheric pollution coming from the Parisian
    area, the Benelux, as well as the south of England and Germany with east and northerly
    winds. On the contrary it is exposed to clean ocean air during south-westerly
    wind (which is the main wind direction). The site itself is representative of
    the main practice of arable crops farming in France with a crop rotation including
    wheat, maize and oilseed rape, representing more than 60% of the crops in France.
  status: ACTIVE
