  description: Riparian forest in cool-temparate zone.The study site (35°57'30"N,
    138°45'32"E) is located in a riparian zone along a small stream (Ooyamazawa) of
    the Nakatsugawa branch of the Arakawa River, in Chichibu Mountains, central Japan.
    This site is located in the protected Chichibu-Tama National Park and ranged from
    1210-1530 m above sea level. This riparian forest in this area phytosociologically
    belongs to the Chrysosplenio-Fraxinetum spaethianae, a typical riparian forest.
    Dominant canopy species in this area are Fraxinus platypoda, Pterocarya rhoifolia
    and Cercidiphyllum japonicum over 30 m in tree height. The subcanopy specie are
    Acer shirasawanum and Acer mono, and the understory is primarily composed of Acer
    carpinifolium and Acer argutum. The area around the study plot is no human disturbances
    such as logging or erosion control works. This study site is a part of the Monitoring
    Sites 1000 Project launched by the Ministry of the Environment, Japan, and also
    is one of a Japan Long-Term Ecological Research (JaLTER) Sites.
