  description: UK Upland Waters Monitoring Network (UK UWMN) site. Loch Coire Fionnaraich
    has a catchment of 550 ha, with a range of elevation from 236 m at the outflow
    to 933 m at the summit of Maol Chean-dearg. Whilst a band of Cambrian basal quartzite
    and "Pipe Rock" crosses beneath the northern side of the loch, the catchment geology
    is mostly made up of Torridonian sandstones from the Applecross and Aultbea groups.
    Catchment soils consist of peats and peaty podsols alongside extensive areas of
    exposed rock. Vegetation is dominated by Molinia and Calluna and the catchment
    is treeless. The surrounding moorland is managed for red deer and low numbers
    of feral goats are also present. A popular hiking path passes along the western
    shore of the loch. There are a number of very small lochans and pools on the catchment's
    northern boundary and one more in the north-west.
