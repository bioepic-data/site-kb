  description: Beverbeek is a complex site consisting of areas with a primary conservation
    purpose as the two gazetted nature reserves Elsbroek (mesotrophic and oligotrophic
    mire with alder-birch woodland, Myrica bush) and Zooren (alluvial plain forest).
    Other parts are multifunctional forests with scots pine, corsican black pine,
    oak, larch, douglas fir, etc.
