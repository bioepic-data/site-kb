  description: The Vallon de Roche Noire is situated between the Col du Lautaret and
    the Col du Galibier, in the French Alps, and extends from 2300 m to more than
    2800 m. The catchment is mainly covered by alpine meadows and is surrounded by
    flysch cliffs. It represents an almost undisturbed alpine pasture landscape.
