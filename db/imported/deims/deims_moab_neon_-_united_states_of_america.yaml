  description: The NEON site at Moab (MOAB) is a terrestrial field site about 40 km
    (25 mi.) south of the town of Moab in San Juan County, Utah, on the Colorado Plateau.
    Its sampling area is 50km2 (12,355 acres) on land managed by the Bureau of Land
    Management. The terrain at the tower site is flat with a very shallow slope towards
    the southwest. This is a key design element because the winds mostly come from
    this direction, allowing NEON to best measure dust generation and deposition.
    Vegetation is a mix of grasses and forbs with a uniform distribution, and the
    site is lightly grazed. The structure of this type of vegetation is representative
    of the dominant vegetation of the region. MOAB is part of NEON's Southern Rockies
    and Colorado Plateau Domain (D13). D13 includes one other terrestrial site and
    two aquatic sites. MOAB is not colocated with an aquatic field site. MOAB is managed
    out of the D15 Support Facility in Salt Lake City, UT.
