  description: "TERN Robson Creek Rainforest is a field site in Ecosystem Processes\
    \ (https://www.tern.org.au/tern-observatory/tern-ecosystem-processes), a field\
    \ platform within the Australian Terrestrial Ecosystem Network TERN (http://www.tern.org.au/).\
    \ \r\n\r\nTERN Ecosystem Processes aims to answer both network wide and site-specific\
    \ science questions through long term monitoring using both sensor technology\
    \ and classical field methods. The Robson Creek Rainforest site lies on the Atherton\
    \ Tablelands in the wet tropical rainforests of Australia at 680-740 m elevation.\
    \ It is situated in Danbulla National Park within the Wet Tropics World Heritage\
    \ Area. The climate is seasonal with approximately 60% of rain falling between\
    \ January – March and the landform is moderately inclined with a low relief although\
    \ the Lamb Range rises sharply to 1276 m asl immediately to the north of the plot.\
    \ \r\n\r\nThe traditional owners in this area are the Tableland Yidinji People."
