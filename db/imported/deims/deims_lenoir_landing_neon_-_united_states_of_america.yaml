  description: The Lenoir Landing site (LENO) is a terrestrial field site located
    located in southwest Alabama near Butler, AL in Choctaw county. The 58 km2 (14,349
    acre) site is colocated with the 17 km2 (4218 acre) Choctaw National Wildlife
    Refuge and Lenoir Landing Park. Lenoir Landing Park hosts the flux tower and tower
    plots and is managed by the U.S. Army Corps of Engineers. The distributed plots
    are located 5 km (3 mi.) south of the tower shed on the Choctaw National Wildlife
    Refuge managed by the U.S. Fish and Wildlife Service. The site is characterized
    by hardwood bottomland with seasonal flooding and is located along the Tombigbee
    River. This site is part of NEON's Ozarks Complex Domain (D08). D08 includes two
    other terrestrial field sites and three aquatic field sites. LENO is colocated
    with the Lower Tombigbee River aquatic site (TOMB).
