  description: Acid alpine grassland on a ridge extending westward from the summit
    of Mount Salatın in the Jalovecka dolina valley,Western Tatra Mountains, Tatra
    National Park, Slovakia. Vegetation at the site belong to the alliance Juncion
    trifidi and it is dominated by graminoid species, including Oreochloa disticha,
    Festuca supina and Agrostis rupestris, with lower cover of forb and shrub species.
    Soils at the site are humic ferruginous podzols, derived from biotite granodiorite
    parent material.
