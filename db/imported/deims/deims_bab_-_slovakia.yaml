    country: Slovakia
    elevation_meters: 190.0
  description: The Bab forest (66 ha) was selected as an example of a lowland deciduous
    broad-leaved forest on loess for ecosystem research in the International Biological
    programme (IBP) in 1967. More than 60 researchers performed a comprehensive ecosystem
    research at the site within IBP and MaB programmes in 1967-1975. This period finished
    by production of syntheses in micro-meteorology and micro-climate, soils, soil
    microbiology, ecophysiological processes of plants (photosynthesis, water relations,
    mineral nutrition), primary productivity, nutrient cycles, water circulation,
    and secondary productivity. The ecosphisiological studies continued in 1975-1980,
    later the research was focused to plant population biology and alien plants invasions.
    The ecosystem research was re-established in 2007. The inventory of shrub and
    trees, herb vegetation, selected animal groups allowed identification of changes
    during 40 years caused probably by the climate changes and anthropogenic disturbances.
    The differences in decomposition of selected native and invasive plant species
    were assessed. The biomonitoring of the air pollution was done using mosses as
    indicator organisms. Now the research is focused to dynamics of forest ecosystem
    (vegetation, selected invertebrate groups, small mammals) and impact of forestry
    management (clear-cuts) to structure and dynamics of forest ecosystem. The multisite
    trampling experiment (ALTER-Net) and tea decomposition experiment (ILTER) were/are
    performed at the site.
