  description: "Kilpisjärvi Biological Station is situated in the mountain birch forest\
    \ zone near the 70th degree of northern latitude\r\n(69°03'N; 20°50'E) in the\
    \ northwesterenmost part of Finland. The station belongs to University of Helsinki,\
    \ the Faculty of Biological and Environmental sciences. The station is famous\
    \ for its long-term ecological research projects (longest continuous ecological\
    \ projects started already in 1946), and long-term follow-up studies form the\
    \ core of the research activities. For instance, the projects were praised in\
    \ the international \"Research Assessment Exercise 2005\" of the University of\
    \ Helsinki. Data of these projects are constantly used as background information\
    \ in many short-term projects, too (see Figure below). Because the station is\
    \ situated in the Sámi indigenous people reindeer herding area, there are good\
    \ opportunities for socioeconomic studies. Land use conflicts between different\
    \ stakeholders (reindeer herding, tourism, scientific research, etc.) have already\
    \ been studied."
