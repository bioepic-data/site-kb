  description: The BLE LTER program (https://ble.lternet.edu/) focuses on productivity,
    trophic relationships, and biogeochemical cycling in the network of lagoons that
    span Alaska’s northernmost coastline. BLE is examining factors that affect the
    stability and resilience of microbial and metazoan food webs, including drivers
    and forms of primary production, in these highly dynamic ecosystems.
