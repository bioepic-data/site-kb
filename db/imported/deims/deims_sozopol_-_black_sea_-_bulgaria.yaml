  description: 'The Laboratory of Marine Ecology is one of the field stations of IBER-BAS,
    based in the town of Sozopol on the coast of the Black Sea. It is provided with
    upgraded equipment and modern laboratory facilities necessary for carrying out
    investigations on the biodiversity and functioning of the coastal marine ecosystems.
    The laboratory is equipped with facilities for general ecological studies, a chemical
    and instrumental laboratory, microscopes and stereomicroscopes and a workshop.
    Main scientific equipment: spectrophotometer and instruments for sediment and
    water sampling and analysis, a combined pH/dissolved oxygen/conductivity measuring
    Instrument (WTW), microscopes and equipment for phytoplankton and microbiological
    research. The laboratory uses SCUBA diving equipment and possesses a small research
    vessel suitable for work in the coastal zone.'
