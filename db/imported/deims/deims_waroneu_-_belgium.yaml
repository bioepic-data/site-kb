  description: 'Waroneu is a 83 ha forested catchment located in the east of Belgium
    (« Hertogenwald »: Duke''s forest) within the municipality of Baelen.  In 2011,
    it was covered with 38% conifers (mainly Picea abies), 45% deciduous trees (Fagus
    sylvatica, Quercus robur, Betula pendula), and 17% open space. Biogeochemistry
    (nutrient and organic carbon in throughfall, rainfall, soil solution and outlet)
    has been studied since 1991. The catchment was limed in 1992 with 3T/ha dolomite
    and 200 kg/ha potassium sulfate.  Since 2013, biogeochemistry and soil microbial
    parameters (microbial biomass, N mineralization, basal respiration) are studied
    in 6 intensive plots, reflecting major combinations of vegetation and upper soil
    caracteristics within the catchment.'
