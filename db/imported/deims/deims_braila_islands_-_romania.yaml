sites:
- id: site_kb:deims-braila_islands_-_romania
  name: Braila Islands - Romania
  network_registrations:
  - network: DEIMS
    network_id: d4854af8-9d9f-42a2-af96-f1ed9cb25712
    network_url: https://deims.org/d4854af8-9d9f-42a2-af96-f1ed9cb25712
    name: Braila Islands - Romania
  location:
    latitude: 44.9624
    longitude: 28.0023
    country: Romania
    elevation_meters: 2.0
  description: "\"Braila Islands\" site with a total surface of over 2600 km2 is situated\
    \ in the South-East of Romania  corresponding to a 78 km long Danube sector that\
    \ stretches between Harsova (kilometer 253) and Braila (kilometer 175) cities.\
    \ This socio-ecological system is inhabited by near 300,000 people and comprises\
    \ heavily modified ecosystems (e.g. Big Island of Braila, former wetland transformed\
    \ into agricultural land) but also systems under a natural functional regime (e.g.\
    \ Small Islands of Braila), being of a crucial natural and socio-economical value.\r\
    \nThe Danube river along the Braila Islands section has been ranked as a heavily\
    \ modified water body according to criteria 2.1 (embankment works) due to the\
    \ hydro-technical works on more than 79% of the river stretch sector and a candidate\
    \ to “heavily modified” according with the WFD criteria 2.2 (regulation works)\
    \ as a result of dredging of 21% of the river bed for intensive navigation. The\
    \ main remnant of the natural floodplains consists in the wetlands from the Small\
    \ Island of Braila Natural Park with a total surface of 210 km2 and the floodplains\
    \ between the riverbanks and dikes of almost 93 km2."
