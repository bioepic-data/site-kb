sites:
- id: site_kb:deims-post-mining_lakes_-_czechia
  name: Post-mining lakes - Czechia
  network_registrations:
  - network: DEIMS
    network_id: 3c3beff8-a097-49a2-a7a1-f7b23a8bf876
    network_url: https://deims.org/3c3beff8-a097-49a2-a7a1-f7b23a8bf876
    name: Post-mining lakes - Czechia
  location:
    latitude: 50.538946
    longitude: 13.646135
    country: Czechia
    elevation_meters: 250.0
  description: Large-scale opencast mining of brown coal represents a significant
    and devastating intervention in the natural environment. As a close to nature
    and economically acceptable method of reclamation of residual mine pits, the hydric
    method of reclamation is used, when lakes are created from quarries. The creation
    of a new lake in a former mining area essentially represents a large-scale ecological
    experiment, during which a number of specific factors are involved with impacts
    on individual organisms, multiple trophic levels and interactions, even entire
    food chains, and ultimately the lake water quality. Post-mining lakes (Medard
    Lake – 490 ha, max. depth 50 m, 400 m a.s.l., Milada Lake – 245 ha, max. depth
    25 m, 145 m a.s.l., Most Lake – 310 ha, max. depth 75 m, 199 m a.s.l.) thus represent
    unique LTER areas for studying ecological processes in large natural lentic ecosystems.
    The ongoing research is focused mainly on (i) the structuring effect of submerged
    macrophytes on trophic relationships and distribution of fish in deep lakes, (ii)
    the effects of intra- and interspecific interactions on the succession of fish
    communities, and (iii) the effects of anthropogenic use and long-term changes
    on water quality, composition, periphyton composition and phytoplankton structure
    and biomass.
