  description: Islands are unique place to be characterized as a long-term monitoring
    site, sustaining communities and preserved high rate of endemism. For not having
    the typical impacts of increasing urbanization in the coastal zone, it becomes
    possible to reliably identify the appropriate sources of impacts (such as overfishing),
    and the direct consequences on the system. This statement is difficult to precisely
    on the coast where the synergism disorders does not isolate each process. Still
    being the islands of control ICMBio with some protection status (Fernando de Noronha
    = National Park; Atol das Rocas = Biological Reserve), or with ongoing research
    programs with the logistical support of the Navy of Brazil and funding CNPQ (Archipelago
    St. Peter and St. Paul and Trindade island), management and conservation rules
    can be more efficiently deployed without generating conflicts with the various
    groups of users of the areas, which is a common situation when it comes to coastal
    systems where 50% of the population live.
