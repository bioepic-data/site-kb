    longitude: 23.405542
    country: Bulgaria
    elevation_meters: 1750.0
  description: This site is located on the territory of National Park “Rila”, Bulgaria.
    Parangalitsa has been a reserve since 1933. It is situated on part of the southwestern
    slopes of Rila mountain, covering 1,509 hectares. It contains some of the oldest
    pine tree forests in Europe with an average age of over 200 years. The site is
    a part of the network of bioecological stations of Forest Research Institute –
    BAS and research is focused on highly productive coniferous forests with unique
    biomass. In the main experimental plots, long-term complex studies were conducted
    during the period 1979 - 1998, a large-scale database was created and a number
    of significant scientific results were obtained. In the period 2000 - 2018, separate
    targeted studies were carried out - focused on some ecosystem processes, which
    allows the analysis and evaluation of the functioning of ecosystems to be don
