  description: "The Protected Landscape Area and Biosphere Reserve Křivoklátsko is\
    \ mostly covered by broadleaved forests that are valuable by high diversity of\
    \ flora, fauna and communities. This biodiversity is increased in deep valley\
    \ of the Berounka River with xeric grasslands on the southern slopes. Inversion\
    \ of vegetation belts is typical of narrow valleys of the Berounka River tributaries.\r\
    \n\r\nMonitoring of vegetation changes and soil properties in natural forests\
    \ (since 1994) and xeric grasslands (since 2004) is the main focus of the LTER\
    \ sites. Continuously with vegetation changes, studies on soil fauna in forests\
    \ were carried out."
