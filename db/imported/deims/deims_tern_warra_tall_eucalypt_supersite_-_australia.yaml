  description: "Warra Tall Eucalypt SuperSite is a member of the Australian SuperSite\
    \ Network (SuperSites, http://www.supersites.net.au/), a facility within the Australian\
    \ Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/).\r\n\r\nSuperSites\
    \ aims to answer both network wide and site-specific science questions through\
    \ long term monitoring using both sensor technology and classical field methods.\r\
    \n\r\nThe Warra Tall Eucalypt SuperSite is located in southern Tasmania, where\
    \ tall, wet Eucalyptus obliqua forests predominate, and are part of the cool,\
    \ temperate wet forest biome. These forests are among the most productive terrestrial\
    \ ecosystems in the world and their management generates a disproportionately\
    \ high social and political interest. The site also includes some areas of moorland,\
    \ temperate rainforest, riparian and montane conifer forest and scrubs. Warra\
    \ is partly within the Tasmanian Wilderness World Heritage Area, which is managed\
    \ for conservation, and partly within State forest, which is managed for multiple\
    \ purposes including wood production.\r\n\r\nWarra Tall Eucalypt was established\
    \ as a Long-term Ecological Research (LTER) site in 1995, and is one of Australia’s\
    \ most scientifically productive. It is a hub for intensive, multi-disciplinary\
    \ research to understand the fundamental ecological processes in E. obliqua forests\
    \ and the long-term effects that management has on those processes in contrast\
    \ with natural disturbance.\r\n\r\nCurrent research is focussing on the bio-physical\
    \ processes that support the biota and how they fluctuate across scales both spatial\
    \ and temporal.\r\n\r\nDetailed knowledge exists for many elements of the biota\
    \ at Warra Tall Eucalypt their habitats, their distribution and their response\
    \ to disturbance.\r\n\r\nImportantly, research done at Warra Tall Eucalypt has\
    \ directly driven improvements in forest management more generally, e.g. the introduction\
    \ of variable retention silviculture in mature tall, wet eucalypt forests.\r\n\
    Key research objectives\r\n\r\n\t- What are the fundamental ecological processes\
    \ in E. obliqua wet forests?\r\n\t- What are the current biodiversity and geodiversity\
    \ of the site and how are these changing, evolving and interacting?\r\n\t- What\
    \ are the long-term effects of different forest management and fire regimes on\
    \ biodiversity, geodiversity and ecological processes?\r\n\t- What are the flows\
    \ of water, nutrients and energy, the biota through which those flows occur, and\
    \ how do they assemble, interact, and change over time?\r\n\t- How do disturbances,\
    \ both natural and human-induced alter the biological, physical and geochemical\
    \ properties of the ecosystem? In particular, what are the mechanisms through\
    \ which the ecosystem recovers following disturbance, what are the feedbacks that\
    \ determine or alter those responses, and what are the thresholds beyond which\
    \ state changes occur?\r\n\r\nTERN acknowledges the palawa and pakana people (Tasmanian\
    \ Aboriginal community) as Traditional Owners of lutruwita (Tasmania)."
