sites:
- id: site_kb:deims-laegeren_-_switzerland
  name: Laegeren - Switzerland
  network_registrations:
  - network: DEIMS
    network_id: 7b4d8b76-1c6d-410c-998c-f9c56b2f7347
    network_url: https://deims.org/7b4d8b76-1c6d-410c-998c-f9c56b2f7347
    name: Laegeren - Switzerland
  location:
    latitude: 47.4783
    longitude: 8.36439
    country: Switzerland
    elevation_meters: 680.0
  description: "The site is located next to Wettingen in the canton of Aargau, within\
    \ a natural, mixed forest stand which mainly consists of 150 year-old beech (Fagus\
    \ sylvatica) and 120-170 year-old spruce (Picea abies) trees. Among others, the\
    \ site is equipped with two meteorological measurement stations; one is located\
    \ within the forest stand, the second is co-located in the nearby open-field,\
    \ allowing to measure the forest stand effect on micro-climate.\r\nThe following\
    \ parameters are being measured since 2013: Soil solution chemistry (lysimeters),\
    \ TREENET, atmospheric deposition (throughfall and bulk deposition), circular\
    \ vegetation plots, crown condition assessment, diameter and height measurements,\
    \ foliar analyses, leaf area index (LAI), litterfall, manual circumference band\
    \ measurements, Ozone visible injury assessment, permanent vegetation quadrats,\
    \ phenological observations, sapflow measurements, soil matrix chemistry, tree\
    \ core sampling, automated point dendrometer measurements, automatic circumference\
    \ band measurements."
