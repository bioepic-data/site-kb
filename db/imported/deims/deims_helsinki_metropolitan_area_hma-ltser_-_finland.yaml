  description: "The Helsinki Metropolitan Area HMA-LTSER platform belongs to the LTER-Finland\
    \ network, and it covers a metropolitan area comprising Espoo, Helsinki, Kauniainen\
    \ and Vantaa municipalities. About a fifth of the population in Finland lives\
    \ within this platform’s boundaries, and it is the most multicultural and rapidly\
    \ growing area in the country.\r\nHMA-LTSER is located on the northern shore of\
    \ the Baltic Sea, between the boreal and hemiboreal climatic zones. The platform\
    \ includes the most urbanised areas in Finland, which are in turn interspersed\
    \ with managed mixed coniferous forests and parks, peatlands, lakes and streams.\
    \ The periurban area of the platform also contains agricultural land and commercial\
    \ plantations, as well as part of the waters and coast of the Baltic Sea. The\
    \ area within the platform represents a blend of cosmopolitan urban life and tranquil\
    \ natural landscapes, making it an attractive place for both residents and visitors.\
    \ \r\nHMA-LTSER monitors relevant environmental parameters along an urbanisation\
    \ gradient as well as different aspects concerning human-nature relations. The\
    \ cities of Espoo, Helsinki, Kauniainen and Vantaa, as the network partners, contribute\
    \ to the platform by offering data for research as well as applying research outputs\
    \ in planning, policy-making and civic activities. \r\nHMA-LTSER is envisioned\
    \ as a hub for different initiatives interested in exploring topics related to\
    \ human-nature interactions and ecosystem services within an urban frame."
