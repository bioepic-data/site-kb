  description: Network of cold scree slope observation. Cold scree slopes are debris
    slopes which lower part is overcooled by seasonally alternating air circulations.
    "Abyssal" ecosystems develop on the cooled part, with dwarf trees, arctic-alpine
    plant, moss and lichen associations, on moor type humus. These sites show a unique
    combination of geomorphologically induced microclimate, vegetation, soil and soil
    microfauna. The network of monitoring sites is distributed over the French Alps
    and Jura mountains.
