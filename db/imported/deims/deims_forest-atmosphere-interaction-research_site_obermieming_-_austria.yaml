  description: "The Forest-Atmosphere-Interaction-Research (FAIR) site is an interfaculty,\
    \ interdepartmental forest research platform of the University of Innsbruck situated\
    \ in a Scots Pine forest some 30 km to the west of Innsbruck (Austria).\r\nThe\
    \ research activities at the FAIR site currently revolve around five main interlinked\
    \ research areas:\r\n- ecosystem carbon and water cycle\r\n- forest-atmosphere\
    \ air quality interactions\r\n- boundary-layer meteorology in complex topography\r\
    \n- remote and proximal sensing\r\n- model development, testing and validation"
