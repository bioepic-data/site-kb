  description: "SEQ Peri-urban SuperSite - Karawatha is a member of the Australian\
    \ SuperSite Network (SuperSites, http://www.supersites.net.au/), a facility within\
    \ the Australian Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/).\
    \ \r\nSuperSites aims to answer both network wide and site-specific science questions\
    \ through long term monitoring using both sensor technology and classical field\
    \ methods.\r\n\r\nThe SEQ Peri-urban SuperSite’s (SEQP) core infrastructure is\
    \ located along two longitudinal transects north and south of Brisbane where the\
    \ urban footprint is expanding the most rapidly. Karawatha Forest is on the southern\
    \ peri-urban edge of Brisbane and is managed by the Brisbane City Council. It\
    \ contains a variety of habitats from freshwater lagoons and sandstone ridges,\
    \ to dry eucalypt forests and wet heath."
