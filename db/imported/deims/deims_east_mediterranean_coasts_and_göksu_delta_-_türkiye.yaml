  description: "The Göksu Delta, located on the southern coast of Turkey in Mersin\
    \ Province, is a dynamic and ecologically rich wetland system where the Göksu\
    \ River meets the Mediterranean Sea. Spanning approximately 15,000 hectares, the\
    \ delta consists of a diverse landscape that includes freshwater and saltwater\
    \ marshes, lagoons, sand dunes, reed beds, and agricultural fields. The climate\
    \ is Mediterranean, with hot, dry summers and mild, wet winters, contributing\
    \ to the formation of unique wetland ecosystems.\r\nGeologically, the delta is\
    \ composed of alluvial deposits carried by the Göksu River, forming a dynamic\
    \ environment shaped by sedimentation and coastal processes. The interaction between\
    \ riverine and marine influences creates a range of salinity gradients, supporting\
    \ a variety of vegetation types, including Phragmites reeds, halophytic plants,\
    \ and riparian woodlands.\r\nGöksu Delta is internationally recognized as a Ramsar\
    \ Wetland of International Importance, serving as a crucial habitat for over 300\
    \ bird species. The area also supports populations of sea turtles (Caretta caretta,\
    \ Chelonia mydas), which nest on its sandy beaches. Human activities in the delta\
    \ include fishing, agriculture, and eco-tourism, with conservation efforts in\
    \ place to balance biodiversity protection and sustainable land use.\r\nThe site\
    \ has been subject to long term scientific studies and ecological monitoring conducted\
    \ by the Aquatic Ecology Research Group of the Middle East Technical University,\
    \ Institute of Marine Sciences. An online water quality monitoring system is in\
    \ the process of establishment."
