  description: "The Czech Arctic Research Station of Josef Svoboda is situated in\
    \ the High Arctic. The mean annual temperature is -6 °C, and the mean annual precipitation\
    \ is 150-200 mm. Petuniabukta, where the field camp is located, is in the central\
    \ part of the Svalbard archipelago, which is more continental and drier than the\
    \ western part. There is a steep elevation gradient in the area (the highest mountains\
    \ reach 1000 m a.s.l.). Various habitats can be accessed within walking distance\
    \ in the study area, i.e. sandy beaches, waterlogged tundra, seepages, dry tundra,\
    \ bird cliffs, lakes, snow-melt and glacial streams, glaciers, etc. Rich wildlife,\
    \ incl. gulls, kittiwakes, terns, barnacle geese, eiders, reindeer, arctic foxes,\
    \ and polar bears are present as well.\r\n\r\nResearch mainly focuses on biodiversity\
    \ and ecosystem dynamics. Relatively long research records on plant ecology, phycology,\
    \ parasitology, and bioclimatology exist. Today, studies on geomorphology and\
    \ hydrology are developing in the area. Regular meteorological measurements were\
    \ established in 2007."
  status: ACTIVE
