    country: United States of America
    elevation_meters: 590.0
  description: "Established in the 1950's, the Hubbard Brook Experimental Forest (HBEF)\
    \ is located in the southern part of the White Mountain National Forest (WMNF)\
    \ in central New Hampshire, USA.  \r\nHBEF, and the broader WMNF have hilly, occasionally\
    \ steep topography; coarse, acidic, glacially-derived soils; bedrock dominated\
    \ by metamorphic rock of igneous and sedimentary origin; northern hardwood forests\
    \ on lower slopes and spruce-fir forests at higher elevations (above ca. 800 m)."
