  description: "Col du Lac Blanc experimental site is located at the Alpe d'Huez ski\
    \ resort near Grenoble in the French Alps.  Col du Lac Blanc experimental field\
    \ is located around 2700 m a.s.l and is oriented north–south. The area consists\
    \ of a large surface of relatively flat terrain (about 25 ha). The pass orientation\
    \ and the specific configuration of the surrounding summits make the pass closely\
    \ resemble a natural wind tunnel.The\r\nnorth–south direction accounts for 90%\
    \ of the wind directions. Aeolian snow transport is observed 10% of the time in\
    \ winter and occurs with concurrent snowfall 37% of the time \r\nIt has been dedicated\
    \ to the study of blowing snow in high mountainous regions for approximately since\
    \ 1989 by IRSTEA (Snow Avalanche Engineering and Torrent Control Research Unit)\
    \ and Meteo France (Snow Study Centre)."
