  description: The Archipelago Research Institute is a historical marine station at
    the island of Seili, located in the middle of the Turku archipelago. The Institute
    offers various research support services as well as participates in multidisciplinary
    research of the Baltic Sea, with a special focus on the condition of the Archipelago
    Sea. The station is open for researchers and visitors year-round.
