  description: Located in the central Brazilian plateau, the nuclear region of the
    cerrado biome. The climate is Aw of Koppen (1931), with annual rainfall between
    1200 and 2000 mm, concentrated between September and March, and the average annual
    temperature is 24.6 ° C. In the park dominates the flat relief, with altitudes
    ranging between 720 and 890 m. The PNE is home to all types of vegetation occurring
    in the Cerrado, with a predominance of open formations - "campo limpo", "campo
    sujo" and "campo cerrado" - holding 78.5% of the park area. The PNE is renowned
    for its wildlife observation easy, especially birds and mammals.
