  description: Shapotou  Desert  Experimental Research Station of CAS founded in 1955,
    locates in Zhongwei City of Ningxia Hui Autonomous Regions, the People’s Republic
    of China, at the Southeastern edge of the Tengger Desert ；It was ratified as the
    opening research station of CAS in 1990. Became membership of the Chinese Ecological
    System Research Network (CERN) in 1992, as the National Key Field Scientific Observation
    Station by Ministry of Science and Technology of the People’s Republic of China
    in 2000.
