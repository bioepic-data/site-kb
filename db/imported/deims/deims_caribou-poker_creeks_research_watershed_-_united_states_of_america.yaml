  description: The Caribou-Poker Creeks Research Watershed (CPCRW) is a relatively
    pristine, 104 km2, basin reserved for meteorologic, hydrologic, and ecologic research,
    with no current human influence (other than scientific research). The CPCRW is
    the only research watershed in the United States located in the region of discontinuous
    permafrost, which comprises a large portion of Alaska and most of interior Alaska.
