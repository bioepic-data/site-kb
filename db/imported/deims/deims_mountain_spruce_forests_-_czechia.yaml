    country: Czechia
    elevation_meters: 1150.0
  description: "Site consists of a large set of mountain spruce forest monitoring\
    \ plots (388) that have been monitored since 2008. The main focus of monitoring\
    \ is the effect of cessation or reduction of forest management on vegetation dynamics\
    \ and the recovery of forest from windthrow and/or bark beetle-induced die off.\
    \ Each plot of the monitoring network (500 m2) is studied using the Field-Map\
    \ technology and the following characteristics are measured: plot characteristics,\
    \ location and characteristics of all trees (living, dead), stumps and dead wood,\
    \ numbers and quantitative / qualitative characteristics of natural regeneration\
    \ and plant community composition. \r\n\r\nThe type of forests include Calamagrostis\
    \ spruce forests (L9.1), Bog and waterlogged spruce forests (L9.2), and Athyrium\
    \ spruce forests (L9.3)."
