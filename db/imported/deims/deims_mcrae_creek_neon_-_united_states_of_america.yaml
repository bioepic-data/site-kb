  description: 'McRae Creek (MCRA) is an aquatic NEON field site located within the
    H.J. Andrews Experimental Forest, 80 km (50 mi.) east of Eugene, OR in the Western
    Cascade Mountains. It is a third-order stream that drains a 3.93 km2 (970 acre)
    old-growth coniferous forested watershed. H.J. Andrews is a 64 km2 (15,800 acre)
    ecological research site that is administered by Oregon State University, the
    USDA Forest Service’s Pacific Northwest Research Station, and the Willamette National
    Forest. It has been a part of the National Science Foundation’s Long-Term Ecological
    Research Program since 1980. It mainly consists of dense forests filled with cedar,
    hemlock, and Douglas fir trees, many of which are at least 300 years old and can
    grow as high as 75 m (250 ft.). MCRA is located in NEON''s Pacific Northwest Domain
    (D16), which is bounded by the Pacific on the west and Canada on the north. It
    includes the eastern halves of Washington and Oregon and parts of northern California.
    The Domain hosts three other field sites: one additional aquatic and two terrestrial.'
