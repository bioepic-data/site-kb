  description: Smithsonian Conservation Biology Institute (SCBI) is a terrestrial
    field site located on the foothills of the Blue Ridge Mountains in Front Royal,
    Virginia. The 12 km2 (2966 acre) NEON field site is located within and hosted
    by the Smithsonian Conservation Biology Institute, a research and education institution
    run by the Smithsonian Institution. The site is dominated by mature and secondary
    hardwood forest. This site is located within NEON's Mid-Atlantic Domain (D02),
    a densely populated region bounded by the Atlantic Ocean on the east and stretching
    down the Eastern Seaboard from southern New Jersey to northern Georgia. The Mid-Atlantic
    Domain includes two other terrestrial sites and two aquatic sites. SCBI is colocated
    with the POSE aquatic site.
