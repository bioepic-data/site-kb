  description: The Regional Spatial Observatory (OSR), labeled in 2007 by the National
    Institute of Sciences of the univers (INSU), is supported by the Center of Spatial
    Studies of the BIOSPHERE (CESBIO, OMP). The mission of the OSR aims at documenting
    on the long term the effects of the climate change and the increasing anthropogenic
    pressures on the hydrologic and agro-ecologic evolutions in the South-West of
    France near Toulouse, for various spatial and temporal scales.
