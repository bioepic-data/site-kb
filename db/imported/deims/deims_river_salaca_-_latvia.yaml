  description: 'Salaca is a river in northern Latvia, Vidzeme. Salaca is anthropogenically
    little affected river that is situated in the North Vidzeme Biosphere Reserve,
    Latvia. n Salaca''s  drainage basin natural territories are dominating: forests
    (56,17%), bogs (3,77%) and waterbodies (1,88%). Arable lands are 37,5%, and urban
    territories 1,88% from the drainage area.  It is 90 km long and flows from Lake
    Burtnieks to the Gulf of Riga. The river flows through three towns, Mazsalaca,
    Staicele and Salacgrīva. The riverbanks feature Devonian red sandstone cliffs,
    and many caves and rapids as well. Salaca is internationally recognized river
    with high biodiversity.It is he most important salmon river in Latvia.'
