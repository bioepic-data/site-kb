  description: A mosaic of savanna, dry forest, evergreen forest, and grassland most
    of them seasonally floodable by overflow of water from Cuiabá River. Regional
    climates is tropical wet and dry. Besides Cuiabá River, there are a large number
    of permanent water body widespread in the landscape, such as oxbow lakes and secondary
    river channels.
