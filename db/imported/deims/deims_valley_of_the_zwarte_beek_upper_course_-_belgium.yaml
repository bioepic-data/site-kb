  description: The site comprises 10 km stretch of a stream valley  managed as a private
    nature/state reserve some 17 kilometer North of the city of Hasselt. Since 1995,the
    restoration projects are carried out aiming at restoring the fen/carr ecosystem.
    Monitoring of the ground- and surface water dynamics and chemistry, the vegetation
    evolution is carried out by INBO.
