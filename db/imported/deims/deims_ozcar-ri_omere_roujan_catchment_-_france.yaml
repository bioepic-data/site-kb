    country: France
    elevation_meters: 100.0
  description: "Small agricultural catchment (91 ha) in a vineyard Mediterranean environment\
    \ with 20 years of data: impact of global change (climate and anthropogenic activities\
    \ as agricultural practices) on water and erosion balance, fluxes and quality.\
    \ \r\nSoils: calcisoils and cambisoils. Bedrock: Marine and coastal miocene deposits.\
    \ \r\nContinuous automatic measurements at nested scales from plot to catchment\
    \ outlet (surface runoff, shallow groundwaters, surface-atmosphere fluxes) and\
    \ continuous monitoring of anthropogenic activities   . \r\nMore information available\
    \ on http://www.obs-omere.org.\r\nRoujan experimental catchment belongs to the\
    \ French SOERE-RBV Network."
