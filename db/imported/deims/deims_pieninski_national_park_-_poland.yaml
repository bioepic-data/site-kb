  description: In 1998 a permanent plot (50 x 50 m) was established at the height
    of 685 m asl in 60 year old spruce stand, where bulk deposition, throughfall and
    soil solution are collected. The investigations of health status of trees and
    floral characteristic have been carried out since 2001. The analyses are carried
    out in a certified laboratory of the Institute for Ecology of Industrial Areas,
    Katowice (Certificate No AB 325). The basic meteo data are taken from the monitoring
    station located 1 km from the plot.
