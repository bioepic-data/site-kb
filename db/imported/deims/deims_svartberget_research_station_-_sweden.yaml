    country: Sweden
    elevation_meters: 275.0
  description: "The Svartberget Field-research Infrastructure hosts several unique\
    \ long-term field research programs, starting in the early 1920’s when the Experimental\
    \ Forests were established here. Present research includes studies of the effect\
    \ of different forest practices, climate change, long-range transport of air pollutants\
    \ on water quality, full carbon budget of boreal mires and forests and long-term\
    \ soil-tree interactions with nutrient optimization. These research activities\
    \ has for decades provided excellent opportunities for international researchers\
    \ to study natural and human induced impacts on the structure and function of\
    \ the boreal landscape. To date, more than 1000 scientific publications and 100\
    \ PhD-theses have contributions from research performed at Svartberget. \r\nA\
    \ main objective of the ongoing research is to assess the role of external drivers,\
    \ such as land-use, climate change and nutrient supply on soils and waters in\
    \ the boreal terrestrial landscape. The main strategy has been to increase the\
    \ interaction between process-based research, environmental monitoring and improved\
    \ modelling. The plan for the future is to continue to: \r\n 1. Generate long-term\
    \ monitoring data of high quality \r\n 2. Provide a long-term climatic context\
    \ for the experimental and hypothesis-driven research \r\n 3. Contribute towards\
    \ scientifically based guidelines and models for policy and decisions makers."
