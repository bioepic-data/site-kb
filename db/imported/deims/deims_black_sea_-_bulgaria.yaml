  name: Black Sea - Bulgaria
  network_registrations:
  - network: DEIMS
    network_id: f4193165-b4de-4dc0-a5bd-7f051be25884
    network_url: https://deims.org/f4193165-b4de-4dc0-a5bd-7f051be25884
    name: Black Sea - Bulgaria
  location:
    latitude: 43.1861
    longitude: 27.9339
    country: Bulgaria
    elevation_meters: 0.0
  description: "Black Sea site includes three areas: cape Kaliakra, cape Galata and\
    \ Varna Bay, and Koketrays Sand bank (only for macrozoobenthos). They were chosen\
    \ on the base of historical data availability and eutrophication/pollution impact.\
    \ Kaliakra marine area is influenced by eutrophication due to mainly the Danube\
    \ river inflow. The local anthropogenic impact in the region is insignificant.\
    \ It is a nature reserve. Cape Galata and Varna Bay sites are under the indirect\
    \ impact of Varna Bay current and the system Beloslav lake-Varna lake - a cascade\
    \ introducing nutrients and pollutants of industrial (chemical industry), agricultural,\
    \ sewage origin and nearby ports. Koketrays Sand bank is an unique benthic habitat.\
    \   \r\nThe coordinates of the selected areas are as follow:\r\nc. Kaliakra: 28.416667\t\
    43.366667\r\nc. Galata:   27.933889\t43.186111\r\nVarna Bay:   28.166667\t43.166667\r\
    \nKoketrays bank: 27.888889 42.635556"
