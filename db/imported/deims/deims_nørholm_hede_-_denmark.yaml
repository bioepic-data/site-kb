  description: "Nørholm Hede (Heath) is situated in the southwestern part of Denmark\
    \ (8º 37´ E, 55º 41´ N). The 350 ha heath was abandoned and left for free succession\
    \ since 1895. It was legally protected in 1913 and succession from heather dominated\
    \ heath over crowberry heath or grass dominated heath towards forest has continued\
    \ without human interference for about 120 years. Already in 1921, the first survey\
    \ of tree colonization and development of flora was conducted in permanent grid\
    \ and plots. Since 1921 a total of 10 surveys have been conducted.\r\nThe soil\
    \ is fluvioglacial sand covered by shifting sand in the eastern part. The soil\
    \ is a sandy podzol but especially in areas with cultivated fields, the profile\
    \ includes an Ap horizon of 15 to 30 cm and the mor layer is thinner. \r\nThe\
    \ western part of the heath was cultivated until 1820 and again in 1870 (Fig 1a).\
    \ The central and eastern part of the heath is old podsolized dry heathland, which\
    \ has never been cultivated. Sheep and cattle grazed the heath until about 1895.\
    \ The fields were probably abandoned several years before. Since 1895 only occasional\
    \ exploitation of the gravel has occurred."
