  description: "Whim bog offers a globally unique comparison of how the main N forms\
    \ affect semi-natural vegetation, with meteorological data and treatment history\
    \ since 2002. \r\nA quantified ammonia concentration / deposition gradient, is\
    \ provided, plus a wet deposition system, comparing oxidized (NaNO3) and reduced\
    \ N (NH4Cl), where treatments are meteorology dependent. ie. wind direction and\
    \ rainfall frequency define the treatment exposure(~120 events y-1).\r\nWet plots\
    \ are large (13m²) and there are 4 replicates per treatment.\r\nOpportunities\
    \ exist to evaluate a whole range of ecosystem services from conservation to carbon\
    \ sequestration, GHG emissions and water chemistry in addition to understanding\
    \ how changes in vegetation affect the delivery of these services."
