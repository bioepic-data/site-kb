  description: Hydrometeorological and biogeochemical observations within 5 embedded
    catchments (from 0.2 to 14.5 km2). Alpine Mediterranean climate with heavy rainfall
    and flash floods in automn. The geology is mainly granite. The land use is mainly
    grassland and forest. More information at http://www.ohmcv.fr
