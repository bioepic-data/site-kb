  description: Tsitsikamma National Park (TNP) Marine Protected Area (MPA) was established
    in 1964 and is a 100% no-take area. The MPA covers an area of 360km2 and is managed
    and protected by SANParks. The TNP-MPA is the oldest and one of the largest MPAs
    in South Africa. The MPA consists of large expanses of reef varying from low to
    high profile and reaching depths of approximately 85m. Long term monitoring began
    in 2006 with angling studies and has now progressed to the use of baited underwater
    remote stereo-video systems (stereo-BRUVs). Monitoring continues once annually.
