  description: "The Hallstätter Glacier is the largest glacier in the northern Limestone\
    \ Alps. The Hallstätter Glacier is oriented to the northeast and is bordered by\
    \ Rock walls. The Large plateau above 2550 m.a.s.l. is connected by three short\
    \ tongues.\r\nThe largest altitude zone in terms of area is between 2550 m and\
    \ 2600m.\r\nThe highest point of the glacier is at 2905 m, the lowest point is\
    \ on 2240 m. With an area of 2.623 km² (glacier boundary 2020), the glacier lost\
    \ half of its extent compared to the glacier peak in 1856. In the past 10years,\
    \ the area has increased by around 13 %."
