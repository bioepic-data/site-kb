sites:
- id: site_kb:deims-ravels_forest_-_belgium
  name: Ravels Forest - Belgium
  network_registrations:
  - network: DEIMS
    network_id: e74fdeaf-08ed-4306-9473-58e3f9a05e73
    network_url: https://deims.org/e74fdeaf-08ed-4306-9473-58e3f9a05e73
    name: Ravels Forest - Belgium
  location:
    latitude: 51.402029
    longitude: 5.056656
    country: Belgium
    elevation_meters: 34.871
  description: This LTER-site corresponds with a 0.25 ha intensive forest monitoring
    plot (ICP Forests Level II) including a 0.25 ha buffer zone. The site is located
    in a homogeneous stand of Corsican pine (Pinus nigra ssp. laricio var. Corsicana
    Loud.) planted in 1930 on former heathland and is part of Gewestbos Ravels, a
    landscape (about 1000 ha) with deciduous and coniferous forests, heathland, bogs
    and pastures in the northern part of the Campine ecoregion of Flanders. The terrain
    is gently sloping (1-2 %) and the soil is a well-drained sandy soil (Endogleyic
    Folic Brunic Albic Arenosol (Dystric)). Ground vegetation is dominated by ferns
    (Dryopteris dilatata and D. carthusiana) and Vaccinium myrtillus. After a storm
    in February 2007 felled several trees an understorey of Betula pubescens started
    to develop. Intensive monitoring was started in 1987 with the main objective to
    study the effects of air pollution on biogeochemical cycling and forest performance
    (growth, vitality). This yielded a number of long-term data series including on
    atmospheric deposition, air quality, soil and soil solution chemistry, tree mineral
    nutrition, ground vegetation and growth. Monitoring will be continued in the future
    as a statutory task of INBO.
