  description: The Petzenkirchen HOAL (Hydrology Open Air Laboratory) catchment is
    situated in the western part of Lower Austria (48°9' N, 15°9' E). The catchment
    area at the outlet (termed MW) is 66 ha. The elevation of the catchment ranges
    from 268 to 323ma.s.l. with a mean slope of 8 %. At present, 87% of the catchment
    area is arable land, 5% is used as pasture, 6% is forested and 2% is paved. The
    crops are mainly winter wheat and maize. The climate can be characterised as humid
    with a mean annual temperature of 9.5°C and a mean annual precipitation of 823mm/yr
    from 1990 to 2014. Precipitation tends to be higher in summer than in winter.
    Crop evapotranspiration (ETc) estimated by the FAO (1998) method using local climate
    data and crop growth information for this period was 471mm/yr. Annual evapotranspiration
    estimated by the water balance ranged from 435 to 841 with a mean of 628mm/yr
    (1990–2014) (assuming deep percolation is negligible). The natural surface water
    outlet of the catchment is known as the Seitengraben stream. Mean annual flow
    from the catchment in this stream is 4.1 L/s (or 195mm/yr) (1990–2014). Mean flows
    tend to peak in the spring. The largest flood events on record occurred in 1949
    and 2002 with estimated peak discharges of 2.800 and 2.000 L/s, respectively.
    The highest discharge in recent times occurred in summer 2013 with 660 L/s. The
    subsurface consists of Tertiary sediments of the Molasse zone and fractured siltstone.
    The dominant soil types are Cambisols and Planosols with medium to poor infiltration
    capacities. Gleysols occur close to the stream. (Blöschl et al., 2016)
