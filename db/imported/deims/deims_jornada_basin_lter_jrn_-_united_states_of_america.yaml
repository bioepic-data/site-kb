    longitude: -106.741
    country: United States of America
  description: "The Jornada Basin Long-Term Ecological Research (LTER) program is\
    \ part of a national network of long-term ecological research sites funded by\
    \ the US National Science Foundation (NSF). The Jornada LTER program has been\
    \ continuously funded since 1982 to develop general principles governing changes\
    \ between grassland and shrubland ecosystems based on long-term data collected\
    \ in the Chihuahuan Desert. Research themes at the Jornada LTER focus on vegetation\
    \ change, climate and land use impacts on ecosystem function, and the role of\
    \ dryland processes in structuring communities and landscapes. We translate our\
    \ findings to dryland ecosystems around the world, and forecast the dynamics of\
    \ future ecosystem states in response to changing climate and land use. \r\n\r\
    \nThe Jornada Basin is located in southern New Mexico, USA, approximately 25 km\
    \ northeast of the city of Las Cruces (32.6 N -106.7 W, elevation 1315 m). Annual\
    \ precipitation is 24 cm and maximum temperatures average 13 C in January and\
    \ 36 C in June. The study site is near the northern extent of the Chihuahuan Desert,\
    \ which is the largest of the North American warm deserts, in a region has undergone\
    \ large shifts in the relative dominance of grasslands and shrublands over the\
    \ past century. We partner closely with the USDA-ARS Jornada Experimental Range\
    \ (JER) and the NMSU Chihuahuan Desert Rangeland Research Center (CDRRC), allowing\
    \ us to benefit from a long history of rangeland research, and to contribute to\
    \ science-based management and sustainability practices.The Jornada Basin LTER\
    \ project is administered by New Mexico State University."
