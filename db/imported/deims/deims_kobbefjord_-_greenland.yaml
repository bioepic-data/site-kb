  description: GINR and the Kobbefjord field station provide access to a low arctic
    ecosystem in West Greenland with different biotopes such as dwarf-shrub heaths,
    fens, grasslands, and lakes. Monitoring of a variety of parameters on vegetation,
    arthropods, mammals (both terrestrial and marine), birds, freshwater lakes, and
    the marine environment has been carried out at GINR for several years.
