  description: "The Jervis Bay Booderee National Park Plot Network is located in Jervis\
    \ Bay Territory, NSW, Australia and its research infrastructure are structure\
    \ plots (1 m × 1 m, 20 m × 20 m) nested within 1-ha sites. \r\n\r\nTemporal visits\
    \ are as follows:\r\n\r\n* Vegetation - 3 years\r\n• Birds - Annual\r\n• Arboreal\
    \ spotlighting - 2 years\r\n• Reptiles - Annual\r\n• Terrestrial mammals - 2 years\r\
    \n\r\nThe Jervis Bay Booderee National Park Plot Network was a member of Long\
    \ Term Ecological Research Network (LTERN), Australia, a facility of the Australian\
    \ Government's Terrestrial Ecosystem Research Network (TERN)."
