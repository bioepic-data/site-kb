- id: site_kb:deims-ozcar-ri_sno_karst_baget_karstic_experimental_catchment_-_france
  name: OZCAR-RI SNO_KARST Baget karstic experimental catchment - France
  network_registrations:
  - network: DEIMS
    network_id: c77eb1c9-54ce-42fc-97c2-f573666d6b9f
    network_url: https://deims.org/c77eb1c9-54ce-42fc-97c2-f573666d6b9f
    name: OZCAR-RI SNO_KARST Baget karstic experimental catchment - France
  location:
    latitude: 42.9549
    longitude: 1.02941
    country: France
    elevation_meters: 920.0
  description: "The Baget catchment is managed by the Laboratory of Functional Ecology\
    \ and Environment (EcoLab), a joint Research Unit between the Institute of Ecology\
    \ and Environment (INEE) of CNRS, the National Polytechnic Institute of Toulouse\
    \ and the University Toulouse III-Paul Sabatier, in collaboration with BRGM (Occitania\
    \ regional agency), the laboratory Geosciences and Environment Toulouse (GET)\
    \ and the Station of Theoretical and Experimental Ecology (SETE) in Moulis (Ariège,\
    \ France).\r\n\r\nThe Baget catchment (Pyrénées, Ariège, France) is a mountain\
    \ ecosystem of middle altitude (Alt.= 1000 m) receiving around 1000mm of precipitation\
    \ per year. Located close to Balagué village at 10 km West from Saint-Girons,\
    \ the Baget catchment (13.25 km2) is drained by a karstic network which supplied\
    \ the surface runoff of Lachein stream (specific discharge: 36 l.s-1.km-2). It\
    \ is a tributary of the Lez which joins the Salat River, right tributary of the\
    \ Garonne River.\r\n\r\nFrom 1968, this experimental site was intensively equipped\
    \ by the CNRS underground Laboratory of Moulis (today SETE). The device is composed\
    \ of one main weir at the outlet, 3 full excess controls, 3 piezometers of which\
    \ one inside the abyss, and one subterranean loss.\r\n\r\nThis karstic watershed\
    \ has been surveyed since 1968 for some hydro-climatic parameters, particularly\
    \ air temperature, precipitations and stream discharge at the outlet. Some geochemical\
    \ parameters (pCO2, chemical and isotopic compositions of waters) and some hydro-biological\
    \ and ecological data (invertebrates, particularly Crustacea) have been surveyed\
    \ for periods during the last 40 years by the CNRS underground Laboratory of Moulis.\r\
    \n\r\nSince 2011, Baget catchment belongs to the French Network of Catchments\
    \ (RBV) and it is included in the certified National Observatory Service SNO Karst.\
    \ Then, new parameters are measured twice a month or with higher frequencies during\
    \ some flood events (major cations and anions, alkalinity, pH, conductivity, dissolved\
    \ organic carbon, total suspended matter, H, O, C isotopes…). Since 2014, a multi-parameter\
    \ probe has been installed with different sensors to measure continuously water\
    \ level, pH, conductivity, turbidity, dissolved oxygen, nitrate and chloride.\
    \ These continuous measurements are calibrated twice a month with laboratory analyses.\
    \ The water discharge is measured by BRGM-Occitania because the Baget karst is\
    \ part of the French patrimonial network of ground-waters and it belongs to the\
    \ piezometric network managed by BRGM.\r\n\r\nThe Baget catchment is very sensitive\
    \ to limit conditions of surface drainage and to land covers. It offers the possibility\
    \ to develop an eco-systemic survey, which integrates the hydrology, the geochemistry\
    \ and the ecology of a mountain ecosystem in the SW of France. In this region,\
    \ climate and land use changes will have significant impacts on biodiversity,\
    \ ecosystem functioning and biogeochemical cycles for the next decades\r\n\r\n\
    The Baget catchment is  an international field site of the Critical Zone Exploration\
    \ Network CZEN (http://www.czen.org/content/aurade-experimental-catchment) and\
    \ it is one of the sites of the French SNO-KARST (Service National d'Observation)\
    \ labellised by INSU-CNRS. It belongs to the French Research Infrastructure OZCAR\
    \ and it is also a  site of the French LTSER ZA PYGAR \"Zone Atelier Pyrénées-Garonne\"\
    ."
