  description: "A wide variety of research projects have been conducted at Sum­mit\
    \ Station since its establishment in 1989. Summit Station has developed into an\
    \ interdisciplinary research hub supporting a wide range of scientific research\
    \ on a year-round basis. These include meteorology, glaciology, atmospheric chemistry,\
    \ astrophysics, and more. In addition to investigator-driven projects, Summit\
    \ Station also supports longer-term year-round observations of key baseline variables\
    \ of climate change at the site.\r\n\r\nA table of current measurements, publications\
    \ and contacts by which to access Summit Station datasets can be found at the\
    \ GEO­Summit website: www.geo-summit.org"
  status: ACTIVE
