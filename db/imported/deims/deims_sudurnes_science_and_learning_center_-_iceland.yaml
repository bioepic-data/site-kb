  description: Sudurnes Science and Learning Center focuses on bird studies, marine
    invertebrates, and seashore ecology. The Center cooperates with the Icelandic
    Marine Research Institute utilizing automated analyses of zooplankton (ZooImage)
    for taxonomic purposes. Other studies are mainly on aquaculture animals such as
    the European lobster, arctic char, and cod, where the Center carries out its own
    projects and/or participates in service programmes using the facilities at the
    Center. The main focus of The University of Iceland´s Research Centre in Sudurnes
    is on research and teaching in marine biology and ecotoxicology, emphasizing on
    postgraduate students. The Southwest Iceland Nature Research Centre collects and
    stores information and data regarding the nature in the southwest region of Iceland.
    The main focus has been on ecological research, mainly on bird ecology and benthic
    invertebrates. The Nature Research Centre takes part in monitoring breeding success
    in seabirds in Iceland as well as monitoring migratory waders that go through
    the Sudurnes region. Climatic data are available for the area at The Icelandic
    Meteorological Office since 1953.
  status: ACTIVE
