  description: The Station is located at the hearth of the Boreal forest (large homogeneous
    black spruce forests, where caribous, black bears, wolves and all typical animals
    from the boreal could be encountered), in the largest protected natural area of
    this type in Quebec, within the traditional ancestral territory (Nitassinan) of
    the Pessamit Innus and a territory designated by UNESCO. As well, the Station
    is built right on the shore of the Manicouagan lake, formed about 214 million
    years ago by the impact of a major meteorite. With a diameter of about 100 kilometers,
    the Manicouagan Astrobleme is the fourth largest crater in the world.
  status: ACTIVE
