  description: "ROSES is the groundwater observatory network at national scale (France);\
    \ it's based on 78 000 monitoring water points (4600 observatory boreholes and\
    \ 75 000 qualitometers (wells, borholes, springs); some stations concern both\
    \ measurements, quality and groundwater level). Some water points belong to water\
    \ framework directive (WFD) such as groundwater level data network 0000000070,\
    \  quality monitoring network 0000000071 and quality operational network 0000000072,\
    \ and several other regional networks operated by various actors.\r\nAvailable\
    \ data: More than 15 million piezometric levels, more than 78 million analyses\
    \ (in situ parameters, major ions, traces, organic compound (pesticides, pharmaceutical\
    \ substances, ...))\r\nMonitoring frequencies for the chemical data are different\
    \ in fonction of the pressure on the ressource (monthly to yearly). Regarding\
    \ groundwater level, for the WFD observatory boreholes network, the frequency\
    \ is on the hour base; in the database, daily data are only available.\r\nAll\
    \ ROSES' data are available on the ADES database ( www.ades.eaufrance.fr)"
