  description: The ICOS ecosystem station on the Big Island of Brăila, operated by
    RCSES–University of Bucharest, monitors exchanges of carbon dioxide, water and
    energy between agricultural ecosystems and the atmosphere. Located within the
    Brăila Islands LTSER site, it supports long-term research on how land management
    and climate influence carbon cycling in the intensively modified Danube floodplain
    landscape.
