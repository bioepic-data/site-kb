  description: The GMS (34°45′N, 127°59′E) is located in the southern coast of Gyeongsangnam-do,
    and belongs to warm-temperate forest zone. The long-term (1981–2010) annual mean
    temperature and precipitation were 14.1 °C and 1839.4 mm, respectively (Korea
    Meteorological Administration 2015). The dominant species are Q. serrata, Chamaecyparis
    obtusa, A. pseudosieboldianum, Carpinus tschonoskii, and Stewartia pseudocamellia.
    This area is originally a natural forest; however, it is adjacent to the C. obtusa
    plantation created in the past. Furthermore, it is possible to observe the expansion
    of C. obtusa through the natural regeneration of young trees.
