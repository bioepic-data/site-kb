  description: "The Mediterranean Sea Large Marine Ecosystem (LME) is characterized\
    \ by its temperate climate. It is a semi-enclosed sea with several distinct biogeographical\
    \ sub-units. It is bordered by a high number of countries. Intensive fishing is\
    \ the primary force driving the LME, with eutrophication as the secondary driving\
    \ force.\r\n\r\n \r\n\r\n \r\n\r\n\r\nProductivity\r\n\r\n\r\nThe Mediterranean\
    \ Sea has a narrow continental shelf. For the origin and history of the Mediterranean\
    \ and Adriatic Seas, see Bombace, 1993. The LME presents a composite structure\
    \ of environmental conditions, with local areas of upwelling, wind-driven currents,\
    \ high water temperatures at least in some periods of the year, and nutrient inputs\
    \ from rivers and human activities (see Caddy, 1993). The major inflow into the\
    \ Mediterranean is nutrient-poor, oxygenated Atlantic surface water through the\
    \ Strait of Gibraltar, resulting in generally well-oxygenated bottom waters.\r\
    \n\r\nGyres and upwellings contribute to the Adriatic Sea’s high phytoplankton\
    \ productivity. The highest levels of productivity occur along the coasts, near\
    \ major cities, and at river estuaries. The lowest levels occur in the southeastern\
    \ Mediterranean (see Darmouli, 1988). The Mediterranean has unusual biodiversity\
    \ for a temperate sea (see FAO, 2003). Temperature stratification can occur during\
    \ extended periods of calm seas, high temperatures, and inflows of freshwater.\
    \ This separates the warmer, less saline surface water from the deeper, colder\
    \ and more saline water, resulting in autumnal algal blooms and extended hypoxia\
    \ or anoxia.\r\n\r\n \r\n\r\n\r\n\r\nFish and Fisheries\r\n\r\n\r\nThis is one\
    \ of the most diverse and stable LMEs in terms of species groupings and their\
    \ share in the total catch. The Food and Agriculture Organization (FAO) 10-year\
    \ capture trend (1990-1999) shows stable catch trends in recent years, with a\
    \ moderate increase in shelf catch, from under 1 million tons in 1990 to 1.1 million\
    \ tons in 1999 (see FAO, 2003, figure 20). Clupeoids (herrings, sardines and anchovies)\
    \ form the most important species group with 38% of catch. Miscellaneous coastal\
    \ fishes account for 18% of the catch, and mollusks for 16%. For more information\
    \ on primary production and fisheries, see Caddy, 1993. For a study on ecology\
    \ and fisheries in the Adriatic Sea, see Bombace, 1993. Technological improvements\
    \ in the fishing fleet and increased fishing capabilities have resulted in a decline\
    \ in the catch rate per boat (see Caddy, 1993). Fishing effort has increased in\
    \ response to high fish prices. By the 1970s, a substantial portion of the less\
    \ productive southern shelves was being harvested for demersal resources. This\
    \ also involved distant-water trawlers, with the result that demersal resources\
    \ were fished at close to maximum sustainable yield. In the Adriatic Sea, coastal\
    \ pollution and eutrophication have been the principal factors driving change\
    \ in fisheries yields. Fish kills have occurred in the northern Adriatic as a\
    \ result of noxious phytoplankton blooms and anoxic conditions.\r\n\r\n \r\n\r\
    \n\r\n\r\nPollution and Ecosystem Health\r\n\r\n\r\nThere are concerns over the\
    \ decline, especially in the northern Mediterranean, of fish species and species\
    \ diversity. Negative anthropogenic impacts on fisheries are untreated sewage\
    \ and an increased incidence of toxic blooms. However, quantifying these effects\
    \ and establishing the respective contributions of overfishing and eutrophication\
    \ are problematic (see Caddy, 1993). Blooms of phytoplankton and benthic diatoms\
    \ have resulted in local fish kills caused by anoxia. Planktonic blooms and sewage\
    \ contamination of coastal waters have also caused health problems associated\
    \ with the ingestion of contaminated shellfish (see UNEP/FAO, 1990; and Caddy,\
    \ 1993). Major threats to the biodiversity of the region’s coastal and wetland\
    \ ecosystems are: uncontrolled development, urbanization, and especially pollution\
    \ from land-based sources such as industry, human sewage and agriculture, which\
    \ enter the Mediterranean via runoff, discharge, and river transport. The atmosphere\
    \ contributes nitrogenous compounds, contaminants, and heavy metals (see Caddy,\
    \ 1993; and UNEP, 1989).\r\n\r\n \r\n\r\n\r\n\r\nSocioeconomic Conditions\r\n\r\
    \n\r\nThe Mediterranean Sea’s 26,000 kilometers of coast supports a population\
    \ estimated at 132 million inhabitants. The figures swell in the summer months,\
    \ as tourists flock to the region, attracted by its cultures and pleasant climate.\
    \ The continuous increase of tourists and settlers is a boon to the region, and\
    \ is today of higher economic value than fisheries in many Mediterranean countries\
    \ (see Caddy, 1993). But tourism is also causing environmental degradation through\
    \ extensive development, added pressure to the coastal areas, and stress on the\
    \ marine environment. The region, situated at the crossroads of Africa, Europe\
    \ and Asia, has a high diversity of cultures, countries, political systems, and\
    \ religions. It contains major population centers and industrial activities. Numerous\
    \ fishing ports are dispersed along the Mediterranean coastline. For a historical\
    \ perspective on fisheries in the Mediterranean Sea, see Caddy, 1993. Fisheries\
    \ production has increased in many areas and is of major economic importance.\
    \ Mariculture has increased production figures for mussels and oysters. Anthropogenic\
    \ nutrient enrichment and eutrophication caused by runoff and polluted river discharges\
    \ are a concern both for fisheries and tourism revenues.\r\n\r\n \r\n\r\n\r\n\r\
    \nGovernance\r\n\r\n\r\nGovernance of the Mediterranean Sea LME involves a high\
    \ number of countries (20 countries). They differ in their stage of economic and\
    \ institutional development and in their capacity to address biodiversity issues\
    \ in the context of sustainable development.\r\n\r\n\r\n\r\nReferences\r\n\r\n\
    \r\nArticles and LME Volumes\r\n•Bombace, Giovanni. 1993. \"Ecological and Fishing\
    \ Features of the Adriatic Sea,\" in Kenneth Sherman, et al. (eds.), Large Marine\
    \ Ecosystems: Stress, Mitigation, and Sustainability (Washington, D.C.: American\
    \ Association for the Advancement of Science, 1993) pp. 119-136. ISBN: 087168506X.\r\
    \n• FAO, 2003. Trends in oceanic captures and clustering of large marine ecosystems—2\
    \ studies based on theFAO capture database. FAO fisheries technical paper 435.\
    \ 71 pages.\r\n• Caddy, John F. 1993. \"Contrast Between recent Fishery Trends\
    \ and Evidence from Nutrient Enrichment in Two Large Marine ecosystems: The Mediterranean\
    \ and the Black Seas,\" in Kenneth Sherman, et al. (eds.), Large Marine Ecosystems:\
    \ Stress, Mitigation, and Sustainability (Washington, D.C.: American Association\
    \ for the Advancement of Science, 1993) pp. 137-147. ISBN: 087168506X. \r\n\r\n\
