  description: "The Alice Mulga SuperSite is a part of the Australian Terrestrial\
    \ Ecosystem Network (TERN, http://www.tern.org), which provides environmental\
    \ research infrastructure for understanding how and why ecosystem change occurs\
    \ (https://www.tern.org.au/tern-observatory/tern-ecosystem-processes/). The Alice\
    \ Mulga SuperSite is located on Pine Hill Cattle Station approximately 200 km\
    \ north of Alice Springs, Northern Territory. It lies in the expansive arid and\
    \ semi-arid portion of mainland Australia that receives less than 500 mm of annual\
    \ rainfall. The site includes Mulga woodland, hummock grassland, and river red\
    \ gum forest. The SuperSite Core 1 ha is located in a dense Mulga woodland (cover\
    \ 70–80%). The SuperSite has a second TERN OzFlux tower at Ti Tree East where\
    \ TERN Surveillance Plots are also located in a mosaic of hummock grassland/Corymbia\
    \ savanna with patches of Mulga/tussock grass. A third study location in the SuperSite\
    \ is a river red gum forest along the Woodforde river where where several hydrological\
    \ and plant ecophysiological studies have been performed.\r\nThe traditional owners\
    \ of these lands are the Anmatyerre Nation."
