  description: Los esfuerzos de investigación se enfocan a la región del altiplano
    mexicano conocida como “El Tokio”, donde se distribuyen los pastizales gipsófilos
    y salinos en el noreste de México y la cual es reconocida como una región prioritaria
    para la conservación de especies de aves residentes endémicas y migratorias. El
    área se caracteriza por valles intermontanos en los cuales se presentan suelos
    con altos contenidos de yeso y carbonatos de calcio, así como pastizales de porte
    bajo que no rebasan los 15 cm de altura en promedio. En estos valles habita el
    perrito llanero mexicano (Cynomys mexicanus), especie clave en el ecosistema.
    La vegetación circundante a estos valles está caracterizada por matorrales de
    gobernadora (creosote bush) con elementos sobresalientes de Yucca. El área es
    fuertemente impactada por actividades agrícolas y ganaderas, las cuales se llevan
    a cabo desordenadamente y sin medidas de mitigación.
