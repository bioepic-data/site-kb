  description: The LTER-TRAN site is located in the transition between the Cerrado
    and Amazonia biomes, in a region called "arc of deforestation", that suffers strong
    impacts by the agriculture expansion. The site include 10 subsites (Bacaba, Vera
    Cruz, Tanguro, Santa Marta, Floresta, Araguaia, Santana, Serra das Araras, Guaporé
    and Tangará), in five municipalities of Mato Grosso and Pará states. The base-site
    is located at the Bacaba Municipal Park, in eastern Mato Grosso, where areas are
    being monitored since 1996, to evaluate the temporal and spatial changes of the
    vegetation (forests and savannas) and streams, allowing to understand the natural
    dynamic processes and the changes resulting from human actions. Legal reserves
    areas in farms and flooded forests of the Araguaia State Park are also being monitored.
    Social-environmental studies and intensive educational actions complement the
    activities of this site.
