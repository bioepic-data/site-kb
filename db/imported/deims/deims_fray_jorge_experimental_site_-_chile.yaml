  description: The  Fray Jorge experimental site is located inside the Fray Jorge
    National Park, in the Region of Coquimbo. Its characteristic vegetation is Mediterranean
    and at the top of the coastal range exists evergreen temperate forests (cloud
    forests). The climate is Mediterranean with coastal influence.
