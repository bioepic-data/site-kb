  description: Río Yahuecas (GUIL) is an aquatic NEON field site located in the central-western
    mountainous area of Puerto Rico. This site was formerly named Río Guilarte. Río
    Yahuecas site is a 2nd order, wadeable stream with a watershed of 9.5 km2 (2350
    acres), comprised of agricultural lands and subtropical moist/wet forest. The
    NEON sampling reach of Río Yahuecas is located in a montane area with steep slopes,
    though large boulders stabilize the channel within the municipality of Adjuntas.
    Access to sensors and sampling locations in the reach of Río Yahuecas are located
    within the surrounding land, which is an agricultural research station owned and
    operated by the University of Puerto Rico – Mayaguez Campus. This location is
    part of the NEON Atlantic Neotropical Domain (D04), which includes the island
    of Puerto Rico and the southern tip of Florida. The Domain includes two terrestrial
    field sites and one additional aquatic field site.
