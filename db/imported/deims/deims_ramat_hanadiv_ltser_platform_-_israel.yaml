    longitude: 34.9453
    country: Israel
    elevation_meters: 60.0
  description: "The Ramat Hanadiv LTSER platform is a unique texture of the region\
    \ surrounding Hanadiv Valley and Taninim River basin. It integrates nature values\
    \ with agriculture, rural communities, and heritage sites. The platform extends\
    \ over an area of apprx. 15,500 hectares, including Ramat Hanadiv Nature Park\
    \ and five neighboring municipal Councils:\r\n1.\tBinyamina Givat-Ada (Urban;\
    \ Local Council )\r\n2.\tZikhron Ya’akov (Urban; Local Council )\r\n3.\tHof Hacarmel\
    \  (Rural; Regional Council)\r\n4.\tJisr A-Zarqa )Arab village; Local Council)\r\
    \n5.\tAlona (Rural; Regional Council)\r\nRamat Hanadiv LTER site is located in\
    \ the heart of the platform, at the southern tip of the Carmel Mountain Ridge.\
    \ Ramat Hanadiv spreads over approximately 450 hectares of typical natural Mediterranean\
    \ vegetation, surrounding the Memorial Gardens in which Baron Benjamin Edmond\
    \ de Rothschild and his wife are buried. \r\nWith mean annual rainfall of 500-600\
    \ mm and mean annual temperature of 170C-190C, Ramat Hanadiv Nature Park is characterized\
    \ by diverse habitats and communities."
