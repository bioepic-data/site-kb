  description: 'The site comprises 4 plots installed in an oak and beech forest of
    60 ha: 2 plots are in pure stands dominated either by oak (1.22 ha) or by beech
    (0.88 ha) and the two other plots are in mixed stands of contrasted densities
    (1.05 and 1.75 ha). All the stands are close to each other and are in very similar
    ecological conditions.'
