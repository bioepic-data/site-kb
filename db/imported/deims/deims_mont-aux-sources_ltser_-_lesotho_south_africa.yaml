  description: "The area is considered especially important from a wetland perspective\
    \ because rivers such as the Tugela, Vemvane, Khubelu, Motete, Matseng and Malibamatso\
    \ all have their origins in these alpine wetland systems. Notable mammals that\
    \ inhabit these wetlands are domesticated sheep and horses, as well as ice rats.\
    \ Within and close to the area of the MaS-LTSER are the Tšehlanyane National Park,\
    \ Lucapa Diamond Mine,  Letseng Diamond Mine, Matsoku Mine, Kao Mine, and Liqhobong\
    \ Mine.\r\nSome of the alpine wetlands in the area are experiencing degradation,\
    \ and there are some that can be considered severely degraded. Wetland degradation\
    \ in this alpine region can lead to loss of ecosystem services as well as livelihood\
    \ of the locals."
  status: ACTIVE
