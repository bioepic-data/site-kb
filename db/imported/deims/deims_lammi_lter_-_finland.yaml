    name: Lammi LTER - Finland
  location:
    latitude: 61.053687
    longitude: 25.041429
    country: Finland
    elevation_meters: 78.0
  description: The Lammi LTER area is located 130 km north of Helsinki, 35 km east
    of the city of Hämeenlinna and 40 km west of the city of Lahti in uplands between
    two major river basins, i.e. rivers Kokemäenjoki and Kymijoki. The Lammi LTER
    area consists of several core sites/areas from which the Evo Forest and Lake Area
    (EVO) is the largest one and has a special value in terms of long term ecological
    studies. Another important study area is Lake Pääjärvi and its surroundings. The
    EVO area is among the largest coniferous forest areas in southern Finland. Lake
    Pääjärvi and its surroundings have been studied since early 1960s as a result
    of the establishment of the Lammi Biological Station in 1953 by the University
    of Helsinki.
