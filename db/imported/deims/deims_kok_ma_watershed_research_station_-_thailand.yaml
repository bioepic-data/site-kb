  description: Kok Ma water research station in located at Doi Suthep-Pui National
    Park about 20 km from Chiang Mai city. The station was established in 1965 by
    Kasetsart University and University of Hawaii. The altitude of this station ranges
    between 1,300-1,600 m above mean sea level. The dominant vegetation is hill evergreen
    forest.
