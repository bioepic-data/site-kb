  description: Grassland site in the pre-apine region of S-Bavaria equipped with EC
    measuring system and lysimeter network for investigation of water, energy, carbon
    and nitrogen cycling and associated exchange processes with the atmosphere and
    hydrosphere. The Fendt site is part of ICOS-D and the main site of the TERENO
    per-alpine Observatory.
