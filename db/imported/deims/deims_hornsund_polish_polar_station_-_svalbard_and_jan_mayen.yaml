  description: The research at the Polish Polar Station focuses on meteorology, glaciology,
    monitoring of geophysical fields (i.e. seismology, geomagnetism, atmospherical
    electricity), permafrost, and geomorphic processes. The main study objectives
    are related to the evolution of the high arctic environment with respect to Climate
    Change. Projects include the research on mass and energy balance of glaciers,
    fluctuations and changes of their hydrothermal state, and dynamics of tidewater
    glaciers and their interaction with the ocean. Changes in marine and terrestrial
    ecosystems are systematically studied, including a strong ornithological component.
    Existing databases include meteorological and glaciological records (www.glacio-topoclim.org),
    geophysical data (collected in several world data centres), as well as marine
    and terrestrial biological parameters. There is a bibliography of publications
    arising from research at the station.
  status: ACTIVE
