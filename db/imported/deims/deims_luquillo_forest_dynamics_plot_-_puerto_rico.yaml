  description: The Luquillo Forest Dynamics Plot (LFDP), previously known as the Hurricane
    Recovery Plot (Zimmerman et. al. 1994) and the Luquillo long-term ecological research
    grid (Soil Survey 1995), is a 16-ha forest plot (SW corner 18° 20' N, 65° 49'
    W) located near El Verde Field Station. The plot is 500 m N-S and 320 m E-W and
    is divided into 400 20 x 20 m quadrats, with each quadrat sub divided into 16
    5 x 5 m sub-quadrats. The field station and LFDP are in the Luquillo Mountains
    of northeastern Puerto Rico, approximately 35 km southeast of San Juan.
  status: ACTIVE
