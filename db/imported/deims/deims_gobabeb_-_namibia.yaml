  description: Gobabeb is a Research Centre with accommodation, conference, laboratory
    and teaching facilities in Namibia's Namib-Naukluft National Park, about 65km
    from the coast on the northern bank of the ephemeral Kuiseb River. It is located
    at a point where three main habitats meet (ephemeral river, gravel plain and the
    Namib erg) and lies within the inland edge of the fog zone. It is the designated
    monitoring and research centre for the Namib Sand Sea World Heritage Site.
