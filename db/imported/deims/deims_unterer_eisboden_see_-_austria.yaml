  description: The formation of a periglacial lake was forced at the glacier terminus
    in recent years by the fast disintegration of the glacier. The development of
    the untere Eisboden See is well documented. Since August 2002, a runoff gauge
    installed by the Hydrographical Service of Salzburg has recorded the discharge
    at the outlet of the new Unterer Eisboden See.
