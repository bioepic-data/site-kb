  description: "The Niwot Ridge Long Term Ecological Research (LTER) site was established\
    \ in 1980 with support from the National Science Foundation. The topography, climate\
    \ and biota of the research site are representative of alpine ecosystems in the\
    \ southern Rocky Mountains, including extensive expanses of alpine tundra and\
    \ subalpine coniferous forests, as well as a cirque glacier (Arikaree Glacier),\
    \ a variety of glacial landforms, lakes and moraines, cirques, talus slopes, patterned\
    \ ground, and permafrost.\r\n\r\nThe LTER site includes Niwot Ridge, the southern-adjacent\
    \ Green Lakes Valley, and the University of Colorado’s Mountain Research Station\
    \ (MRS). Niwot Ridge is part of the Roosevelt National Forest and has been designated\
    \ a United Nations Educational, Scientific and Cultural Organization (UNESCO)\
    \ Biosphere Reserve and an Experimental Ecology Reserve (USDA Forest Service).\
    \ The Green Lakes Valley is a part of the City of Boulder Watershed. The MRS is\
    \ an interdisciplinary facility devoted to the advancement of the study of mountain\
    \ ecosystems, providing research and educational opportunities for scientists,\
    \ students, and the general public."
