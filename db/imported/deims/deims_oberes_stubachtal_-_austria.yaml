    longitude: 12.6167
    country: Austria
    elevation_meters: 2570.0
  description: "LTER site Oberes Stubachtal is a long-range research site with a main\
    \ focus on the measurement of the annual mass balance of the Stubacher Sonnblickkees\
    \ (SSK) and processes of different glaciers, going along with water budget estimations\
    \ within the catchment area of the dam lakes Weißsee and Tauernmoos that are controlled\
    \ by the Austrian Federal Railways (ÖBB) and can gives you more Information about\
    \ the catchment hydrology. Regular observations and systematic studies had begun\
    \ with measuring the glacial length in 1960 by the brothers Heinz and Werner Slupetzky.\
    \ The Massbalance of SSK is measured since 1963 and indirect back calculated till\
    \ 1946. The Glaciers are photogrammetric mapped since 1963.\r\nAdditionally the\
    \ lake “Unterer Eisbodensee”, originated in the 1980s, is monitored with temperature,\
    \ waterlevel and runoff by the Hydrographical Service of Salzburg since 2006.\
    \ In the center of this researchsite is the meteorological station Rudolfshütte\
    \ operated by the ZAMG since 1962. The Rudolfshütte is also a Mountain Hotel and\
    \ can be use as a Basecamp. Since the year 2004 there are some TLS measurement\
    \ for the generation of high resolution DTMs of the end of the glacier tongue\
    \ and glacier forefield of the Odenwinkelkees and of the sourounding area of the\
    \ lake “Oberer Eisbodensee”."
