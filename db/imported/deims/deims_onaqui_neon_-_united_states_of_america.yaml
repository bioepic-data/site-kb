  description: Onaqui (ONAQ) is a terrestrial NEON field site located in Tooele County,
    UT, approximately 80 km (50 mi.) southwest of Salt Lake City. It consists of a
    sampling area of 68 km2 (15,300 acres) and is managed by the Bureau of Land Management.
    It is characterized by the sagebrush and western juniper community that dominates
    the Great Basin. The site is part of NEON's Great Basin Domain (D15), which is
    bordered by the Sierra Nevada to the west, the Rocky Mountains and Colorado Plateau
    to the east, the Mojave Desert to the south, and the Columbia Plateau to the north.
    D15 has one other field site, the aquatic site REDB.
