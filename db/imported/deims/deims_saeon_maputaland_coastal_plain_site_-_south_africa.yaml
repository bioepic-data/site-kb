  description: The SAEON Maputaland Coastal Plain site, Umhlabuyalingana Local Municipality,
    is a Long term hydro-ecological research platform focused on understanding the
    relative impacts of climate and land use land cover change on ecosystems services
    This is a groundwater driven system (sandy unconsolidated aquifer), forming part
    of the Zululand Aquifer Strategic Groundwater Source Area. There are no surface
    rivers importing water into the system hence is is dependent on local rainfall
    for recharge, making it sensitive to changes in rainfall patterns. The site incorporates
    lake Sibaya, South Africa's largest freshwater lake, which falls within the iSimangaliso
    Wetland Park, World heritage site and is a RAMSAR site. The region is typified
    by impoverished and vulnerable  communities , with few sources of income. SAEON
    has instrumented the ground water catchment and its boundaries with raingauges,
    weather stations, surface renewal systems and  an eddy covariance tower.  We are
    also monitoring ground water levels in a number of established monitoring wells.
    Using a social ecological systems approached, and focused on co-learning,  we
    have developed strong relations with three local communities within the area.
    The intention is to attract collaborators wishing to co locate instruments as
    well as perform multidisciplinary work or simply collaborate. We welcome diverse
    fields of expertise from earth systems science, biodiversity to social and economics
    sciences.
