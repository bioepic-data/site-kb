  description: The site is a wave-exposed rocky shore typical of central-northern
    Chile. The coastal border (including littoral zone and intertidal shore) as well
    as the shallow subtidal habitat (down to about 25-30m deep) has been protected
    from human intervention since 1982. In 2005 the marine area was declared Area
    Marina Costera Protegida (AMCP) de Chile (Marine Protected Area). Adjacent to
    the marine reserve there is a marine laboratory, Estación Costera de Investigaciones
    Marinas of P. Universidad Católica de Chile.
