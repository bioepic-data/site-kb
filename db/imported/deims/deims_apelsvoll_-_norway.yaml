    country: Norway
  description: "The ExpeER site is a tile-drained 3.2 ha experimental site on loam\
    \ soil representing Scandinavian inland climate zone. Six cropping systems, each\
    \ with 2 replicates, are practiced on twelve 0.18 ha blocks, each equipped for\
    \ volume proportional sampling of drainage discharge and surface runoff. Three\
    \ systems with cash-cropping and three systems with both arable and fodder crops\
    \ (both conventional and organic management).\r\nFocus : Yields and yield quality,\
    \ nutrient leaching and runoff losses, food productivity versus environmental\
    \ impact, pesticide drainage and runoff, economic aspects, nitrogen, phosphorus\
    \ and potassium balances, soil microbial biomass, insect predators, environmental\
    \ indices, economic risk assessment, soil structure and earthworm populations"
  notes: 'Biogeographical region: boreal'
  status: ACTIVE
