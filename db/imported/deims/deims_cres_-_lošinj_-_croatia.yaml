  description: "Large marine site located in the Kvarnerić area, around the sheltered\
    \ coast and waters of the eastern part of the Lošinj and Cres archipelago. It\
    \ is one of the most important feeding and breeding areas for bottlenose dolphins\
    \ (Tursiops truncatus) in the Eastern Adriatic.\r\nLithostratigraphic units represented\
    \ on the coast are dolomites and post sedimentary diagenetic breccia (upper albian,\
    \ lower cenomanian - K16, K12), rudist limestones (cenomanianmaastricht - K21-6).\
    \ Soils on the coast are rockyground, anthropogenic soil on karst. The area was\
    \ created after the transgression of the sea after the last glaciation; marine\
    \ shelf; highly indented coastline.\r\nIn July 2006 of preventive protection of\
    \ a part of the Kvarnerić region for 3 years as a Special Marine Reserve (Cres-Lošinj\
    \ Special Marine Reserve – CLSMR has been declared."
