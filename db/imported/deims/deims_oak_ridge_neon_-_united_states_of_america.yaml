  description: Oak Ridge National Laboratory (ORNL) is a terrestrial NEON field site
    located in the Cumberland Plateau within Anderson and Roane Counties, TN. The
    57.4 km2 (14,000 acre) field site is managed by a combination of the Department
    of Energy (DOE) and Tennessee Wildlife Resources Agency (TWRA). The DOE's Oak
    Ridge National Laboratory is famous for its involvement in creating atomic bombs
    associated with the Manhattan Project. The surrounding region includes the world’s
    longest expanse of hardwood-forested plateau and is home to some of North America’s
    greatest diversity of fish, mollusk, and wildflower species. ORNL is part of NEON
    Domain 07 - Appalachians & Cumberland Plateau, which includes eastern Tennessee,
    most of Kentucky, southern Ohio, and parts of North Carolina, Georgia, Indiana,
    and Illinois. D07 includes four other NEON field sites, including two additional
    terrestrial sites and two aquatic sites. ORNL is colocated with the WALK aquatic
    field site.
