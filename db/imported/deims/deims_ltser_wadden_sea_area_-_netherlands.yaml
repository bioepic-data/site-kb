    country: Netherlands
    elevation_meters: 0.0
  description: The Dutch Wadden Sea area is a large coastal area (615510 ha) bordering
    the north of the Netherlands. A range of inhabited barrier islands (included in
    LTSER Wadden Sea Area) separate the Dutch Wadden Sea from the North Sea. The barrier
    islands comprise sandy beaches, dunes, grazed and ungrazed saltmarsh areas, and
    polders with meadows and villages. The Dutch Wadden Sea itself consists of intertidal
    mudflats and subtidal areas. The southern border of the LTSER Wadden Sea Area
    consists of inhabited polders, many of which consist of reclaimed saltmarsh areas.
    The Dutch Wadden Sea is part of the international Wadden Sea, extending along
    the coasts of Denmark, Germany and the Netherlands. The international Wadden Sea
    comprises the largest tidal flats system in the world, where natural processes
    proceed to a large extent undisturbed.
