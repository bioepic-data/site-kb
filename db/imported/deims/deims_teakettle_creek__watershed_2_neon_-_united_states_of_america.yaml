  description: Teakettle 2 Creek (TECR) is an aquatic NEON field site located in the
    Sierra National Forest, 80 km (50 mi.) east of Fresno, CA, near Courtright and
    Wishon Reservoirs. It is a wadeable stream on the western slope of the Sierra
    Nevada Mountains with a watershed size of approximately 3.0 km2 (740 acres). The
    TECR catchment is entirely located within the Teakettle Experimental Forest (TEF),
    which is located in the northern part of the Kings River watershed. The TEF was
    established in 1936 for timber management research and is owned and operated by
    the U.S. Forest Service Pacific Southwest Research Station. TECR is located at
    an elevation that spans 2109 - 2489 m (6900 - 8166 ft.). The TECR watershed is
    southeast-facing and passes through senescent red fir. TECR is part of the Pacific
    Southwest Domain (D17), which is bounded by the Pacific Ocean on the west and
    the Sierra Nevada Mountains on the east, and encompasses most of California. There
    are four other NEON field sites in D17, including three terrestrial sites and
    one additional aquatic site. TECR is colocated with the NEON terrestrial site
    Lower Teakettle (TEAK).
