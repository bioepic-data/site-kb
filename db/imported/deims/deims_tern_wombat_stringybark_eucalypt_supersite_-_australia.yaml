  description: "The Wombat Stringybark Eucalypt SuperSite is a member of the TERN\
    \ Ecosystem Processes platform (https://www.tern.org.au/tern-observatory/tern-ecosystem-processes/),\
    \ a field observatory within the Australian Terrestrial Ecosystem Network (TERN,\
    \ http://www.tern.org.au/). The Wombat Stringybark Eucalypt SuperSite is located\
    \ in the Wombat State Forest, Victoria, South Eastern Australia at an elevation\
    \ of 713m.  The site is a secondary re-growth forest that was last harvested in\
    \ 1980. Dominant tree species are Eucalyptus obliqua (messmate stringybark), Eucalyptus\
    \ radiata (narrow leaf peppermint) and Eucalyptus rubida (candlebark) with an\
    \ average canopy height of 25 m.  The understorey consists mainly of patchy grasses\
    \ and the soil is a silty-clay overlying clay. The forest is managed by the Department\
    \ of Environment, Land, Water and Planning and management includes selective harvesting\
    \ and prescribed burning regimes. The climate of the study area is classified\
    \ as cool-temperate to Mediterranean zone with cold and wet winters (May-Aug)\
    \ and warm and dry summers (Dec-Feb). \r\n\r\nKey research objectives include:\r\
    \n\r\n•\tWhat are the elements of structure, composition, functions and processes\
    \ of the dry eucalypt forests of South Eastern Australia required for the sustainable\
    \ management of these ecosystems? \r\n\r\n•\tWhat is the carbon sink/source strength\
    \ of a dry sclerophyll forest and what is their contribution to Australia’s National\
    \ Carbon Inventory? \r\n\r\n•\tWhat is the magnitude of emission and/or uptake\
    \ of non-CO2 greenhouse gases, such as nitrous oxide and methane of dry eucalypt\
    \ forest? \r\n\r\n•\tHow will climate variability, drought or fire influence the\
    \ ecosystem processes of dry eucalypt forest? \r\n\r\nThe Dja Dja Wurrung peoples\
    \ are the traditional owners at Wombat."
