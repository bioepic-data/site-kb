  description: The site is located in Clocaenog Forest in North East Wales (53o 03’
    19’’N -03o 27’ 55’’ W). It is a typical upland west-atlantic moorland, dominated
    by the evergreen shrub Calluna vulgaris (heather). Heather makes up >60% of the
    plant biomass at the site, but Vaccinium myrtillus and Empetrum nigrum are also
    present.
