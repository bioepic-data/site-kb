  description: The station Lison (ICOS code IT-Lsn) is located in the middle of an
    extended vineyard, on a flat terrain of Venice region (Lison di Portogruaro, province
    of Venice), North-East Italy. The vineyard, established in 2001, is about 33 ha
    and surrounded by other vineyards, has the vine rows oriented to 35-125 N. Rows
    are spaced 2.2 m apart and are approximately 0.5 m wide; plant spacing is 0.9
    m and the canopy height at full development is 2 m. The vineyard alleys are covered
    by permanent grass, regularly mowed during the season, while the soil below plants
    on the row is chemically weeded for a strip of about 0.7 m width. Eddy covariance
    measurements started in May 2014. Canopy height at full development is 2 m, the
    vine growing season is from April to September. The alleys are covered with spontaneous
    herbaceous vegetation.
  status: ACTIVE
