  description: "Houay Pano is a small agricultural catchment (60 ha) of northern Lao\
    \ PDR, 10 km from the UNESCO world heritage city of Luang Phrabang, in a sloping\
    \ land environment monitored since 1998. The objective is to monitor the impact\
    \ of land use changes from annual crops (upland rice, Job’s tear and maize, cultivated\
    \ with slash and burn system) to perennial (teak trees), and of climate changes\
    \ upon hydrological and sedimentary fluxes and budgets, along with water quality\
    \ (including microbial contamination). The mean slope is 48%. Alfisol, Ultisol,\
    \ Entisol developed on shale and shist. Monitoring devices include an automatic\
    \ meteorological station, weirs to monitor discharge from nested catchments, suspended\
    \ sediment, and bedload, piezometers, and electrical resistivity. More information\
    \ is available on https://mtropics.obs-mip.fr/ and in the following papers:\r\n\
    Boithias, L., et al., 2021. The Multiscale TROPIcal CatchmentS critical zone observatory\
    \ M-TROPICS dataset II: land use, hydrology and sediment production monitoring\
    \ in Houay Pano, northern Lao PDR. Hydrol. Process. 35, e14126. https://doi.org/10.1002/hyp.14126\
    \ \r\nRibolzi, O., et al., 2017. From shifting cultivation to teak plantation:\
    \ effect on overland flow and sediment yield in a montane tropical catchment.\
    \ Sci. Rep. 7, 3987. https://doi.org/10.1038/s41598-017-04385-2 \r\nValentin,\
    \ C., et al., 2008. Runoff and sediment losses from 27 upland catchments in Southeast\
    \ Asia: Impact of rapid land use changes and conservation practices. Agric. Ecosyst.\
    \ Environ. 128, 225–238. https://doi.org/10.1016/j.agee.2008.06.004\r\n\r\nMore\
    \ information is available on https://mtropics.obs-mip.fr/ and in the following\
    \ papers:\r\nBoithias, L., et al., 2021. The Multiscale TROPIcal CatchmentS critical\
    \ zone observatory M-TROPICS dataset II: land use, hydrology and sediment production\
    \ monitoring in Houay Pano, northern Lao PDR. Hydrol. Process. 35, e14126. https://doi.org/10.1002/hyp.14126\r\
    \nRibolzi, O., et al., 2017. From shifting cultivation to teak plantation: effect\
    \ on overland flow and sediment yield in a montane tropical catchment. Sci. Rep.\
    \ 7, 3987. https://doi.org/10.1038/s41598-017-04385-2\r\nValentin, C., et al.,\
    \ 2008. Runoff and sediment losses from 27 upland catchments in Southeast Asia:\
    \ Impact of rapid land use changes and conservation practices. Agric. Ecosyst.\
    \ Environ. 128, 225–238. https://doi.org/10.1016/j.agee.2008.06.004"
