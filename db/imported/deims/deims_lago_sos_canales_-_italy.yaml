  description: Lake Sos Canales (IT10-005-A) is located in north-eastern Sardinia.
    The reservoir was built in 1956 with the damming of the Tirso River. The reservoir
    lies at 714 m a. s. l. and has a maximum area of 0.33 km2, a mean depth of 13.2
    m and a maximum nominal volume of 4.3 x 106 m³. The catchment is extended for
    about 16 km2.
