  description: 'The station Mooseurach (ICOS code DE-Msr) is a forested bog located
    about 37 km South of Munich, in the region of Bavaria, Germany. The site is part
    of a large bog complex (250 ha) that was drained at the beginning of the 20th
    century, and the research area was afforested in 1967. The site is currently dominated
    by downy birch (Betula pubescens Ehrh.), alder buckthorn (Frangula alnus Mill.),
    and Norway spruce (Picea abies L. Karst). The site is situated in a region where
    the climate transitions from oceanic to continental. Locally, the climate is influenced
    by the Starnberg Lake, which is located about 10 kilometers west of Mooserauch:
    air masses that move across the lake become more humid.'
  status: ACTIVE
