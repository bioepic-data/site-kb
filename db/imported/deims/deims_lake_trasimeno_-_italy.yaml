  description: Lake Trasimeno (Umbria, Italy) is a shallow meso-eutrophic lake of
    a remarkable naturalistic importance (Natura 2000 site, S.C.I., S.P.Z. and Regional
    Park). Despite its large extension, the lake is very shallow and its bathymetry
    very smooth, with a maximum nominal depth of 6.3 m, which can only be reached
    when the water level exceeds the artificial outlet threshold located at 257.50
    m a.s.l.
