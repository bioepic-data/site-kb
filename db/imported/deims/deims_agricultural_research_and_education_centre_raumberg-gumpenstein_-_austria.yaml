  description: The Agricultural Research and Education Centre Raumberg-Gumpenstein
    is the largest Austrian multidisciplinary research and education centre, which
    holds the legal status of an institution under public law. As part of the Austrian
    Federal Ministry of Agriculture, Forestry, Regions and Water Management, it is
    a driving-force for sustainable business in the agricultural, food and environmental
    sectors of rural areas in agricultural research. The head office is situated in
    the municipality Irdning-Donnersbachtal, in the Styrian Enns Valley, at an altitude
    of 700 meter a.s.l.. The rural area is dominated by grassland and forests, embedded
    in a mountainous landscape. More than 280 employees work in four research institutes
    (organic farming and livestock biodiversity, livestock research, crop production
    and cultural landscape, animals, technology and environment) and as teachers at
    the higher agricultural college (branches agriculture with a focus on agricultural
    management, environmental and resource management) with about 410 students. AREC
    has external research areas and test sites with different climate conditions all
    over Austria (Wels, Lambach, Winklhof, Admont). The centre is specialised in research
    for multifunctional farm and environmental systems and in developing complex landscape
    analysis in view of agriculture, sustainable and efficient usage of natural resources,
    climate change, preservation of biodiversity and rural development. AREC offers
    a high expertise in dissemination of know-how for scientists, farmers, practitioners,
    decision makers, stakeholders and the local population. Workshops, trainings and
    national as well as international conferences are organized regularly with several
    hundred participants each year. AREC participates in national and international
    projects as well as relevant research networks.
