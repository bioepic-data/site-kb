  description: The Northern Great Plains Research Laboratory (NOGP) is a terrestrial
    NEON field site located 9.6 km (6 mi.) west of Bismarck, North Dakota. The sampling
    area is about 6 km2 (1483 acres), placed on land that has been managed by the
    U.S. Department of Agriculture and the Agriculture Research Service (ARS) for
    over 100 years. The site is full of sprawling grassland vegetation which represent
    much of NEON's 770,995 km2 (190.5 million acre) Northern Plains Domain (D09),
    NEON's second largest Domain. D09 includes two other terrestrial field sites and
    two aquatic field sites. NOCP is not colocated with an aquatic site.
