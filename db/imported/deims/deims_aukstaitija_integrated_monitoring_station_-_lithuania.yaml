  description: "Aukštaitija integrated monitoring station (LT01) was founded in 1993,\
    \ and measurements continuously carried on since. \r\nThe station is administrated\
    \ by Vytautas Magnus University and Nature Protection Agency of Lithuania.\r\n\
    \r\nThe station is part of:\r\n- National ecosystem and air monitoring programs\r\
    \n- ICP Integrated Monitoring\r\n- ICP Forest\r\n- eLTER network\r\n- GERI\r\n\
    \r\nThe majority of ICP IM and ICP Forests measurements are carried in Aukštaitija\
    \ National Park, Ažvinčiai strict nature reserve, Versminis river basin. The area\
    \ of the basin is 101.5 ha. The rest of the infrastructure requiring measurements\
    \ is carried out in nearby Rūgšteliškis village 55.46339 26.00427 and its surrounding\
    \ forest stands.\r\n\r\nAccording to long-term AIMS data, the average annual air\
    \ temperature in the area is 6.9 ± 0.8 °C and the annual precipitation is 680\
    \ ± 100 mm. The growing season lasts on average 189 days, with an average temperature\
    \ of 13.2 ± 0.6 °C and precipitation of 420 ± 94 mm. Based on the analysis of\
    \ meteorological data from the monitoring station (Augustaitis et al., 2018; Augustaitis,\
    \ 2019), a statistically significant increase in annual temperature of 0.043 °C\
    \ per year was identified.\r\nThe area is covered by multi-aged and multi-layered\
    \ natural or seminatural mixed coniferous forest stands, dominated by Scots pine\
    \ and Norway spruce with the admixture of Silver and Downy birches.\r\nSoil properties\
    \ vary from deep (>120 cm) haplic arenosol, with a high proportion of sand (~90%)\
    \ covering the majority of the area. To water-saturated, deep (>80 cm) terric\
    \ histosol consisting mostly of low-moor deep eutrophic peat soil located in the\
    \ lowest places of the Versminis river basin.\r\n\r\nThe goal of the research\
    \ station is a better understanding of the environment and a more harmonious coexistence\
    \ with/within it."
