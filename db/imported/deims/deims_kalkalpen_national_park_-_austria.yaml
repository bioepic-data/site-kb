  description: "Kalkalpen National Park is made up of two mountain ranges\r\n* The\
    \ Reichraminger Hintergebirge is one of Austria's largest distinct forest areas\
    \ - a sea of forest, which has not yet been dissected by public transportation\
    \ routes and human habitation. Here, you will also find one of the longest intact\
    \ stream systems of the Eastern Alps. Old shelters and overgrown trails remind\
    \ us today of how wood was used and harvested in earlier times.\r\n* The Sengsengebirge\
    \ is a northern outpost of the Limestone Alps. The ca. 20 km long main ridge reaches\
    \ its highest point at the Hoher Nock (1,963 m). \r\nThe name Sengsengebirge can\
    \ be traced back to the use of the forests as a source of energy for the numerous\
    \ scythe smithies once located here.\r\n \r\nFacts & Figures\r\nEstablished: July\
    \ 25, 1997\r\n Area: 20,850 ha\r\n Zoning: 89% nature zone, 11% conservation area\r\
    \n Property: 88% federally owned (Austrian Forestry Service), 11% privately owned,\
    \ and 1% municipal property\r\n Internationally recognized: as a national park\
    \ (IUCN category II) since 1998, Ramsar protected area (wetland of global importance),\
    \ and Natura 2000 area (European nature reserve) since 2004\r\n Elevation: 385\
    \ to 1,963 m (Hohe Nock)\r\n Main types of rock: Wetterstein limestone, primary\
    \ dolomite\r\n \r\nLandscape Classification of Kalkalpen National Park\r\n \r\n\
    (Updated June 2011)\r\n81% forest \r\n8% mountain pine \r\n6% alpine pastures\
    \ and meadows \r\n5% rock and scree"
