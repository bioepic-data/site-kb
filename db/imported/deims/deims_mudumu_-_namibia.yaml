  description: "Mudumu National Park, one of Namibia’s least-known parks, is richly\
    \ rewarding for adventurous visitors. The main attraction is the riverine habitat\
    \ of the Kwando River, while inland is the Mudumu Mulapo fossilised river course\
    \ and the dense mopane woodland shelter woodland species. There is no formal entrance\
    \ gate or park fence - the park is separated from neighbouring communal farmland\
    \ by a graded cutline.\r\n \r\nMudumu is home to a large elephant population.\
    \ The park acts as a corridor for these pachyderms as they migrate between Botswana,\
    \ Zambia, Angola and Zimbabwe.\r\n \r\nIn recent years, Mudumu has become the\
    \ model for co- operation  between  parks and neighbours. The parks, conservancies,\
    \ community forests and traditional leaders work together on law enforcement,\
    \ fire management (early burning), game monitoring and translocations. This evolved\
    \ from the need to manage common resources across unfenced park and conservancy\
    \ boundaries."
  status: ACTIVE
