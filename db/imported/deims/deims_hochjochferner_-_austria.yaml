  description: Hochjochferner (glacier) is located between the Schnalstal and the
    Venter valley. It extends over an area of 612 ha from the Grawandspitze (3.251
    m) and the Fineilspitze (3.514 m) to the Hochjoch (2.750 m) and into the Rofen
    valley. The western part of the glacier was used as year-round ski area until
    2012.
