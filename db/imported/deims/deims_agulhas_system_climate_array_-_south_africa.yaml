  description: 'The ASCA shelf and tall moorings extend 200 km offshore of Hamburg
    just south of East London on the East coast of South Africa, along the decending
    TOPEX/Jason satellite ground track # 96, through the core of the Agulhas Current,
    with Current- and Pressure-recording Inverted Echo Sounders (CPIES) measurements
    extending the array to 300 km offshore.  There are  two shelf and seven full-depth
    tall moorings, interspersed with five  CPIES, measuring pressure, current velocities,
    temperatures and salinities.'
