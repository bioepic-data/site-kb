  description: Research undertaken and supported at WARC is wide ranging and includes
    archaeology, permafrost, limnology, oceanography, geology, spatial information
    sciences, botany, renewable energy (solar and wind), atmospheric sciences, wildlife,
    fisheries, and marine mammal health. Social sciences, health sciences, and traditional
    knowledge studies are also frequently supported. Each year, we support more than
    50 separate research projects. The Aurora Research Institute (ARI) maintains the
    NWT Research Database, which is a searchable database of all research licenses
    issued by ARI since 1974.
