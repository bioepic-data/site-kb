  description: The site is located in the Congo Basin. The region is part of a floristic
    group identified as semi-deciduous evergreen. Canopy height model (CHM) data indicate
    the presence of a heterogeneous canopy with an average tree height of 29.3 m and
    95% of the identified crowns between 21.2 m and 38.8 m. The CongoFlux research
    site is located at the Institut National pour l'Etude et la Recherche Agronomique
    (INERA), Yangambi Centre (CRY) built in the 1930s.
  status: ACTIVE
