    longitude: 0.0169
    country: Spain
    elevation_meters: 750.0
  description: "The Intensive Monitoring of Forest Ecosystems (ICP-Forests Level II\
    \ network) consists currently in 14 monitoring plots representing important Spanish\
    \ Forest Ecosystems distributed throughout the Spanish mainland showing the most\
    \ common forest situations of each country and representing rare or endemic situations.\r\
    \n\r\nThe plot 06 Qi represents an Holm oak (Quercus ilex) forest  located in\
    \ the East of the Iberian peninsula.\r\nIt is a 41-80 years old monospecific regular\
    \ forest. It was a coppice forest which is currently under transformation into\
    \ high forest\r\nThere are many Holm oak shoots In the understory. There are also\
    \ rocky outcrops, with ferns. In the places where there is a grass layer, there\
    \ is Hedera helix.\r\nClimatic gradient is Mesomediterranean.\r\nSoil is made\
    \ up of limestone"
