    name: Mapimi - Mexico
  location:
    latitude: 26.39
    longitude: -103.85
    country: Mexico
    elevation_meters: 1100.0
  description: "Se ubica en el límite donde se unen los estados norteños de Chihuahua,\
    \ Coahuila y Durango, en la parte central del desierto chihuahuense. Está conformada\
    \ por llanuras esérticas en cuencas endorreicas, denominadas bolsones, localizadas\
    \ a elevaciones entre los 1,000 y 1,200 m; en medio de estas llanuras sobresalen\
    \ algunas elevaciones\r\nde cerros y pequeñas serranías de origen volcánico y\
    \ sedimentario. Un rasgo geográfico característico del Bolsón de Mapimí consiste\
    \ en la presencia de formaciones arenosas  que llegan a ocupar grandes superficies\
    \ cubiertas por dunas o extensas planicies de arena."
