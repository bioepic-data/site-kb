  description: The Aelmoeseneie Forest is a 28.5 ha mixed deciduous forest in the
    community of Gontrode, just southeast of Ghent. The largest part of the forest
    is ‘ancient forest’, i.e. it is permanently forested since before 1775, while
    the forest is surrounded by agricultural land (mostly pastures). The soil consists
    of a silt loam to loam soil (Planosol), overlaying a mosaic of tertiary clayey
    and sandy deposits with high base saturation starting at 50 cm depth. Forest management
    is designed to obtain a more natural tree species composition and to conserve
    biodiversity. More info can be found at www.aelmoeseneiebos.ugent.be.
