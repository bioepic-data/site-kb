  description: "In biological science, M’Clintock Channel is possibly most famous\
    \ for its polar bears. The M’Clintock Channel sub-population estimate is 284 polar\
    \ bears, based on mark-recapture work completed in 2000. There is low harvest\
    \ on the polar bears, and the population is thought to be increasing from reduced\
    \ numbers. The area has the classic flora and fauna of this part of Nunavut, incl.\
    \ ringed seals, geese, gulls, turns, waders (shorebirds), etc. The M’Clintock\
    \ Channel is 274 km long, and between 105 to 209 km wide, making it one of the\
    \ largest channels in the Canadian Arctic Archipelago.\r\n\r\nPolar bear research\
    \ made by scientists supplemented with traditional Inuit knowledge has been the\
    \ focus of the research at the M’Clintock Channel Research Cabins. For more information,\
    \ please contact the Gjoa Haven Trappers and Hunters Association."
  status: ACTIVE
