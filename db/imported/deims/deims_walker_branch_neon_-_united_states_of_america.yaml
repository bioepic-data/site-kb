  description: Walker Branch Watershed (WALK) is an aquatic field site located in
    the Cumberland Plateau within Roane County, Tennessee. The site is located on
    the U.S. Department of Energy’s (DOE’s) Oak Ridge Reservation. WALK is managed
    by the DOE, specifically by the Oak Ridge National Laboratory’s Multiple Research
    Division. Walker Branch is a wadeable stream that drains a 1.1 km2 (270 acre)
    watershed and is surrounded by deciduous forest. The region's rivers and streams
    harbor some of the largest variety of fish and mollusk species in the U.S. WALK
    is part of NEON Domain 07 - Appalachians & Cumberland Plateau, which includes
    eastern Tennessee, most of Kentucky, southern Ohio, and parts of North Carolina,
    Georgia, Indiana, and Illinois. The Domain hosts four other NEON field sites,
    three terrestrial and one aquatic, three of which are located in Tennessee. WALK
    is colocated with the ORNL terrestrial field site.
