  description: "Livingston Island (62º39’S, 60º21’W) is situated in the South Shetlands,\
    \ one of the Earth’s regions where warming has been more significant in\r\nthe\
    \ last 50 years. Livingston island shows high mountain relief, is 90% covered\
    \ by glaciers and the bedrock in the research area (Hurd Peninsula) is a low-grade\
    \ metasedimentary sequence of sandstone, shales and quartzite. About 10% free\
    \ of ice vegetated terrains."
