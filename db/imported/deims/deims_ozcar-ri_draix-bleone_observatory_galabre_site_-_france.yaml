  description: "The Galabre site is part of Draix-Bleone observatory, located in the\
    \ French South Alps, upstream of Digne, on the right side of the Bleone river.\
    \ \r\n\r\nThe hydrosedimentary station of La Robine-sur-Galabre was created in\
    \ 2008 to measure water of sediment fluxes from the Galabre catchment, 20 km2.\
    \ This catchment integrates a diversity of lithologies and land use that are characteristic\
    \ of the Pre-Alps. The climate is mountainous and Mediterranean. The site is characterized\
    \ by intense erosion and intermittent sediment fluxes.\r\n\r\nThe variables that\
    \ are monitored on the long-term include rainfall and meteorology, high-frequency\
    \ water discharge and suspended sediment concentration (10 minutes), some physico-chemical\
    \ properties of stream water and sediments."
