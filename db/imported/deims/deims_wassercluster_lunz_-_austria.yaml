  description: "The Interuniversity Centre for Aquatic Ecosystem Research, WasserCluster\
    \ Lunz  Biologische Station GmbH (WCL), is located on the shore of Lake Lunz („Lunzer\
    \ See“) in the south of the Austrian province of Lower Austria. It is an interdisciplinary\
    \ freshwater research center and designed to advance and teach freshwater science.\
    \ WasserCluster Lunz is an independent research institute, with close ties to\
    \ three Universities (University of Vienna, University of Natural Resources (BOKU)\
    \ and Applied Life Sciences, Danube University Krems). Currently four working\
    \ groups are located at WCL, covering research on biogeochemistry, biodiversity\
    \ & conservation, microbial ecology, food webs, ecotoxicology and restoration\
    \ ecology. Research addresses lakes and running waters, including Lake Lunz and\
    \ its watershed. \r\nThe location of the WCL provides an excellent opportunity\
    \ to study the ecological processes in an ecosystem (terrestrial and aquatic)\
    \ which is nearly undisturbed by human impacts. Especially the aquatic ecosystems\
    \ “Lunzer See” (ecosystem lake) and “Oberer Seebach” (ecosystem catchment) are\
    \ closed by the WCL and are equipped with measurement instruments in a very high\
    \ quality. Moreover, WKL has a fully equipped laboratory for a lot of biochemical\
    \ analyses regarding the aquatic research objectives. \r\n\r\nFour working groups\
    \ with different research objectives in aquatic systems are established: \r\n\r\
    \nCARBOCROBE (K. Attermeyer) - https://wcl.ac.at/index.php/en/people?peid=4295304993;\
    \ \r\n\r\nFLUVICHEM (G. Weigelhofer) - https://wcl.ac.at/index.php/en/people?peid=4295208354;\r\
    \n\r\nLIPTOX (M. Kainz) - https://wcl.ac.at/index.php/en/people?peid=4295208329;\r\
    \n\r\nSCIFISH (L. Závorka) - https://wcl.ac.at/index.php/en/people?peid=4295318343"
