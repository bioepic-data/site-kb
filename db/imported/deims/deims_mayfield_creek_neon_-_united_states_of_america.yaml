  description: Mayfield Creek (MAYF) is an aquatic NEON field site in the coastal
    plain of west-central Alabama. The site has a watershed size of 14.3 km2 (3534
    acres) and is encompassed within the Mobile River Basin. This site is also located
    in the Talladega National Forest and is managed by the U.S. Forest Service. The
    forest consists of mixed mature coniferous and hardwood trees, and wetlands comprise
    a significant portion of the watershed. MAYF is part of NEON's Ozarks Complex
    Domain (D08). D08 includes two other aquatic field sites and three terrestrial
    sites. MAYF is colocated with the terrestrial site TALL.
