sites:
- id: site_kb:deims-kis-balaton_site_balaton_lter_-_hungary
  name: Kis-Balaton Site, Balaton LTER - Hungary
  network_registrations:
  - network: DEIMS
    network_id: 8129fed1-37b3-48e6-b786-d416917acc72
    network_url: https://deims.org/8129fed1-37b3-48e6-b786-d416917acc72
    name: Kis-Balaton Site, Balaton LTER - Hungary
  location:
    latitude: 46.6333
    longitude: 17.1833
    country: Hungary
    elevation_meters: 104.0
  description: "In order to combat the eutrophication of Lake Balaton, the Kis-Balaton\
    \ Water Protection System (KBWPS) was initiated in the early 1980s. Originally,\
    \ the KBWPS consisted of an 18 km2 shallow (less than 1.3 m) artificial lake system\
    \ (Lake Hídvégi) and a 16 km2 wetland, which were constructed on the site of the\
    \ former Kis-Balaton wetland in the mid-1980s. Later, the wetland part of the\
    \ KBWPS was significantly enlarged (over 50 km2). Lake Hídvégi was designed to\
    \ retain nutrients and provide ideal conditions for algae growth, while the wetland\
    \ component of the KBWPS prevented these algae from entering Lake Balaton.\r\n\
    \r\nRegular limnological, ornithological, ichthyological and plant ecological\
    \ measurements are carried out in both Lake Hídvég and the wetland part of the\
    \ KBWPS."
