  description: "The Fuchsenbigl Field Station is an agricultural research site of\
    \ the Austrian Agency for Health and Food Safety (AGES) and representative of\
    \ productive soils managed as arable land.\r\nThis site is located in the Marchfeld\
    \ (Lower Austria), the soil is described as a fine sandy-loamy Calcaric Chernozem\
    \ (WRB). Cultivated crops include cereals (e.g. winter wheat, barley, rye), sugar\
    \ beet, maize and potatoes. Current research objectives include to study the effects\
    \ of different conventional arable management practices on crop yields and  quality\
    \ and on chemical, physical and biological soil parameters."
