  description: Naiman Desertification Research Station (NDRS), Cold and Arid Regions
    Environmental and Engineering Research Institute (CAREERI),Chinese Academy of
    Sciences (CAS) was officially estabilished in 1985, locating at Naiman County
    Inner Mongolia. The station is also affiliated to the Chinese Ecosystems Research
    Network (CERN) and Chinese National Ecosystem Research Network (CNERN).
