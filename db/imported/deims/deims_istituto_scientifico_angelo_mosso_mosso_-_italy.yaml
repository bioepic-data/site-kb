  description: "The \"Istituto Scientifico Angelo Mosso\" research site is located\
    \ on the watershed between Piedmont and Valle d'Aosta (NW-Italy), in the Municipality\
    \ of Alagna Valsesia (Monte Rosa massif). The Scientific Laboratories of the \"\
    Angelo Mosso Institute\" at Col d’Olen (2901 m a.s.l.), the heart of this research\
    \ site, were built between 1905 and 1907, when it became clear that the Capanna\
    \ Regina Margherita on Monte Rosa (4554 m a.s.l.), as a high-elevation research\
    \ centre, had become insufficient to the increasing number of requests for use\
    \ by the international scientific community. From here the idea promoted by Angelo\
    \ Mosso (1846-1910), professor of human physiology at the University of Turin,\
    \ to add an additional structure to the Observatory of the Capanna Regina Margherita\
    \ for make larger laboratories available to researchers and allow study stays\
    \ at high elevation. This project soon became a reality thanks to the intervention\
    \ of Queen Regina Margherita, Ministries of Education and Agriculture, the Italian\
    \ Alpine Club and various personalities of the time. The research conducted at\
    \ the Institute did not concern only human physiology, but also other disciplines,\
    \ including alpine meteorology and glaciology, thanks also to the presence of\
    \ the Meteorological Observatory that flanked the Institute, directed in the years\
    \ 1925-40 by Umberto Monterin. It is now home to an automatic snow and weather\
    \ station, managed by the Alpine Troops-Meteomont service. In addition to the\
    \ University of Turin, the research groups that operate at the site and contribute\
    \ to data collection and implementation are currently CNR-IRSA, Alpine Troops\
    \ Command-Service Meteomont, Monterosa 2000 SpA and Monterosa SpA (Monterosa Ski),\
    \ Protected areas of Valsesia, ARPA Piemonte, ARPA Valle d'Aosta and Sesia Val\
    \ Grande Geopark. In addition to the valuable historical series of climate data,\
    \ a series of research activities are devoted to the study of snow-soil-vegetation\
    \ interactions, with particular reference to soil carbon and nitrogen dynamics\
    \ (Magnani et al. 2017a,b; Freppaz et al. 2019; Pintaldi et al. 2022; Benech et\
    \ al. 2025). In addition, investigations are performed focusing on the chemical\
    \ characteristics of high-elevation surface waters, fed by different cryospheric\
    \ features such as rock glaciers, glaciers, and permafrost (Colombo et al. 2018a,b;\
    \ 2019a,b; 2020; Vione et al., 2021). New research lines, aimed at investigating\
    \ the most recent environmental challenges, have been added to the previous ones.\
    \ For instance, investigations on sources and routes of atmospheric carbon and\
    \ nitrogen species are ongoing.\r\n\r\n\r\nReferences: Colombo N. et al. (2018a),\
    \ https://doi.org/10.1002/esp.4257. Colombo N. et al. (2018b), https://doi.org/10.1016/j.scitotenv.2018.05.098.\
    \ Colombo N. et al. (2019a), https://doi.org/10.1016/j.scitotenv.2019.06.233.\
    \ Colombo N. et al. (2019b), https://doi.org/10.1007/s00027-019-0670-z. Colombo\
    \ N. et al. (2020), https://doi.org/10.1016/j.catena.2020.104700. Freppaz M. et\
    \ al. (2019), https://doi.org/10.3897/natureconservation.34.30737. Magnani A.\
    \ et al. (2017a), https://doi.org/10.1657/AAAR0016-037. Magnani A. et al. (2017b),\
    \ https://doi.org/10.1016/j.catena.2017.03.007. Vione D. et al. (2021), https://doi.org/10.1016/j.scitotenv.2020.143464.\
    \ Pintaldi et al. (2022), https://doi.org/10.1080/15230430.2022.2104001. Benech\
    \ et al. (2025), https://doi.org/10.1007/s11629-025-9921-8"
