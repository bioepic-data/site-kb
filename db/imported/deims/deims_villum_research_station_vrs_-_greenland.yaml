  description: Once the new station is fully operating, a database will be established
    for storage of all kind of scientific data. At present only atmospheric data are
    stored in a database maintained by Aarhus University. Meteorological and atmospheric
    chemical data are reported to EMEP (European Monitoring and Evaluation Programme),
    and AMAP (Arctic Monitoring and Assessment Programme) and will in the future also
    be reported to WMO-GAW (World Meteorological Organisation, Global Atmosphere Watch).
    A list of the parameters currently being measured at Station Nord can be found
    on http://envs.au.dk/en/research/facilities/villumresearchstation.
