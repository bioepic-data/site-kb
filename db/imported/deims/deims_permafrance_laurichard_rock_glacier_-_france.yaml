  description: "An active rock glacier in the French Alps, at the climatic boundary\
    \ between Mediterranean and Oceanic climatic zones, near the Col du Lautaret (45°N).\
    \ Located between 2650 and 2450 m asl, this ice-rich permafrost landforms, typical\
    \ of high mountain periglacial environments, is studied since the late 70' and\
    \ has the longest series of monitoring. Its displacements are measured using geodetic\
    \ methods (total station, GPS, terrestrial LiDAR and photogrammetry).\r\n\r\n\
    Monitoring of the Laurichard rock glacier aims at understanding the responses\
    \ of mountain permafrost to Climate and Global change."
  notes: 'Biogeographical region: alpine'
  status: ACTIVE
