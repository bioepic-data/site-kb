  description: "The Morris Kahn Marine Research Station was established in order to\
    \ provide baseline data and understanding of the marine ecological system in the\
    \ Mediterranean Sea of Israeli coastal waters. \r\nThe Charney School of Marine\
    \ Sciences at the University of Haifa recently established a long-term ecological\
    \ research station focusing on the eastern Mediterranean basin located in Kibbutz\
    \ Sdot Yam, 44 km south of Haifa, near Caesarea. The station is called the Morris\
    \ Kahn Marine Research Station and focuses on five main research topics;\r\n·\
    \ Top Predators \r\n· Sediments\r\n· Water composition (Biogeochemistry)\r\n·\
    \ Rocky Bottoms\r\n· Fish Disease (pathogens)\r\nThe Israeli coastal area and\
    \ the eastern Mediterranean Sea is experiencing accelerated development and infrastructure\
    \ projects along the coastline, and a massive exploitation of marine resources\
    \ never experienced in our region and nation. Coupled with the effects of global\
    \ climate change and local polluting factors, life in the shallow and deep sea\
    \ are changing rapidly. The Morris Kahn Marine Research Station is responsible\
    \ for collecting biological and ecological data for long term research that will\
    \ provide insight for understanding processes and predicting the effects of climate\
    \ change and development on the environment. Such data will allow for science-based\
    \ decisions that will greatly influence the interaction nature of future generations\
    \ with the sea and the marine environment. This issue is particularly important\
    \ given the fact that an majority of the water consumed in Israel is produced\
    \ through desalinization of sea water, the main energy supply is based off of\
    \ marine gas fields, aquaculture is gaining momentum as development allows for\
    \ the cultivation of fish for human consumption in marine farms, and national\
    \ projects referring to the sea as “developable land” that can be dried and made\
    \ into artificial islands for various infrastructures. In order to accompany such\
    \ a momentum in development without the collapse of the ecosystem and destruction\
    \ of the sea as a natural resource, there is a need to provide reliable and in\
    \ depth understanding as to how the system works. \r\nTo accomplish these goals,\
    \ the station employs top of the line researchers specializing in the Mediterranean\
    \ as well as collaborate with other academic and research centres in Israel, while\
    \ providing the best equipment for research and analysis of data collected from\
    \ the sea including; \r\n· Rosetta collecting water samples from different depths\r\
    \n· CTD device for measuring physical data of water\r\n· Advanced underwater photography\
    \ and documentation equipment\r\n· Closed and controlled water system for aquaculture\
    \ research\r\n· Device for detecting and quantifying nutrients in the water (Seal\
    \ AA3).\r\n· Robot for measuring isotopes in samples (GC-IRMS-MS)\r\n· Confocal\
    \ microscopy\r\n· Membrane mass spectrometer\r\n· Servers for database backup\
    \ and maintenance\r\n· AAUS diving club performing scientific technical dives\r\
    \n· Closed dive systems to allow deep, long, and safe dives\r\n· Boat used as\
    \ a platform for diving and marine monitoring on the continental shelf\r\n· Laboratories\
    \ for dissection\r\n· Work rooms for student and guest researchers\r\n· Meeting/conference\
    \ rooms\r\n· AUV and ROV (Marine technologies lab)\r\n· THEMO buoy for deep sea\
    \ research\r\n· Drones and other aerial devices\r\n· Website for sharing information\
    \ as well as providing accessible information for the general public"
