  description: Lake Cedrino (IT10-002-A) is the result of the dam on the Cedrino River
    built in 1984. The lake is located in the eastern centre of Sardinia. It has a
    surface area of 1.5 km2 and a volume of 20 x 106 m3 when it is filled to the maximum
    share (103 m a. s.l.), and a mean depth of 26.5 m. The catchment covers about
    627 km2.
