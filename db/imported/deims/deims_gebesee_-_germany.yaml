  description: The station Gebesee (ICOS code DE-Geb) is located near Gebesee ca.
    20 km northwest of Erfurt in the Thuringian Plain, Germany. The site is an agricultural
    site with crop rotation since 2001 (when the eddy flux measurements started) included
    winter wheat (Triticum aestivum L.), potatoes (Solanum tuberosum L.), rape (Brassica
    napus L.), winter barley (Hordeum vulgare L.), sugar beet (Beta vulgaris L.),
    peppermint (Mentha × piperita L.), durum (Triticum durum DESF.), and spring wheat
    (Triticum aestivum L.). The soil is classified as Chernozem (FAO) with a silty
    clay loam texture (~30 % clay) and granular structure.
  status: ACTIVE
