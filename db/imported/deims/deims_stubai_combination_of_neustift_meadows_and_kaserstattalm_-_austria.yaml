    country: Austria
    elevation_meters: 2000.0
  description: 'The LTER grassland sites in the Stubai Valley are situated near the
    village of Neustift (47° 7′ N, 11° 18′ E). They include a valley bottom meadow
    at 970 m a.s.l., cut 3-4 times per year, as well as three grasslands differing
    in land use, which are located on the mountain slope in the vicinity of the Kaserstattalm:
    a mountain meadow at 1810 m a.s.l. (one cut, lightly grazed in late summer), a
    pasture at 1870 m a.s.l. and a grassland at 1980 m a.s.l., which was abandoned
    in 1984. Documentation of management history and vegetation dynamics of the whole
    area date back to 1865, and detailed information on the current socio-economic
    situation and future land-use scenarios is available.'
