  description: The restoration sites are located in abandoned arable land and clear-cut
    tree plantations mostly, but not entirely within LTER Fulophaza that is a high
    diversity site, both in terms of habitats and species, in the Kiskunság Sand Ridge.
    It uses some of the central facilities of the KISKUN LTER, such as the meteorological
    station and the field research station with accommodation opportunities, and a
    couple of long term monitoring sites and field experiments.
