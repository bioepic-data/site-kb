  description: This site is representative of high altitude environments of the North-Western
    Alps. Six study areas, located along an altitudinal gradient ranging from 2100
    to 3100 m a.s.l. were chosen. In such areas, soils are snow covered for between
    five and eight months per year. Vegetation cover ranges from larch and spruce
    stands, to alpine grasslands, overlying soils at different evolution degrees.
    One of such areas  belongs to the GLORIA (GLobal Observation Research Initiative
    in Alpine Environments) Network, coordinated by the University of Vienna (prof.
    G. Grabherr) and is also a site monitored by the Regional Agency for Environmental
    Protection of the Aosta Valley Region (ARPA Valle d’Aosta) with the contribution
    of Mont Avic Natural Park. An area is a permanent site for monitoring of permafrost
    and active layer, located at 3100 m a.s.l. and coordinated by ARPA Valle d’Aosta.
    A fourth area is a subalpine site under larch stands interspersed with recently
    abandoned pastures. In such area phenological studies and C fluxes are intensively  monitored
    following the protocols of the CARBOITALY Network.
