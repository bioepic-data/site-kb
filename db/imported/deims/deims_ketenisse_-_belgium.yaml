  description: The site is a managed realignement (Sea Wall Removal) combined with
    a land lowering to start estuarine development in a suitable tidal frame. The
    site was created in 2002 and monitored in an initial phase intensively. (aspects
    of morphology, sediment characteristics (including polluents), macrozoobenthos,
    vegetation and birds). Vegetation and birds are ongoing monitoring.
