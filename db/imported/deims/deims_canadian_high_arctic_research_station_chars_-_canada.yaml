  description: The Canadian High Arctic Research Station (CHARS) operated by Polar
    Knowledge Canada, has been designed and built to optimize innovation in Arctic
    science and technology, to welcome visitors, and to provide researchers with the
    accommodation and technical services they need. It’s an innovative facility that
    can support a wide range of research needs – from ecosystem monitoring, to DNA
    analysis – and where Indigenous Knowledge is recognized as fundamentally important
