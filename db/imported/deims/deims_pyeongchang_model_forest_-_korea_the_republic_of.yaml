  description: The Pyeongchang Model Forest (37° 48" N, 128° 52" E) was established
    in the Jungwangsan of Pyeongchang-gun, Gangwon-do, and belongs to the temperate
    north forest region. Because it is adjacent to the forest genetic resource protection
    area, the risks of damage and public access to this forest are considered relatively
    low. It comprises various species of trees such as Quercus mongolica, Acer mandshuricum,
    Acer pictum, and Cornus controversa.
