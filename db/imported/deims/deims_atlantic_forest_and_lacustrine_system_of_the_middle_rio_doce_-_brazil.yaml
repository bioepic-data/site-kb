  name: Atlantic Forest and Lacustrine System of the middle Rio Doce - Brazil
  network_registrations:
  - network: DEIMS
    network_id: a262d0f8-696b-451d-b871-82aa639b99ed
    network_url: https://deims.org/a262d0f8-696b-451d-b871-82aa639b99ed
    name: Atlantic Forest and Lacustrine System of the middle Rio Doce - Brazil
  location:
    latitude: -19.6833
    longitude: -42.5509
    country: Brazil
    elevation_meters: 250.0
  description: 'The LTER project in the middle Rio Doce watershed, Southeast Brazil,
    calls attention to the importance of the system (> 150 lakes) and mantaining a
    considerable part of the original Atlantic Forest, one of the world’s most diverse
    and threatened ecosystem: 260 mammals species of which 30% are protected within
    the Rio Doce State Park together with 325 bird species and nothing less than 7
    Primates!, 20,000 plant species of which 1,129 within the Rio Doce Park. The site
    is located within the "Steel Valley" and surrounded by 19 municipalities which
    represent a considerable source of pressures together with extense Eucalyptus
    spp plantations, mining, exotic species and abandoned pastureland.'
