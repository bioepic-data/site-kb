  description: Dead Lake (DELA) is a terrestrial NEON field site located in seasonally-flooded
    hardwood bottomland in Greene County, Alabama. This site has a sampling area of
    about 4 km2 (1013 acres) and is hosted by the U.S. Army Corps of Engineers. Greene
    County is bordered by the Tombigbee, Warrior, and Sipsey rivers within the Black
    Warrior River watershed. The county is known for its hunting and fishing. DELA
    is located in an area called the "Blackbelt," an area known for its nutrient-rich,
    dark soil. This site is part of the NEON Ozarks Complex Domain (D08). D08 includes
    two other terrestrial field sites and three aquatic field sites. DELA is colocated
    with the aquatic site Black Warrior River near Dead Lake (BLWA).
