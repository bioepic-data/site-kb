  description: 'Utqiaġvik (BARR) is a terrestrial NEON field site located on the coastal
    plains of the North Slope of Alaska near Utqiaġvik, AK (formerly known as Barrow).
    It is the NEON Program’s northernmost field site. The 50 km2 (12,400 acre) site
    is within the Charles Etok Edwardsen Barrow Environmental Observatory, about 500
    km (310 mi.) north of the Arctic Circle on the shores of the Chukchi Sea. The
    site represents the polygon tundra and lake systems across the northern extent
    of the North Slope of Alaska. The landscape is extremely flat with a max elevation
    of 15 m (50 ft.) above sea level. Field site boundaries overlap other ecological
    research networks, allowing opportunities for larger datasets and longer time
    series. BARR is part of the NEON Tundra Domain (D18), which includes the northern
    and western parts of Alaska. D18 hosts three other NEON field sites in Alaska:
    two aquatic sites and the TOOL terrestrial site, all located on the North Slopes
    of the Brooks Range.'
