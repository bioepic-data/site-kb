  description: The sample site of the VULCAN project in Hungary, where research was
    conducted between 2001 and 2013. We studied the effects of a warming and drying
    climate on the functioning and organisation of the sand forest-steppe ecosystem.
    The research activities cover a wide range of areas, including plant phenology,
    primary productivity, ecophysiology, plant population biology, the role of functional
    groups, plant biodiversity, biodiversity of specific animal groups, litter decomposition,
    N-mineralisation, soil respiration, etc.
