  description: Hydrometeorological observations within 3 embedded catchments (0.9,
    2.6 and 14.5 km2). Mediterranean climate with heavy rainfall and flash floods
    in automn. The geology is mainly shale. The land use is mainly forest. This site
    is typical of the Cévennes region. More information at http://www.ohmcv.fr
