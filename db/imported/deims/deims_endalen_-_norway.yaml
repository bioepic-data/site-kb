  description: "In this project we monitor temporal trends in bird communities in\
    \ a high-altitude birch-dominated habitat in Central Norway. The project aims\
    \ to monitor both community composition and changes in territory size among and\
    \ within species in the study period. The study started in 1967 and is still on-going.\r\
    \n\r\nMethods: Standardized transects are monitored 10 timed in early parts of\
    \ the breeding season, following a GPS-track of 3km. Bird species and numbers\
    \ are noted and placed relative in the habitat. This is done to potentially estimate\
    \ territory size, which is performed by standardized formulas annually. Both seen\
    \ and heard individuals are noted."
