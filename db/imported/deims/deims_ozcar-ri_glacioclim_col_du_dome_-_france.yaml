  description: Col du Dome (CDD) is a high plateau located in the Mont-Blanc massif
    (4250 m a.s.l.). Ice is cold at this altitude whatever the month of the year.
    Accumulation varies between 0.5 and 3 m w.e and is mostly governed by the wind.
    Périodic ice cores are drilled in the ice to monitor ice temperature. A weather
    station runs permanently. CDD is a part on the GLACIOCLIM/CRYOBS-CLIM Observatory.
