  description: "The Alto Patache fog oasis is located in northern Chile, 70 km south\
    \ of Iquique, Tarapacá Region. This Oasis is located along the Coastal Range of\
    \ Norte Grande, in the Atacama Desert, known for its remarkable aridity.\r\nThe\
    \ influence of coastal fog allows the development of a specially adapted vegetation,\
    \ which provides habitat suitable for animal species."
