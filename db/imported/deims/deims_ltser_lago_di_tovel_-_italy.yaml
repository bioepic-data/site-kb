  description: "Lake Tovel has a long history of limnological research and over 300\
    \ publications since the late 1800s, including an intensive study by E. Baldi\
    \ in the 1930s, document the continued interest in this lake. Tovel is famous\
    \ for its clear waters and past red dinoflagellate blooms (Flaim et al. 2004.\
    \ Phycologia 43:737–743) that no longer occur due to changes in land use (Borghi\
    \ et al. 2006. Studi Trent. Sci. Nat., Acta Biol.  81:1-472). Besides its intrinsic\
    \ biological value, Lake Tovel provides irrigation water and electrical energy\
    \ to the local population, and its location in the heart of the Adamello Brenta\
    \ Natural Park makes it an important tourist attraction. \r\nFollowing several\
    \ sporadic surveys, since 1995 the lake is part of an ongoing long-term limnological\
    \ study conducted by the Fondazione E. Mach (FEM) at S. Michele all’Adige TN,\
    \ that includes temperature profiling, chemical and biological data taken at monthly\
    \ intervals during the ice-free period and occasional winter sampling. FEM is\
    \ well equipped for limnological field work with dinghy with electrical motor,\
    \ multi-parameter probe, fluoroprobe, underwater quantum sensor, Eckman dredge,\
    \ plankton nets, water sampling bottles, etc. Laboratory facilities include microscopy\
    \ (bright field, phase contrast, interferential, fluorescent, inverted microscopes\
    \ and stereoscopes) with image analysing software, a wet lab and a fine chemistry\
    \ lab for nutrients and major ions in water as well as organics by ion chromatography\
    \ and liquid chromatography-Mass Spectrometry (LC-MS). Also available are molecular\
    \ laboratories equipped with basic (PCR, electrophoresis) and advanced techniques\
    \ (Sanger and NG sequencing).\r\n Limnological data are supported by meteorological\
    \ data provided by a meteorological station situated in the lake and active since\
    \ 1976. Recently, sensors for high frequency data (HFD) for temperature, dissolved\
    \ oxygen, light (at various depths) and water level have been installed on a central\
    \ lake platform. \r\n\r\n\r\nNotwithstanding its modest altitude (1178 m asl),\
    \ Tovel has characteristics similar to a 'high altitude' lake because its waters\
    \ are particularly cold and transparent. The lake is oligotrophic (PT <10 µg/L)\
    \ with a high biodiversity of plankton, especially of flagellates (Hansen & Flaim\
    \ 2007J Limnol 66:107-141)and rotifers (Obertegger et al. 2008 J Plank Res 30:633–643).\
    \ Cold-water dinoflagellates from the lake have been studied for their life cycles\
    \ (Flaim et al. 2009 Hydrobiologia 639:85–98), lipid profiles (Flaim et al. 2012\
    \ Hydrobiologia 698: 285-293) and their response to stressors such as UVR (Obertegger\
    \ et al. 2011 J. Phycol. 47:811–820). Furthermore, marked water level fluctuations\
    \ due to the input of snowmelt water are influential in structuring the plankton\
    \ community (Obertegger et al. 2007. Aquat. Sci. 69:575 – 583). Lake Tovel is\
    \ an ideal ‘natural laboratory’ where we study the biotic and abiotic parameters\
    \ tied to climate change and verify ecological theories."
