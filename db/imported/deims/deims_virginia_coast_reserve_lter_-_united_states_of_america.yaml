  description: Research activities of the VCR/LTER focus on the mosaic of transitions
    and steady-state systems that comprise the barrier-island/lagoon/mainland landscape
    of the Eastern Shore of Virginia. Primary study sites are located on Hog Island,
    Parramore Island and mainland marshes near Nassawadox VA. The VCR/LTER uses field
    laboratory and housing facilities at the Anheuser-Busch Coastal Research Center
    in Oyster, VA.
