  description: The site is located in the Southern Carpathians (Romania). The predominant
    ecosystems are grasslands located above tree line, dominated by Carex curvula,
    Juncus trifidus (alpine zone) and Festuca airoides, Nardus stricta, Festuca nigrescens
    (subalpine zone). The site consists of monitoring points in subalpine and alpine
    meadows.
