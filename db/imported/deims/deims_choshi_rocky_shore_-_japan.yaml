    elevation_meters: 0.0
  description: Choshi JaLTER site locate along the Pacific coast of Chiba Prefecture,
    Central Honshu. The coastal site consists of various types of habitats, including
    algal and seagrass beds, rocky intertidal and subtidal bottoms, boulder shore
    and high energy sandy beach. This site locates the region where the warm Kuroshio
    and the cold Oyashio meet, and is characterized by the co-occurrence of warm-water
    and cold-water derived marine organisms.
