  description: Senda Darwin Biological Station is located along Route 5 south, at
    a distance of 14 kilometers from the city of Ancud, in the north of Chiloe Island.
    It aims to facilitate scientific research, environmental education and the application
    of knowledge for temperate forests conservation.
