  description: The Lower Tombigbee River (TOMB) is an aquatic field site located in
    the Coastal Floodplains of southwest Alabama in Choctaw County. It is within the
    Tombigbee River Basin and is colocated with the 17 km2 (4218 acre) Choctaw National
    Wildlife Refuge near the small town of Coffeeville, Alabama. The Lower Tombigbee
    River is the section of the river and watershed below where the Black Warrior
    River joins, and is managed by the U.S. Army Corps of Engineers. The Tombigbee
    watershed covers 47,0845 km2 (116 million acres) and spans most of western Alabama.
    TOMB is located in the southern extent of the watershed, 15 km (9 mi.) upriver
    from the Coffeeville lock and dam. TOMB is part of NEON's Ozarks Complex Domain
    (D08). D08 includes two other aquatic field sites and three terrestrial field
    sites. TOMB is colocated with the Lenoir Landing terrestrial site (LENO).
