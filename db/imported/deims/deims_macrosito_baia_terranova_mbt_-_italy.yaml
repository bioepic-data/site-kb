  description: "The coastal marine environment of Terra Nova Bay is one of the few\
    \ temporary ice free areas in the Ross Sea and has peculiar\r\necological characteristics,\
    \ showing a higher productivity and abundance in zooplankton compared to other\
    \ areas of the Victoria Land coast, and hosting a benthic community characterized\
    \ by a remarcable species richness. Since 2003, part of this coastalmarine environment\
    \ is protected by the Terra Nova Bay ASPA(n.161).\r\nDuring the Mario Zucchelli\
    \ Station opening period, the Project will follow the evolution of the principal\
    \ environmental features and of the pelagic and sympagic communities in stations,\
    \ localized inside and outside the ASPA area (Faraglione, Portofino, Santa Maria\
    \ Novella). The structure of the benthic community will be studied as in the past\
    \ in front of Road Cove, in Adelie Cove and Tethys Bay.\r\nThe ecological parameters\
    \ (Science Plan EASIZ ) taken into account will be as follows:\r\nIce measurements:\
    \ type of ice, thickness, coverage (with other PNRA projects).\r\nWater column\
    \ measurements: temperature, salinity, fluorescence, nutrients, chlorophyll and\
    \ pigment spectra, particulate and dissolved matter,bacterioplankton,phytoplankton\
    \ (composition),microzooplankton (composition), zooplankton (composition)\r\n\
    Sediments: textural characteristics, biochemical composition of the organic matter\r\
    \nBenthic and nekton communities: Structure and short- and long-term variations\
    \ of key species\r\nThe main atmospheric parameters will be analysed to understand\
    \ the land-sea interactions (in collaboration with other projects).\r\nGIS, cartography\
    \ and amplification of the website will be developed within the present competences\
    \ in the MNA"
