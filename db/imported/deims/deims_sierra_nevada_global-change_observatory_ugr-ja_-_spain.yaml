  description: "Mountain site, alpine forests\r\n\r\nSierra Nevada (Andalusia, SE\
    \ Spain), is a mountainous region with an altitudinal range between 860 m and\
    \ 3482 m a.s.l. covering more than 2000 km2. The climate is Mediterranean, characterized\
    \ by cold winters and hot summers, with pronounced summer drought (July-August).\
    \ The annual average temperature decreases in altitude from 12-16ºC below 1500\
    \ m to 0ºC above 3000 m a.s.l., and the annual average precipitation is about\
    \ 600 mm. Additionally, the complex orography of the mountains causes strong climatic\
    \ contrasts between the sunny, dry south-facing slopes and the shaded, wetter\
    \ north-facing slopes. Annual precipitation ranges from less than 250 mm in the\
    \ lowest parts of the mountain range to more than 700 mm in the summit areas.\
    \ Winter precipitation is mainly in the form of snow above 2000 m of altitude.\
    \ The Sierra Nevada mountain range hosts a high number of endemic plant species\
    \ (c. 80; Lorite et al. 2007) for a total of 2,100 species of vascular plants\
    \ (25% and 20% of Spanish and European flora, respectively), being considered\
    \ one of the most important biodiversity hotspots in the Mediterranean region.\
    \  \r\nThis mountain range has several legal protections:  Biosphere Reserve MAB\
    \ Committee UNESCO; Special Protection Area and Site of Community Importance (Natura\
    \ 2000 network); and National Park. The area includes 61 municipalities with more\
    \ than 90,000 inhabitants. The main economic activities are agriculture, tourism,\
    \ cattle raising, beekeeping, mining, and skiing."
