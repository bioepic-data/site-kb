  description: UK ECN site.  Bradgate Brook (a small stream) is located in the Charnwood
    Forest area of Leicestershire important for its precambrian rocks (granite). The
    stream flows through the ancient parkland of Bradgate Park and into Cropston Reservoir.
    The park is managed as a deer park, has never been agriculturally "improved" and
    is designated an SSSI. However it was bequeathed to the people of Leicester for
    their enjoyment and pressures on the site relate to public access. There are no
    discharges to or abstractions from the brook which supports an invertebrate community
    of regional importance, including a population of native crayfish.
