  description: "Mitchell Grass Rangeland SuperSite is situated near Longreach in western\
    \ Queensland in the Mitchell Grass Downs IBRA bioregion, that covers approximately\
    \ 47 M ha (14% of Queensland and 6% of Australia). The mean annual precipitation\
    \ is 444 mm. The nearest Bureau of Meteorology station (Longreach Aero 036031)\
    \ is approximately 10 km away. The black vertosol soil supports sheep and beef\
    \ cattle grazing in the area. The SuperSite is located at the Longreach Pastoral\
    \ College (previously the Queensland Department of Primary Industries Rosebank\
    \ Research Station) with a history of CSIRO research sites in the area.\r\n\r\n\
    Traditional owners at this site are the Iningai people."
  status: ACTIVE
