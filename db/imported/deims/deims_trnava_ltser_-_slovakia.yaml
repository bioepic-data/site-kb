  description: LTSER Trnava is located in the south-west Slovakia, in territory of
    one city (Trnava) and 44 rural municipalities with total area of 741.33 km2. Arable
    land dominate (65.13 %), followed by forests (17,78%), built-up area 7.84%, grassland
    (2.15%), gardens (1.83%), water bodies (1,38%), vineyards (0,81%), orchards (0.2%),
    and other plots (2.9%). The main part of the LTSER (central and southern parts)
    is located in the Danubian Lowland. Because of the best, most fertile soils and
    favourable climatic condition, it is intensively used for agriculture, especially
    as arable land. In this part of LTSER is located the largest settlement – Trnava.
    It represents the administrative centre of the county and region with highest
    population, trade and industry. Hilly northwest part of the LTSER, located in
    the Little Carpathians Mts. belongs to the Malé Karpaty Protected Landscape Area.
    This is the only large protected area having vineyard character in Slovakia; vineyards
    forms transition belt between lowland arable land and forested hills/mountains.
    Several types of deciduous forests are developed – oak-hornbeam and beech forests
    are most common, in steeper sites are developed ravine forest dominated by ash
    and maple. The LTSER represents intensively used industrial and agricultural area
    with specific environmental problems (strong degree of contamination of environment,
    the degradation processes of agricultural land, etc.) and low degree of ecological
    stability. Use of the most productive soils for construction of industrial parks
    represents a significant environmental issue.
