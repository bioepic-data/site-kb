  description: CNR Arctic Station “Dirigibile Italia” is the Italian scientific station
    in Svalbard. It is funded and managed by the National Research Council of Italy
    (CNR). Research programmes currently developed at the station deals with microbial
    ecology and evolution; biogeochemistry and energy fluxes; vegetation and permafrost
    studies; oceanography, marine biomarkers; atmosphere, aerosols, gases and clouds;
    remote sensing of the environment; sun-earth relations and space weather; human
    biology and medicine.
  status: ACTIVE
