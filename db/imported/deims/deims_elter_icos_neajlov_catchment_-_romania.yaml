  description: The ICOS Comana ecosystem station, operated by RCSES–University of
    Bucharest within the Neajlov Catchment LTSER site, monitors exchanges of carbon
    dioxide, water and energy between the ecosystem and the atmosphere. Located in
    Comana Natural Park, it supports long-term research on carbon cycling and ecosystem
    responses to climate variability, land use and environmental change.
