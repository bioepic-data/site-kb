  description: "The Belgian part of the North Sea (BPNS) covers the most south-western\
    \ part of the North Sea and is bordered by the English Channel to the south-west\
    \ and by the central part of the North Sea  to the north-east. The BPNS is mainly\
    \ influenced by water from the ‘channel’ and from freshwater inputs from the Yzer\
    \ and Scheldt. \r\nLong term data series are being collected for this site at\
    \ different locations, making use of Thornthon Buoy, Simon Stevin Research vessel\
    \ and an operational Marine Observatory that includes monthly surveys on the BPNS\
    \ and an array of sensor networks."
