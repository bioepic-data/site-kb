  description: "The site comprises a mosaic of fields influenced by springs, seepage\
    \ zones, wet ground, and a small headwater watercourse with downstream connectivity.\
    \ These characteristics make the site suitable for long-term observation of hydrological,\
    \ ecological, and soil processes during land-use transition.\r\nThe site is being\
    \ secured for long-term ecological use (minimum 30 years) and is intended to function\
    \ as an open, non-extractive observation and monitoring site. No fixed experimental\
    \ design has been imposed at this stage, allowing for phased and proportionate\
    \ monitoring aligned with future research or evidence-led initiatives."
