  description: "Cork (Quercus suber) and holm (Quercus ilex L.) oaks were probably\
    \ the dominant oak species in the Iberian Peninsula south of the Cantabrian/ Pyrenean\
    \ mountains since the end of the last glaciation. Despite a large range overlap\
    \ between both species, cork-oak was confined to the mild western regions of the\
    \ Peninsula (thereby encompassing most of the Portuguese territory), occurring\
    \ only in small patches along the coast further east, while holm oak was and still\
    \ is the dominant oak over most of the Centre and East of the Peninsula, subjected\
    \ to a harsher continental climate. Millennia of land clearing driven by human\
    \ population growth and need for agricultural land lead to the almost complete\
    \ elimination of cork oaks from the Centre and North of Portugal (and Galicia),\
    \ where the mountainous relief and relatively high precipitation allowed for the\
    \ establishment of numerous small farms. However, in the dry lowlands south of\
    \ river Tajus, the impossibility of land irrigation and the poor soil quality\
    \ were two of the main drivers that contributed to the establishment of the montado\
    \ agro-sylvo-pastoral system. Today, roughly 90% of Portuguese cork-oak montados\
    \ are found in this region (Alentejo) and represent the largest cork-oak montado\
    \ area in the world. Here, the species basically occurs on two soil types – the\
    \ skeletal schist soils that result from the weathering of the Palaeozoic hercinic\
    \ core of the Peninsula and the alluvial plains of the Tajus and Sado rivers,\
    \ which well drained sandy soils, correspond to an ecological optimum for this\
    \ species. When compared with holm oaks, cork-oaks are relatively fragile, being\
    \ unable to withstand severe droughts and continental climates (inland) or calcareous\
    \ soils (in the Algarve). Therefore, as one proceeds south of the Tajus, the flatlands\
    \ become divided between the coastal cork-oak montados and the inland holm oak\
    \ montados.\r\nIn spite of their physiological differences, holm oak forests were\
    \ also cleared with different extents in different areas and the same pattern\
    \ emerged, with most of the Portuguese holm oak montados occurring nowadays in\
    \ inland Alentejo. These montados are in fact the western limit of the Spanish\
    \ dehesas; their aggregated area constitutes the largest extension of montado\
    \ ecosystem in the world.\r\nData series of Alentejo province concerning the main\
    \ key drivers of change and available to the research team are: Climate (historical\
    \ time series since 1930 and every thirty years onwards, plus climatic models);\
    \ Satellite images (1984, 1990, 1994 and 2004  – several series along the year,\
    \ 2008); Aerial Photographies (1960/70, 1974/80, 1995, 2005); Forestry inventories\
    \ (60’s/70’s, 1995, 2005).\r\nIn each of the three core research and monitoring\
    \ stations encompassing the variety of edapho-climatic conditions to which most\
    \ montados are subjected, and that are proposed in the current proposal (see research\
    \ plan), two study case sites were selected to illustrate contrasting human pressures.\
    \ More relevance was given to cork oak montados, due to the importance of cork\
    \ industry for the national PIB, as well as to the global importance of the Portuguese\
    \ territory for this ecosystem.\r\nTwo main and one secondary contrasts related\
    \ to human pressures will be monitored: i) vulnerability to dryness (also related\
    \ to land use), monitored at Machuqueira do Grou and Companhia das Lezírias (less\
    \ vulnerable) vs Ribeira Abaixo and Sines (more vulnerable); and ii) vulnerability\
    \ to grazing intensification, monitored at Companhia das Lezírias (more vulnerable)\
    \ vs Machuqueira do Grou and Ribeira Abaixo (less vulnerable). The same vulnerability\
    \ to grazing intensification will be monitored at the two holm oak site, where\
    \ the main contrast is the type of grazer: cattle (Coitadinha) vs game species\
    \ (Contenda). Finally, the additional contrast refers to the proximity to pollution\
    \ sources that can be explored by the comparison between Companhia das Lezírias\
    \ and Sines (more exposed) vs. all other study sites (less exposed)."
