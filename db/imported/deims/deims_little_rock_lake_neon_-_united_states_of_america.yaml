  description: Little Rock Lake (LIRO) is a aquatic site in the American Legion State
    Forest in Vilas County in north-central Wisconsin. It is hosted by the Wisconsin
    Department of Natural Resources. LIRO is a 0.16 km2 (40 acre) mesotrophic lake
    with an elevation of 501 m (1640 ft.). The surrounding region is a matrix of hardwood,
    coniferous, and mixed forests and lakes and streams. LIRO is located within NEON's
    Great Lakes Domain (D05), which includes northern Ohio, Michigan, northern Wisconsin,
    and parts of Indiana and Illinois. D05 also includes three terrestrial sites and
    one additional aquatic site.
