  description: UK ECN site. The River Cree has a catchment area of 515.7km2, much
    of which is afforested, and a total river length of 57.5km. It has become one
    of the most acidic catchments in SW Scotland, with pH values as low as 5.0 being
    recorded occasionally. The raises concerns about its ability to meet the EC requirements
    for freshwater fisheries and about the survival of the salmon fishery. There are
    many sewage effluent discharges entering the river along its course, most of which
    have small flow rates; the largest discharge is from Newton Stewart. In the early
    1980's, large stretches of the river were subject to excessive weed growth, believed
    to be due to the aerial application of fertilisers over large tracts of forest.
    The mean pH at Newton Stewart is 6.5, with lower mean pH levels upstream.
