  description: The study site is located in Tolfa-Allumiere, in Central Italy not
    far from the Tyrrhenian coast at an elevation of about 500 m above sea level.
    A Mediterranean evergreen woodland was selected for a large through-fall manipulation
    experiment. The experimental design included three large (1 ha each) un-replicated
    plots (1 Control, 1 Dry, 1 Wet) for eddy-flux measurements, and nine smaller (8x12
    m2) plots (3 Control, 3 Dry, 3 Wet) for replicated ecological studies. These plots
    were equipped with automated soil respiration systems, dendrometers, litterbags
    and others environmental sensors. This facility is suitable for testing short
    and long term effects of precipitation changes in Mediterranean ecosystems.
