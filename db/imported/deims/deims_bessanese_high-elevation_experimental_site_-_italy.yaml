  description: "The Bessanese high-elevation experimental site is located in the Western\
    \ European Alps (Graian Alps, municipality of Balme, Italy). This site is representative\
    \ of the glacial and periglacial environments of the Alps. In this site, glaciers\
    \ have been the main morphogenetic agent: the head of the basin hosts a well-developed\
    \ glacial cirque, while the LIA has left an imposing moraine on the left side\
    \ of the glacier as an indelible mark in the landscape. Additional cryogenic and\
    \ atmospheric processes, running waters and gravity have contributed to shape\
    \ the study area. These latter processes are becoming more and more important,\
    \ compared to glacier shaping, in the present context of climate change, which\
    \ led to an impressive-areal and volume reduction of the glacier. Most of the\
    \ area once occupied by the glacier is now covered with debris which, in many\
    \ cases, is ice-cored, or contains ice lenses. Downstream of the main lake of\
    \ the basin, located at an elevation of about 2580 m, the debris forms a large\
    \ and characteristic rock glacier. Among gravitative processes, rockfalls are\
    \ particularly common and relevant from the hazard point of view in the study\
    \ area.\r\n------------------------------\r\n-----------------------------\r\n\
    Near real-time rock temperatures are available at: https://bessanese.lab3841.it/\r\
    \n------------------------------\r\n-----------------------------\r\nSome publications:\r\
    \n1. Nigrelli G., Paranunzio R., Turconi L., Luino F., Mortara G., Guerini M.,\
    \ Giardino M., Chiarle M. (2024) – First national inventory of high-elevation\
    \ mass movements in the Italian Alps. Computers and Geosciences. https://doi.org/10.1016/j.cageo.2024.105520\r\
    \n2. Nigrelli G., Chiarle M. (2023) – 1991–2020 climate normal in the European\
    \ Alps: focus on high-elevation environments. Journal of Mountain Science, 20(8),\
    \ 2149-2163. https://doi.org/10.1007/s11629-023-7951-7\r\n3. Nigrelli G., Chiarle\
    \ M., Merlone A., Coppa G., Musacchio C. (2022) – Rock temperature variability\
    \ in high-altitude rockfall-prone areas. Journal of Mountain Science, 19(3), 798-811.\
    \ https://doi.org/10.1007/s11629-021-7073-z\r\n4. Viani C., Chiarle M., Paranunzio\
    \ R., Merlone A., Musacchio C., Coppa G., Nigrelli G.  (2020) – An integrated\
    \ approach to investigate climate-driven rockfall occurrence in high alpine slopes:\
    \ the Bessanese glacial basin, Western Italian Alps. Journal of Mountain Science,\
    \ 17, 2591-2610, DOI https://doi.org/10.1007/s11629-020-6216-y\r\n------------------------------\r\
    \n-----------------------------\r\nDataset available on Pangaea repository:\r\n\
    1. Nigrelli, Guido; Chiarle, Marta; Merlone, Andrea; Coppa, Graziano; Musacchio,\
    \ Chiara (2022) – Rock temperature variability in the alpine cryosphere. Pangaea\
    \ Data Publisher for Earth & Environmental Science, https://doi.pangaea.de/10.1594/PANGAEA.950246\
    \ \r\n2. Nigrelli, Guido; Barbero, Secondo; Chiarle, Marta (2021) – Solar radiation\
    \ at the Bessanese high-elevation experimental site (Italy). Pangaea Data Publisher\
    \ for Earth & Environmental Science, https://doi.org/10.1594/PANGAEA.930679 \r\
    \n3. Nigrelli, Guido; Chiarle, Marta; Merlone, Andrea; Coppa, Graziano; Musacchio,\
    \ Chiara (2018) – Rock and debris temperature in the alpine cryosphere. Pangaea\
    \ Data Publisher for Earth & Environmental Science, https://doi.org/10.1594/PANGAEA.894317"
