    longitude: 138.347
    country: Japan
    elevation_meters: 1320.0
  description: 'Sugadaira Montane Research Center, established in 1934, is located
    on the mountain region of 1,300 m alt. in Nagano Prefecture, central Honshu-Island,
    Japan. In the extensive campus of the Center (35 ha), a sere of vegetation succession
    is well preserved, and seral stages of the secondary succession for the last one
    hundred years are sequentially and chronologically arranged: a Miscanthus grass
    field (A) - young pine forest (about 45 year-old) (B) - mature pine forest (about
    60 year-old) (C) - older deciduous broad-leaved forest (about 100 year-old) (D).'
