  description: The Santa Rita Experimental Range (SRER) site is a terrestrial NEON
    field site located on the the Santa Rita Experimental Range and Wildlife Area,
    the oldest continuously utilized long-term agricultural research station in the
    U.S. Located 35 km (21.8 mi.) outside of Tucson, Arizona, the 214.9 km2 (53,101
    acre) data collection site is hosted by the University of Arizona. Data collected
    here help scientists understand the functions of desert ecosystems; deserts are
    uniquely sensitive to human disturbances. SRER is located in NEON's Desert Southwest
    Domain (D14). D14 has one other terrestrial field site and one aquatic field site.
    SRER is not colocated with an aquatic site.
