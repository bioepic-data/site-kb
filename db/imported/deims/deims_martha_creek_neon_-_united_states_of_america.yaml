  description: 'Martha Creek (MART) is an aquatic NEON field site located just north
    of the Columbia River Gorge in Gifford Pinchot National Forest. Martha Creek is
    a third-order wadeable stream that drains a 6.34 km2 (1570 acre) watershed and
    is a tributary of Trout Creek. The land is managed by the U.S. Forest Service.
    The watershed is dominated by old-growth coniferous forest and is designated a
    Tier I Key Watershed in the Northwest Forest Plan due to its importance in supporting
    threatened native fish populations. The 2012 removal of a dam to improve fish
    passage in the creek allows for the study of aquatic habitat restoration. MART
    is located in NEON''s Pacific Northwest Domain (D16), which is bounded by the
    Pacific on the west and Canada on the north. It includes the eastern halves of
    Washington and Oregon and parts of northern California. The Domain hosts three
    other field sites: one additional aquatic and two terrestrial. MART is near the
    WREF terrestrial site.'
