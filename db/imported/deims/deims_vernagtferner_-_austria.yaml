  description: 'The Vernagtferner region has a long tradition of glaciological research
    performed by groups from Munich. It started in 1889, when Prof. Sebastian Finsterwalder
    from the Technical University in Munich produced the first map of a complete glacier
    based on terrestrial photogrammetry. Since then, numerous maps of the glacier
    have been made, describing the change in surface elevation for more than a century.
    These maps form the basis of the geodetic method of glacier mass balance determination,
    which provides volume changes as average data for the period between two surveys,
    i.e. typically for 10 years. Since the start of the glaciological method on Vernagtferner
    in 1964, annual as well as winter and summer mass balance data are available continuously.
    But only since 1973, the construction of the Vernagtbach station, approximately
    1 km below the glacier margin at that time, provided the means to record a larger
    number of hydrological and meteorological parameters with a temporal resolution
    of typically 1 hour. For more information see Braun, L. & Escher-Vetter, H. (2012):
    Gletscherforschung am Vernagtferner. Themenband zum fünfzigjährigen Gründungsjubiläum
    der Kommission für Glaziologie der Bayerischen Akademie der Wissenschaften, München.
    In: Kuhn, M.: Zeitschrift für Gletscherkunde und Glzialgeologie. Band 45/46 (2011/2012).'
