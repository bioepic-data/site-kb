  description: "The Kellogg Biological Station (KBS) is located in southwest Michigan\
    \ in the eastern portion of the U.S. cornbelt, 50 km east of Lake Michigan in\
    \ the SW corner of the state (42° 24′ N, 85° 24′ W, elevation 288 m). Annual rainfall\
    \ at KBS averages 1,005 mm/y with about half falling as snow; potential evapotranspiration\
    \ (PET) exceeds precipitation for about 4 months of the year. Mean annual temperature\
    \ is 10.1 °C. KBS is 1600 ha of cropping systems, successional communities, and\
    \ small lakes. Surrounding KBS is a diverse, rural-to-semirural landscape typical\
    \ of the U.S. Great Lakes and upper Midwest regions. The diversity of land use,\
    \ soil and vegetation types, and aquatic habitats within a 50-km radius of the\
    \ Station is high. Most of southwest Michigan is on the pitted outwash plain of\
    \ the morainic system left by the last retreat of the Wisconsin glaciation, circa\
    \ 12,000 years ago. Soils in the area developed on glacial till, and include well-\
    \ and poorly-drained alfisols, mollisols, and entisols. Most regional soils are\
    \ sandy loam and silty clay loam of moderate fertility, principal Station soils\
    \ are Typic Hapludalfs.\r\n\r\nLand use around KBS ranges from urban (Kalamazoo,\
    \ with a metropolitan population of 180,000, is 20 km south of the Station) to\
    \ rural; vegetation ranges from cultivated and early successional old fields to\
    \ older growth oak-hickory and beech-maple forests; and aquatic habitats include\
    \ more than 200 bodies of water of different morphometries, alkalinities, and\
    \ degrees of eutrophication within 50 km.\r\n\r\nCropping systems in the area\
    \ are typical of the U.S. cornbelt — mainly corn/soybean rotations with wheat\
    \ of varying importance, and alfalfa an important forage crop. KBS yields are\
    \ typical of non-irrigated yields elsewhere in the North Central Region. KBS LTER\
    \ research is carried out in a variety of experimental systems. The most important\
    \ of these is the Main Cropping System Experiment (MCSE), which was started in\
    \ 1989 and consists of 11 different cropping systems or successional plant communities,\
    \ ranging from annual corn-soybean-wheat rotations to late-successional deciduous\
    \ forest. All communities are replicated within the landscape."
