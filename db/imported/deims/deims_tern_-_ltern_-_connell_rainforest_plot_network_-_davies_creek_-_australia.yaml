  description: "The Connell Rainforest Plot Network long-term forest dynamics plot\
    \ of Davies Creek is located in the Dinden National Park circa 25 km southwest\
    \ of Cairns, Northern Queensland.\r\n\r\nTemporal visits occur between 1 to 6\
    \ years.\r\n\r\nBetween 2012 and 2018 the Connell Rainforest Plot Network was\
    \ a member of Long Term Ecological Research Network (LTERN), Australia, a facility\
    \ of the Australian Government's Terrestrial Ecosystem Research Network (TERN)."
