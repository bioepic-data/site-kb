  description: The site is located in a primeval forest in The University of Tokyo
    Chichibu Forest (UTCF), as a field of research and education about forest science
    in the cool-temperate region. UTCF covers at 5,812 ha and occupies elevations
    ranging from 600 m to 1,600 m, which is composed of various types of natural forest
    stands.
