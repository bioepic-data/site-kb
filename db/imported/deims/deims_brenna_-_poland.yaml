  description: "The Brenna monitoring site in the Silesian Beskid (Polish part of\
    \ the West Carpathians) was established in 1991 and consists of a monitoring station\
    \ (meteo parameters and air pollution level) at the elevation of 865 m a.s.l.\
    \ and 7.5 ha and 50 ha catchments at the elevation of 750 m a.s.l under old spruce\
    \ stand being under reconstruction.The main goals of the monitoring programme\
    \ is the investigation of:\r\n● Response of spruce stands to air pollution and\
    \ forest management practice in the mountain area which has been influenced by\
    \ emissions from the industrial complexes of Silesia and the Czech Republic\r\n\
    ● The balance of nutrients in a small mountain catchment.  \r\n● Changes in floral\
    \ characteristics \r\nThese monitoring activities have been continuing and moreover,\
    \ the effect of forest management (falling, skidding) on soil (erosion) is monitored.\r\
    \nIn 2016 the Particulate analyzers (PM10/PM2.5) (The Model 5030 Synchronized\
    \ Hybrid Ambient Real-time Particulate SHARP Monitor) were installed at the station\
    \ to measure the inflow of pollutants from industrial regions.Equipment for meteorological\
    \ measurements is as follows:\r\nBarometr LB-716, Thermohigrometer LB-710R, Wind\
    \ Speed Meter LB-746, Pyranometer PQS1, Thermometer LB-711 (air and soil), Pluviometer\
    \ RG50A. \r\nAdditionally, continuous measurements of ozone have been carried\
    \ out since the nineties (Monitor Thermo Scientific)."
