  description: "The Nunavut Research Institute is situated in the arctic zone with\
    \ vegetation consisting of mosses, lichens, small shrubs, grasses, and low flowering\
    \ plants. The sub-soil remains frozen throughout the year. Temperatures average\
    \ below freezing eight months of the year. The terrain around Iqaluit is hilly\
    \ with influence of marine and glacial deposits. Tidal range in Iqaluit is up\
    \ to 12 m with a mean tidal range of 9 m. Caribou, polar bear, fox, wolves, and\
    \ hares can be found in the vicinity of the town. Ring, harp, and bearded seal\
    \ are found in Frobisher Bay, and beluga whales and walrus are common in the region\
    \ as well. Eider ducks and Canada geese appear during the warmer months, and wheatears,\
    \ snow buntings, and rock ptarmigan are present in spring and summer. Arctic char\
    \ are abundant in the rivers and coastal lakes. Landlocked cod can be found in\
    \ some lakes off Frobisher Bay.\r\n\r\nNunavut Research Institute accommodates\
    \ more than 100 research projects each year within the fields of natural, social,\
    \ and health sciences. Descriptions of research projects licensed by the institute\
    \ are available on the website at www.nri.ca. Nunavut Research Institute shares\
    \ a research library with several other organisations that carry out research\
    \ in Nunavut. The library can be accessed at www.nwmb-lib.com. Research is carried\
    \ out by Canadian and international universities with an interest in the Arctic."
  status: ACTIVE
