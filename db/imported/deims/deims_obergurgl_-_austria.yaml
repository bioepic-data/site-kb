  description: "Obergurgl lies about 1930 m a.s.l., very much at the head of the Ötz-valley\
    \ (municipality of Sölden) in the central Alps. The research areas of the LTER\
    \ site Obergurgl are located at the slopes, glacier valleys and glaciers south\
    \ and south-west of Obergurgl. A variety of logger stations (mostly wheather stations)\
    \ are installed at different locations at the site, some of them measuring since\
    \ 1953. Various research project, most of them performed by researchers of the\
    \ University of Innsbruck, are carried out in this area.\r\nHabitat types are\
    \ alpine grassland, alpine forests, pasture and dwarf shrub heath, glacier forelands\
    \ and glaciers.\r\nThe LTER site Obergurgl is managed by the Alpine Research Centre\
    \ Obergurgl (http://www.uibk.ac.at/afo/), a branch office of the University of\
    \ Innsbruck (http://www.uibk.ac.at/). The Alpine Research Centre Obergurgl is\
    \ located at the edge of the village Obergurgl. It is consolidated with the University\
    \ Centre Obergurgl (http://www.uz-obergurgl.at/), a congress centre and hotel\
    \ with up to 100 beds. Indoor infrastructure are a lecture hall, a seminar room,\
    \ a small laboratory and small libraries."
