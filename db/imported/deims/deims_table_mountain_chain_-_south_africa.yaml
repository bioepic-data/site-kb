  description: The Table Mountain Chain comprises a network of public and private
    land within the Cape Peninsula. The land area is approximately 340 km2 and the
    marine component is approximately 980 km2.  The coastline is approximately 130
    km. The land area is surrounded by the intensive agriculture and urban development
    of the City of Cape Town.  Because of the proximity of the city the area has a
    long history of research carried out by universities, research institutions and
    nature conservation agencies.
