  description: "The Tumbarumba Wet Eucalypt SuperSite is a member of the Australian\
    \ SuperSite Network (SuperSites, http://www.supersites.net.au/), a facility within\
    \ the Australian Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/).\
    \ The Tumbarumba Wet Eucalypt SuperSite is located in the Bago State Forest in\
    \ New South Wales on the western edge of the Snowy Mountains. \r\n\r\nKey research\
    \ objectives include: \r\n•\t How does airflow, terrain and forest structure affect\
    \ the way the ecosystem takes up and releases carbon and uses water?\r\n•\tHow\
    \ can measures of carbon pools, stocks and turnover rates, atmospheric fluxes,\
    \ be used to improve the surface–vegetation–atmospheric–transfer (SVAT) models?\r\
    \n•\t What effects does vegetation have on the lower atmosphere, including the\
    \ exchange of heat and the production of particles and chemical species that contribute\
    \ to the formation of aerosols?\r\n\r\nWe acknowledge and honour all traditional\
    \ owners past and present of this area, including the Wiradjuri and Ngarigo people,\
    \ who lived and continue to live on this land."
