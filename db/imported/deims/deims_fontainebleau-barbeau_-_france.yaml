  description: The Fontainebleau-Barbeau station, with ICOS code FR-Fon, is located
    about 50 km South-East of Paris (France), within the Atlantic Biogeographical
    Region and it is a deciduous oak forest. The climate is temperate oceanic, well
    representative of a large North-Western part of Europe. The forest is dominated
    by Quercus petraea (Matt.) Liebl. and Quercus robur L., with a hornbeam coppice
    understory established on a gleyic luvisol.
