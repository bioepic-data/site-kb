  description: "In this project we will examine environmental and societal aspects\
    \ of forest ungulate browsing in boreal ecosystems within an ecosystem services\
    \  framework to underpin an ecosystem approach to sustain forest resources. Replicated\
    \ exclosure/browsed paired plots of 20x20 m are in place in recently clear-cut\
    \ forest where moose is the dominant forest ungulate: In Trøndelag 15 sites are\
    \ monitored since 2008.\r\n\r\nWe investigate the impact of browsing forest ungulates\
    \ on: (1) Forest development (tree growth, species composition, browsing pressure\
    \ and tree density), to collect primary data relating to timber provisioning,\
    \ forest ungulate production (forage availability) and ecosystem functioning.\
    \ Methods: The density of trees of different species and height classes is recorded\
    \ in four subplots in each exclosure/browsed plot. Individual trees are also marked\
    \ and height and browsing pressure are recorded annually, producing a time series\
    \ of forest development; (2) Field layer vegetation dynamics (species diversity\
    \ and primary productivity, berry production) – focusing on the provisioning services\
    \ of berries and wildlife forage. Methods: Field layer is recorded biennially\
    \ in 10 quadrats per exclosure/browsed plot using the point intercept method"
