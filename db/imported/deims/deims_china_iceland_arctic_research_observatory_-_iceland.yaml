  description: "China Iceland Arctic Research Observatory – CIAO. Land and buildings\
    \ owned by Aurora Observatory, AO, an Icelandic non-profit foundation. Operated\
    \ under a long term lease agreement with AO by the Polar Research Institute of\
    \ China – PRIC.\r\n\r\nThe CIAO Observatory is located at Karholl, about 1,5 km\
    \ south of the small community of Laugar, approx. 60 km east of Akureyri in Northern\
    \ Iceland at 65° 42.431'N, 17° 22.017'W. The land of the Observatory is 156 hectares.\
    \ It was previously a privately owned farm, designated partially as agricultural\
    \ land and partially as forestry area under a contract with the Forest Service.\
    \ The location is in the valley of Reykjadalur, with glacier carved soft hillsides\
    \ on the west and east side, open view to the ocean 32 km to the north and the\
    \ Icelandic interior highlands to the south. The nature reserve of Lake Mývatn\
    \ with its renowned natural features and the Vatnajökull national park are within\
    \ close driving distance.\r\n\r\nCIAO is a state of the art facility with latest\
    \ research equipment related to aurora and upper atmosphere research already in\
    \ place in carefully specially designed facilities currently including six all-sky\
    \ camera towers and a lazer/lidar. More equipment and for further research fields\
    \ is to be installed. The Observatory is also intented as a work hub for research\
    \ conducted in its greater area. CIAO offers excellent working conditions for\
    \ its users with spacious work spaces, laboratory facilities from high-tech dry\
    \ labs to wet labs, latest servers and computer systems, communication equipment,\
    \ fibre internet connection, special current stabilized electrical installation,\
    \ high voltage wiring, and more, in a design-award environment. Station manager,\
    \ technical and science support staff and administrative support staff is available\
    \ for users benefit."
  status: ACTIVE
