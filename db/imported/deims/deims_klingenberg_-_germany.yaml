  description: The cropland site Klingenberg (50.89306?N, 13.52238?E; 478 m a.s.l.)
    is located in the mountain foreland of the Erzgebirge. EC measurements began in
    2004. The ecosystem is an intensively managed farmland (5-year crop rotation including
    rapeseed, winter wheat, forage maize, spring barley and winter barley as well
    as occasional catch crop). The site is located in the suboceanic/subcontinental
    climate. The main wind direction is WSW. The EC measurement setup has been established
    in May 2004 (reference height 3.5 m a.g.). It consists of ultrasonic anemometers
    GILL R3-50 (Gill Instruments, Lymington, UK) or Young 81000V (R. M. Young Company,
    Traverse City, MI, USA) and a closed-path gas analyzer LI-7000 (LiCor Inc., Lincoln,
    NE, USA), respectively, accompanied by measurements of radiation components, air
    temperature and humidity, precipitation, soil temperature and moisture as well
    as soil and biomass observations. Management information (harvest, fertilization,
    crop protection, seeding, scarification) of the Colmnitzer Agrargenossenschaft
    are available. Near the cropland is an adjacent village (530 m W) and a reservoir
    (around 1500 m E). According to footprint investigations there are no fetch restrictions.
    The site represents the specified target land cover type very well. The area is
    flat in a radius of at least 800 m around the EC mast except the medium sloped
    Western direction.
  status: ACTIVE
