  description: Aquitain's karsts observatory (Aquitaine, France) regroups different
    karst sites located on the edge of the Aquitain sedimentary basin. These karst
    watersheds range from 0.01 km² (Lascaux cave) and 1 km² (Cussac cave) up to 100
    km² (Toulon springs) and the land use consists of forests and agriculture under
    modified oceanic climate. This observatory consists of various observation and
    experimentation sites like patrimonial caves and large karstic hydrosystem outlets.
