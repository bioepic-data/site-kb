  description: The Fengqiu Experimental Station for Agro-ecology Chinese Academy of
    Sciences is located in the Pandian countryside, Fengqiu county, Henan Province,
    China (114°24′E, 35°00′N), with flat terrain and an average altitude of 67.5 m
    above sea level. This region has a typical monsoon climate with an average annual
    temperature of 13.9 °C and average annual precipitation of approximately 615 mm.
    The soil is derived from the alluvial sediments of the Yellow River and is classified
    as an aquic inceptisol (a calcareous, fluvo-aquic sandy loam (Soil Survey Staff,
    2010)), with a sandy loam texture at the plough layer (0-20 cm). The experimental
    station is located in a region typical of the North China Plain, with the prevailing
    cropping system of wheat-corn rotation. The Station has 9.41 hectares of experimental
    fields, equipped with 1300 square meters of laboratories, 1500 square meters of
    living rooms, complete experimental equipments and living facilities, and two
    investigative cars. The Fengqiu Station is one of the main experimental field
    base, deployed by the country and Chinese Academy of Sciences in the Huang-Huai-Hai
    Plain and devoted to the agriculture, resource, ecology and environment research.
