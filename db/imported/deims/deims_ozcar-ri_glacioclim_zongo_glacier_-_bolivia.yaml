  description: Zongo Glacier is located in the Huayna Potosi region (Cordillera Real,
    Bolivia) 30 km north of La Paz city, between the dry Altiplano plateau in the
    west and the wet Amazonian basin in the east, under outer tropics meteorological
    conditions (strong seasonality in precipitation, low seasonality in temperature).
