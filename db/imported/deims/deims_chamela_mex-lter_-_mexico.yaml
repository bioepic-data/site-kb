  description: Reserva de la Biósfera Chamela-Cuixmala dominada por bosque tropical
    seco en la Costa del Pacífico Mexicano en el estado de Jalisco. El relieve predominante
    en Chamela consiste de lomeríos bajos y con fuerte pendiente sobre rocas volcánicas
    del Terciario en las que predominan la riolita, el granito y la granodiorita.
    Los suelos de Chamela son  relativamente jóvenes y someros e identificados como
    Entisoles. La geología y topografía de la región de Chamela pertenece a la provincia
    fisiográfica de la Sierra Madre del Sur.
