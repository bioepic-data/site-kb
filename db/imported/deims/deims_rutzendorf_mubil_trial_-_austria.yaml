  description: "The Rutzendorf Experimental Station is an agricultural research site\
    \ of the University of Natural Resources and Live Sciences Vienna (BOKU), belonging\
    \ to the Landwirtschaftliche Versuchswirtschaften GmbH. It is representative for\
    \ the productive soils managed as arable land in the Marchfeld area (Lower Austria).\
    \ The soil is described as a silty loamy Calcaric Phaeozem (WRB), a Chernozem\
    \ according to Austrian soil classification. Management on the farm is without\
    \ livestock, no organic fertilizers are applied. The farm was converted to organic\
    \ farming in the production year 2002/03. The 8-year crop rotation comprises luzerne\
    \ (2 yrs), winter wheat*, grain maize, spring barley*, field peas*, winter wheat,\
    \ winter rye. Cover crop mixtures are grown where indicated in the crop rotation\
    \ with an asteric. \r\n\r\nCurrent research questions include to study (i) the\
    \ long-term sustainability and productivity of the stockless organic arable system\
    \ compared to a livestock-keeping system, (ii) the mitigation of climate change\
    \ effects on the soil-plant system by reducing soil cultivation intensity, and\
    \ (iii) the development of biodiversity following the conversion to organic farming\
    \ and enhancement of landscape elements. Regularly meteorological data, crop yields\
    \ and quality, physical, chemical and biological soil traits, weed species and\
    \ diaspores, springtails, wild bees and other animal species are assessed. Studies\
    \ have been conducted as research projects financed nationally and by the European\
    \ Union, e.g. in two EIP projects."
