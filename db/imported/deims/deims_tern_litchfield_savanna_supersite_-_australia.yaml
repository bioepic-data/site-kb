  description: "The Litchfield Savanna SuperSite is a member of the Australian SuperSite\
    \ Network (SuperSites, http://www.supersites.net.au/), a facility within the Australian\
    \ Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/). The Litchfield\
    \ Savanna SuperSite represents high rainfall, frequently burnt, tropical savanna.\
    \ At 1.9 million km2, tropical savanna is the dominant ecosystem type across northern\
    \ Australia. Understanding biogeochemical cycles, impacts of fire on sequestration,\
    \ vegetation and fauna is a national priority.\r\n\r\nThe site is a 5 km x 5 km\
    \ block of relatively uniform open-forest savanna inside the park, and about 80\
    \ km south of Darwin. The infrastructure will help scientists understand the dynamics\
    \ of vegetation structure and floristics by linking field observations with infrastructure\
    \ measuring fluxes of carbon, water and energy. The fluxes will be linked to remotely\
    \ sensed observations of vegetation cover and leaf area taken from the ground,\
    \ aircraft and space.\r\n\r\nKey research objectives include: \r\n•\tWhat are\
    \ the impacts of prevailing fire regimes (primarily frequency, but also intensity,\
    \ extent, heterogeneity) on vegetation structure and composition, habitat quality,\
    \ fragmentation and vertebrate faunal biodiversity?\r\n•\tHow does vegetation\
    \ structure, climate drivers and fire regime influence savanna carbon sequestration\
    \ rate?\r\n•\tHow can fire management contribute to greenhouse gas abatement and\
    \ carbon sequestration in savanna ecosystems?\r\n•\tWhat are the impacts of climate\
    \ change on fire regimes and subsequent feedbacks to savanna carbon and water\
    \ cycles?\r\n\r\nLitchfield National Park encompasses the traditional boundaries\
    \ of 4 Aboriginal language groups: Werat, Koongurrukun, Waray and Mak Mak Marranunggu"
