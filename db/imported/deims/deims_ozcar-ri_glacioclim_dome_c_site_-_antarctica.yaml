  description: "Concordia is a joint French-Italian research facility opened in 2005\
    \ on the Antarctic Plateau, Antarctica (-75.1, 123.33), managed together by PNRA\
    \ (Italian National Antarctic Programme) and IPEV (Institut Polaire Francais Paul\
    \ Emile Victor).\r\nIt is built at 3,233 m above sea level on the third highest\
    \ summit of Antarctica: Dome C."
