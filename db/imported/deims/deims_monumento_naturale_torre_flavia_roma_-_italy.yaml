sites:
- id: site_kb:deims-monumento_naturale_torre_flavia_roma_-_italy
  name: Monumento Naturale Torre Flavia (Roma) - Italy
  network_registrations:
  - network: DEIMS
    network_id: e618c7ca-2b92-46cb-9156-d87336c5a81f
    network_url: https://deims.org/e618c7ca-2b92-46cb-9156-d87336c5a81f
    name: Monumento Naturale Torre Flavia (Roma) - Italy
  location:
    latitude: 41.962278
    longitude: 12.046354
    country: Italy
    elevation_meters: 2.0
  description: The site, located along the Tyrrhenian coast, north of Rome city, is
    a Special Protection Area (SPA) for migratory and nesting birds (Anatidae, Ardeidae).
    The wetland area is one of the last stretches of the Lazio wetlands which have
    been progressively reclaimed and cultivated during the last century. The flora
    and the fauna of the site is not only highly specialized but also highly endangered,
    with a relevant ecological value evidenced in previous studies. The site includes
    coastal dune habitats of European interest, as the annual vegetation of drift
    lines, the embryonic shifting dunes, the mobile dunes with Ammophila arenaria
    and the dune grasslands. There are also habitats related to wet and mud soils,
    as Mediterranean salt meadows and reed beds dominated by Phragmites australis.
