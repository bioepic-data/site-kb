  description: La Reserva de la Biosfera de Manantlan es un área protegida ubicada
    en los límites de los estados de Jalisco y Colima cuya importancia para la conservación
    radica en su diversidad de ecosistemas y especies, y en el papel que desempeñan
    sus bosques en la protección de cabeceras de cuencas que abastecen de agua a la
    región. En la RBSM se presenta la transición de las selvas bajas y medianas de
    las partes bajas a bosques de encino, mesófilo de montaña, pino y oyamel de las
    zonas altas. La variación en el sustrato geológico, la geomorfología y los suelos,
    y una larga historia de influencia humana a través de la agricultura, la ganadería,
    las actividades forestales y el uso del fuego, han contribuido a la heterogeneidad
    del paisaje.
