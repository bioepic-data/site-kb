  description: Lower Teakettle (TEAK) is a terrestrial NEON field site located in
    the Sierra National Forest, 80 km (50 mi.) east of Fresno, CA, near Courtright
    and Wishon Reservoirs. NEON samples 51.4 km2 (12,700 acres) at the site, which
    is managed by the U.S. Forest Service and partially encompasses the Pacific Southwest
    Research Station’s Teakettle Experimental Forest. It is a mixed conifer forest,
    ranging in elevation from 1900 - 2807 m (6230 - 9210 ft.). The varied terrain
    is typical of the Sierra Nevadas, with rugged mountains, meadows and prominent
    granite outcrops. TEAK is part of the Pacific Southwest Domain (D17), which is
    bounded by the Pacific Ocean on the west and the Sierra Nevada Mountains on the
    east, and encompasses most of California. There are four other NEON field sites
    in D17, including two additional terrestrial sites and two aquatic sites. TEAK
    is colocated with the aquatic site Teakettle 2 Creek (TECR).
