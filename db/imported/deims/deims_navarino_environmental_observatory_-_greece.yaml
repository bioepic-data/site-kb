  description: "The Navarino Environmental Observatory (NEO) is a pioneer in Greece\
    \ as an international partnership, between the academic community and the private\
    \ sector in the field of research and education on climate change and the environment\
    \ in the Mediterranean region. (www.navarinoneo.gr). NEO started its full operation\
    \ in 2010 as a collaboration between Stockholm University, the Biomedical Research\
    \ Foundation of the Academy of Athens (BRFAA) and TEMES S.A..\r\nThe unique climate\
    \ and landscape of the Messinia region makes it an ideal location for research\
    \ on climate and environmental change. NEO has already become an international\
    \ hub for frontline research and education, where scientists from all over the\
    \ world meet to exchange knowledge and ideas."
