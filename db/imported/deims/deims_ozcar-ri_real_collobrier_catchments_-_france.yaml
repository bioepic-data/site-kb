  description: "The  Watershed  Research  and  Experimentation  of  Real  Collobrier\
    \  is  a  privileged  site  for  the \r\nobservation and the study of the water\
    \ cycle in the Mediterranean forest. It is a landmark site of the \r\nhydro  regional\
    \  climatology  where  many  cognitive  approaches  have  been  carried  out.\
    \  Observation \r\nnetwork  allows  the  study  of  phenomena with a  particularly\
    \  fine  scale,  which  makes  it  an  ideal \r\nlaboratory  for  the  development\
    \  of  methodologies  directly  applicable  in  operation\r\nal  hydrology.  \r\
    \nThe watershed is instrumented since 1966. It has long chronic hydro-climatic\
    \ data for fifty years, with 15 rain gauges and 7 flow gauges. Climatology and\
    \ physico-chemical measurements are also carried out continuously.\r\nThe multidisciplinary\
    \  approach, associated  with  specific  experiments,  allows  a  deepening  of\
    \  our understanding of the interaction soil-water-atmosphere."
