  description: Dynamics of alpine tree line has been reported from several mountain
    ranges in Europe, in North America, New Zealand as well as in the Alps (Grabherr
    et al. 1994). This led to the formation of the GLORIA (Global Observation Research
    Initiative in Alpine Environments) project, dedicated to initiate a global indicator
    network towards research on the effects of climate change through an international
    co-operation. Indian part of Himalaya was not having any site towards this mission
    till 2013. Therefore, based on some Indian studies which also indicated this trend
    in more pronounced manner, the need of having Indian network was felt. It was
    in this context as a part of network project across the Indian Himalayan states
    under the banner of HIMADRI (Himalayan Alpine Dynamics Research Initiative) a
    long-term monitoring site was established in Kashmir Himalaya at Gulmarg, a famous
    hill resort. This particular work plan (TeaComposition initiative) is conducted
    at this selected HIMADRI site. Gulmarg lies on the north east side of the Pir
    Panjal Range and is about 60 kms west of Srinagar city. It encompasses the upper
    catchment area of Ferozpur Nullah and the forests that surround the Gulmarg meadow.
    The vegetation in Gulmarg mainly comprises of coniferous temperate mountain forests
    of Blue Pine (Pinus Wallichiana), sub-alpine forests of Silver Fir (Abies pindrow)
    and Himalayan Birch (Betula utilis), followed by alpine scrub and meadows.
