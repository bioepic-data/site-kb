  description: The Black Warrior River site (BLWA) is an aquatic site on the Black
    Warrior River in west-central Alabama. The site sits in the lower extent of the
    river’s 16,160 km2 (nearly 4 million acre) watershed, 11 km upriver from its confluence
    with the Tombigbee River. As a navigable river, it is managed by the U.S. Army
    Corps of Engineers; the property used to access BLWA is privately owned. The site
    is forested, and the topography is flat with shallow depressions. The river is
    impacted by a series of locks and dams, coal-fired steam power plants, and urban
    and agricultural use. BLWA is part of NEON's Ozarks Complex Domain (D08). D08
    includes 2 other aquatic field sites and 3 terrestrial field sites. BLWA is colocated
    with the terrestrial site at Dead Lake (DELA).
