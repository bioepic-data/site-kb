  description: The station Nivolet (ICOS code IT-Niv) is an unmanaged subalpine grassland
    located in the Gran Paradiso National Park (GPNP, north-western Italy), a highly-protected,
    closed hydrological basin part of the European LTER network. The site is covered
    with Alpine pasture, with typical high-altitude species among the dominant species.
    The vegetation undergoes a fast phenological change during the summer months from
    mid-late June to October. At 2750 meters above sea level it is covered by snow
    about 200 days per year.
  status: ACTIVE
