  description: "Reynold’s Creek Experimental Watershed, ID\r\n\r\nThe D-DIRT experiment\
    \ in Idaho was established in 2013,and is situated at the Reynold’s Creek Experimental\
    \ Watershed (RCEW), which is also the site of the Reynold’s Creek Critical Zone\
    \ Observatory (CZO) (http://criticalzone.org/reynolds/research/). The RCEW is\
    \ located in the Owyhee Range in southwest Idaho, and situated along a 1000 m\
    \ elevation range, it encompasses a wide range of environments typical of the\
    \ intermountain region of the western USA. Precipitation in the RCEW generally\
    \ increases with elevation from less than 250 mm/y to greater than 1100 mm/y,\
    \ while mean annual temperature decreases by about 5°C, from 10.2°C to 5.6°C.\
    \ Rain is the dominant form of precipitation in the RCEW, with snow dominating\
    \ in the highest elevations. Corresponding vegetation types include sagebrush\
    \ steppe in the lower elevations, transitioning to mountain sagebrush, western\
    \ juniper, aspen and coniferous forest. An extensive description of the RCEW environment\
    \ can be found in Seyfried et al., (2001).\r\n\r\nThe RCEW-DIRT site is one of\
    \ the sites in the D-DIRT network (Dryland Detrital Inputs and Removal Treatments),\
    \ and is located at the lowest elevation (1184m) at RCEW (43°15’ N,116°46’ W).\
    \ Mean annual temperature at the site is 10.2°C, and mean annual precipitation\
    \ is 236mm. The vegetation consists of a patchy mosaic of shrubs and grasses.\
    \ The main shrub is big sagebrush (Artemisia tridentata), and common herbaceous\
    \ species at the site are P. secunda, P. spicata, and B. tectorum."
