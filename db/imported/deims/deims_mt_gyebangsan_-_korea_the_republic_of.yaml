  description: Mt. Gyebangsan Forest (37° 44" 19' N, 128° 27" 11' E) is located in
    the border between Hongcheon and Pyeongchang in Gangwon-do, and belongs to a typical
    temperate northern cool temperature forest with lower average annual temperatures
    than the other regions. The long-term (1981-2010) annual mean temperature and
    precipitation were 10.3 °C and 1405.4 mm. The main dominant species were Quercus
    mongolica, Acer pseudosieboldianum, Tilia amurensis, Betula schmidtii, Pinus densiflora,
    and Kalopanax septemlobus.
