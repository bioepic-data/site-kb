  description: Scientific programs emphasize on research in glaciology, hydrology,
    glacial geomorphology, permafrost and periglacial processes, as well as climatologic
    and botanical studies. Since 1996 glaciological research and the studies of permafrost
    of various ground types and their seasonal thawing, as well as meteorological
    observations are the major issues on the research agenda. The results of glaciological,
    meteorological and permafrost studies to date have made it possible to obtain
    some of the longest data series available for Svalbard today. Monitoring of contemporary
    changes in the cryosphere and standard meteorological observations are being conducted,
    including using automatic weather stations operating all year round. Investigations
    conducted at the station are covering the monitoring of the natural environment
    in its abiotic and biotic parts.
  status: ACTIVE
