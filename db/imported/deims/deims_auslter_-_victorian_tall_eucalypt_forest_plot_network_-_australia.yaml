  description: "The Victorian Tall Eucalypt Forest Plot Network is located in the\
    \ Central Highlands of Victoria, Australia and its research infrastructure is\
    \ comprised of stratified 1-ha long-term plots within 3-ha monitoring sites. \r\
    \n\r\nBetween 2012 and 2018 the Victorian Tall Eucalypt Forest Plot Network was\
    \ a member of the Long Term Ecological Research Network (LTERN), Australia, a\
    \ facility of the Australian Government's Terrestrial Ecosystem Research Network\
    \ (TERN)."
