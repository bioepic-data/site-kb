  description: "GLORIA Target region\r\n\r\nThe site lies in the alpine zone of Hochschwab\
    \ in the NE-Alps. It is defined as a standard Target region of the GLORIA network\
    \ (www.gloria.ac.at). Hochschwab_GLORIA was the networks first test site for standardised\
    \ monitoring of alpine summit vegetation established in 1998. Regular monitoring\
    \ started in 2001 as part of the EU-FP-5 project GLORIA-Europe. All permanenent\
    \ plots were resurveyed in 2008 and in 2015. The site consists of 4 separate summit\
    \ sites arranged along the elevation gradient between 1910 and 2255m. The main\
    \ scientific purpose is to detect impacts of climate change on alpine vegetation\
    \ and its biodiversity. \r\nIn addition, downslope transects to the treeline ecotone\
    \ were established in 2008, diversity of soil nematodes were studied at the GLORIA\
    \ summit areas and the region was part of an assessment of useful plants of the\
    \ alpine life zone.\r\nFor the sampling design and recording methods see the GLORIA\
    \ Field manual and update documents downloadable under: http://www.gloria.ac.at/?a=20"
