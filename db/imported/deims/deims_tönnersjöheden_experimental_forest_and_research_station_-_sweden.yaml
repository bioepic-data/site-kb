  description: Tönnersjöheden and Skarhult experimental forests are situated in the
    nemoral/nemo-boreal zone closed to the Atlantic sea in South Sweden. Tönnersjöheden
    (1143 ha) was established as an experimental forest in 1923 with the original
    aim of studying ecosystems in transition from low productive broad-leaved forests
    and open Calluna heath-lands to conifer dominated forests. Skarhult (180 ha) was
    opened as an experimental forest in 1989 with a main focus on management and ecology
    of broad-leaved forest stands. Forests at Tönnersjöheden are dominated by old
    growth broad-leaved stands with long continuity, first and second rotations of
    planted coniferous stands and a number of planted stands with exotic tree species.
    Forests at Skarhult are dominated by naturally regenerated and planted pure and
    mixed broad-leaved forest stands of European beech (Fagus sylvatica L.), common
    oak (Quercus robur L.) and ash (Fraxinus excelsior L.). Research and monitoring
    activities cover a broad range of basic and applied subjects in the field of forest
    and forest related environmental sciences. The experimental forests are well-documented
    and well-described concerning history, climate, soils, vegetation and forest stands.
