  location:
    latitude: 42.44625
    longitude: 13.554978
    country: Italy
    elevation_meters: 2210.0
  description: "The site consists of high elevation vegetation in central Mediterranean\
    \ basin, along the Apennines mountain range: xerophitic primary grassland (Pediculari\
    \ elegantis-Seslerietum tenuifoliae) and mesophitic primary grassland (Luzulo\
    \ italiacae-Festucetum macratherae), with important resident and migratory bird\
    \ communities.\r\nSix plots, each one 100 m2 large, grouped in two cluster-plots\
    \ including each one three plots, representative of a larger area of 0,5 km2 ca.,\
    \ ranging from 2100 to 2300 m a.s.l. (alpic and Mediterranean high-mountain belts."
