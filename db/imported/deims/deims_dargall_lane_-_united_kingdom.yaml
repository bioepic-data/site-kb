  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. The Dargall Lane
    catchment is a sub catchment of Loch Dee, Galloway, south-west Scotland. The catchment
    rises from 260 m at the sampling station to 716 m at Lamachan Hill. The underlying
    geology is complicated and includes Silurian and Ordovician greywackes, shales
    and mudstones, and granite/gneiss intrusions. Rankers are the dominant soil type
    covering some 80% of the catchment, with peaty podsols and subalpine soils comprising
    the remainder. The vegetation of this moorland catchment is characterised by Molinia
    and Calluna. Land-use was traditionally confined to low-intensity sheep grazing.
    In 2002 however cattle were introduced to a small area, away from the stream,
    at the bottom of the catchment. Annual rainfall is c. 2400 mm. Note: The area
    is the size of the catchment.'
