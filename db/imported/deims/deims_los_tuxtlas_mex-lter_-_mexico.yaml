  description: Los trabajos en Los Tuxtlas se concentran principalmente en la Estación
    de Biología Tropical “Los Tuxtlas” de la UNAM y sus areas aledañas. La Estación
    de Biologia Tropical Los Tuxtlas se ubica sobre la carretera Catemaco-Monte Pío
    en el municipio de San Andrés Tuxtla, Veracruz, México. La vegetaciónes es bosque
    primario conocido como selva alta perennifolia. Es internacionalmente reconocida
    como uno de los sitios con mayor investigación en ecología de selvas en el mundo.
    Se realiza investigación en fragmentos cercanos con ecosistemas razonablemente
    conservados y otros perturbados. También se estudian algunos cuerpos de agua mayores,
    como las lagunas Escondida y Zacatal. Recientemente el estudio de la ecología
    de potreros y acahuales adyacentes ha sido importante. Por otro lado es conocido
    como un "hotspot" de biodiversidad.
