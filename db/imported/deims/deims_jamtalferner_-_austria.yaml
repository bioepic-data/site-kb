    name: Jamtalferner - Austria
  location:
    latitude: 46.954164
    longitude: 10.224291
    country: Austria
    elevation_meters: 2279.0
  description: The site is located at the main Alpine ridge in Silvretta group right
    at the border between Austria and Switzerland. Jamtalferner glacier and it's forefield
    is subject to scientific reseach for more than 100 years. Current monitoring includes
    climate, hydrology, glacier mass balance, permafrost, paleoglaciology, society
    and biotic succession in the periglacial area. In addition to that, several short
    time research projects are carried out, e.g. concerning glacier albedo. The site
    inlcudes the are from the highest peaks at 3384 m a.s.l.  and the valley further
    down to the communities of Galtür and Ischgl (1263 m a.s.l.).  More information
    can be found at the website of the environmental education program Jamtal www.umweltbildung-jamtal.info.
