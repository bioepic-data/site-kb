    longitude: 24.81453
    country: South Africa
    elevation_meters: 1183.0
  description: The site is located 10 km outside of the Kimberley on the border of
    the Northern Cape and Free state. Previously used for grazing land, the area is
    currently a Private Nature Reserve, home to various game species. Research at
    the site has been active since the late 1900s, primarily focussing on mammals
    and birds. SAEON got involved in research at the site in 2017. The site can be
    characterized by having Nama-Karoo, Arid Grassland, and Arid Savanna.
