  description: Lake Cuga (IT10-003-A) is located in the north-western part of Sardinia.
    The reservoir was built in 1965, but its first filling was in 1975. It lies at
    an altitude of 114 m a.s.l. and is extended for about 58 x 106 m2, with a maximum
    and average depth of 45 m and 11 m, respectively. It has a volume of 34 x 106
    m3. The waters are used mainly for irrigation and drinking supplies. Cuga Lake
    is classified as eutrophic since the early years of its filling.
