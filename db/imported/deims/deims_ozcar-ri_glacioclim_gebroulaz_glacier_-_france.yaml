  description: 'Gebroulaz glacier (GEB) is located in the Vanoise massif (France),
    between 2700 and 3400 m altitude. The glacier is one of the glaciers with longest
    records of glacier mass balance worldwide. Data series are continuous and cover
    few decades.This site is also characterized by the complete glaciological parameters
    performed annually to complete annual and seasonnal mass balance : ice velocity,
    ice thickness variation, snout position.In addition, meteorological observations
    complete the data base. GEB is a part of the French Glacier Observatory GLACIOCLIM/CRYOBS-CLIM.'
