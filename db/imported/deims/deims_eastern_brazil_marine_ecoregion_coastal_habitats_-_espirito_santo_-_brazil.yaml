  description: The LTER HCES site (or PELD-HCES) is a coastal marine protected area
    on the tropical Eastern Brazil Marine Ecoregion (Spalding et al., 2007), with
    includes a transition estuarine ecosystem composed of two estuaries, coastal sand
    beaches, algal reefs and maerl beds distributed along the inner continental shelf
    to depths og 50-60 meters.
