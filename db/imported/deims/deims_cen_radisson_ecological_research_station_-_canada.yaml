  description: 'CEN Radisson Ecological Research Station (Station de recherche ecologique
    de Radisson). The station is the property of the Radisson municipality. It is
    run and operated by the following three member institutions of the Centre d''études
    Nordiques (CEN: Centre for Northern Studies): Université Laval, Université du
    Québec; Rimouski and Centre Eau, Terre et Environement of the Institut national
    de la recherche scientifique. The station has a long-term lease with the municipality.
    The CEN secretariat based at Université Laval oversees the management of the station.
    This station is part of the CEN Network, more precisely the Qaujisarvik Network
    of stations, and is the most southerly station of the network at 53°N. The vast
    expanse of the Québec territory, adjacent to James Bay, is administered by the
    Société d''énergie de la Baie James which is a subsidiary of Hydro Québec. Hydro
    Québec is responsible for emergency services and requires an annual logistical
    and security plan for all visitors.'
  status: ACTIVE
