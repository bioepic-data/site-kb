  description: "In the past the Acquatina basin was part of a vast brackish system\
    \ periodically invaded by the Adriatic Sea. In the ‘30s, during the reclamation\
    \ work of the marsh areas surrounding the basin, the perimeter of the lake was\
    \ embanked by a brickwork, prefiguring the current lagoon. The banks of the basin\
    \ are made of large slabs of rock which are fixed around the perimeter, about\
    \ 7 km long. \r\nAcquatina has a surface of 0,45 sqkm, an average depth of 1.2\
    \ m and a maximum depth of 2 m. Its morphology is developed in three branches,\
    \ one heading north and two heading south. The relatively shallow depth, very\
    \ limited tidal regime, scarce and unpredictable rainfall, intermittent freshwater\
    \ inputs and strong evaporation processes ensure the high spatial and temporal\
    \ heterogeneity of the main lagoon's chemical–physical characteristics:salinity,\
    \ temperature, oxygen. Due to freshwater inflow, salinity near the mouth of the\
    \ Giammatteo canal is often lower than in the other parts of the basin. At its\
    \ southern extremity where the lake directly communicates with the sea, the salinity\
    \ generally reaches very high values: the highest values, up to 42, are reached\
    \ in summer in few areas of the basin. With regard to the temperature, as the\
    \ sea water impedes an excessive cooling down, in winter it is higher where the\
    \ basin communicates with the sea, and in general near the dune. Dissolved oxygen\
    \ concentration declines in the areas less exposed to the prevailing winds (NNO).\
    \ The lowest values occur at the end of the spring and summer months, above all\
    \ in calm wind conditions. The biological oxygen demand by the decomposers in\
    \ the sediments is so high that the oxygen concentration reaches zero in few millimeters-deep\
    \ sediments. The nutrient (nitrogen and phosphorous) supply occurs from agricultural\
    \ run-off inflowing through the small streams. On the basis of the average annual\
    \ values of nitrogen and phosphorous the lagoon can be classified as meso-oligotrophic.\
    \ The bottom is mainly muddy, with some rocky patches near the shore, and is often\
    \ covered by meadows of Cymodocea nodosa and Ruppia sp. A considerable amount\
    \ of Posidonia oceanica leaf detritus is present around the main sea inlet and\
    \ the mouth of the Giammatteo canal. The Acquatina catchment area has a total\
    \ surface of 78 sqkm. The comparison between the dimensions of the catchment basin\
    \ and those of the lagoon shows the high vulnerability of this site with respect\
    \ to the activities in the basin. The most part of the emerged surface area of\
    \ the catchment basin is cultivated above all with cereals and olives, requiring\
    \ more than 300 tonnes per year of fertilizers and 3 of pesticide. According to\
    \ the Habitat Directive 92/43/CEE, the Acquatina lagoon is included in the Site\
    \ of Community Importance (SCI) “Acquatina Frigole” (CODE IT9150003), which has\
    \ an extension of 1,6 km. Within this area priority habitats such as coastal lagoons,\
    \ the Mediterranean salt steppes and grasslands of Posidonia have been identified\
    \ and require urgent measures of conservation. Currently the lake of Acquatina\
    \ and the surrounding area are managed by the Department of Biological and Environmental\
    \ Sciences and Technologies of the University of Salento aiming at the improvement\
    \ of basic and applied ecological research activities on transitional waters,\
    \ aquaculture and fishing."
