  description: The station Estrees-Mons A28 (ICOS code FR-EM2) is located in Picardie
    region, about 200 km north-east of Paris, in an INRA research station which includes
    150 ha of experiments on arable crops (both annual food crops and perennial bioenergy
    crops). The ICOS station is part of the “SOERE ACBB” long-term experiment which
    includes two eddy covariance towers. Soil is deep loamy soil.
