  description: The site is composed by a set of Atlantic Forest fragments and restoration
    sites scattered in an agricultural landscape in north of Parana state, south Brazil.
    The forest in this region is a seasonal semi-deciduous form of Atlantic Forest,
    which undergone strong conversion rates from 1940 to 1980 and presently has only
    8% forest cover, distributed in a myriad of small fragments. Forest fragmentation,
    fertilizer and pesticide leakage from agricultural fields and urbanization are
    the main regional drivers of environmental change. In each sub-site (forest fragment
    or restoration site) we are sampling flora, fauna and ecosystem attributes (forest
    biomass, litter fall, litter decomposition etc). The site is maintained by Londrina
    State University
