  description: The VCG platform is an area of molassic foothills, covering the Louge,
    Touch and Save watersheds; it is bounded to the south, east and north by the Garonne.
    The platform is located inside the Zone Atelier Pyrénées-Garonne, and it includes
    the Auradé watershed site.
