  description: UK ECN site.  The River Coquet rises at Coquet Head on the Scottish
    border and flows generally eastward, draining the southern flanks of the Cheviot
    Hills, finally discharging to the North Sea at Amble. The Warkworth Dam marks
    the tidal limit. The River Coquet is an excellent, clean river system of high
    conservation and ecological value. The river is designated as a Site of Special
    Scientific Interest (SSSI). Bankside habitats range from woodland fringed lower
    river and wooded lowlands through the hay meadows, herb rich valleys and gravel
    haughs of lower Coquetdale to the upper moorlands of the Cheviots. This relatively
    undisturbed environment provides excellent habitats for wildlife including a number
    of protected species. The principal habitats protected are hay meadows, woodland
    and the estuary. The main river supports a healthy and diverse invertebrate fauna
    of mayflies, stoneflies, caddis flies and other taxa which are sensitive to pollution.
    Their presence indicates the absence of chronic pollution and the in-stream biology
    is generally of excellent quality. The ECN site on the Coquet is at Warkworth,
    Grid Reference NU 236 050, approximately 2 kilometres upstream of the tidal limit.
