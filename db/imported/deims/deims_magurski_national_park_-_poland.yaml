  description: In 1998 a permanent plot (50 x 50 m) was established at the height
    of 505 m asl in 45 year old spruce stand, where in the 45-year-old spruce stand
    bulk deposition, throughfall and soil solution are collected. The investigations
    of health status of trees and floral characteristic have been carried out since
    2001. The analyses are carried out in a certified laboratory of the Institute
    for Ecology of Industrial Areas, Katowice (Certificate No AB 325). The basic meteo
    data are taken from the monitoring station located about 1 kn from the plot.
