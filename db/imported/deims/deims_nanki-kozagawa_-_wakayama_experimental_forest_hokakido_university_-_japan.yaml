  description: The Wakayama Experimental Forest (approx. 450 ha) was established in
    1925 for education and research of warm temperate forests. The mean annual temperature
    is 15.2℃ (max. 37.8℃, min. -9.5℃), and annual precipitation is frequently over
    4,000mm. The elevation ranges from 260 to 840 m. The mountainous areas are rather
    steep with slopes mostly over 30°. More than 70% of forest area is covered with
    plantations of Japanese cedar (Cryptomeria japonica) and Japanese cypress (Chamaecyparis
    obtusa). The remaining area supports natural forests composed of evergreen broad-leaved
    trees (mainly evergreen Fagaceae and Lauraceae) and deciduous broad-leaved trees
    (Zelkova serrata, Aesculus turbinate and Mallotus japonicas). Near the mountain
    summits, there are mixed forest of broad-leaved trees and conifers (Abies firma
    and Tsuga sieboldii), and native forests of Japanese cedar, Japanese cypress and
    Japanese umbrella-pine (Sciadopitys verticillata). In these forests, more than
    23 species of mammals are living. Monitoring forest vegetation and wildlife populations,
    and research on the impact of forestry on natural environments have been conducted.
    The Wakayama Experimental Forest provides various field education programs for
    elementary school children to post graduate students as well as to the public.
