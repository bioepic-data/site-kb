  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. Loch Chon is a
    relatively large (surface area 105.7 ha) lake lying at an altitude of 92 m in
    the Trossachs region of central Scotland. The loch is fed by several small streams
    and drains to the south via Loch Ard and the River Forth. The loch has two main
    basins, with the deepest area (25 m) represented by a trench near the western
    shore. The bathymetry was first surveyed by Murray and Pullar in 1910. Some data
    managed by UK ECN Data Centre. Note: The area is the size of the catchment. The
    lake area is 106 ha'
