  description: "HYBAM observatory runs a network of 17 stations for hydrological,\
    \ sediment and geochemistry sampling in the Amazon basin. The infrastructure is\
    \ shared between the partners in each country including France, Brazil, Peru,\
    \ Bolivia, Colombia and Ecuador. ADCPs are used for river water flow measurements.\
    \ Samples are processed in different laboratories at Manaus and Brasilia University\
    \ (Brazil), Lima University (Peru) and Toulouse University (GET laboratory in\
    \ France). For comparisons with other large tropical rivers, one stations is maintained\
    \ along the Orinoco River (Venezuela) and Congo River (Congo) \r\n\r\nHYBAM data\
    \ are used in a large variety of programs in relation to hydrology, geomorphology,\
    \ geochemistry, climatology, climate change, carbon cycle, remote sensing and\
    \  isotopic tracers.\r\n\r\nThe data produced by the HYBAM observatory are made\
    \ available online on its website (www.ore-hybam.org) to provide to the research\
    \ community long term assessments on the hydrology of world largest basin."
