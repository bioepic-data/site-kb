    country: Belgium
    elevation_meters: 500.0
  description: 'La Robinette is a 81 ha catchment located in the east of Belgium («
    Hertogenwald »: Duke''s forest) within the municipality of Baelen.  Biogeochemistry
    (nutrient and organic carbon in throughfall, rainfall, soil solution and outlet)
    has been studied since 1991 as a reference catchment within the frame of a liming
    experiment (Waroneu catchment) and critical loads calculations. The catchment,
    initially covered by Picea abies, was subjected to windthrow, reducing coverage
    to 46% (1990s) and experimental clearcut of 22 ha (1996), followed by afforestation
    with deciduous species in 1998. Four 2-ha plots were planted with deciduous species
    in alternate rows. Alder, rowan, birch and oak were also planted within the catchment.
    In 2012, the catchment was covered by 8% mature and 41% young conifers (Picea
    abies), 7% deciduous trees (Fagus sylvatica, Quercus robur, Betula pendula, Alnus
    glutinosa, Sorbus aucuparia, Salix caprea ), 44% open space. Biogeochemical measurements
    have been complemented with experiments on litterfall, litter decomposition, soil
    respiration, N cycle processes. Flux and meteorological data have been collected
    from 2007 to 2011 (CarboEurope) and from end 2016 (ICOS). In addition, since 2013,
    biogeochemistry and soil microbial parameters (microbial biomass, N mineralization,
    basal respiration) are studied in 6 intensive plots, reflecting major combinations
    of vegetation and upper soil characteristics within the catchment.'
