  description: "The Strengbach Watershed is a granitic watershed (80ha) located in\
    \ NE of France, in the Vosges Mountains at altitudes between 880 and 1150 m (omsl)\
    \ and with highly incised side slopes (mean 15°).\r\nThis catchment is situated\
    \ in a remote area lacking human activities except forest management.\r\nThe forest\
    \ covers 90% of the area and corresponds about to 80% spruce (mainly Piceas Abies\
    \ L.) and 20% beech (Fagus Sylvatica). \r\nThe climate is temperate oceanic mountainous.\r\
    \nThe site is managed by Ecole et Observatoire des Sciences de la Terres (University\
    \ of Strasbourg / CNRS-INSU-France)."
