  description: The Talladega National Forest (TALL) is a terrestrial NEON field site
    located within the Oakmulgee District of the Talladega National Forest in west-central
    Alabama, in Hale and Bibb counties. TALL has a total sampling area of 52.3 km2
    (12,924 acres) on land that is managed by the U.S Forest Service. It is encompassed
    within the Fall Line Hills of the Eastern Gulf Coastal Plain Physiographic Region.
    The site is located in NEON's Ozarks Complex Domain (D08) and is the northernmost
    aquatic field site in the Domain. D08 has two other terrestrial field sites and
    three aquatic field sites. TALL is colocated with the Mayfield Creek (MAYF) aquatic
    site. TALL and MAYF are upstream of the Dead Lake (DELA) and Black Warrior River
    (BLWA) sites.
