  description: SITES Lönnstorp research station is situated in the Scanian agricultural
    landscape between Malmö and Lund and has a focus on the design, sustainable development
    and assessment of arable cropping systems, in conventional and organic farming.
    The research station is available for research within ecology, agronomy, environmental
    science, agroecology and other disciplines. SITES Lönnstorp research station have
    access to 60 hectares of conventional and 18 hectares of organic farm land, mainly
    cultivated with annual crops, representative for agricultural practise in southern
    Sweden. The station is also a part of SITES, Swedish Infrastructure for Ecosystem
    Science. SITES is a nationally co-ordinated infrastructure for terrestrial and
    limnological field research. In 2016, SAFE (SITES Agroecological Field Experiment)
    was established at the research station. SAFE make it possible to compare four
    different agroecosystems, a conventional reference system, an organic system,
    a perennial system and an agroecological intensified system.
