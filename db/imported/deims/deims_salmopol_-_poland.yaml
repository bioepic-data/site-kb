  description: The monitoring site was established in 1993 and consists of a monitoring
    station, where the measuring equipment is located, i.e., Wind Speed Meter (Young)
    pyranometer (LiCo) hygrometers, etc., permanent plots in the 105-year-old spruce
    stands where bulk deposition, throughfall and soil solution are collected on the
    monthly basis. The investigations of health status of trees and floral characteristic
    have been carried out since 1994. The analyses are carried out in a certified
    laboratory of the Institute for Ecology of Industrial Areas, Katowice (Certificate
    No AB 325).
