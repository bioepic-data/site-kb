  description: 'Steigerwaldt Land Services (STEI) is a terrestrial site that consists
    of two geographically separate project areas in north-central Wisconsin. The Steigerwaldt
    Land Services property, where the tower plots are located, encompasses 0.3 km2
    (77 acres) in Lincoln County, WI and is approximately 1.6 km (1 mi.) north of
    NEON’s Treehaven site (TREE). This property is owned and managed by Steigerwaldt
    Land Services, Inc., a forestry and real estate consulting business. This site
    is in Major Land Resource Area (MLRA) 94D - Northern Highland Sandy Drift. The
    distributed plots are within a section of the Chequamegon-Nicolet National Forest
    in eastern Price County, WI, about 30 miles northwest of the STEI tower. This
    land is managed by the U.S. Forest Service. This site encompasses 23.4 km2 (5785
    acres) and is in MLRA 90A - Wisconsin and Minnesota Thin Loess and Till, Northern
    Part. STEI is located within the Great Lakes Domain (D05), which includes northern
    Ohio, Michigan, northern Wisconsin, and parts of Indiana and Illinois. D05 hosts
    four other NEON field sites: two aquatic and two terrestrial, located in Wisconsin
    and Michigan.'
