    name: LTSER Zone Atelier Alpes - France
  location:
    latitude: 44.8
    longitude: 6.4
    country: France
    elevation_meters: 1800.0
    bounding_box:
      west: 4.8846
      south: 43.4795
      east: 7.7155
      north: 46.40787
  description: 'The LTSER Zone Atelier Alpes is a research platform that embraces
    all the French Alps as defined by the European Alpine Convention. The platform
    hosts several sites dedicated to the long term monitoring of social-ecological
    systems : one GLORIA site (FR-AME), a large set of permanent plots located along
    several elevational transects (ORCHAMP project), a network of sentinel alpine
    pastures, etc. Infrastructures regroups all facilities and observatories maintained
    by the academic community Univ. Grenoble Alpes. More intensive research investigations
    concern three master sites: (1) the ''Lautaret-Galibier'' master site includes
    the Lautaret Garden, an alpine field station member of the Anaee network (2) the
    ''Arves-Mont Blanc'' master site ranges from urbanized valleys to the highest
    summit of Europe (3) the ''alpine trench Grenoble-Chambéry-Annecy'' master site
    is a large area encompassing the urbanized valleys of the western border of the
    French Alps (Grenoble-Chambéry-Annecy) and nearby mountain ranges (Vercors, Chartreuse,
    Belledonne & Bauges). The LTSER Zone Atelier Alpes belongs to LTER-France network
    and is located in south eastern France.'
