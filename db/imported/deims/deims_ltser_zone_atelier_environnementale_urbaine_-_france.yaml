  description: 'The LTSER Zone Atelier Environnementale Urbaine belongs to LTER-France
    network and is located in eastern France.The Zone Atelier Environnementale Urbaine
    ZAEU was created in 2010. It focuses on urban area and urban socioecosystem research
    questions. The main objective is to define how to facilite an harmonious development
    according to the city needs without badly impacting the natural system around.
    The Eurometropole of Strasbourg is a close partner of the ZAEU: local authorities
    participate to the research experimentations and observation campains. Six working
    groups are dealing with natural systems in order to better understand the urban
    ecosystem (biodiversity, hydrology, air and climate, urban metabolism) and the
    socio system (social and economic dimensions of the society and the individuals,
    groups behavior and values, politics strategies). In the working groups, we study
    issues like hydrological system processes in the urban area, population health,
    energy consomption and production at the city scale, pollutions and contaminations
    of the various spheres, refusal management with regards to the context of global
    changes, sustainable development and transitions (economy, ecology, energy).'
