  description: The site Jochberg is part of the European Level II Forest Monitoring
    System in the frame of the International Co-operative Programme on Assessment
    and Monitoring of Air Pollution Effects on Forests (ICP Forests). This site is
    one out of 16 Austrian Level II sites; it was established in 1995 and is, since
    2006, part of the LTER Austria network. The site is situated in the east of the
    federal country Tyrol in the Austrian Central Alps about 15 km south of the skiing-resort
    Kitzbühel at 1050 m a.s.l., in a 95 year old managed spruce forest.
