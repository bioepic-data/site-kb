  description: "The Woodland Restoration Plot Network is located in the Cumberland\
    \ Plain, Western Sydney, NSW, Australia with the objective to develop robust methods\
    \ for evaluating the success of native woodland restoration on retired agricultural\
    \ land and apply them to a major restoration project of an endangered ecological\
    \ community. The plot network aims to determine whether the composition and structure\
    \ of restoration plantings undertaken between 1992 and 2002 are on a trajectory\
    \ from abandoned exotic pasture towards comparatively undisturbed remnant vegetation.\
    \ The data gathered will inform future restoration efforts.\r\n\r\nBetween 2012\
    \ and 2018 the Woodland Restoration Plot Network was is a member of Long Term\
    \ Ecological Research Network (LTERN), Australia, a facility of the Australian\
    \ Government's Terrestrial Ecosystem Research Network (TERN)."
