  description: "The ecological station is situated in the Yundola place in the Rila\
    \ Mountain in Central South Bulgaria on an area of 321 hectares at an altitude\
    \ of 1500 m. It includes 10 plots with different exposition and density of tree\
    \ vegetation. The plots are equipped with controlled measuring systems. The open\
    \ areas region is covered by dense coniferous forests of herbaceous species on\
    \ the age of about 150 years. The river network is dense and includes small permanent\
    \ and numerous temporary streams with high velocity. The stations were founded\
    \ in 1961. However, the regular observations have started since 1964-1965.\r\n\
    \ \r\n\r\nThe ecological station in Yundola is a part of a Training Experimental\
    \ Forest Enterprise. Much other investigations, experiments, and students training,\
    \ concerning almost all components of the forest ecosystems are carried out there\
    \ since its creation in the beginning of the sixties. For example, studies were\
    \ performed on: the characteristics of soil and litter forest cover, the forest\
    \ stand and the regeneration, the understanding of run-off chemistry and leaf\
    \ mass biochemistry, the fertilizing, the influence of logging technology of water\
    \ supply, soil protection, growth functions of the forests, the precipitation\
    \ chemistry in case of air pollution, etc."
