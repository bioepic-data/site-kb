  description: "The mountainous Gossenköllesee is located in the Stubaier Alps at\
    \ an elevation of 2,417 m.  The research station on the shore of Gossenkoellesee\
    \ provides an ideal platform to conduct research related to global change as shown\
    \ in mountaineous regions.\r\n\r\nThe former UNESCO Gossenköllesee Biosphere Reserve\
    \ (the smallest in the world) was established in 1977 in order to guarantee long-term\
    \ ecological research. In the year 2014 this label has been withdrawn due to the\
    \ incompatibility with the Sevilla strategy to define biosphere reserves. It was\
    \ defined with an area of 85ha ranging from 2.417 m (lake level) to 2,828 m above\
    \ sea level (Pirchkogel) at 4714'N and 1101'E. The former Biosphere Reserve comprised\
    \ the lake itself with the adjacent catchment area.\r\nIt is characteristic for\
    \ high alpine regions and has a largely intact natural environment. The centre\
    \ of scientific interest is the long-term change of alpine lakes, streams and\
    \ entire catchments. The two lakes, Vorderer and Hinterer Finstertaler See, were\
    \ converted into a reservoir for hydroelectric power generation in 1974, and dam\
    \ construction flooded the existing limnological research station, established\
    \ in 1959 on the shore of the Vorderer Finstertaler See. A new station was built\
    \ in 1975 on the opposite slope of the Kühtai Valley, the socalled Limnological\
    \ Station Gossenköllesee, and was completely reshaped and enlarged in 1995. In\
    \ 2016 it has been entitled after Prof. Roland Pechlaner.\r\nAfter twenty-five\
    \ years, this is still an attractive and highly relevant subject for both ecological\
    \ research and environmental protection.\r\nDuring the Ice Age the whole area\
    \ was glaciated. After the ice retreated at the beginning of the Holocene several\
    \ lakes were formed, four of which still exist today; the largest of these is\
    \ Gossenköllesee. The bedrock of the drainage area is granitic and consists of\
    \ crystalline schist and gneiss. The moraine forming the natural dam of Gossenköllesee\
    \ is composed of amphibolites, granite gneiss and mica slate.\r\nThe lake is subpolar,\
    \ oligotrophic and dimictic in character with a maximum depth of 9.9 m and an\
    \ area of 16,700 m². It is covered for up to eight months of the year with an\
    \ alternating sheet of ice, snow and slush, which has a critical influence on\
    \ light transmission, stratification and nutrient exchange of the pelagic zone.\
    \ The lake has no surface inflows and outflows, except a small outlet during snowmelt.\
    \ It harbours one of the last populations of the Danubian brown trout (Salmo trutta),\
    \ probably descended from fish stocked by the Emperor Maximilian in A.D.1500.\
    \ It is accessible all year round, lying within an hour’s walking distance from\
    \ the small village of Kühtai, a well-known ski resort situated about 30 km west\
    \ of Innsbruck that can be reached daily by car and public transport.\r\nGossenköllesee\
    \ and its catchment area is a centre of alpine research with a fully equipped\
    \ research station at the shore of the lake that undertakes the collection (and\
    \ to some extent analysis) of sensitive samples and maintains automated observation\
    \ of climate and hydrology on site. The station has accommodation for up to six\
    \ people, and was modernized and equipped with telephone, modem and electrical\
    \ energy in 1994, allowing for emission-free heating and operation of the equipment.\
    \ Additionally, since 2016 we run an automatic weather based on a platform on\
    \ the lake. A webcam provides online pictures. \r\nGLOBAL CHANGE RESEARCH IN MOUNTAIN\
    \ HABITATS\r\nSince 1992, Gossenköllesee has been a key site in various EU projects\
    \ (ALPE, MOLAR, EMERGE) and is included in the Integrated Project EUROLIMPACS\
    \ and the Network of Excellence ALTER-NET (6th Framework Programme). Over the\
    \ last three decades the atmospheric deposition, lakes, streams, soils and vegetation\
    \ of this area have been subjects of MSc dissertations, PhD theses and international\
    \ projects. Beginning in 2004, Gossenköllesee, which is unique as a centre of\
    \ scientific education, will be the principal site for research focus of the Innsbruck\
    \ University (ALPINER RAUM–ALPINE SPACE). The importance of the station for research\
    \ and teaching can be illustrated by numerous interviews and TV documentaries.\
    \ Since 2015 it is member of GLEON (Global Lake Ecological Observation Network)\
    \ as the only Austrian high mountain lake.\r\nThe lake and its catchment area\
    \ lay entirely in the alpine zone, that is, above the present and possibly also\
    \ the historical treeline. It harbours several alpine plant species such as rhododendron,\
    \ dwarf shrubs and typical representatives of alpine grass heath.\r\nApproximately\
    \ 10 per cent of the catchment area is covered by thin soils, mostly raw and podsolic\
    \ soils with low pH. The surroundings are characterized by large rocks and moraines,\
    \ which offer shelter to marmots, chamois, ermines, foxes and adders.\r\nThe site,\
    \ which is part of the local agrarian community, is bordered by a ski resort and\
    \ can be reached during winter after a short journey using skies or snowshoes.\
    \ During the summer Gossenköllesee is accessible on foot via a narrow trail (one-hour\
    \ walk), and in good weather conditions (in late summer) is even accessible by\
    \ jeep. As a result of the moraine, the lake and the station are hidden from view\
    \ and therefore rarely visited by hikers or skiers. During the summer sheep graze\
    \ in Kühtai, and some go as far as the Gossenköllesee catchment, thus providing\
    \ additional nutrient input."
