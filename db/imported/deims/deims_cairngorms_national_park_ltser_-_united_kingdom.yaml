  description: "The Cairngorms National Park is one of 15 National Parks in the UK\
    \ (one of two in Scotland) and is Britain's largest National Park (4,528 km2).\
    \ It is the location for some of the most spectacular landscapes in Britain and\
    \ is home to an incredible diversity of wildlife and plants.\r\n\r\nhttp://cairngorms.co.uk/the-park/facts-figures/\r\
    \nThe aims of the National Park are:\r\n• To conserve and enhance the natural\
    \ and cultural heritage of the area;\r\n• To promote sustainable use of the natural\
    \ resources of the area;\r\n• To promote understanding and enjoyment (including\
    \ enjoyment in the form of recreation) of the special qualities of the area by\
    \ the public;\r\n• To promote sustainable economic and social development of the\
    \ area’s communities.\r\n\r\n Cairngorms National Park, seven broad habitats can\
    \ be identified:\r\n• Enclosed farmlands\r\n• Woodlands\r\n• Open waters (rivers,\
    \ lochs, wetlands and floodplains)\r\n• Mountains\r\n• Moorland\r\n• Semi-natural\
    \ grasslands\r\n• Urban\r\n\r\n• Population of c17,500\r\n• 25.8% of population\
    \ over 60 (higher than Scottish average)\r\n• Average health index in top 25%\
    \ of Scotland (based on deprivation indices)\r\n• Extensive core paths network\r\
    \n• 55 Munros including 5 summits over 4000 feet\r\n• 3 ski centres\r\n• National\
    \ Cycle Network Route 7\r\n• 1 Long Distance Route (Speyside Way)\r\n\r\n• Relatively\
    \ low atmospheric pollution\r\n• Annual precipitation over 2250mm on summits and\
    \ under 900mm in straths\r\n• Average annual snow cover 200 days on summits and\
    \ 50 days on low-ground\r\n• Prevailing winds from south-west"
