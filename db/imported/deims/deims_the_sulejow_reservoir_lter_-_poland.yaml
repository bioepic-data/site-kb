sites:
- id: site_kb:deims-the_sulejow_reservoir_lter_-_poland
  name: The Sulejow Reservoir LTER - Poland
  network_registrations:
  - network: DEIMS
    network_id: 8b9d04ca-0798-4f7f-91cd-82c91f881c8e
    network_url: https://deims.org/8b9d04ca-0798-4f7f-91cd-82c91f881c8e
    name: The Sulejow Reservoir LTER - Poland
  location:
    latitude: 51.433333
    longitude: 19.923611
    country: Poland
    elevation_meters: 130.0
  description: "The site is situated in lowlands of Central Poland and arranged around\
    \ the Sulejowki Reservoir. It has been build in 1969-1974 on the Pilica River\
    \ mainly as a source of drinking water for the City of Lodz (the third biggest\
    \ city in Poland) and other cities like Tomaszow, Piotrkow, Sulejow, and a power\
    \ generator. With time it became also an important touristic and recreational\
    \ place. \r\nThe research area includes the reservoir and its direct catchment,\
    \ where smaller plots have been located for analysing surface flow, groundwaters,\
    \ and the role of land/water ecotones in regulation of nutrient cycling. There\
    \ is number of sampling sites/points located also on the reservoir, 3 of them\
    \ are permanent since 1980's and serve as a source of data on water chemistry,\
    \ the others are sampled periodically for certain purposes, e.g. fish (including\
    \ 1+), phytoplankton, zooplankton, sediment depositon, groundwater level, groundwater\
    \ chemistry."
