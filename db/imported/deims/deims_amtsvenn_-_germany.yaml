  description: Drained peatland, peat cutting stopped in 1979 but drainage ditches
    remain open. In the area of the tower footprint the peat body was not cut but
    is degraded due to oxygenation. Water levels draw down to as much as -60 to -70
    cm in the end of summer and ca. -20 to -10 cm in winter. The site will be rewetted
    in the coming year
  status: ACTIVE
