    longitude: 34.772014
    country: Israel
    elevation_meters: 800.0
  description: "The Negev Highlands (NH) LTSER platform is situated between the Sinai\
    \ Peninsula to the west\r\nand the Arava – Dead Sea depression to the east. This\
    \ is a rocky terrain, covering an area of\r\n17,000 sq. km with series of ridges\
    \ at an altitude of 400-1000 m above sea level. As part of the\r\nSaharo-Arabian\
    \ desert belt, the climate across the NH is arid to hyper-arid region: January’s\r\
    \nmean daily temperature is 10 °C and July’s mean daily temperature is 25 °C The\
    \ potential\r\nevaporation is approximately 2200 mm/y, and mean annual precipitation\
    \ is 70–130 mm, with\r\nlarge inter annual variations. The rainy season occurs\
    \ during the winter months, from November\r\nto March. The area is rich with unique\
    \ natural landscapes. One of the most prominent of these\r\nare the Makhteshim,\
    \ which is the largest erosion craters in the world. In addition to its unique\r\
    \nlandscapes, it is also a habitat for various species of flora and fauna that\
    \ are adapted to arid zones\r\nand highlands, some of which are endemic to the\
    \ area. The Negev Highland LTSER platform\r\nincludes two LTER sites: Avdat Site\
    \ in the arid zone and Makhtesh Ramon site in the hyper arid\r\nzone.\r\nArchaeological\
    \ remains indicate that humans lived in the area for at least 1.4 million years.\r\
    \nToday, about 10,000 residents live here, in towns, agricultural communities,\
    \ small Bedouin tribal\r\nvillages and tourist-agricultural farms. Most of it\
    \ is concentrated along the main route (Route No.\r\n40), while much of the area\
    \ beyond the roads is either designated nature reserves or firing zones.\r\nThe\
    \ two main livelihoods in NH today are agriculture - mainly vines and olives,\
    \ and\r\ntourism; Both are greatly affected by climate change. Agriculture relies\
    \ on desalinated\r\nseawater imported into the area. However, it is affected by\
    \ the climate in several ways: 1) flash\r\nfloods cause increased soil erosion.\
    \ 2) Long periods of drought during the winter, cause increased\r\nevaporation\
    \ and therefore large water consumption. This is when the price of water is the\
    \ main\r\nexpense of the farmers, and increasing it may make agriculture unprofitable.\
    \ 3) The uncertainty\r\nregarding the amount of precipitation and their timing,\
    \ characterizes the arid environment. Recent\r\nclimate changes are increasing\
    \ this uncertainty and therefore make it very difficult for farmers to\r\nplan\
    \ their land cultivation and expenses. Climatic uncertainty poses a significant\
    \ challenge also\r\nfor tourism operators; Jews and Bedouins, as well. This is\
    \ due to the multiplicity of events of\r\nextreme climatic conditions (extreme\
    \ cold or extreme heat), which repel tourists from reaching\r\nthe area. And,\
    \ a multitude of years when there is not enough precipitation to generate the\
    \ famous\r\nspring bloom of the area.\r\nFor the past 7 years, the NH LTSER's\
    \ researchers have been working closely with three\r\nstakeholder groups in the\
    \ area: winegrowers in the valleys, the Negev Highlands Tourism\r\nAssociation\
    \ and Bedouin tourism operators. In Green Transformation we will actively engage\r\
    \nwith this group, through tow case studies: 1) The Desert Miracle farm - which\
    \ will serve as a\r\nmonitoring and dissemination knowledge farm; In a collaboration\
    \ with the owner of the farm,\r\nR and D agriculture in the NH and the Center\
    \ for Flood Research (DSASC). 2) Tourism in the NH;\r\nIn collaboration with the\
    \ NH Tourism Association. Through joint work with these NGOs, we will\r\n\r\n\
    develop a long-term monitoring program and educational materials. The topics we\
    \ will deal with:\r\nreducing soil erosion and increasing soil moisture, by using\
    \ appropriate agricultural methods to\r\nmultiply flash floods, which will be\
    \ distributed to additional farmers in the area through activities\r\nat the monitoring\
    \ farm. and to tourists through workshops of the Tourism Association. In the case\r\
    \nof tourists, the aspect to be monitored is the number of tourists who come to\
    \ the area in relation to\r\nthe weather conditions. Together with the Tourist\
    \ Association we will develop tourist-monitoring\r\nsystem. The high sensitivity\
    \ of the arid region to climate change and the great exposure of the\r\nimpact\
    \ of these changes on animals, plants and humans, invite possible tourist-educational\r\
    \nactivities aimed at transformation in ways of thinking and behaving. An environmental\
    \ education\r\nprogram and educational tools will be developed together with the\
    \ Tourist Association. Their\r\nimpact will be monitored in collaboration between\
    \ the NH LTSER platforms researchers and\r\ntourism operators."
