  description: "The station is located on Devon Island, a Mars analog environment\
    \ and polar desert, approximately 165 km northeast of the hamlet of Resolute in\
    \ Nunavut, Canada (75°25’ N, 89°49’ W). The station is situated on Haynes Ridge,\
    \ overlooking the Haughton impact crater, a 23 km diameter crater formed approximately\
    \ 39 million years ago (late Eocene). The location is approximately 1609 km from\
    \ the Geographic North Pole and approximately 1287 km from the Magnetic North\
    \ Pole.\r\n\r\nExperiments at Flashline primarily focus on biodiversity surveys\
    \ of the arctic desert and geological/geophysical study of the Haughton Crater\
    \ area. Other experiments included a geophysical analysis of Haughton Crater which\
    \ answered key questions on the physical characteristics of the 20-million year\
    \ old meteor crater and examined microfossils in crater soil deposits. Logistics\
    \ and engineering experiments are also conducted."
  status: ACTIVE
