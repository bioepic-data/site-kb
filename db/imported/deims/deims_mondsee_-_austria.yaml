  description: The site Mondsee is part of the European Level II Forest Monitoring
    System in the frame of the International Co-operative Programme on Assessment
    and Monitoring of Air Pollution Effects on Forests (ICP Forests). This site is
    one out of 16 Austrian Level II sites; it was established in 1995 and is, since
    2006, part of the LTER Austria network. The site is situated about 25 km east
    of the city of Salzburg  at 850 m a.s.l., in a mixed  about  25 year old spruce
    broadleaved forest.
