  description: "Adam Mickiewicz University staff has studied the area since 1984,\
    \ using the old hut Skottehytta as a base until 2009. In 2011, a temporary station\
    \ was built nearby. It was moved to the western coast of the bay and expanded\
    \ to the current size in 2015. The station consists of two 10 m2 bedroom barracks\
    \ and one kitchen/living room/laboratory facility (18 m2). In between them, during\
    \ the summer, a tent hall (40 m2) is raised. Electricity is from fossil fuel generator\
    \ (230 V) and solar panels (12 V). Supplies to the station (equipment, food and\
    \ fuel) are brought from Poland at the beginning of summer or bought in Longyearbyen.\r\
    \nScientific investigations at the station are cover monitoring of both biotic\
    \ and abiotic compartments of the natural environment. Meteorological surveys\
    \ are based on stationary observations at the station, as well as automatic weather\
    \ stations around the bay. Sites of permafrost studies, comprising ground temperature\
    \ measurements are established and during the summer glaciological, hydrological,\
    \ geomorphological, geological, geochemical, botanical observations are performed.\
    \ Data are acquired according to standards of the Polish Governmental Integrated\
    \ Monitoring system."
  status: ACTIVE
