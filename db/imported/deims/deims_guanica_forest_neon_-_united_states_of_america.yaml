  description: The Guánica Dry Forest Reserve (GUAN) is a terrestrial NEON field site
    located in a subtropical dry zone along the southern coast of Puerto Rico. The
    34.9km2 (8630 acre) site is encompassed within the Guánica State Forest and Biosphere
    Reserve and managed by the Commonwealth of Puerto Rico’s Department of Natural
    and Environmental Resources. The forest was designated as a Biosphere Reserve
    by the United Nations in 1981 and supports numerous global ecological research
    programs. The area is characterized by low annual rainfall and high evapotranspiration.
    Plant species along the reserve include cacti, grasses, and shrubs and the forest
    has of areas with semi-evergreen, deciduous and scrub trees. This location is
    part of the NEON Atlantic Neotropical Domain (D04), which includes the island
    of Puerto Rico and the southern tip of Florida. The Domain includes one additional
    terrestrial field site and two aquatic field sites.
