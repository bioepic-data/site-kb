  description: "KLRS is located at the shore of Kluane Lake in the southwest corner\
    \ of the Yukon Territory, Canada. The study area traverses First Nations Traditional\
    \ Territories, public land, and the Kluane National Park and Reserve. The National\
    \ Park is a UNESCO World Heritage Site.\r\n\r\nKLRS has hosted a wide variety\
    \ of disciplines over the last 50 years. The main projects have been related to\
    \ geology, glaciology and geophysics in the ice-field region, high-altitude physiology\
    \ on Mt. Logan, a massive collaborative project investigating interactions within\
    \ the boreal forest over several decades, climate modelling, and remote sensing\
    \ throughout the region. The KLRS Bibliography can be accessed via www.arctic.ucalgary.ca/research/kluane-lake-research-station.\
    \ The Arctic Institute of North America also maintains a major data base called\
    \ ASTIS and publishes the quarterly journal “Arctic”."
  status: ACTIVE
