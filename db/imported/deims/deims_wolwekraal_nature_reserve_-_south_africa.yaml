  description: The field site comprises 123 ha of natural Karoo shrubland. The Dorpsrivier
    passes through the nature reserve. Habitats include exposed Ecca mudstone plains,
    a north-facing ridge, pockets of aolian sand, and quatzite pebble bed conglomerate
    along the levees of the Dorpsrivier. The field site has been fenced to exclude
    domestic livestock since the 1970s.
