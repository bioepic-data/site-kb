  description: The Wando Arboretum Forest (34° 31" N, 126° 75" E) was established
    in the Wando arboretum, Gunoe-myeon, Wando-gun, Jeollanam-do, Korea, and belongs
    to the warm-temperate forest region. The long-term (1981-2010) annual mean temperature
    and precipitation were 14.1 °C and 1532.7 mm. The dominance of the Quercus acuta
    is the highest, and the evergreen broad-leaved trees such as Castanopsis sieboldii,
    Machilus thunbergii, Neolitsea sericea, and Cinnamomum yabunikkei are mixed at
    a very high density. The value of Wando evergreen forests is considerably high
    because the temperate species in the southern temperate zone are attracting attention
    as an alternative to climate change adaptation.
