  description: The Experimental Research Station in Bad Lauchstädt allows scale-dependent
    experimental investigations of different ecological systems in climatic chambers,
    heated and unheated greenhouses as well as in field sites on an area of 40 ha.
    The experiments contribute to a better understanding of the complex relationships
    in the soil-plant-atmosphere system. In particular, factors arising from the changes
    in land use, climate and species pool system are investigated. Thus, the experimental
    station Bad Lauchstädt is the experimental basis for numerous departments of the
    UFZ.
