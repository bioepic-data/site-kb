  description: Niakhar is a complementary site of the AMMA-CATCH observation network,
    that has been set up to study the longitudinal gradient over West Africa in comlement
    to the mesoscale sites. It is located in central Senegal, under Sahelian climate
    in a rural area, 150 km from Dakar. The studies focus on meteo/vegetation interactions
    in a cultural complex. The AMMA-CATCH site is coupled with the "long-term Collaborative
    Observatory on agroforestry ecosystem services", managed by partners since 2018.
