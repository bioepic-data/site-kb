  description: "MIXED NORWAY SPRUCE AND BEECH FOREST ON POHORJE MOUNTAINS IN SLOVENIA.\r\
    \nThe mixed spruce and beech mountain forest is located in the Pohorje mountains,\
    \ North-East Slovenia. The site is core plot of the ICP Forests - the International\
    \ Co-operative Programme on Assessment and Monitoring of Air Pollution Effects\
    \ on Forests operating under the UNECE Convention on Long-range Transboundary\
    \ Air Pollution (CLRTAP) – monitoring network. The site located at 1289 m above\
    \ sea level and consists of a 1 ha plot of mixed Fagus sylvatica (L.) and Picea\
    \ abies (Karst) forest. Bedrock material is Dioritoid (Tonalite) and the soil\
    \ was classified as Dystric Cambisols (WRB 2007).\r\nThere are ongoing measurements\
    \ of Crown condition, Foliar analysis, Soil survey, Soils solution analysis, Increment\
    \ measurements, Ground vegetation assessment, Deposition measurements, Meteorological\
    \ measurements, Tree Phenological observations, Air quality monitoring, etc."
