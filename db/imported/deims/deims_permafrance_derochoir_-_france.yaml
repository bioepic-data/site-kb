  description: The Derochoir rockglacier is situated above the village of Les Houches,
    in the western part of the Mont Blanc massif (France). It is one the very few
    rockglaciers in the Mont Banc massif. It is a small rockglacier with a suspended
    front, overhanging the torrential catchment of the Arandellys torrent, which flows
    through the village of Les Houches and eventually caused flooding of parts of
    the village.
