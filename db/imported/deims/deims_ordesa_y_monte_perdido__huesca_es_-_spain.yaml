  description: "The Ordesa and Monte Perdido National Park (OMPNP) lies in the Southern\
    \ slopes of the Central Pyrenees. It is in bounded to the north by the French\
    \ border, and comprises 4 deep valleys occupying 15.608 ha: Ordesa, Añisclo, Escuaín\
    \ and the upper part of Pineta. The peripheral part spreads over 19.679 ha more,\
    \ and extends along parts of other valleys: Bujaruelo, Vió, Puértolas, Pineta,\
    \ and La Larri.\r\n\r\nThe ice and the water constitute the main eroding agents\
    \ responsible for the landscape: glaciar valleys (U shape), river valleys (V shape),\
    \ deep canyons, mountain lakes… Despite most of the park is dominated by the alpine\
    \ belt and subalpine grasslands, the impressive orography creates a mosaic of\
    \ small areas covered by contrasted ecological systems. Such environmental heterogeneity\
    \ promotes a high diversity (1400 plant species). Two particular geomorphological\
    \ processes are noticeable in the park: glaciar and periglacial processes and\
    \ karstic dynamics. The Monte Perdido ice masses are the only ones that can be\
    \ considered as glaciers, and they are composed of two separate bodies that have\
    \ been greatly reduced during the last decades. Because of the carbonate nature\
    \ of the bedrock, karstic processes are very active in the Park and are the main\
    \ control of its hydrogeology."
