    country: Israel
    elevation_meters: 450.0
  description: "The Kedoshim-forest Long Term Ecological Research (LTER) is an experimental\
    \ set up established in 2008 in a mature Pinus halepensis forest. This long-term\
    \ research was designed to address silvicultural issues related to the management\
    \ of mature, first generation, man-made, pine forest ecosystems in Israel and\
    \ the design of their next generations as sustainable multiple-use forests. The\
    \ Kedoshim LTER site is part of the Israeli LTER network - MAARAG.\r\nThe Kedoshim\
    \ LTER site provides a comprehensive well designed experimental infrastructure\
    \ to study long-term effects of silvicultural manipulation (specifically overstory\
    \ thinning) on vegetation dynamics, forest structure and ecosystem function. Four\
    \ overstory thinning treatments were applied within 70×70 research plots: 1) clear\
    \ cut, 2) heavy thinning – 100 tree ha-1 (65% reduction in stem basal area), 3)\
    \ moderate thinning – 300 tree ha-1  (35% reduction in stem basal area) and, 4)\
    \ control with no thinning – ca. 500 tree ha-1. Additionally, adjacent non-forested\
    \ area was assigned as a reference. Climate and microclimate and various aspects\
    \ of vegetation dynamics, forest function and biodiversity are monitored continuously\
    \ since the application of thinning treatments."
