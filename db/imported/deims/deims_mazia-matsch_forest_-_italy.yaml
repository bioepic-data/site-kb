  description: The forest in the Mazia-Matsch Valley is predominantly made up of European
    larch and Swiss stone pine. Several units have been installed to measure sap flow
    in the stems and to monitor tree growth using automatic dendrometers. The data
    collected are used to investigate the influence of climate factors on the common
    coniferous species in the area.
