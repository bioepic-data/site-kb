  description: The national park Hunsrück-Hochwald is situated in the north-east of
    the nature park Saar-Hunsrück. 90 percent of the national parks area belong to
    Rhineland-Palatinate and 10 percent to the Saarland. Founded in March 2015, it
    is Germanys youngest national park. The basis of its foundation has been a treaty
    between Rhineland-Palatinate and the Saarland, which was passed through in January
    2015. The special quality of the foundation is shown in the successful public
    participation. The national park contains the biggest occurance of wildcats in
    Europe. The visitor can see a great woodrush beech forest with moors, rocks and
    meadows of arnica. Because of the fact, that the forest is left to his own ressources,
    it offers safe and natural habitats to rare animal and plant species which can
    be observed. Furthermore, data about the condition of the forest, the air quality
    and analyses of bodies of water are collected, too.
