  description: Ordway-Swisher Biological Station (OSBS) is a terrestrial NEON field
    site located in Putman County, Florida about 20 miles east of Gainesville. It
    is located within the Ordway Swisher Biological Station (OSBS), a 38.5 km2 (9500
    acre) property owned and managed by the University of Florida as a biological
    research center. The OSBS site is managed to maintain intact longleaf pine ecosystem,
    one of the historically dominant forest types in the region. It is encompassed
    within the NEON Southeast Domain that is bounded by the Atlantic Ocean on the
    east and the Gulf of Mexico to the west. The Domain features a patchwork of forest,
    grassland, and wetland communities embedded in a matrix that is increasingly dominated
    by a fast-growing human population. The Domain hosts five other NEON field sites,
    including three aquatic and two additional terrestrial sites, located in Florida
    and Georgia. OSBS is colocated with two aquatic field sites, Barco Lake (BARC)
    and Suggs Lake (SUGG).
