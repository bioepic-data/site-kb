  description: 'The mooring A is located in an open sea area close to Franklin Island,
    characterized by both clay bottom sediment and a flat morphology. The station
    can be considered as representative of the productivity and sedimentary conditions
    of the southern part of the Ross Sea, one of the areas considered to be affected
    by greater productivity rate.The study of mooring can be consider part of the
    activities conduct in the framework of the research project "ABIOCLEAR - Antarctic
    biogeochemical cycles - climatic and paleoclimatic reconstructions. (Resp. M.
    Ravaioli)". Such Project is the natural prosecution of previous research activity
    carried out from 1987. Objectives : Study of the particle fluxes towards the marine
    bottom sediment, in particular with the aim to obtain quali/quantitative estimate
    of the biogenica component coming from the primary production. Analysis of the
    vertical rain rate processes and, therefore, the marine cycle of the main biogenic
    particles such as Carbon and Silica. Try to obtain mass budgets of these parameters,
    estimating their cycle in the water column until the burial processes in sediments.
    From apparent accumulate rate calculated in the bottom sediment we will tried
    to discriminate the real vertical fluxes (Rain Rate) from the horizontal input
    from sediment remobilization processes. Acquisition and elaboration of long time
    series of data. Collection of bottom Sediment samples to estimate the variations
    of the productivity and the paleoproductivity in the area. Historical time series
    of Mooring A: Primary productivity data (every three years), fitoplancton, New
    and regenerated productivity, Seasonal, annual and interannual fluxes measure,
    monthly Particles samples, current velocity, water salinity, temperature and torbidity,
    Water-sediment interface measure. Biogeochemical parameters. Radiometrical Data,
    Mineralogical and grain size characterization.  Nutrient, metals. Biostratigraphy
    interpretations. Lidar data are also available from 1997.'
