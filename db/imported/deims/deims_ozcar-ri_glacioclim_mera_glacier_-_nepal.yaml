  description: "Mera glacier (MER) is located in Nepal, near the Khumbu valley. This\
    \ glacier is free debris cover. Mas sbalance and dynaic measurements were initiaited\
    \ in 2007. In addition, meteorological observations complete the data base. 2\
    \ weather stations are on the moraine and on the glacier itself. MER is a part\
    \ of the French Glacier Observatory GLACIOCLIM/CRYOBS-CLIM.\r\n\r\nAll the series\
    \ on Mera glacier (MER) are unique and necessary for glaciological studies because\
    \ Himalaya is still partly unknown in terms of future evolution. Data permit to\
    \ calibrate models in order to determine future glacier evolution. Mera data are\
    \ also unique to test hydrological model in the catchment."
