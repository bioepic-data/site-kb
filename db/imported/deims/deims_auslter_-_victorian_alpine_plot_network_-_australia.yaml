  description: "The Victorian Alpine Plot Network is located in Victoria’s Bogong\
    \ High Plains and other high plains and mountain summits.\r\n\r\nTemporal visits\
    \ generally range from every 3 to 10 years with some plots are surveyed annually\
    \ during initial monitoring.\r\n\r\n Between 2012 and 2018 the Victorian Alpine\
    \ Plot Network was a member of Long Term Ecological Research Network (LTERN),\
    \ Australia, a facility of the Australian Government's Terrestrial Ecosystem Research\
    \ Network (TERN)."
