  description: "This site is the university forest of Kochi University with an accommodation\
    \  for 60 persons located close to the forest.\r\n60 % and 40% of the area was\
    \ covered with conifer plantations (Japanese cedar and Japanese cypress) and secondary\
    \ broad-leaved forests (both evergreen and deciduous, regenerated from charcoal\
    \ production), respectively. The conifer plantation consists of small patches\
    \ of various aged stands from just after planting to about 100 years of age. Now\
    \ we are on the way of preparering a  patchwork of vegetation  at various stages\
    \ of  succession. The small scale vegetation patchwork may be a distingushing\
    \ feature of this site."
