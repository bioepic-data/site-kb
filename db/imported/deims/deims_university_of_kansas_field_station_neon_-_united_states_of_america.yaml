  description: 'UKFS is a terrestrial NEON field site located approximately 9 km (5.5
    mi.) north of Lawrence, KS, near the eastern border of the state. The 6.2 km2
    (1530 acre) site is encompassed within the University of Kansas Field Station,
    a biological field station owned and managed by KU. The location lies along an
    eastern deciduous forest and tallgrass prairie transition zone. The surrounding
    region consists of grasslands, forests, and agricultural land cover types and
    includes the largest remaining areas of unplowed tallgrass prairie in North America.
    Our UKFS site is part of the NEON Prairie Peninsula Domain (D06), which stretches
    from Kansas through Nebraska and Iowa to southern Minnesota, and moves east to
    encompass Illinois and most of Indiana. The Domain hosts four other NEON field
    sites: two aquatic and two additional terrestrial, all of which are located in
    Kansas. Land use and land use management are key grand challenge themes for this
    Domain.'
