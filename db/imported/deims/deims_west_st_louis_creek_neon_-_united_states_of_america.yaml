  description: West St. Louis Creek (WLOU) is an aquatic site within the 93 km2 (23,000
    acre) Fraser Experimental Forest near Winter Park, Colorado. It is a high elevation
    mountain stream at around 2902 m (9521 ft.) just west of the Continental Divide.
    The streams drains a 4.9 km2 (1210 acre) watershed and the forest is managed by
    the U.S. Forest Service. A water diversion feature is present just downstream
    of WLOU, and aids in bring water from Saint Louis and Vasquez Creeks to the City
    of Denver. WLOU is part of NEON's Southern Rockies and Colorado Plateau Domain
    (D13). D13 has one other aquatic site and two terrestrial sites. WLOU is not colocated
    with a terrestrial site.
