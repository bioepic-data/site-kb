  description: "Hydrometeorological and hydrosedimentary observations within 3 embedded\
    \ catchments: Gazel, Claduègne and Auzon (3.4, 43, and 116 km²).\r\nMediterranean\
    \ climate with heavy rainfall and flash floods in automn.\r\nThe upper part of\
    \ the catchment is characterized by basalt formations, after which a sharp transition\
    \ occurs where the lower two thirds is made up of sedimentary limestone rock.\
    \ The soil types are heavily infuenced by the geology of the catchment. \r\nMain\
    \ land use types are pastures,vineyards and forest.\r\nMore information at http://mistrals.sedoo.fr/?editDatsId=1438"
