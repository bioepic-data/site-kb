    name: Puergschachen Moor - Austria
  location:
    latitude: 47.5806
    longitude: 14.3444
    country: Austria
    elevation_meters: 632.0
  description: "The Pürgschachen Moor is located on the bottom of the Styrian Enns\
    \ valley, about 1.5 km southwest of the village Ardning in the district of Liezen\
    \ at an altitude of 632 m a.s.l. It is a pine peat bog with a present extent of\
    \ about 62 ha. Thus, it is the biggest (to a large part) intact valley peat bog\
    \ of Austria with a closed peat moss cover and a good example of the formerly\
    \ widely distributed peatlands of inner-alpine valleys. The peat bog site is property\
    \ of the Benedictine monastery Admont and is leased to the Moorschutzverein Pürgschachen\
    \ for an indefinite period of time. An EU Life-project were conducted in the years\
    \ 1995 to 1998. Since 1991, the peat bog is part of the international and intergovernmental\
    \ treaty of the Ramsar Convention, constituting a convention on wetlands for the\
    \ conservation and wise use of wetlands and their resources. As a part of the\
    \ network of nature protection areas Natura 2000 the site is protected as European\
    \ nature reserve and mentioned as Important Bird Area. \r\nGenesis of such valley\
    \ floor bogs is owed to the incurrence of postglacial lakes on impermeable loamy\
    \ clay. The open water surfaces silt up due to the sedimentation of dead plant\
    \ material. Therefore, peat bogs with a peat depth up to 6 meters could evolve\
    \ from these terrestrialisation mires in the course of time. Mean average temperature\
    \ of Admont is 6.6°C, annual precipitation is 1400 mm (1971-2000). The typical\
    \ vegetation of the peat bog is constituted of the three associations of plants\
    \ Pino mugo-Sphagnetum magellanici (pine peat bog association), Sphagnetum magellanici\
    \ (coloured bog moss association), and Caricetum limosae (bog sedge association),\
    \ depending on the prevailing hydrological (local) site conditions. The peat material\
    \ of the peat bog can be separated into three different peat layers: Muddy-peaty\
    \ deposits, Carex-rich Sphagnum-Eriophorum-peat, and Ericaceous-poor Sphagnum-Eriophorum-peat.\
    \ \r\nThe focus of our research at the study area Pürgschachen Moor is the investigation\
    \ of carbon fluxes and a full carbon balance measured by eddy covariance technique.\
    \ Based on the sampling of undisturbed peat cores potential gas releases measured\
    \ in the laboratory can be compared with the data measured in field. The examination\
    \ of peat properties, water table measurements, vegetation surveys, and climate\
    \ data are further important variables. The Pürgschachen Moor is the first peat\
    \ bog in the Alpine region getting investigated in detail regarding its carbon\
    \ budget and is supposed to provide extensive information for the assessment and\
    \ differentiation of alpine peat bogs."
