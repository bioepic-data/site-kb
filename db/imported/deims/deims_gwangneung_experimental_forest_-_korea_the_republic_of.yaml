  description: The GEF (37° 44" 39' N, 127° 9" 22' E) is a well-preserved forest located
    in the central temperate forest sub zone of Gyeonggi-do, Korea. It has been managed
    since the Joseon Dynasty, and public access to this area is currently controlled
    for the purpose of preserving the experimental forest. The long-term (1981-2010)
    annual mean temperature and precipitation of this site were 11.5 °C and 1438.2
    mm. The dominant woody plants are Quercus serrata, Carpinus laxiflora, Quercus
    mongolica, Cornus controversa, and Pinus koraiensis in GEF. A multidisciplinary,
    collaborative research is being carried out at GEF. In addition, it was officially
    registered with the internal and external flux research networks (KoFlux, FluxNet,
    and AsiaFlux), and was therefore called Super Site.
