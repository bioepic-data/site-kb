    latitude: 21.05
    longitude: -90.0
    country: Mexico
    elevation_meters: 0.0
  description: 'El área de estudios del grupo Ecopey se encuentran lagunas y dunas
    costeras, manglares, selvas  bajas inundables y petenes, que forman un interesante
    mosaico de hábitats bien conservados; se encuentran también sabanas, áreas de
    uso agropecuario y centros de población. En la región se encuentran tres áreas
    protegidas: la Reserva Estatal El Palmar y la Reserva de la Biosfera Ría Celestún
    en el estado de Yucatán y la Reserva de la Biosfera de los Petenes en el norte
    del estado de Campeche. La diversidad de ambientes permite diseñar experimentos
    de largo plazo sobre los efectos de eventos naturales e impactos antrópicos sobre
    la estructura y funcionamiento de ecosistemas costeros.'
