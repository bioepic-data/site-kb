  description: The Joseph Jones Ecological Research Center (JERC) is a terrestrial
    NEON field site located within the Lower Coastal Plains and Flatwoods areas in
    southern Baker County, Georgia. The 117 km2 (29,000 acre) reserve is privately
    owned and managed by the Robert W. Woodruff Foundation. The site is characterized
    by longleaf pine habitats mixed with patches of hardwood deciduous forest and
    wetlands. It is encompassed within the NEON Southeast Domain that is bounded by
    the Atlantic Ocean on the east and the Gulf of Mexico to the west. The surrounding
    region is a patchwork of forest, grassland, and wetland communities embedded in
    a matrix that is increasingly dominated by a fast-growing human population. The
    Domain hosts five other NEON field sites, three aquatic and two additional terrestrial
    sites, located in Florida and Georgia. JERC is colocated with the FLNT aquatic
    field site, on the eastern boundary of the center.
