  description: 'Treehaven (TREE) is a NEON terrestrial field site located in Lincoln
    county, Wisconsin between the cities of Rhinelander and Tomahawk. The 4.7 km2
    (1160 acre) site is hosted and operated by the University of Wisconsin – Stevens
    Point (UWSP), College of Natural Resources. The primary land cover types at this
    site are woody wetlands, mixed forest and deciduous forest. This site is approximately
    1.6 km (1 mi.) south of the relocatable terrestrial site Steigerwaldt (STEI),
    which is managed by Steigerwaldt Land Services, Inc. The close proximity and different
    management plans for the two sites could lead to valuable data on the effects
    of different management practices on carbon cycling dynamics. TREE is located
    within NEON''s Great Lakes Domain (D05), which includes northern Ohio, Michigan,
    northern Wisconsin, and parts of Indiana and Illinois. D05 hosts four other NEON
    field sites: two aquatic and two terrestrial, located in Wisconsin and Michigan.'
