  description: The permanent grassland (mesophytic hay meadow) of around 40 ha is
    unfertilized since 1987 and is extensively managed (one to three cuts per year
    for fodder and hay production, occasional cattle, sheep or horse grazing in autumn).
    Typical plant species are couch grass (Elymus repens (L.) Gould ), meadow foxtail
    (Alopecurus pratensis (L.)), yarrow (Achillea millefolium), common sorrel (Rumex
    acetosa) and white clover (Trifolium repens). The organic soil horizon (ABhw)
    is characterised as silty loam. The B horizon shows mainly medium clayey loam
    and medium clayey silt. The site is located in the suboceanic/subcontinental climate
    (Cfb). The grassland is surrounded by forest (up to 30 m). So, the fetch is restricted
    to 530 m (N), 250 m (W), 470 m (S) and 350 m (E), respectively. However, footprint
    investigations considering the site represents the specified target land cover
    type very well.
  status: ACTIVE
