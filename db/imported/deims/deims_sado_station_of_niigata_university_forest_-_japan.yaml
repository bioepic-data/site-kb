    country: Japan
    elevation_meters: 600.0
  description: NUF (500ha), which is in the Faculty of Agriculture of Niigata University,
    is located on Osado Mountains in Sado Island. NUF was found on 1955 and it has
    been used mainly for education and research of forestry and forest science. NUF
    has been noted for huge, long-lived conifer timbers (Cryptmeria japonica), two
    endemic mammals (Lepus brachyurus lyoni and Sorex sadonis), an endemic beetle
    (Damaster blaptoides capito), and many endangered perennial flowers. Four investigators
    and Seven technicians are engaged in the station.
