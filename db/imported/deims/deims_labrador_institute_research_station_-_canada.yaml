  description: "The facility is new but is seeing an increasing amount of use. The\
    \ station is co-located with the College of the North Atlantic and the NWR Community\
    \ Library, and includes employee and general office space, large board room, scientific\
    \ laboratory, GIS/social science laboratory, general (wet) laboratory, archaeology\
    \ lab, accommodation for four people, full kitchen and dining area, and storage\
    \ and laundry space. Our primary scientific lab is currently being developed.\
    \ Equipment includes: digital balances, a variety of microscopes, incubators,\
    \ sample freezer, water purification, pH testing kit, centrifuge, digestion block,\
    \ water bath, large volume stirrer, portable ventilation system, etc. There are\
    \ more than seven work stations, sinks, teaching area, and lots of open space\
    \ for further development. Also included: satellite internet and telephone service.\r\
    \n\r\nLIRS is just coming online, but the Labrador Institute (LI) has a long history\
    \ of research in Labrador in many disciplines, including but not limited to health\
    \ research, arts and culture, social programs, climate change, archaeology, education,\
    \ mining and resource development history, migratory birds, and land mammals.\
    \ Currently, the LIRS is supporting and/or taking part in climate change research,\
    \ land use studies, interior archaeology, archaeological mitigation, addictions\
    \ awareness, aquatic ecology, soil amendment research, and mine tailings remediation.\
    \ LIRS and LI are currently undergoing a period of significant growth. As a result,\
    \ we will increase our capacity in environmental studies, climate change, earth\
    \ sciences, anthropology, archaeology, and geography. We will also be starting\
    \ an artist in residence programme."
  status: ACTIVE
