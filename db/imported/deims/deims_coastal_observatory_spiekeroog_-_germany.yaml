  description: "The basis for the Spiekeroog Coastal Observatory (SCO) was established\
    \ in 2002 as the Time Series Station Spiekeroog. The Coastal Observatory seized\
    \ preceding research initiatives and grew continuously to the recent observational\
    \ infrastructure including a multitude of elements and parameters.\r\n\r\nToday,\
    \ the SCO and the conducted research around, improve our understanding of environmental\
    \ change and anthropogenic impacts on coastal areas along the land-sea interface.\
    \ The unique characteristic of the SCO can be found within this interdisciplinarity\
    \ of the element sites operated in the largest tidal flat region worldwide."
