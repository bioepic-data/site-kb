  description: "The LTSER Platform Pannonischer Raum represents the entire area of\
    \ the federal state of Burgenland in Austria an so the Pannonian Region. \r\n\r\
    \nLocated on the eastern edge of the alps and the western edge of the small hungarian\
    \ plain the area is one of Austria’s hotspots of biodiversity. Alpine, asian,\
    \ mediterranean and nordic species are present as well as endemics.  The high\
    \ diversity of habitats results from a high variability of environmental factors\
    \ as different soil types, flooding and draught but also anthropogenic influence.\r\
    \nIt also represents Europe‘s most western steppe lake - Lake Neusiedl (Austria)\
    \ - and the cultural landscape that it’s surrounded by. It extends a total area\
    \ of about 500 km² and is characterized by the steppe lake, it’s reed belt and\
    \ a mosaic of salt marshes, periodically dry saline lakes, sand habitats, dry\
    \ and wet grasslands, vineyards, cropland, touristic infrastructure and rural\
    \ settlements. The region (average altitude 120 m.a.s.l.) is characterised by\
    \ a hot, dry Pannonian climate with an annual precipitation of 600 mm and temperatures\
    \ between 40 °C in summer and -20 °C in winter, making this area unique in Austria\
    \ and contrasts the alpine landscapes of western Austria.\r\n\r\nThe LTSER Platform\
    \ Pannonischer Raum, in turn, attempts to cover all socio-ecological aspects across\
    \ the north and south of the federal state and to ensure that these are recorded\
    \ in a representative and comparable manner. \r\nThe aim of the research is to\
    \ provide decision-making tools for sustainable ecosystem management and conservation\
    \ as well as sustainable regional development fort the entire area of Burgenland."
