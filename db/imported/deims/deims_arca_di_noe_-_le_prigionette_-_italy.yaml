  description: The site Arca di Noe - Le Prigionette (ICOS site code IT-Noe) is located
    in the Porto Conte Regional Natural Park, inside a public area of about 1200 hectares,
    about 20 km west of Alghero in the province of Sassari (Sardinia, Italy). The
    characteristic Macchia Mediterranea is the typical ecosystem of this station,
    including species as Juniperus phoenicea L., Pistacia lentiscus L., Phillyrea
    angustifolia L., Genista spp., Rosmarinus officinalis L., Chamaerops humilis L..
