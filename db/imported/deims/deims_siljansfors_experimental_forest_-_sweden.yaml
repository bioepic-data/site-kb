  description: Siljansfors Experimental Forest (1 520 ha) is a research facility within
    the Swedish University of Agricultural Sciences. It is situated in the central
    parts of Sweden (latitude 60º 53´ N, longitude 14º 24´ E) and was established
    in 1921. The area is dominated by productive forests (1 362 ha) of Scots pine
    (Pinus sylvestris), Norway spruce (Picea abies) and birch (Betula pendula and
    Betula pubescens). There are also wet lands, lakes, ponds and streams. The mean
    annual temperature is 3.3 degrees Celsius, the annual mean precipitation is 674
    mm, and the mean snow coverage is 150 days per year. The soils are dominated by
    various types of moraine with porphyry, granite, diabase, clayey slate, quartzite
    and sandstone/conglomerate as the most common rocks in the moraine/till. Siljansfors
    has a rich history of forest fires, particularly during the 18th and 19th centuries.
    The Experimental Forest has suffered from at least 24 considerable storms during
    its 90 year history.
