  description: The JJI (33° 18" 45' N, 126° 32" 31' E) belongs to a warm-temperate
    forest. However, Mt. Hallasan is the highest mountain in South Korea (1,950 m),
    and is surrounded by the sea. The long-term (1981-2010) annual mean temperature
    and precipitation were 16.6 °C and 1923 mm. The evergreen broad-leaved forests
    were found in the coastal area, sub-alpine species were found in the vicinity
    of the summit, and various habitats were found depending on the altitude. Unlike
    other survey sites, many evergreen broad-leaved species are growing in this site,
    but most of the forests, except for the highlands, have been severely damaged
    by the development of ranches and production of wood for mushroom cultivation.
    Therefore, the remaining evergreen broad-leaved forests are not large. Major species
    growing in these forests include Quercus acuta, Camellia japonica, and Carpinus
    laxiflora.
