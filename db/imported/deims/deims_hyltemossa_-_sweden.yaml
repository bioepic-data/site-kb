  description: The station Hyltemossa, with ICOS code SE-Htm, is located in southern
    Sweden. The site is a evergreen needleleaf managed forest located in a temperate,
    maritime climate. The forest in the target area composed of two stands, 29 and
    34 years old, and dominated by Picea abies (L.) H.Karst (Norway spruce) with a
    small fraction of Betula spp. (birch) and single occurrence of Pinus sylvestris
    L. (Scots pine). Understory vegetation is sparse. The forest floor is mainly covered
    by moss.
  status: ACTIVE
