  description: "Marine environment consisting of Coralligeneous outcrops of variable\
    \ extension (from the few square meters of the smallest outcrops up to over a\
    \ thousand square meters)\r\nlocally called tegnùe or tresse. It is possible to\
    \ identify outcrops of great extension and discrete elevation that constitute\
    \ the only hard substrates of natural origin in a\r\nmainly sandy-silty bottom.\
    \ The presence of these structures provides a support on which sessile organisms\
    \ can be installed. The occasional presence of Chelonia mydas has been found,\
    \ although with non-significant populations.\r\nOn 3 August 2002, Zona di Tutela\
    \ Biologica - ZTB was established by Ministerial Decree. Both professional and\
    \ sport fishing are prohibited and recreational diving is regulated, allowing\
    \ anchoring exclusively to special buoys upon notice to the association that manages\
    \ it."
  notes: 'Biogeographical region: continental'
  status: ACTIVE
