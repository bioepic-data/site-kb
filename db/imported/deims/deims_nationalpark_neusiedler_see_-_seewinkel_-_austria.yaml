  description: "The Neusiedler See - Seewinkel National Park is the first cross-border\
    \ National Park in Austria and the first Austrian National Park recognised by\
    \ the IUCN. It covers in total about 90km² on Austrian territory. About 50% of\
    \ the area (about 4500 ha) is a Nature Reserve Zone, which remains untouched by\
    \ humans. This zone is dominated by the southernmost Austrian part of the reed\
    \ belt from Lake Neusiedl. The Conservation Zones are mainly cultural landscapes\
    \ and require landscape conservation measures and habitat management like pasturing,\
    \ mowing, cutting reed or water retention. These measures are taken to preserve\
    \ the cultural landscape and its biodiversity that has developed over centuries.\
    \ Important habitats like 160 km² of reed belt and around 40 periodically dry\
    \ soda lakes, as well as sand habitats, dry and wet meadows can be found closely\
    \ associated with vineyards, cropland, touristic infrastructure and rural settlements.\
    \ \r\n\r\nLong-term monitoring programs regarding bird populations, fish ecology\
    \ or the grazing management enable the cross-border National Park Neusiedler See\
    \ - Seewinkel to provide biological data from flora and fauna. Furthermore, all\
    \ soda lakes are monitored frequently regarding salinity, oxygen, temperature,\
    \ color etc. and biological parameters such as species diversity and quantity\
    \ of macrozoobenthos.\r\n\r\nDue to the mosaique of protected and non-protected\
    \ areas, the boundaries of the National Park area are difficult to define on the\
    \ shown map."
