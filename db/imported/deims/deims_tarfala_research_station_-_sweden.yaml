  description: Tarfala Research Station is located at 1130 m a.s.l. in the high alpine
    Kebnekaise mountains, northern Sweden. The Tarfala valley catchment reaches from
    2100 to 500 m a.s.l. Vegetation spans high alpine flora, mountain heath and meadows
    and the upper mountain birch forest zone. The lake, rivers and glacier meltwater
    streams is  part of the headwaters for the unregulated Kalix River. The station
    was established in 1946 with the main aim to study  glacier massbalance. The best
    known glacier is Storglaciären which is one of the most well studied glaciers
    in the world. The glaciers and terrestrial and aquatic ecosystems formed by the
    harsch climate in this area is now changing rapidly. Over the years the environmental
    monitoring program has expanded and includes today mountain meteorology, water
    discharge and chemistry, permafrost and vegetation. The station belongs to Stockholm
    University and is part of the Swedish Infrastructure for Ecosystem Science (SITES).
