  description: "Located at the east entrance of Kananaskis Country, R.B. Miller and\
    \ Sheep River Stations are our research only facilities.\r\n\r\nR.B. Miller is\
    \ located within the Park gates of Sheep River Provincial Park and has a newly\
    \ constructed, off grid, 3-bedroom accommodation to sleep six researchers. The\
    \ energy efficient building has electricity via solar panels, running water during\
    \ the summer months, a composting toilet, and small office area. This station\
    \ is extensively used for animal behaviour studies (Bighorn Sheep and Columbian\
    \ ground squirrels) because of its isolated location and large nearby animal populations.\
    \ Access to R.B. Miller opens from May 15 - December 1st and winter access requires\
    \ additional permits. \r\n\r\nNew for 2019 is the Sheep River Site, outside of\
    \ the Park gates, to provide year-round accommodation to researchers. The mobile\
    \ home contains 3 bedrooms and sleeps 8 people with a kitchen facility and running\
    \ water. \r\n\r\nAt both locations, researchers are responsible for their own\
    \ meals and the general upkeep of the buildings. Limited wifi access is provided\
    \ and both sites do not have cell phone coverage nor telephone. There is a public\
    \ phone at the Sheep River Ranger Station approximately 10km from R.B. Miller\
    \ and adjacent to the Sheep pad site."
  status: ACTIVE
