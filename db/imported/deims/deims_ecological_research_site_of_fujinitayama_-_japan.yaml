  description: Fujinitayama site is in the Nasu Research station of NARO Institute
    of Livestock and Grassland science. This experiment started at 1974. In this site
    which was an abandoned pasture, M. sinensis had occupied at the start of this
    experiment. This site was divided into three plots, heavy grazing plot (144 head
    day ha–1 year–1), light grazing plot (73 head day ha-1 year-1), and control plot
    (non-treatment). In each plot, 20 quadrats were arranged and the coverage and
    height of all species were measured in every September. M. sinensis grassland
    which was adapted for mowing changed in Z. japonica grassland was adapted for
    grazing in both treatment plots. In addition, the dominant speed of Z. japonica
    in heavy grazing plot was higher than that of light grazing plot. However, Pinus
    densiflora invaded into all plots including a control plot. When P. densiflora
    was not cut down by man, it increased every year. So, it is difficult to maintain
    Z. japonica grassland only by cattle grazing.
