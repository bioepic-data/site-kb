  description: The site Mürzzuschlag is part of the European Level II Forest Monitoring
    System in the frame of the International Co-operative Programme on Assessment
    and Monitoring of Air Pollution Effects on Forests (ICP Forests). This site is
    one out of 16 Austrian Level II sites; it was established in 1995 and is, since
    2006, part of the LTER Austria network. The site is situated in the north-eastern
    part of the federal country Styria about 65 km north of the city of Graz at 720
    m a.s.l., in a 75 year old managed spruce forest.
