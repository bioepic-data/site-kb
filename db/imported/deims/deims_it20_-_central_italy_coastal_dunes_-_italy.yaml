  description: 'This site includes coastal dune ecosystems of Central Italy. The flora
    and the fauna of the site is highly specialized with a relevant ecological value.
    On the other side, the site includes one of the most threatened ecosystems at
    national and European level (highly endangered due to human pressure) and comprises
    Tyrrhenian and Adriatic coastal dunes. These areas were included in the Nature
    2000 network with many EU interest species. Major habitats are: Habitat 1210 (Annual
    vegetation of drift lines), Habitat 2110 (Embryonic shifting dunes), Habitat 2120
    (Shifting dunes along the shorelines with Ammophila arenaria, white dunes), Habitat
    2230 (Malcolmietalia dune grasslands) and the priority Habitat 2250 (Coastal dunes
    with Juniperus spp).'
