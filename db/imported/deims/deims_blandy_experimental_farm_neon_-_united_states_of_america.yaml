  description: The Blandy Experimental Farm (BLAN) is a terrestrial NEON field site
    located in Clarke County, Virginia, approximately 60 miles west of Washington,
    D.C. BLAN is subdivided between two locations, with 2.7 km2 (667 acres) at Blandy
    Experimental Farm and 3 km2 (741 acres) at Casey Tree Farm. The site includes
    a mix of land use types including woodland, hay fields, and tree nurseries. The
    surrounding region is characterized by general land use types including successional
    fields, pastures, woodlands, and small ponds. This site is located within NEON's
    Mid-Atlantic Domain (D02), a densely populated region bounded by the Atlantic
    Ocean on the east and stretching down the Eastern Seaboard from southern New Jersey
    to northern Georgia. The Mid-Atlantic Domain includes two other terrestrial sites
    and two aquatic sites. BLAN is located near the Lewis Run aquatic site.
