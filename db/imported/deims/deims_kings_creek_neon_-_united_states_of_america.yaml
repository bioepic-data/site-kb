  description: King's Creek (KING) is an aquatic NEON field site located in the Flint
    Hills region of Kansas just 10 km (6 mi.) south of Manhattan, KS. The site is
    encompassed within a 13.2 km2 (3260 acre) watershed within the Konza Prairie Biological
    Station, which is hosted by the Nature Conservancy and Kansas State University.
    It is a second-order creek that drains a watershed of mixed agricultural, pasture
    and tallgrass prairie land. The surrounding region consists of grasslands, forests
    and agricultural land cover types and includes the largest remaining areas of
    unplowed tallgrass prairie in North America. KING is part of the NEON Prairie
    Peninsula Domain (D06), which stretches from Kansas through Nebraska and Iowa
    to southern Minnesota, and east to encompass Illinois and most of Indiana. The
    Domain hosts four other NEON field sites, one other aquatic and three terrestrial,
    all of which are located in Kansas. KING is colocated with the KONA terrestrial
    field site. Land use and land use management are key grand challenge themes for
    this Domain.
