  description: The station Braunschweig (ICOS code DE-Brs) belongs to an agricultural
    research campus, which is used by several institutes and agencies. The main actors
    are three agencies of the Federal Ministry of Food and Agriculture (Thünen Institute,
    Julius Kühn Institute and Friedrich Löffler Institute) and the DWD (Deutscher
    Wetterdienst), which is Germany's National Meteorological Service and belongs
    to the Ministry of Traffic and Infrastructure. The fields north and south of the
    eddy tower are managed uniformly. At present, the vegetation is ryegrass (similar
    to a field further to the south-west), however, in previous years the fields were
    part of a crop rotation system, which is now restricted to the surrounding fields.
  status: ACTIVE
