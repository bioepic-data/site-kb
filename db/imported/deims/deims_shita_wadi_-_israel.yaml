    longitude: 35.127448549366
    country: Israel
    elevation_meters: 250.0
  description: A small watershed that collects floods and run-off. The lowest place
    is home to a (relativity) dense Acacia savana. The slopes are completely bare.
    The wadi is covered with alluvium resting on a 6 m layer of red surface of late
    Pleistocene, which includes silt, clay and fine sand. Rainfall is 30 mm
