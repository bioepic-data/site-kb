  description: "The area is located in the south part of Romania with the geographic\
    \ position of 24°51’12”-26°13’52” E longitude and 43°55’31”-44°49’32” N latitude.\r\
    \nThe Neajlov River and its catchment are a tributary and a sub-catchment of the\
    \ river Arges, which in turn is one of the main tributary for the lower Danube\
    \ river stretch. The Neajlov river catchment belongs also to the four administrative\
    \ units(counties) – Arges, Dimbovita, Giurgiu and Teleorman."
