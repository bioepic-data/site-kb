  description: This site is part of the BFW project "Klimaforschungswald". The aim
    of this research project is to evaluate which tree species will fullfil the important
    tasks and functions of the forest ecosystem in the future. Furthermore, temperature
    and precipitation fluctuations in particular are to be documented in order to
    be able to map a possible trend and the influence of the growing vegetation. The
    climate research forest is also intended to be a communication and recreation
    forest for the population, which can be experienced through an educational trail
    with display boards.
