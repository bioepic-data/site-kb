  description: In the framework of an initiative to advance biodiversity research
    in Germany, we established three exemplary large-scale and long-term research
    sites (funded by the German Research Foundation). They are termed Biodiversity
    Exploratories, in contrast to mainly descriptive observatories. The exploratories
    sustain the scientific infrastructure to develop the intellectual framework needed
    to address critical questions about changes in biodiversity and to evaluate the
    impacts of those changes for ecosystem processes. Thus, in the exploratories biodiversity
    and ecosystem research will be merged at a large scale and with a long-term perspective.
