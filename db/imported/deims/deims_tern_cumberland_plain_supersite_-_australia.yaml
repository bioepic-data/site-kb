  description: "The Cumberland Plain SuperSite is a member of the Australian SuperSite\
    \ Network (SuperSites, http://www.supersites.net.au/), a facility within the Australian\
    \ Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/). Cumberland Plain\
    \ SuperSite is located in remnant Eucalyptus woodland in the Cumberland Plain,\
    \ at the University of Western Sydney's Hawkesbury campus in Richmond, New South\
    \ Wales. Associated research extends into the Blue Mountains ecoregion. These\
    \ sclerophyll woodlands occur on nutrient-poor alluvium deposited by the Nepean\
    \ River from sandstone and shale bedrock in the Blue Mountains. Despite this they\
    \ support high regional biodiversity and endemic biota. Cumberland Plain woodland\
    \ is a critically endangered ecological community found only in the Sydney Basin\
    \ Bioregion. It faces major pressures including invasive weeds, altered fire regimes,\
    \ Western Sydney’s urban development, conversion to agriculture, and extreme climate\
    \ events. The vegetation structure and species composition in the core 1 ha consists\
    \ of a mix of Eucalyptus moluccana, Eucalyptus fibrosa and Melaleuca decora in\
    \ the overstorey and Bursaria spinosa dominating the understorey. \r\nThe traditional\
    \ custodians are the Darug peoples, and we invite all interested parties to work\
    \ with us and share their stories.\r\n\r\nKey research objectives include: \r\n\
    •\tWhat are the processes controlling biogeochemical fluxes and the impacts of\
    \ extreme climate events and\r\nclimate change on biodiversity, conservation management\
    \ and restoration of remnant Eucalyptus woodland\r\nand pastures of Western Sydney."
