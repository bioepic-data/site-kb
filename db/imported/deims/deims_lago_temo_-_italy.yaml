  description: Lake Temo (IT10-006-A) is located in north-west Sardinia. The construction
    of the dam began in 1971 and ended in 1984. The reservoir lies at 226 m a.s.l.
    and has an area of 4.81 km2, a mean depth of 15.8 m and a maximum capacity of
    91 x 106 m3. Its catchment extends for 142 km2.
