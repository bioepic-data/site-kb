  description: "Ossoue glacier (OSS) is located in the Pyrennees massif (France),\
    \ between 2750 and 3210 m altitude. The glacier is one of the last glacier in\
    \ this massif.This site is characterized by various glaciological parameters performed\
    \ annually : annual and seasonnal mass balance, ice velocity, ice thickness variation,\
    \ snout position.OSS is a part of the French Glacier Observatory GLACIOCLIM/CRYOBS-CLIM.\r\
    \n\r\nAll the series on Ossoue glacier (OSS) are unique and necessary for glaciological\
    \ studies. They permit to calibrate models in order to determine future glacier\
    \ evolution"
