    longitude: 4.647222
    country: Belgium
    elevation_meters: 30.0
  description: The site comprises 4 km stretch of a complete alluvial floodplane managed
    as a private nature reserve some 10 kilometer upstream of the city of Leuven.
    Since 1990, human interference in the river channel has stopped resulting in a
    spontaneous meander evolution and roughening of the river channel. This has induced
    frequent (e.g. yearly) inundations, thus avoiding flood damage in the city of
    Leuven downstream and this without creating the usual storm basins.
