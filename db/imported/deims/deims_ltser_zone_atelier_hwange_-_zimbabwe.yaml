  description: The LTSER Zone Atelier Hwange (ZAHWG) belongs to LTER-France network
    and is located in western Zimbabwe, in Sub-Saharan Africa, and is centered around
    Hwange National Park. The ecosystem is dominated by dystrophic savannas (mostly
    wooded savannas and dry woodlands) with discrete water sources. Surrounding land-uses
    include forestry areas, subsistence agro-pastoral farming, private ranches and
    hunting concessions, and mining. The ZAHG conducts an interdisciplinary research
    on the dynamics and resilience of this socio-ecological system organised, around
    a large protected area with re-known large mammal diversity and facing major social
    and climatic challenges for sustainable conservation
