    name: OZCAR-RI M-TROPICS, Dong Cao - Viet Nam
  location:
    latitude: 20.95569
    longitude: 105.48541
    country: Viet Nam
    elevation_meters: 248.0
  description: "Dong Cao is a small agricultural catchment (47 ha) of northern Vietnam,\
    \ located at 70 km from Hanoi, in a sloping land environment. The objective is\
    \ to monitor the impacts of land use changes (from cassava to fodder and tree\
    \ plantations) and possible climate changes upon hydrological and sedimentary\
    \ fluxes and budgets. The catchment has an elevation of 125 m to 485 m and slopes\
    \ range from 15 to 120%. Monitoring devices include an automatic meteorological\
    \ station, and weirs to monitor discharge, suspended sediment and bedload. More\
    \ information is available on https://mtropics.obs-mip.fr/ and in the following\
    \ paper:\r\nValentin, C., et al., 2008. Runoff and sediment losses from 27 upland\
    \ catchments in Southeast Asia: Impact of rapid land use changes and conservation\
    \ practices. Agric. Ecosyst. Environ. 128, 225–238. https://doi.org/10.1016/j.agee.2008.06.004"
