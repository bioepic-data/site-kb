  description: The Experimental Farm Groß Enzersdorf is a research and teaching facility
    of BOKU University of Natural Resources and Life Sciences, Vienna. It was founded
    in 1902 as a donation to the university by the Austrian emperor; it is a typical
    arable farm of 140 ha arable fields in Gross-Enzersdorf, Lower Austria. The farm
    is run in conventional agriculture, but 26 ha are converted to organic farming
    since more than 20 years. Another 35 ha acreage in Tulln, Lower Austria, plus
    6 ha of experimental garden in the city of Vienna, 21. district, are additionally
    managed by the farm and available for experiments with arable crops, vegetables
    and fruit species. The experiments include two long-term field experiments that
    are descibed individually as related plots. These experiments are focussed on
    long term effects (i) of crop rotation and fertlization since 1906, and (ii) of
    soil tillage treatments since 1996. The whole farm beyond can be used for any
    kind of soil, plant or atmosphere observations in experimental settings, representing
    a typical Pannonian agricultural environment. It is equipped with complete sets
    of agricultural machinery for large scale farming operation as well as for small
    experimental plots. On the farm there is also a weather observation station installed
    by the Austrian Zentralanstalt für Meteorologie und Geodynamik (ZAMG).
