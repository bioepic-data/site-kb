  description: Roztochia lanscape-geophysical station (RLGS) by Ivan Franko National
    University of Lviv (LNU) is located within the hill ridge of Roztochia which stretches
    in Ukraine northwest to the Poland. The station is located in urban village Bryukhovychi
    (49˚55̍02.3̎ N; 23˚57̍06.1̎ E), 8 km from city of Lviv and 12 km from Faculty
    of Geography. The station was founded in autumn 1968 and is in operation now.
    There is the only one station in the western regions of Ukraine that has a continuous
    series of day-night actinometrical and meteorological measurements.
