  description: The H.J. Andrews is a 16,000-acre ecological research site in Oregon's
    western Cascades Mountains. The landscape is home to iconic Pacific Northwest
    old-growth forests of Cedar and Hemlock, and moss-draped ancient Douglas Firs;
    steep terrain; and fast, cold-running streams.
