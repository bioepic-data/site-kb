- id: site_kb:deims-wilderness_area_dürrenstein-lassingtal_-_austria
  name: Wilderness Area Dürrenstein-Lassingtal - Austria
  network_registrations:
  - network: DEIMS
    network_id: 5578e8f9-0f3d-4210-9ace-660c33f837f5
    network_url: https://deims.org/5578e8f9-0f3d-4210-9ace-660c33f837f5
    name: Wilderness Area Dürrenstein-Lassingtal - Austria
  location:
    latitude: 47.743299
    longitude: 15.000858
    country: Austria
    elevation_meters: 1200.0
  description: "The wilderness area \"Dürrenstein-Lassingtal\" preserves the largest\
    \ remaining primeval forest in the Alpine arc. It is an IUCN-recognized Category\
    \ Ia + Ib protected area and has been a UNESCO World Natural Heritage Site since\
    \ 2017. With its natural forests, it is an important building block in the effort\
    \ to permanently protect rare ecosystems with their animal, plant, and fungus\
    \ species.\r\n\r\nThe protected site covers an area of about 7000 ha and is characterized\
    \ by the largest and vastest natural forests of Austria, which have not been cultivated\
    \ or managed since the last ice age. The old growth spruce-fir-beech forest „Rothwald“\
    \ is the core area, which covers approximately 400 ha.\r\n\r\nThe research priorities\
    \ are interdisciplinary monitoring and the steady continuation of the species\
    \ inventory. Monitoring focuses on the impacts of wildlife and silvicultural management,\
    \ ancient woodland indicator species (mainly fungi, woodpeckers and xylobiont\
    \ beetles), the collection of climate data, the population ecology and impact\
    \ of natural disturbances on the forest ecosystem. Furthermore, the wilderness\
    \ area is involved in a resettlement project of the Ural Owl, which aims at establishing\
    \ a survivable population of this species in Austria.\r\n\r\nThere is only few\
    \ infrastructure in the wilderness area. A gravel road provides access to the\
    \ management zone of alpine pastures. In the eastern part, a gravel road forms\
    \ a small part of the outer border. The accessibility of the core parts (virgin\
    \ forest) of the area is difficult and only possible by foot. \r\nRegarding vehicles\
    \ and appliances:\r\n- ATV  (All Terrain Vehicle)\r\n- observation stations for\
    \ climate data\r\n- observation station for photometry (Dark Sky Association)\
    \ \r\n- infrared scouting cameras (in 2012, 25 new cameras will be installed)\r\
    \n- huts (one inside the area, one nearby), no electricity\r\n\r\nAvailable data:\
    \ FFH types of habitats, biodiversity data / species lists (bryophyta, fungi,\
    \ bats, grouse, selected birds of prey, woodpeckers, xylobiont beetles, lepidoptera,\
    \ locusts, odonata, diptera, ants, selected hymenoptera), results of research\
    \ projects on forest ecosystem dynamics, soil organisms, the effects of game and\
    \ small mammals on tree rejuvenation..."
