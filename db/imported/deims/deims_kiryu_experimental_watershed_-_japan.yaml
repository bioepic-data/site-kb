  description: The watershed covers 5.99 ha and ranges in elevation from 190 to 255
    m. A meteorological observation tower is located in a small catchment within the
    experimental watershed. The watershed is mainly covered by Chamaecyparis obtuse
    Sieb. et Zucc. (Japanese cypress, an evergreen conifer) planted in 1959. Pinus
    densiflora Sieb. et Zucc. and several deciduous broad-leaved tree species are
    sparsely present. In 1990's, pine-wilt disease has decreased P. densiflora stands.
    Eurya japonica Thunb. dominates the forest floor. The total leaf area index (LAI)
    ranges approximately from 4.5 to 5.5 with a little seasonal fluctuation. The entire
    catchment consists of weathered granite with abundant amounts of albite. The topographic
    map of the area shows a mild northward inclination of approximately 9.2 degrees.
    Winds flow mainly from the north during the day and from the south at night. The
    annual mean air temperature from 1999 to 2012 was 13.5 C, and annual mean precipitation
    from 1972 to 2012 was 1,651 mm. The site therefore has a warm temperate climate.
    Rainfall occurs throughout the year, peaking in summer. Little snow falls in winter.
