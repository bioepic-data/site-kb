  description: The Oueme mesoscale site (Benin) is part of the AMMA-CATCH observation
    network. Its characteristics are as follows a 14000 km² basin in sudanian climate
    on a crystaline basement. The studies focus on the hydrological cycle, the water
    budget and the hydrological processes.
