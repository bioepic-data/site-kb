  description: Lower Hop Brook (HOPB) is an aquatic site located west of Harvard Forest
    in Franklin County, Massachusetts and is hosted by the Massachusetts Department
    of Conservation and Recreation Division of Water Supply Protection. The wadeable
    3rd-4th order stream flows over a 12.8 km2 (3160 acre) watershed into the Quabbin
    Reservoir. The site's dominant land cover is evergreen and mixed forest. HOPB
    is located in the Northeast Domain (D01), which encompasses the New England and
    northern Eastern Seaboard states along with the northern end of the Appalachian
    range. D01 includes one other terrestrial site and one aquatic site. HOPB is located
    near the Harvard Forest (HARV) terrestrial site.
