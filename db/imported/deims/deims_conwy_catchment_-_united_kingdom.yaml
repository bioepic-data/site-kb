  description: Mixed lowland and upland catchment established as a major UK research
    platform for ecological research, including long-term monitoring of greenhouse
    has fluxes and water quality, ecosystem-scale experiments, ecological and biogeochemical
    process studies and modelling. The Conwy catchment incorporates a range of habitats
    broadly representative of Wales, comprising upland bog and heath, mountain grassland,
    lowland improved grassland, conifer and broadleaf woodland.
