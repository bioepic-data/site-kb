    name: Rhine-Main-Observatory - Germany
  location:
    latitude: 50.267302
    longitude: 9.269139
    country: Germany
    elevation_meters: 110.0
  description: The Rhine-Main-Observatory (RMO) covers the drainage basin of the Kinzig
    River in Hesse, Germany (~1060km²). Situated at the fringe of the Rhine-Main area,
    the second largest metropolitan area in Germany, the Kinzig River divides three
    lower mountain ranges (Rhön, Vogelsberg, Spessart). Therefore, the Rhine-Main-Observatory
    includes both densely populated areas on the outskirts of the Rhine-Main metropolitan
    region as well as natural landscapes with little anthropogenic disturbance. This
    creates a highly diverse mosaic of land uses along a wide gradient of exploitation
    activities, from vibrant city centers to dense industrial areas; and from intensively
    and extensively used agricultural land, to heavily managed forests and natural
    reserves. The RMO was started officially in 2007, however many of the data series
    started much earlier. The scientific focus of the work in the RMO lies in understanding
    the role of land use and (micro-) climate in shaping meta-community structures
    in a fragmented river-floodplain ecosystem. The monitoring comprises a broad variety
    of permanent biotic and abiotic monitoring sites, as well as additional context-dependent
    monitoring schemes.
