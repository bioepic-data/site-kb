  description: HAUSGARTEN comprises 21 permanent stations covering a depth range of
    300 to 5.500 m water depth. Repeated water and sediment sampling and the deployment
    of moorings and different free-falling systems, which act as observation platforms,
    has taken place since the establishment of the observatory in 1999.
