  location:
    latitude: 42.086116
    longitude: 14.085206
    country: Italy
    elevation_meters: 2400.0
  description: "The site consists of “orographic islands” with high elevation vegetation\
    \ in central Mediterranean basin, along the Apennines mountain range. \r\nMajella:\
    \ 26 plots are in Majella National Park, 15 plots belonging to the world network\
    \ GLORIA, placed along an elevation gradient between dwarf shrublands and tundra\
    \ vegetation (2400-2700 m a.s.l.), 6 plots refer to the study of population biology\
    \ of endangered taxa and other 5 plots, ranging from 2400 to 2600 m a.s.l., refer\
    \ to soil monitoring. \r\nMatese: 10 plots  in Matese mountains (1800-2000 m a.s.l.),\
    \ included into the world network GLORIA, and characterised by high elevation\
    \ grasslands."
