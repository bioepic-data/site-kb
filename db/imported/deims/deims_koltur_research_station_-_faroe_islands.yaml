  description: "The station is located on a 2.5 km2 island which reaches 477m a.s.l.\
    \ and has typical sheep-grazed grassy slopes, exposed rocky shores, sea-bird cliffs,\
    \ and small streams. The island is under the auspices of the National Museum and\
    \ is partly protected. It is situated 3.5 km from the island of Streymoy and the\
    \ western side is exposed to the predominant south-westerly winds and waves.\r\
    \n\r\nMain research now is a baseline study of the biodiversity of the island.\
    \ Invertebrates are being sampled using methods such as pit-fall traps, Malaise\
    \ trap, net-sweeping and Surber sampling in freshwater. Birds and vegetation are\
    \ being recorded. Several temperature loggers are placed around the island. There\
    \ is no dedicated database."
  status: ACTIVE
