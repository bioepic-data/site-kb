  description: The site is located in the Eastern Carpathians (Romania). The predominant
    ecosystems are grasslands located above tree line, dominated by Carex curvula,
    Juncus trifidus (alpine zone) and Nardus stricta, Festuca airoides (subalpine
    zone). The site consists of monitoring points in subalpine and alpine meadows
    across the whole range of the Rodna Mountains.
