  description: It is located in the region of the Grand Causses, south of the Massif
    Central. The karstic aquifer of Durzon represents a surface of 100 km² which feeds
    the spring of Durzon. This spring supplies the drinking water of the Aveyron part
    of Larzac. The observatory has a set of sites dedicated to gravimetric, inclinometric
    and hydro-geodesic observations, as well as a flow tower for evapotranspiration
    measurements.
