  description: "Fletcherview Tropical Rangeland SuperSite was established in 2021\
    \ at James Cook University’s Fletcherview Research Station, a fully operational\
    \ outback cattle station located 50 km west of Townsville, Queensland. The site\
    \ is used for cattle grazing and is characterised by tall open savanna. The area\
    \ around this SuperSite is used for cattle grazing. \r\n\r\nBlack and red basalt\
    \ soils and alluvial river flats support a wide variety of flora and fauna across\
    \ open savanna woodland, dry rainforest, lava flows, three creek systems and the\
    \ Burdekin River. The vegetation is dominated by native grasses such as blackspear\
    \ and kangaroo grasses, as well as introduced species like buffel grass, signal\
    \ grass and leucaena. \r\n\r\nFletcherview typically experiences a dry and wet\
    \ season, with most rainfall occurring between January and April.\r\nThis site\
    \ sits on Gugu-Badhun land."
