  description: "Localities Boubín and Milešice represent particularly Acidic and Fresh\
    \ nutrient medium spruce-beech forests. These forest stand types are very important\
    \ in the scope of both area and wood-producting stands of the Czech Republic.\
    \ Especially the Boubín (Kubani) natural forest represents a very valuable and\
    \ felling aloof forest stand. It was just founded as a forest research reserve.\
    \ Owing to the verderer Josef John, who processed the first detailed dendrometry\
    \ in the Boubín natural forest in 1847, we have got unique data sets for the time\
    \ series of over 160 years.\r\n\r\nThe hurricane Emma blew over the sites in March\
    \ 2008 and left notable traces behind reserves' current states. The wind did not\
    \ inflict large disturbances – it broke forest stands into pieces with various\
    \ intensity. Both sites are fenced – especially Milešice, the site located inside\
    \ a game-park, had to be necessarily protected against the deer game pressure.\
    \ The Stožec-Medvědice natural forest brings a view on mountain talus forest with\
    \ principal tree species sycamore maple, spruce, and elm."
