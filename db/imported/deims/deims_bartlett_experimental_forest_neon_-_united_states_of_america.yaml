  description: Bartlett Experimental Forest (BART) is a terrestrial NEON field site
    located within the Saco River Valley of the White Mountain National Forest in
    Carroll County, New Hampshire. The 15.66 km2 (3870 acre) site is hosted by the
    U.S. Forest Service. The site’s soils, elevational gradient, climate, and tree
    species composition are typical for many forested areas throughout New England.
    BART also represents the most northeastern NEON site and anchors the top of the
    north-south nitrogen deposition gradient along the eastern side of the U.S. BART
    is located in the Northeast Domain (D01), which encompasses the New England and
    northern Eastern Seaboard states along with the northern end of the Appalachian
    range. D01 includes one other terrestrial site and one aquatic site.
