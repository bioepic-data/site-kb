  description: "This is a long-term monitoring study of freshwater zooplankton and\
    \ phytoplankton population changes after introduction of the mysid, Mysis relicta\
    \ Lovén, 1862 in lake Jonsvatnet. It is an oligotrophic lake located in central\
    \ Norway (63° 22’ N, 10° 37* E), 150 m above sea level. The lake has three basins\
    \ divided by narrow sounds with depths of 1 – 3 m. The major basin is Store Jonsvatnet\
    \ with surface area of 12,4 km2 and the two smaller ones are Lille Jonsvatnet\
    \ and Kilvatnet with surface areas of 1,6 km2 and 0,8 km2 respectively. The maximum\
    \ depths of the three basins are 97 m, 37 m and 34 m respectively and the average\
    \ depth of the lake is 37 m.\r\nMethod: Plankton are sampled at one station in\
    \ each lake basin. All samples are taken during the period June-October, twice\
    \ a month in June - August, once a month in September and one sampling of mysids\
    \ in late October. Zooplankton is sampled with a 1 m long tube sampler (volume\
    \ 5 l). A vertical column of water extending from 0 to 20 m depth is consistently\
    \ sampled every 1 m. Samples from 5 m layers are mixed together and treated as\
    \ one sample. Phytoplankton is sampled with a water sampler (volume 1.6 l). A\
    \ vertical column of water extending from 0 to 10 m depth is consistently sampled\
    \ every 1 m. Samples from 5 m layers are mixed together and treated as one sample.\
    \ Mysis relicta is sampled in Lille Jonsvatnet with vertical net hauls (net opening\
    \ 1 m2, mesh size 500 µm) from 1 m above bottom to to the surface."
