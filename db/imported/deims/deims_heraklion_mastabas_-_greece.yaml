  description: Tower is located in a residential area called Mastambas at southern
    part of Municipality of Heraklion, Crete. The flux tower instruments have been
    mounted on a 17 m mast, installed on a 7.1 m roof of an elementary school. Additionally,
    for the purposes of the establishment a concrete tower base has been constructed
    adding 0.5 m to tower''s total height, finally reaching the 24.6 m a.g.l. The
    surrounding area is characterized with residential neighborhoods (high building
    density, with small and sparse vegetation areas), with small stores and a few
    public facilities (e.g. schools). The traffic network is characterized with low
    and medium traffic activity crossroads. However, in the northern distant part,
    there are higher density in Low Vegetation (i.e. grass, crops) and one of the
    busiest parts of the national road. The annual carbon dioxide fluxes are mainly
    driven by the heating emissions during lower temperature months. The prominent
    winds present a seasonal trend, with southern winds during winter and northern
    ones in summer.
  status: ACTIVE
