  description: "Paired experimental watersheds in sub-humid tropical climate, plus\
    \ nested watersheds, located in South India in the Kabini watershed. The experimental\
    \ watersheds are:\r\n(1) Mule Hole (semi-deciduous dry forest), monitored since\
    \ 2003, 4.3 km2;\r\n(2) Maddur (cultivated), monitored since 2005, 7.1 km2;\r\n\
    (3) Berambadi (higher order of/including Maddur watershed), monitored since 2010,\
    \ 80km2;\r\n\r\nfor evaluating the influence of agriculture on water and biogeochemical\
    \ cycle in sub-humid tropics, and the effect of the monsoon variability on these\
    \ cycles"
