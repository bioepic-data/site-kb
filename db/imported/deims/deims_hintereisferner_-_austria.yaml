  description: Hintereisferner (glacier) is located at the end of Rofen valley between
    2500 and 3750 m altitude. The glacier is situated in Naturpark Ötztal,  and one
    of the glaciers with longest records of glacier mass balance worldwide. In addition
    to that, a number of hydrological and meteorological observations complete the
    data base. Currently, 3 weather stations and 6 rain gauges provide data. Topographic
    and land cover data are available, in the recent years on an annual base. The
    area is used for Alpine tourism (but without a hut in the basin), for limited
    hunting and growing a few sheeps.
