  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. Burnmoor Tarn
    is the largest ''tarn'' in the English Lake District. It occupies 23.9 ha and
    lies at an altitude of 253 m in a moraine hollow on the uplands between Wastwater
    and Eskdale. The lake has two distinct basins close to the south-eastern shore
    and a maximum depth of 13 m. There are four main inflow streams to the north and
    north-west. The outflow at the eastern end joins the Hardrigg Beck which drains
    the slopes of Scafell and, in times of especially high flow, is partly diverted
    into the lake across a braided delta. Some data are managed by UK ECN Data Centre.
    Note: The area is the size of the catchment.'
