  description: The site consists of a marine databuoy equipped with a suite of sensors
    that monitor water quality parameters and acoustic receivers for the detection
    of Porpoises and tagged fish. The buoy is moored near an offshore windmill farm,
    approx. 30km off the coast on the Belgian Continental Shelf.
