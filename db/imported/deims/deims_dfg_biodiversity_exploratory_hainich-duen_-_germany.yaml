  description: The Hainich-Dün region is situated in the west of Thuringia close to
    the border to Hessen. It consists of the forest region Hainich in the south, and
    the Dün region in the north, connected by the Obere Eichsfeld. The Hainich with
    its 16,000 ha is one of the largest closed forest areas in Germany that is dominated
    by broad-leaved trees. The National Park Hainich, founded in 1997, is located
    at the southern edge of this region and covers an area of 7600 ha.
