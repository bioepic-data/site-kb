  description: "Skálanes is located on the east coast of Iceland at the bay of the\
    \ remote fjord, Seyðisfjörður. Here, skálanes sits within a 1250 hectare (3089\
    \ acre) independent nature reserve containing habitats and ecosystems representative\
    \ of the East fjords region, including the common species of flora and fauna and\
    \ especially known as a habitat for a wide variety of bird species.\r\n\r\nWe\
    \ are currently developing a monitoring program and a new database at Skálanes.\
    \ The databases are currently not all publishable, but can act as a reference\
    \ for further studies. Avian time series and baseline data on geology, plants,\
    \ insects, birds is available."
  status: ACTIVE
