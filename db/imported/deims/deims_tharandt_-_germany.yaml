  description: The station Tharandt, with ICOS code DE-Tha, is located in the Eastern
    part of a large forested area, near the city of Tharandt, about 25 Km SW of Dresden.
    The site is an evergreen needleleaf forest located in the suboceanic/subcontinental
    climate. The present species are composed of 87% coniferous evergreen (72% Picea
    abies (L.) H.Karst., 15% Pinus sylvestris L.) and 13% deciduous (10% Larix decidua
    Mill., 1% Betula spec., 2% others).
  status: ACTIVE
