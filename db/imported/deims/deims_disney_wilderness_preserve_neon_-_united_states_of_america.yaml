  description: 'The Disney Wilderness Preserve (DSNY) is a terrestrial NEON site hosted
    by The Nature Conservancy. The 48.5 km2 (12,000 acre) preserve is situated at
    the headwaters of the Everglades ecosystem in south-central Florida between Polk
    and Osceola Counties. It is a patchwork of forest, grassland, and wetland communities
    embedded in a matrix that is increasingly dominated by a fast-growing human population.
    The site is encompassed within the NEON Southeast Domain that is bounded by the
    Atlantic Ocean on the east and the Gulf of Mexico to the west. The Domain hosts
    five other NEON field sites: three aquatic and two additional terrestrial sites,
    located in Florida and Georgia.'
