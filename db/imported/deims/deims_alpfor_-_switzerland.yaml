  description: "Alpine Research and Education Station Furka, ALPFOR, Switzerland\r\
    \nThe ALPFOR station is unique in Europe by being located at 2440 m a.s.l. directly\
    \ in the centre of the alpine belt (Swiss central Alps), convenient access by\
    \ public transport or car. ALPFOR was founded by members of the Institute of Botany\
    \ of the University of Basel in cooperation with the regional 'Korporation Ursern'\
    \ (Andermatt) and the Swiss Army in 2009. Three major buildings of the former\
    \ military camp ‘Furkablick’ have been adapted and renovated in 2009-2011 to serve\
    \ the new science- and education-oriented needs. Funds were provided by private\
    \ and public donations.\r\n\r\nThe station is run by the independent, non-profit\
    \ organisation ALPFOR (affiliated to the University of Basel) that aims at supporting\
    \ long-term activities in research and education in alpine ecology, fostering\
    \ sustainable management and use of high mountain ecosystems. \r\n\r\nThe three\
    \ ALPFOR houses offer space for projects, courses and conferences: dining/lecture\
    \ room for 80-100 persons, 45 beds in 2- to 7-person rooms, 2 large kitchen facilities,\
    \ several working rooms and modern sanitary facilities in all 3 houses. The station\
    \ is open from 1st June to 30th September, please notify there is no access during\
    \ wintertime.\r\n\r\nYear-round weather station, total N deposition, multi-site\
    \ soil temperatures, 300 flowering plant species (biodiversity hotspot), high\
    \ geo- and topographic diversity. Inventory of flora and fauna on 22 permanent\
    \ plots (c. 400-600 m2).\r\n\r\nResearch topics (since 1991):\r\n- Microclimatology\
    \ \r\n- Influence of elevated CO2 on growth and water regime \r\n- Impact of N\
    \ deposition, warming, sheep trampling on alpine grassland\r\n- Population biology,\
    \ reproductive ecology, molecular genetics of plant populations\r\n- Hydrological\
    \ consequences of land use change\r\n- Ecological consequences of N-fixing shrub\
    \ encroachment \r\n- Biodiversity monitoring"
