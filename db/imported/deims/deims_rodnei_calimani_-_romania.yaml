  description: Rodna-Calimani site is located in the north part of Eastern Carpathians.
    The site consist on two national park (Rodna Mountain National Park and Calimani
    National Park) and one Biosphere reserve (Pietrosul Rodnei). Forest cover more
    50% of the site.  The main forestry species are beech (Fagus sylvatica), spruce
    (Picea abies), mountain pine (Pinus mugo), fir (Abies alba), maple (Acer pseudoplatanus),
    birch (Betula pendula), alder (Alnus viridis), Rowan (Sorbus aucuparia). Pinus
    cembra population are the only one from Eastern Carpathians and is probably one
    of the most representative of the Carpathian Mountains. Long term research consisting
    on climate and tree growth continuous monitoring was placed in 2007. Several permanent
    plots for natural forest stand dynamics were established starting with 1976.
