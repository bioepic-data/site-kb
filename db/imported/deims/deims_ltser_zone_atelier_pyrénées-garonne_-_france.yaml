  location:
    latitude: 43.2667
    longitude: 0.85
    country: France
    elevation_meters: 300.0
  description: 'The ZA PYGAR covers the whole Garonne river basin up to the upper
    part of the Gironde estuary (La Reole station). Within this territory, research
    is structured around 4 main sites: the Pyrénées mountains, covering the upstream
    part of the Garonne river basin (PYRénées site), the farmland of the foothills
    of the Pyrénées  (Vallées et Coteaux de Gascogne site), the Garonne river (Axe
    Fluvial Garonne site) and the basin of two tributaries of the Garonne river in
    the Massif Central moutains (Aveyron-Viaur site).'
