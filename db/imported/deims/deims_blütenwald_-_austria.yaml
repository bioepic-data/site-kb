  description: This site is part of the BFW project "Klimaforschungswald". The aim
    of this research project is to evaluate which tree species will fullfil the important
    tasks and functions of the forest ecosystem in the future. Furthermore, temperature
    and precipitation fluctuations in particular are to be documented in order to
    be able to map a possible trend and the influence of the growing vegetation. In
    addition to the site characteristics, attention was paid to whether they were
    particularly attractive for bees and insects, which should increase their food
    supply.. When selecting the trees and shrubs, in addition to the site characteristics,
    attention was paid to whether they were particularly attractive for bees and insects.
    This should increase the food supply for bees and insects. Furthermore, information
    boards were erected and meteorological measuring stations installed. The meterological
    measuring stations record air temperature and relative humidity as well as precipitation.
