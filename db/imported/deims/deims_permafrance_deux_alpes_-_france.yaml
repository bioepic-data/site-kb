  description: Upper part of the Deux-Alpes ski resort, Est of Grenoble in the French
    Alps. Area of glacially eroded gneiss bedrock, with some limestone cover remnants.
    Part of the area is underlain by permafrost, and the site includes one rockglacier
    (rockglacier Bellecombes). Many infrastructures (cable cars, dirt roads, ski tracks)
    partly on permafrost. One chairlift end station on the rockglacier.
