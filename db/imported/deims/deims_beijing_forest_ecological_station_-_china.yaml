  description: 'BJF is located in Xiao Long Men National Forest Garden of Mentougou
    District, Beijing. The research objects of BJF is deciduous broad-leaved forests
    in warm temperate zone. Research directions include: warm temperate forest ecosystem
    structures and functions, the long-term dynamic of vegetation pattern, mechanism
    of forest population maintenance, and forest biodiversity responses to global
    change.'
