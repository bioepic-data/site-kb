  description: "The Lehrforst Rosalia (Rosalia University forest) is about 1000 ha,\
    \ covered with all major tree species and forest types in Austria (Norway spruce,\
    \ Fir, Larch, Scots pine, Beech, Oak, etc). The forest area is located in the\
    \ Rosalia Mountains near the Lower Austria/Burgenland border.\r\n\r\nThe Demonstration\
    \ Forest (950 ha) was set up in 1972 with an agreement between the Austrian Federal\
    \ Forests (Österreichische Bundesforste, ÖBf, https://www.bundesforste.at/english.html)\
    \ and BOKU.\r\nNevertheless, the University is active in this area since 1875;\
    \ considerable documentation regarding forest description and planning was elaborated\
    \ by that time.\r\n\r\nIt is located on the western slope of the mountainous ridge\
    \ called „Rosaliengebirge“ in the southeastern part of Lower Austria (LAT 47°42’N,\
    \ LON 16°17’ E).\r\nElevation is between 300 and 720 m a.s.l, annual mean temperature\
    \ of  6.5 deg C and 800 mm annual precipitation.\r\nThe forest is mainly composed\
    \ of beech associations (Fagetums) , peripheral also spruce-fir-beech forest association\
    \ (Abieti-Fagetum).\r\n\r\nThe Key task of the Forest Demonstration Centre is\
    \ supporting the educational and research work of the University of Natural Resources\
    \ and Life Sciences. Accordingly, accommodation, work and teaching facilities\
    \ are provided.\r\n\r\nThe research focus lies on following areas:\r\n\r\n· Collection\
    \ and hold ready of area-based and environmental data\r\n· Establishing and monitoring\
    \ of sample plots especially for beech growth and treatment related questions\r\
    \n· Characterization of local and microclimate\r\n· Environmental impacts to forest\
    \ ecosystems\r\n· Monitoring and modelling of small forested watersheds\r\n\r\n\
    Essential research and educational infrastructure are:\r\n\r\n· 4 weather monitoring\
    \ stations\r\n· 2 scaffolding towers for measuring (35m) with instrument cabin\r\
    \n· 4 measuring weirs for runoff monitoring (Watershed 230 ha)\r\n· radio linked\
    \ data collection and on-line hosting\r\n· Surveying and mapping equipments (terrestric\
    \ and GPS)\r\n· Long-term experiment simulating drying and rewetting of forest\
    \ soils (DRAIN Station)\r\n· Laboratories and work rooms\r\n· Lecture Rooms\r\n\
    · Accommodation for more than 40 people\r\n\r\nThe available data range from base\
    \ data (GIS-Data), meterological and hydrological time series (since 1990), inventory\
    \ data of growing stock, data of different plots to measuring data related to\
    \ numerous projects."
