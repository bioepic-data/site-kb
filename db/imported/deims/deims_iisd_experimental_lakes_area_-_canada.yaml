  description: IISD Experimental Lakes Area (IISD-ELA) is an exceptional natural laboratory
    comprised of 58 small lakes and their watersheds set aside for scientific research.
    IISD-ELA is located on Treaty 3 territory, the traditional land of the Anishinaabe
    Nation and the homeland of the Métis Nation. It is a remote region of northwestern
    Ontario in Canada, approximately 250 km east of Winnipeg, Manitoba, or 50 km east
    of Kenora, Ontario.
