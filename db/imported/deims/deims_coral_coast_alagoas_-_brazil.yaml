  description: The  Marine Protected Area Costa dos Corais (APACC) created in 1997
    is the largest marine/coastal protected area (MPA) in Brazilian coast. The APACC
    cover about 400,000 ha area including natural systems as coral reefs, estuaries,
    mangroves, seagrass banks, sand beaches and Atlantic forest as well as traditional
    fishing and tourism activities.
