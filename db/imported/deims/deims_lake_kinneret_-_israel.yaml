    name: Lake Kinneret - Israel
  location:
    latitude: 32.868671
    longitude: 35.552015
    country: Israel
  description: "The Kinneret Limnological Laboratory (KLL) is situated at the ‘Sapir’\
    \ Site (Tabha) on the shores of Lake Kinneret (Sea of Galilee). The Lake Kinneret\
    \ monitoring program conducted by KLL has been operating since Jan. 1969. The\
    \ program has provided a unique database and information, due to the sampling\
    \ resolution, accuracy of the measurements, and their continuity, it is used to\
    \ make operational decisions and environmental policy. \r\nThe monitoring program\
    \ includes several stations around the lake and from numerous depths and includes\
    \ fixed on-lake, high-resolution, and manual sampling of water samples analyzed\
    \ in the laboratory.\r\nThe Kinneret monitoring program has expanded in recent\
    \ years and currently has four fixed on-lake and online sampling platforms, strategically\
    \ placed, each with thermistor chains and multi-probe sensor systems including\
    \ one that is a profiling system. Also, the program includes collaboration with\
    \ the Ministry of Agriculture to carry out monitoring of fish and fisheries in\
    \ the lake.\r\nAs the lake suffers typically from two seasonal cyanobacteria blooms,\
    \ (i.e., a winter Microcystis bloom and a summer N-fixing cyanobacteria bloom)\
    \ routing monitoring of cyanobacteria biomass and toxins is conducted and adaptive\
    \ to the extent of the bloom. This is carried out simultaneously with satellite\
    \ imaging over the lake."
