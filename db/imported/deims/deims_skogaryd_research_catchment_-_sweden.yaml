    country: Sweden
    elevation_meters: 78.0
  description: "Skogaryd is designed and state of the art equipped for interdisciplinary\
    \ landscape and atmospheric studies that encompasses the complete catchment from\
    \ a pristine bog via streams, riparian zones and forests to lakes, as well as\
    \ the subsequent exchange between the atmosphere and surface waters The station\
    \ also elucidating Greenhouse Gas (GHG) emissions from drained organic forest\
    \ soils and are used for testing ecosystem models.\r\nThe terrestrial sites at\
    \ Skogaryd measure GHG emissions with eddy covariance (EC), CO2, H2O and N2O/CH4\
    \ (site dependent) and abiotic/biotic variables. They also have automatic stream\
    \ station (flow, DIC/DOC etc.) and will be equipped with cameras/spectrometers\
    \ for phenological studies and satellite ground truth validation. The forest sites\
    \ are equipped for below ground studies; suction/gas probes, fine root production,\
    \ Mycorrhiza, sap flow, above litter fall, tree production etc. \r\nAt the lake\
    \ CO2, H2O and CH4 are measured with EC. Abiotic and weather data are monitored.\
    \ The sites have electric power, internet connection, boardwalks, bridges or boats.\
    \ They have capacity for chamber/profile studies and process studies."
