  description: "The Upland Heath Swamps Plot Network is located in the Dharawal National\
    \ Park, near Sydney, NSW. \r\n\r\nSampling of vegetation is stratified along the\
    \ soil moisture gradient and across the range of structural variability in the\
    \ vegetation. Thus, three categories of soil moisture and three categories of\
    \ vegetation structure (based on the height and form of shrubs) are sampled in\
    \ a factorial design at 60 sites in upland swamps scattered throughout the study\
    \ area (Keith & Myerscough 1993).\r\n\r\nTemporal visits are conducted every 5\
    \ years or when fires occur.\r\n\r\nBetween 2012 and 2018 the Upland Heath Swamps\
    \ Plot Network was a member of Long Term Ecological Research Network (LTERN),\
    \ Australia, a facility of the Australian Government's Terrestrial Ecosystem Research\
    \ Network (TERN)."
