  description: "The Connell Rainforest Plot Network is a member of Long Term Ecological\
    \ Research Network (LTERN), Australia (http://www.ltern.org.au), a facility of\
    \ the Australian Government's Terrestrial Ecosystem Research Network (TERN), (http://www.tern.org.au).\
    \ \r\n\r\nThe long-term forest dynamics plot at O'Reilly's is located in the subtropical\
    \ rainforest near O’Reilly’s Guest House in Lamington National Park, 65 km south\
    \ of Brisbane. It consists of two 1-ha plots spaced approximately 600 m apart,\
    \ but for analyses they have always been treated as a single unit. This plot has\
    \ never been logged, but some selective logging has occurred just outside the\
    \ plot boundary. \r\n\r\nTemporal visits occur between 1 to 6 years."
