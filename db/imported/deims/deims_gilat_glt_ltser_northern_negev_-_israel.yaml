  description: A Loess plain is devoted to agro – ecosystem and climate change research.
    The site is subdivided into permanent plots which are exposed to various manipulations.
    The manipulations include introducing of various crops and various grazing regime.   The
    manipulation provides data on the effect of management and rainfall regime on
    agricultural productivity. In addition, the area includes ecological plots to
    study a natural succession, penology and productivity under various rainfall regimes.
    The site is also used to study climate change in relation to rainfall and runoff
    patterns. An important study is the dynamic of geophytes that are important as
    cultural ecosystem service in the area. A new research direction is to study ecosystem
    development under various rainfall and runoff patterns.
