  description: Dongting Lake Station (29º30'N, 112º48'E) located in East Dongting
    Lake in Yueyang City, Hunan Province. The station has good geographical advantage,
    convenient transportation, for about 180 kilometers from Changsha, the capital
    of Hunan Province. Dongting Lake located in the northeast of Hunan Province, the
    south shore of Jing River (in the middle of the Yangtze River) is the second largest
    freshwater lake of China.
