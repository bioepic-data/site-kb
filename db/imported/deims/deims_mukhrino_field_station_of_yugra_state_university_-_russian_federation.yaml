    country: Russian Federation
    elevation_meters: 35.0
  description: Mukhrino Field Station is owned and run by the UNESCO Chair on Environmental
    Dynamics and Climate Change at the Yugra State University, Khanty-Mansiysk, Russia.
    The Mukhrino Field Station is located at the east bank of the Irtysh River near
    the confluence with the Ob River in the central taiga area of Western Siberia
    (60°54’ N, 68°42’ E), 30 km south-west of the town of Khanty-Mansiysk (60 000
    inhabitants). Due to the severe continental climate, the environmental conditions
    in the region are comparable with the sub-arctic zone of Northern Europe. The
    research site is representative for the Western Siberian pristine carbon accumulating
    peatland ecosystem (“plain mires”). The mires cover c. 60 % of the land surface
    and can be regarded as important sources/sinks of greenhouse gases and aerosols.
    The main mire type of the site is raised bogs of the type Pine-dwarf shrubs-bogs
    (Ryam) characterized by pine trees, Ledum palustre and dwarf shrubs, with areas
    of Sphagnum fuscum. Interspersed are mires of the type Poor fens (partly drained
    in the summer) dominated by Carex lasiocarpa and other graminoids, and Sphagnum
    balticum. Also ridge-hollow complexes, consisting of bog ridges and poor fen hollows
    are present.
