  description: Lajas Experimental Station (LAJA) is a terrestrial NEON field site
    located in the southwestern corner of Puerto Rico in the Lajas Valley. The site
    consists of two areas, a plot of farmland owned by a private farmer known as Hacienda
    Resolucion and the Lajas Experimental Station, one of six Agricultural Experimental
    Stations on the island. Hacienda Resolucion is east of the dairy farm managed
    by the Experimental Station and west of the Laguna Cartagena National Wildlife
    Refuge managed by the Fish and Wildlife Service. The Lajas Experimental Station
    is managed by the University of Puerto Rico – Mayaguez Campus. NEON samples approximately
    3.9 km2 (976 acres) of land at the station. This location is part of the NEON
    Atlantic Neotropical Domain (D04), which includes the island of Puerto Rico and
    the southern tip of Florida. The Domain includes one additional terrestrial field
    site and two aquatic field sites.
