  description: Sesoko Island is located at the west of northern part of Okinawa Island,
    Okinawa Prefecture, Japan.  Okinawa Prefecture is in subtropical climate, and
    islands of Okinawa are fringed by coral reefs.  Sesoko Island is a good field
    for studying coral reefs.
