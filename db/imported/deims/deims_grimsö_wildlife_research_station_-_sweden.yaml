  description: "Grimsö wildlife research area (GWRA), SLU, is located in south-central\
    \ Sweden at the end of the Nordic taiga, in the hemi-boreal zone. GWRA comprise\
    \ 130 km2, covered mainly by mixed coniferous forest (74%), bogs and mires 18%.\
    \ About 85% of the area is managed by conventional forest practices, and the area\
    \ also includes two forest reserves of ca 4 and 11 km2. Farmland constitutes 3%,\
    \ and lakes and rivers 5% of the area. The landscape is relatively flat, with\
    \ altitudes ranging from 75 m.a.s.l. in the south to 180 m.a.s.l. in the north.\
    \ The area hosts the expected mid-Swedish flora and fauna.\r\nWildlife research\
    \ started at Grimsö in 1974 and the activities has expanded over time and include\
    \ at present an established staff of ca 40 people."
