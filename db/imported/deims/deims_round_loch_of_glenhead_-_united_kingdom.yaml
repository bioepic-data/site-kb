  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. The site lies
    at 298 m altitude in the Galloway region of south-west Scotland. The loch is 12.7
    ha in area and receives drainage from minor streams and catchment blanket peats.
    The outflow drains to the south-west into the Glenhead Burn and Loch Trool. The
    loch bathymetry indicates a single deep basin (maximum depth 13.5 m) offset to
    the south with slopes rising gently away from the southern shore. An island is
    located just off the western shore some 250 m from the outflow. Some data are
    managed by UK ECN Data Centre.  Note: The area is the size of the catchment.'
