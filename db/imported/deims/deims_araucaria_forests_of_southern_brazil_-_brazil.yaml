  description: This research site develops long-term ecological studies in experimental
    units located in public and private areas throughout the Rio Iguaçu Basin, Paraná
    State, southern Brazil. The site exists since 1999 and research areas are continuous
    and uninterrupted monitored since then. The main research focus is the generation
    of ecological knowledge about the process of regeneration and growth of the forest
    related to demographic processes and environmental changes and in response to
    human disturbance impacts.
