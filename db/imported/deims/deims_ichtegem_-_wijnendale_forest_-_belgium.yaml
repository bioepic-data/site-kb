    longitude: 3.03722
    country: Belgium
    elevation_meters: 27.0
  description: "The LTER-site of Wijnendale Forest is a 90 ha scientific zone located\
    \ in a larger mixed atlantic beech-oak-woodland (300 ha), in the North-West of\
    \ Belgium, 20 km south of Bruges. The site is located on moderately wet to dry\
    \ sandy soils. The site is an ancient woodland that used to be managed as coppice\
    \ with standards. Over the last 100 years it was gradually transformed to a mixed\
    \ high forest, mainly of oak and beech.\r\nThe site contains\r\n- an ICP Forests\
    \ Level II plot (0.25 ha), in which effects of air pollution on the forest ecosystem\
    \ are monitored, according to standard protocols.\r\n- a strict forest reserve\
    \ of 65 ha: here, natural dynamics of forest structure and ground vegetation are\
    \ monitored, and its effects on biological diversity.\r\n- a 25 ha buffer zone,\
    \ containing both forest and open grassland (extensively managed for nature conservation),\
    \ where 'open field' measurements are performed.\r\nThe sampling network in the\
    \ strict reserve includes >100 sampling plots (0.1 ha) combined with a 1 ha core\
    \ area. In these plots, full dendrometric surveys (tree position, species, DBH,\
    \ height, ...) and ground vegetation relevees are performed every 10 years.\r\n\
    Additionally, standardised sampling of saproxylic beetles, mosses and fungi were\
    \ performed and high-resolution air-borne LIDAR and hyperspectral data were recorded\
    \ in 2012-2014.\r\nMain aims for the future are the continuation of the observational\
    \ networks to provide longer robust time-series that allow more thorough analysis\
    \ and investigation."
