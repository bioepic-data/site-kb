  description: Our work focuses on a metropolitan area that includes the nation’s
    sixth largest city, Phoenix, as well as 22 other municipalities and spans Maricopa
    County and a small portion of Pinal County, Arizona. We engage biological, physical,
    engineering, and social scientists in research that provides a foundation for
    understanding urban socio-ecological systems in an arid, but rapidly growing,
    metropolitan area.
