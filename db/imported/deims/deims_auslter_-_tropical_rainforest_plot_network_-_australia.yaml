    longitude: 145.431410036
    country: Australia
    elevation_meters: 193.0
  description: "Except for minor disturbances associated with selective logging on\
    \ two plots, the Tropical Rainforest Plot Network plots were established in old\
    \ growth forest and all plots have thereafter been protected. Plots have been\
    \ regularly censused and at each census the diameter at breast height of all stems\
    \ is recorded.  The data collected from the 20 plots provides an insight into\
    \ the floristical composition, structure and long term forest dynamics of Australian\
    \ tropical rainforests and allows direct comparisons to be made with long-term\
    \ monitoring plots at a global scale.\r\n\r\nTemporal visits were initially conducted\
    \ every 2 years, then every 5 years from 1990.\r\n\r\nBetween 2012 and 2018 the\
    \ Tropical Rainforest Plot Network is a member of Long Term Ecological Research\
    \ Network (LTERN), Australia, a facility of the Australian Government's Terrestrial\
    \ Ecosystem Research Network (TERN)."
