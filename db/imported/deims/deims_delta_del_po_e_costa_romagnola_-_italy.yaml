  description: "The site is equipped with two fixed stations: a meteo-oceanographic\
    \ buoy (E1 buoy) and an elastic beacon equipped with meteo-oceanographic sensors\
    \ (S1-GB beacon).\r\nThe fixed stations were deployed in the framework of a multidisciplinary\
    \ research project that uses automated stations to study the marine environment,\
    \ in cooperation between the Insitute of Marine Science (ISMAR) in Bologna (CNR)\
    \ and other public and governmental Research Institutes. The S1 buoy was installed\
    \ in 2004 at the Po river Delta and recently (2015) implemented being now an elastic\
    \ beacon. The E1 buoy is off the coast of Rimini town measuring in near real-time\
    \ meteo and physico-chemical oceanographic parameters at different depths in the\
    \ water column. It records every  5-10-15-30 minutes  atmospheric pressure, air\
    \ temperature, relative humidity, wind speed , wind gust, wind direction, net\
    \ solar radiation, water temperature, salinity, dissolved oxygen, fluorescence,\
    \ turbidity, speed and direction of the currents, height, direction and period\
    \ of the wawes .\r\nThe data are transmitted via GSM and downloaded (on average\
    \ every 2-4 hours) at the Data Center of the Institute of ISMAR in Bologna.\r\n\
    Data are daily validated and analysed, in order to be used for different studies."
