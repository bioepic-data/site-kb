  description: "Arrived to the littoral region you will see a unique Nemunas delta\
    \ with its major branches Atmata and Skirvytė and the island Rusnė surrounded\
    \ by them. This landscape is created by water - there are many interlaced rivers,\
    \ lakes - the lagoon of Krokų lanka and many other smaller lakes. There are also\
    \ old river beds, marshes and fens. During the spring floods the regional park\
    \ will provide you with unforgettable impressions. Your gaze will be able to travel\
    \  flooded delta meadows full of rear water birds without hindrance. The delta\
    \ is famous because of rare breeding birds abundance and because it is an important\
    \ place for travelling birds. Under the Ramsar Convention criteria the delta was\
    \ added to the wet areas of international importance list in 1993. This unique,\
    \ versatile regional park landscape that still retains its natural dynamics must\
    \ be preserved.\r\nThe Nemunas River delta area with adjacent floodplains is the\
    \ most important stopover site for numerous species of waterbirds in the South\
    \ Eastern Baltic Region."
