  description: The site Heraklion Kornarou (ICOS code GR-HeK) is located in the city
    center of Heraklion, on the island of Crete, Greece, and is therefore classified
    as an urban site, mainly compact low rise LCZ3 in the Local Climate Zone (LCZ)
    scheme. The business areas and Heraklion's main thoroughfares, which are used
    for both commercial activity and commuter traffic, are concentrated in the northern
    part of HECKOR. The southern part is distinguished by residential districts with
    high building density and sparse, small scale vegetation areas, as well as by
    roadways with low traffic loads. Additionally, in an approximately 400m distance
    away but also inside the flux footprint, there is another notable feature of Heraklion's
    urban landscape, the Venetian walls (16th century). Commercial activity is a major
    contributor to the yearly carbon dioxide fluxes, especially during morning rush
    hours on weekdays and at lower levels at night and on weekends.
  status: ACTIVE
