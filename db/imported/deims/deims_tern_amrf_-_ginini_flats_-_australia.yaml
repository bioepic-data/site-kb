  description: Ginini Flats is AMRF's ACT monitoring site, located within Namadgi
    National Park at approximately 1,590 m elevation. It hosts an AMON (Australian
    Mountain Observation Network) 1 ha monitoring plot with a standard AMRF sensor
    suite, a DroughtNet rainfall exclusion experiment, and a hydrogeology monitoring
    array. The site provides long-term baseline data on subalpine heathland microclimatic
    and hydrological conditions close to Canberra, making it one of the most accessible
    sites in the AMRF network.
  status: ACTIVE
