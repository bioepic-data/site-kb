  location:
    latitude: 35.4333
    longitude: 138.75
    country: Japan
    elevation_meters: 1100.0
  description: "The Fuji Hokuroku Flux Observation Site (FHK) (35° 26'N, 138° 45'E,\
    \ 1100m above sea level) is located in a mature larch forest of 55-60 years old\
    \ at the foothills of Mt. Fuji. The micrometeorological, meteorological and biomass\
    \ measurements were started in 2006. Active studies are now conducted for technological\
    \ development of various gas flux measurement methods, including other greenhouse\
    \ gases such as methane. \r\nThe site is also used for ground measurement to validate\
    \ satellite remote sensing data, various training programs, and joint investigations\
    \ with Asian researchers."
