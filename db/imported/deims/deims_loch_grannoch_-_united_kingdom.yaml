  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. Loch Grannoch
    is a large (surface area 111.4 ha), elongated lake which lies at 214 m altitude.
    Small streams feed the loch along its eastern and western shores, the principal
    of which is the Cuttimore Burn. It drains to the north into the River Dee via
    the Pullaugh Burn. The loch bathymetry was first surveyed by Murray and Pullar
    in 1910 and was updated by a subsequent survey by the Palaeoecology Research Unit
    of University College London. The major basin is offset to the south of the loch
    and reaches a maximum depth of 20.5 m. Some data are managed by UK ECN Data Centre.
    Note: The area is the size of the catchment.'
