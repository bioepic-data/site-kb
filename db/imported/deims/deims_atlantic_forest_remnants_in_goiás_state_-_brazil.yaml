  description: The PELD Jataí site is located in Atlantic Forest remnants in the southern
    state of Goiás, Brazilian central plateau. Covering about 20,000 hectares of not
    continuous forests, distributed among the geographic coordinates 18o 55'S and
    51o 42'W, with altitudes ranging from 520 to 650 m. The fragments are mostly immersed
    for pasture matrix. The climate is classified as Aw, tropical savanna, with marked
    seasonality, rain in summer and dry in winter, typically found in the Brazilian
    Cerrado. December and January are the months with the highest frequency of rainfall,
    and June to August there is less rainfall intensities. The annual average rainfall
    is 1650 mm. The site consists of different forest vegetation types in good conservation
    status, as woody savanna, deciduous and semideciduous forests; flooded and non-flooded
    gallery forests and riparian forests along the Rio Corrente, a tributary of the
    Rio Paranaiba. There are also small fragments of cerrado stricto sensu.
