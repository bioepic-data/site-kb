  description: 'The Lautaret-Oisans platform focuses on the study of socio-ecosystems
    and the critical zone of the alpine mountains. The research and observation sites
    are focused on three sub-systems:  little-engineered high mountains; alpine pastures;
    and lakes, rivers and watershed heads. The platform is built around the Lautaret-Roche-Noire
    site (https://deims.org/8574370e-934e-418a-af63-e15f4cbc5084) and Lautaret Garden
    infrastructures.'
