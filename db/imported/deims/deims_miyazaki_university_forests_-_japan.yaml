  description: The site named Miyazaki University Forests is located hilly region
    in southern part of Kyushu island, Japan. The site is managed by University of
    Miyazaki to promote scientific research and education about forest ecology and
    forest industry. Dominant vegetations are evergreen broadleaved forest and Japanese
    cedar plantation. The Miyazaki University Forests perform various joint studies
    and is the most active research site located in warm-temperate forest area in
    Japan.
