  description: 'KISKUN LTER was established in 1995, together with the Hungarian LTER
    Network. Its study area is the Kiskunság Sand Ridge and its periphery, 14000 km2
    altogether, 17% of the area of Hungary. The primarily sandy area is extremely
    heterogeneous. It consists of arable lands, planted forests, meadows, abandoned
    fields, settlements, alkaline lakes, wetlands, and species rich remnants of forest
    steppe. It is also very varying in time: ploughing and setting aside, extensive
    plantation of alien trees, drainage, wild fires, biological invasions, and fast
    demographic movements have been happening in the last 100 years, and beyond all
    those, the area is particularly sensitive to the climate change.'
