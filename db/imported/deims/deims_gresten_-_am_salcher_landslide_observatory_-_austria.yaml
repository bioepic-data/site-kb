  description: "The ENGAGE working group (Geomorphological Systems and Risk Research\
    \ at the Institute for Geography and Regional Research) has been running a long-term\
    \ monitoring project to investigate landslides in Lower Austria. Landslides (translational\
    \ and rotational failures, debris flows, rock avalanches, rock falls, etc.) number\
    \ among the most abundant natural hazards in Lower Austria. Resulting from sporadic\
    \ phases of activity it is essential to generate specific long-term measurement\
    \ series, enabling the analysis of changes in surface movements as well as underground\
    \ in connection with triggering factors. Therefore, in 2014 the project “NoeSLIDE\
    \ – Monitoring diverse types of landslides in Lower Austria” was initiated. The\
    \ research sites are compiled under the parent site \"LTER NoeSLIDE\" which has\
    \ three subsites, of which one is the Salcher Landslide Observatory. \r\n\r\n\
    The Salcher landslide is located in the municipality of Gresten, Scheibbs district,\
    \ Province of Lower Austria. It is located on an unwooded hillside area that slopes\
    \ from west to east (at around 435 to 470 m above sea level / slope between 5\
    \ ° and max. 20 °) and is enclosed on three sides by anthropogenic features (streets\
    \ / houses). The processes at the Salcher landslide are to be classified as rotational\
    \ landslide, with more than one sliding surface being assumed. The currently active\
    \ area is ~ 4,000 m², the area to be potentially activated is ~ 20,000 m². In\
    \ addition to traditional methods such as the installation of a weather station,\
    \ piezometers, inclinometers, TDR (time-domain reflectometry) probes, GNSS (global\
    \ navigation satellite system), Tachymeters, methods such as continuous terrestrial\
    \ laser scanning, UAV applications and permanent geoelectric are used."
