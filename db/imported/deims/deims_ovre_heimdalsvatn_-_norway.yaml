  description: "Øvre Heimdalen is located by Valdresflya in the eastern part of Jotunheimen\
    \ on the border between the municipalities of Øystre Slidre and Vågå. The valley\
    \ floor, which is oriented east-west, is at an altitude of 1,100 metres. The surrounding\
    \ mountains reach over 1,800 m above sea level. Birch forest grows on the south-facing\
    \ valley side, but the rest of the area is above the tree line.\r\n\r\nResearch\
    \ activity in Øvre Heimdalen began in 1957 with documentation of the trout population\
    \ in Øvre Heimdalsvatn, and how the biomass, growth rate and age composition of\
    \ the population were affected by environmental conditions."
