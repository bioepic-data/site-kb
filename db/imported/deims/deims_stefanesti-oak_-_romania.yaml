  description: 'Stefanesti-oak represents an ICP-Forests level II plot, being chosen
    as core plot in Futmon Project. Main parameters investigated in this plot are:
    crown condition, air chemistry, biodiversity, terrestrial biomass, soil properties,
    total nitrogen input, phenology, meteorology. The main research topics are: pollution
    effects, ecosystem structure, biodiversity driven by land use, biodiversity driven
    by climate change, forest ecology'
