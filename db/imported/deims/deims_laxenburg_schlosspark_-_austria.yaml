  description: The Schlosspark Laxenburg is located in the Vienna Basin south of Vienna.
    Extended over approximately 280 hectares in area, it is one of the largest parks
    of its kind in Central Europe. It was first mentioned in the 13th century as a
    hunting ground that formed part of the estate of a large house. Its present design
    as English landscape garden took shape in the 18th and continued into the 19th
    centuries under Joseph II and Francis II/I. In addition to recreational areas,
    there are large near-natural areas, especially meadows and forests. Due to the
    occurrence of rare species (especially birds and beetles) and unique habitats,
    the Schlosspark Laxenburg was designated as part of the Natura 2000 site "Feuchte
    Ebene- Leithaauen" since 2009 and 2011 respectively. A survey done during the
    years 2023-2025 recorded a total of 484 taxa of wild or feral plants were recorded
    (478 species, four natural hybrids and two subspecies). Of these, forty species
    are listed as being under threat in Austria according to Red List categories "Endangered"
    and "Vulnerable", and 13 species are part of the Red List.
