  description: "The study plot was established by the Institute of Forest Ecology\
    \ (Mendel University in Brno) in 1968, namely in connection with the UNESCO International\
    \ Biological Programme (IBP) and the UNESCO programme “Man and the Biosphere”\
    \ (MAB). Research was aimed at the primary production, element and water cycling\
    \ and the secondary production of invertebrates, birds and small mammals. It refers\
    \ to a semi-natural floodplain forest free of management measures characterized\
    \ by the Ulmeto-Fraxinetum carpineum forest type group. Dominant tree species\
    \ are as follows: Fraxinus excelsior, Quercus robur, Populus nigra, Tilia platyphyllos,\
    \ and Acer campestre.\r\n\r\nIn consequence of flood control, the local floodplain\
    \ forest was affected by changes in the water regime (absence of natural floods,\
    \ fall of the groundwater table) from 1972. In the course of the 1970s and 1980s,\
    \ it resulted in the insufficient supply of water. Since the 1990s, revitalization\
    \ measures have been carried out (increasing the ground water level by means of\
    \ channels) for improving forest health. Changes in the water regime have resulted\
    \ in the improving condition of the floodplain forest ecosystem that has been\
    \ documented owing to LTER on the site.\r\n\r\nFollowing research activities are\
    \ carried out there: (i) monitoring selected parameters of the stand microclimate\
    \ and mesoclimate, (ii) evaluating the moisture balance in the forest ecosystems,\
    \ (iii) evaluating the water regime and moisture conditions of the floodplain\
    \ forest ecosystem, (iv) evaluating temperature and moisture conditions, (v) research\
    \ into the water relations of trees, (vi) evaluating long-term changes in the\
    \ synusia of small terrestrial mammals of the floodplain forest, and (vii) evaluating\
    \ decomposition processes."
