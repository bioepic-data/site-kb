    country: Germany
    elevation_meters: 610.0
  description: "The Ostersee LTER-D site investigates how freshwater ecosystems respond\
    \ to changing environmental conditions and to what extent these changes are reflected\
    \ in eco-evolutionary dynamics. The site aims to establish a long-term assessment\
    \ of interactions between ecological and evolutionary processes by integrating\
    \ ecological monitoring with genomic approaches. Population genomics, together\
    \ with eDNA, eRNA, and continuous environmental measurements, provides high-resolution\
    \ insights into biodiversity dynamics, ecosystem functioning, and eco-evolutionary\
    \ responses to changing environmental conditions.\r\nThe study area is located\
    \ in the Osterseen lake district in Bavaria, southern Germany. The Osterseen comprise\
    \ approximately 20 interconnected lakes (depending on the classification), which\
    \ were formed during the last glacial period as kettle lakes (Toteisseen). The\
    \ lakes are groundwater-fed and along the north-south lake chain, a pronounced\
    \ trophic gradient develops before the system ultimately drains into Lake Starnberg.\
    \ Research focuses on the largest lake, Großer Ostersee, an oligotrophic lake\
    \ that serves as the core study system.\r\nThe Limnological Research Station Iffeldorf\
    \ of the Technical University of Munich (TUM) provides the central research infrastructure\
    \ for the site and supports long-term ecological observations, field experiments,\
    \ and sampling activities. The site is organised as an interdisciplinary collaborative\
    \ research platform involving several project partners and associated subprojects.\
    \ It serves as the foundation for long-term research within a coordinated research\
    \ network, combining expertise in limnology, ecology, evolutionary biology, genomics,\
    \ and environmental monitoring to address fundamental questions on eco-evolutionary\
    \ dynamics in freshwater ecosystems."
