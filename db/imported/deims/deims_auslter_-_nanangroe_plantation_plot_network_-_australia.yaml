  description: "The Nanangroe Plantation Plot Network is located in the southwest\
    \ slopes of NSW west of Lake Burrinjuck and includes four exotic Pine Plantations\
    \ (Nanangroe, Cotway, East Bungongo and Bungongo), as well as private properties\
    \ adjacent to those plantations. Its research infrastructure is comprised of an\
    \ array of stratified 2-ha long-term plots.\r\n\r\nTemporal visits occur annually\
    \ / biennially (rotating sampling program).\r\n\r\nBetween 2012 and 2018 the Nanangroe\
    \ Plantation Plot Network was a member of Long Term Ecological Research Network\
    \ (LTERN), Australia, a facility of the Australian Government's Terrestrial Ecosystem\
    \ Research Network (TERN))."
