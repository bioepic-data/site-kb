  description: "The Bohemian Forest in Central Europe is among the most acidified\
    \ lake districts in the world. Deposition of sulphur and nitrogen compounds in\
    \ the area rapidly increased between 1950 and 1980, and reached a maximum in mid\
    \ the 1980s. Owing to long-term occasional hydrobiological research and palaeolimnological\
    \ studies, we are able to document the significant changes in the lake water chemistry\
    \ and biodiversity (in particular the conspicuous reduction in crustacean and/or\
    \ insect species in some lakes, as well as the extinction of fish). During the\
    \ 1990s, acidic deposition decreased substantially, and its current levels are\
    \ comparable to the early 20th century for SO42– and NH4+, and to the mid 1960s\
    \ for NO3–. The decline in acidic deposition has resulted in a partial recovery\
    \ of the Bohemian Forest lakes, as well as in an improvement of the Norway spruce\
    \ physiology in their catchments.\r\n\r\nTherefore, the Bohemian Forest lakes\
    \ represent excellent LTER sites. Available historical data (biota since 1871)\
    \ and regular monitoring (biota and chemistry since 1984) provide a valuable background\
    \ for long-term ecological research of the catchment–lake ecosystems that currently\
    \ focuses on (i) chemical reversal and biological recovery of the lakes, (ii)\
    \ acidification effects on in-lake nutrient cycling, (iii) climatic effects on\
    \ water chemistry, and (iv) catchment processes, including soil biogeochemistry\
    \ and acidification impacts on vegetation (mountain spruce forests).\r\n\r\nTwo\
    \ of the lakes, the most acidified Čertovo Lake and the mesotrophic (phosphorus\
    \ rich) Plešné Lake, have been selected for detail mass-budget studies since 1998.\
    \ Hydrology, water and precipitation chemistry, soil and sediment biochemistry,\
    \ litter composition, and climatic variables have been regularly monitored with\
    \ the aim to evaluate cycling of nutrients (C, N, P, Si) and ecologically important\
    \ metals (Al, Fe) within the catchment–lake ecosystems."
