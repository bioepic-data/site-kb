  description: Kopaonik is the largest and the longest mountain range in Serbia located
    in its central part. It is proclaimed a national park in 1981. The observatory
    site in Kopaonik is located in strictly protected spruce forest, on the lower
    distribution of spruce zone on the border zone with beach forest. The mountain
    is characterized by alternating climate conditions; from warmer sub-mediterranean
    climate in the lowest part of the mountain to cold subalpine climate in high elevation
    areas. Vertical profile of the mountain with different climate zones and geological
    diversity resulted in high habitat diversity. The largest part of the area is
    covered by climatologically adapted mixed deciduous and coniferous forest having
    obvious zonal transition. A large number of endemic and relict plant species makes
    Kopaonik one of the most significant biodiversity centers in Serbia. Main threats
    to the area besides soil erosion present logging, deforestation and tourism.
