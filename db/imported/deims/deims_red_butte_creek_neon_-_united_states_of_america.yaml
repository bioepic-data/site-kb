  description: Red Butte Creek (REDB) is an aquatic NEON field site located just east
    of Salt Lake City, UT near Fort Douglas. It is a second-order wadeable stream.
    The stream reach is located upstream of the Red Butte Reservoir and a U.S. Geological
    Survey gaging station. The stream is confined within a steep canyon drainage basin
    in the southwestern Rocky Mountains and drains a 16.7 km2 (4130 acre) watershed.
    REDB is managed by the United States Forest Service and the University of Utah.
    The site is part of NEON's Great Basin Domain (D15), which is bordered by the
    Sierra Nevada to the west, the Rocky Mountains and Colorado Plateau to the east,
    the Mojave Desert to the south, and the Columbia Plateau to the north. D15 has
    one other field site, the terrestrial site ONAQ.
