  description: Caddo – Lyndon B. Johnson National Grasslands (CLBJ) is a terrestrial
    NEON field site located in the Great Plains region of north-central Texas, about
    50 km (30 mi.) northwest of Denton. CLBJ occupies approximately 80 km2 (20,000
    acres) of public lands managed by the U.S. Forest Service. NEON samples 41.9 km2
    (10,300 acres) of area at CLBJ. The site has fairly flat terrain and consists
    of a mosaic of oak-dominated forests and grasslands. CLBJ is part of NEON's Southern
    Plains Domain (D11), which stretches over the central sections of Texas and Oklahoma
    and includes portions of southern Kansas and southern New Mexico. D11 has three
    other NEON field sites, including one additional terrestrial and two aquatic sites,
    located in Texas and Oklahoma. CLBJ is colocated with the Pringle Creek (PRIN)
    aquatic field site.
