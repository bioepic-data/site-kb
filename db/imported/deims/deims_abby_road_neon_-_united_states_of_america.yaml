  description: 'Abby Road (ABBY) is a terrestrial NEON field site located approximately
    30 km (18 mi.) northeast of Vancouver, WA and situated in the western foothills
    of the Cascade Range in the Yacolt Burn State Forest. The 29.9 km2 (7390 acre)
    site is a conglomerate of parcels managed by the Washington Department of Natural
    Resources (WDNR) and is typical of WDNR land in the area. Different parcels have
    logging years that range from 1940 to 2016, allowing for the opportunity to collect
    NEON data on a dynamically managed forest landscape. ABBY is located in NEON''s
    Pacific Northwest Domain (D16), which is bounded by the Pacific on the west and
    Canada on the north. It includes the eastern halves of Washington and Oregon and
    parts of northern California. The Domain hosts three other field sites: two aquatic
    and one additional terrestrial.'
