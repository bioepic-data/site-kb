  description: Fukang Station in the hinterland of the Eurasian continent (44o17'N,
    87o56'E and 475 m a.s.l.). The station is 8 km from the southern edge of the Gurbantonggut
    Desert and 72 km south of the highest peak of the eastern Tianshan Mountains (5445
    m a.s.l.). The study area is fairly flat (slope < 1o), and the groundwater table
    fluctuates between 2-5m depth. The soil is a silty clay-loam, consisting of 7%
    clay, 32% sand and 61% silt, with total nitrogen and C contents of 0.068 and 1.064%,
    respectively. The local climate is temperate continental arid with hot summers
    and cold winters. The winter extends from November to late March; and includes
    a snow cover of 20-30 cm. The growing season usually starts in early May and ends
    in late October. Mean annual air temperature is 6.6°C. Mean annual precipitation
    is 163 mm, with the majority of it (60-70%) falling between May and September.
