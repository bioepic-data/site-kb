  description: The ICOS Enisala ecosystem station, operated by RCSES–University of
    Bucharest in collaboration with the Danube Delta National Institute, monitors
    exchanges of carbon dioxide, water and energy between wetland ecosystems and the
    atmosphere. Located within the Danube Delta Biosphere Reserve, it supports long-term
    research on wetland carbon dynamics and ecosystem responses to climate variability
    and environmental change.
