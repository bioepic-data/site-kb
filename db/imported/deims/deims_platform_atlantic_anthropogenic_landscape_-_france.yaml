  description: "The AAA-LTER platform focuses on agricultural and urban landscape\r\
    \nThe objective of the proposed LTSER structure is to provide an internationally\
    \ open, attractive and recognized scientific observatory of human/nature interactions.\
    \ Through its representativeness of environmental issues of Atlantic terrestrial\
    \ and aquatic landscapes and the complementarity of its eLTER sites, the AAA-LTSER\
    \ is a unique showcase for decision makers to help them in defining regional decision\
    \ frameworks and sustainable policies, and to promote technical and social innovation\
    \ as well as science education.\r\nThe AAA-LTSER embraces regional social-ecological\
    \ dimensions whose diversity of landscape use and planning covers a unique set\
    \ of interconnected aquatic and terrestrial systems. lt concentrates multiples\
    \ supports and cofunding from the European Union, the State, the Brittany region\
    \ and local institutions to improve and maintain high density of sensors, equipment\
    \ and social studies that are crucial for better understanding human/nature interactions\
    \ and train the next generation of scientists to work at these interfaces in inter-\
    \ and trans-disciplinary approaches.\r\nTo cover the major regional environments\
    \ and interfaces (continent/ocean, urban/rural, subsurface/surface), the AAA-LTSER\
    \ platform is founded on existing and complementary sites. They represent the\
    \ different terrestrial, transitional and marine landscape structures, features\
    \ and dynamics that shape this intensive anthropogenic\r\nregion, and their related\
    \ social-ecological issues. All these sites involve end-users and policy makers\
    \ seeking for advanced understanding of social and ecological interactions and\
    \ the definition, validation and promotion of sustainable policies."
