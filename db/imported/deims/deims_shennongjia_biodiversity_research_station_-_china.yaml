  description: "Shennongjia Station is located in Xingshan County, Hubei Province,\
    \ China. It is located in the southern slope of Mount Shennongjia. The altitude\
    \ is 1290m above sea level. The typical forest types are the northern subtropical\
    \ mixed evergreen and deciduous broadleaved forest.\r\nShennongjia Station was\
    \ established in 1994, it became a station of National Field Research Station\
    \ network running by the Ministry of Science and Technology of the People’s Republic\
    \ of China in 2005, and became a member of Chinese Ecosystem Research Network\
    \ (CERN), CAS in 2008."
