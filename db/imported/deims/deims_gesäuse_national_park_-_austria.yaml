  description: "The Gesäuse Nationalpark was founded in 2002 and is located in Styria,\
    \ in the Center of Austria. It is Austrias third largest National Park with an\
    \ area of about 120 km² . The Gesäuse is characterized by a mountainous landscape\
    \ which is cut by the river \"Enns\". Most parts of the Nationalpark are coverd\
    \ by mountain forests. Other important habitats are alpine grasland, rock and\
    \ scree habitats and pastures. The Enns with its alluvial forests and its small\
    \ islands as well as the numerous freshwater springs represent very special habitats\
    \ within the mountain ranges. Because of the great range of altitude differences\
    \ within a small area in the Gesäuse National Park, there is a dense concentration\
    \ of extremely diverse habitats and, consequently, of species of animals and plants.\
    \ Furthermore the Gesäuse is known for its exeptional richness in endemic species.\r\
    \n\r\n200 years ago, the natural beauty of the Gesäuse region, the contrast between\
    \ the river Enns and the sheer rock faces of Gesäuse mountains with their diverse\
    \ habitats and species, already attracted researchers and mountaineers to this\
    \ area in the heart of Austria. As early as 1958, the Gesäuse and the valley of\
    \ the river Enns leading out of it were designated as the first conservation area\
    \ in Styria. Persisting plans for hydroelectric power generation on the Enns eventually\
    \ led to the creation of a national park. The Gesäuse NP was established on 26\
    \ October 2002 and internationally recognized in 2003 by the IUCN as Cat. II protected\
    \ area (national park). Large areas of the national park are also part of the\
    \ Natura 2000 network in the sense of the EU Fauna Flora Habitat and Birds Directives.\
    \ With 11 000 ha, it is the third-largest National park in Austria. It is situated\
    \ in the Ennstal Alps in the province of Styria, which are part of the Northern\
    \ Limestone Alps and includes essentially the two mountain ranges of Buchstein\
    \ and Hochtor. In the north it borders on the Eisenwurzen Nature Park and is only\
    \ ten kilometres away from Kalkalpen NP in Upper Austria.\r\n\r\nCurrently there\
    \ are six national parks in Austria, which are recognized by the IUCN as Cat.\
    \ II national parks. Covering an area of 2 382 km², they make up 2.8 % of the\
    \ Austrian territory and include some of the ecologically most valuable regions.\
    \ They are organized under the umbrella of Nationalparks Austria to leverage synergies\
    \ and to ensure consistent presentation to the general public. The directors of\
    \ the national parks coordinate and initiate joint activities in cooperation with\
    \ the Federal Ministry of Agriculture, Forestry, Environment and Water Management\
    \ and the respective federal provinces. National parks across the world aim to\
    \ protect areas of outstanding natural beauty, rich diversity of plants and animals,\
    \ rare or endangered species and special natural phenomena. The label is designed\
    \ to prevent technical development and economic exploitation and to safeguard\
    \ natural dynamics. Humans are invited to participate as quiet observers. As internationally\
    \ recognized IUCN Cat.II protected areas, all national parks in Austria are committed\
    \ to four basic tasks:\r\n-- conservation and protection of biodiversity;\r\n\
    -- recreation and nature experience;\r\n-- education about nature and the environment;\r\
    \n-- research.\r\nResearch in the Gesäuse NP concentrates in implementing its\
    \ core tasks of protecting habitats and species. Most of it is therefore research\
    \ into applied conservation, with basic research taking second place. Applied\
    \ conservation research includes documenting habitats and species in the national\
    \ park, basic research includes long-term research and monitoring of changes in\
    \ the natural landscape. In the Gesäuse NP the focus is on dynamic habitats like\
    \ avalanche chutes, windthrow areas, scree gullies or gravel banks in the river.\
    \ Initial results underline the special significance of these ecosystems shaped\
    \ by extreme weather for biodiversity in the national park. In terms of long-term\
    \ research, over the last seven years the Gesäuse NP has established a network\
    \ of permanent monitoring sites in diverse habitats (springs, running waters,\
    \ forest, high mountain pastures, peaks, etc.). In addition to monitoring the\
    \ vegetation in these sites, the focus is on identifying various groups of animals\
    \ as indicator species. These special climate change monitoring projects in the\
    \ national park include studies of flora and fauna at peaks (GLORIA) and the creation\
    \ of a network of metereological measuring stations that represents all altitudinal\
    \ zones and expositions. A project modelling climate and hydrological scenarios\
    \ is headed by the University of Graz and includes a dozen partners. The national\
    \ park works closely with universities on numerous projects. Many theses have\
    \ been written on issues of the Gesäuse. The national park offers the local infrastructure\
    \ and the universities bring their special know-how to the research in the national\
    \ park.  All research deliverables in the national park are also available online\
    \ on the dedicated research web page http://www.parcs.at/npg"
