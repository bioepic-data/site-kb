  description: 'UK Upland Waters Monitoring Network (UK UWMN) site. Narrator Brook
    lies in the Dartmoor National Park, south-west England. The study catchment covers
    446 ha and drains into the Burrator Reservoir. The altitude at the reservoir inflow
    is 225 m and a maximum altitude is reached at Cairn Eylesbarrow (456 m). The underlying
    geology is composed of granite and soils consist of brown podsols, stagnopodsols
    and stagnohumic gleys. Molinia dominated blanket bog comprises about two thirds
    of the catchment, with acid grassland invaded by Pteridium, conifers, deciduous
    woodland and valley bog constituting the remainder. The catchment is utilised
    for low-intensity grazing by sheep, cattle and ponies and a small area at the
    western end is common land, but other land-management is minimal. The conifers,
    which are not planted to the stream edge, were planted in 1931-1933 and thinned
    (and replanted in places) between 1980 and 1988. They now fall within a Woodland
    Grant Scheme. Annual rainfall is c. 1800 mm. Note: The area is the size of the
    catchment.'
