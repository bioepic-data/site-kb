  description: Great Smoky Mountains National Park, Twin Creeks (GRSM) is a terrestrial
    NEON site located in the mountains of southeastern Tennessee near the North Carolina
    border. It is comprised of 32.7 km2 (8080 acres) within the 2108 km2 (814 sq.
    mi.) Great Smoky Mountains National Park. GRSM is characterized by abundant rainfall,
    variable elevations, and an exceptional richness of biota hosted by closed-canopy
    deciduous old growth forests. As one of the largest protected areas in the eastern
    U.S., it is the most biodiverse park in the National Park system and the most
    visited. GRSM is part of NEON Domain 07 - Appalachians & Cumberland Plateau, which
    includes eastern Tennessee, most of Kentucky, southern Ohio, and parts of North
    Carolina, Georgia, Indiana, and Illinois. D07 includes four other NEON field sites,
    including two additional terrestrial sites and two aquatic sites. GRSM is colocated
    with the LECO aquatic field site.
