  description: The station supports a comprehensive year-round monitoring programme
    covering basic climatology and local climate gradients in the Mittivakkat Glacier
    drainage basin, glacier mass balance, run-off and sediment transport, and the
    development of coastal and delta geomorphology. Data are available on request
    from the three climate stations and a hydrometric station. Glacier mass-balance
    measurements and glacier surveys has been carried out since the mid 1980s and
    delta surveys since 1989. Maps, digital 3D terrain models, satellite data, and
    aerial photographs, in addition to a complete bibliography of publications arising
    from research at the Sermilik Research Station are available on request.
  status: ACTIVE
