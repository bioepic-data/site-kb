  description: 'The Ploemeur-Guidel observatory (Britanny, France) is focusing on
    surface-depth relationships in a fractured crystalline geological context and
    oceanic climate. It is built on 2 sub-sites, one highly anthropized, the other
    in natural state. In Ploemeur, groundwater has been pumped since 1991, supplying
    more than 1 million m3 of clean drinking water annual at a sustainable rate. Such
    high productivity is explained the specific fractured network in granite and micaschists,
    draining deep geological layers (~400 m). Extracted water quality is very good,
    with limited nitrate concentration, in a region that has been strongly affected
    by widespread pollution. Guidel site is in a similar, but natural context. Deep
    iron-rich groundwater is upflowing, creating surface and deep groundwater-dependent
    ecosystems, and feeding a classified coastal wetland. Both sites have a very dense
    equipment to study rapid to long-term surface-depth exchanges: a flux tower, unsaturated
    zone monitoring, a network of ~50 shallow (<10m) and deep boreholes (>80m), hydrochemical,
    temperature and deformation. An well-characterized fractured experimental site
    offers the possibility to conduct experiments to test innovative instruments and
    develop new methodologies'
