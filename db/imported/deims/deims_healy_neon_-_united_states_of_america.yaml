  description: Healy (HEAL) is a terrestrial NEON field site located in central Alaska,
    120 km (75 mi.) southwest of Fairbanks and at the northern border of Denali National
    Park. The 45.6 km2 (11,300 acre) site is managed by the Alaska Department of Natural
    Resources. It sits at an average of 678 m (2224 ft.) in elevation and is situated
    in a high-elevation, glaciated valley where the dominant vegetation consists of
    dwarf shrubs and sedge meadows. This valley experiences widespread permafrost
    thawing, making it a valuable resource to understand how other permafrost systems
    in Alaska may experience and react to thawing in the future. The site is open
    to the public for recreation including hunting, berry picking, snowmobiling, and
    dog sledding. HEAL is one of the four sites (three terrestrial and one aquatic)
    located in the NEON Taiga Domain (D19), which comprises Alaska’s interior and
    the Alaska Peninsula.
