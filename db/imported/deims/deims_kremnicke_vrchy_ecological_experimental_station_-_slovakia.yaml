    longitude: 19.069098
    country: Slovakia
    elevation_meters: 470.0
  description: 'The research is focused on complex study of ecological processes running
    within the beech ecosystem at the lower edge of its occurrence. The Ecological
    Experimental Station (EES) was founded in the Kremnické vrchy Mountains (Western
    Carpathians, Slovakia) in 1986. It is located at 500 m a.s.l., on SW slope. The
    leading stand-forming association is Dentario bulbiferae-Fagetum Z l a t n i k
    1935, with locally admixed Carici pilosae-Fagetum O b e r d. 1958. For both associations,
    to the permanent constituents (at different dominances and abundances) belong:
    Carex pilosa, Carex sylvatica, Carex digitata, Galium odoratum, Dentaria bulbifera,
    Anthyrium filix-femina, Dryopteris filix-mas. The dominant tree species at the
    locality is beech (80–95%); fir, oak and hornbeam are the associated species.
    The soil type is andic cambisol with high skeleton content (20–60%) and mild acid
    reaction (pH 5.4–6.4), the humus form is acid mull. The long-term mean (1951–1980)
    annual air temperature is approximately 6.8 °C, with a mean of 17 °C in the warmest
    month (July) and - 4 °C in the coldest month (January). The mean annual precipitation
    is approximately 780 mm. An increasing value (+1.1 °C) of the mean annual air
    temperature was observed during the last two decades; however, the mean annual
    precipitation did not change significantly. The site is equipped with a few climatic
    microstations, collectors for precipitation and litterfall, lysimeters, dendrometers,
    etc.'
