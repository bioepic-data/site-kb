  description: 'Konza Prairie Agroecosystem (KONA) is a terrestrial NEON field site
    is located in the Flint Hills region of Kansas just 10 km (6 mi.) south of Manhattan,
    KS. Sampling occurs in a 3.6 km2 (903 acre) area of cultivated crop fields owned
    and managed by Kansas State University’s Department of Agronomy and Department
    of Animal Science and Industry. The site is focused on sampling within agricultural
    systems. The surrounding region consists of grasslands, forests, and agricultural
    land cover types and includes the largest remaining areas of unplowed tallgrass
    prairie in North America. KONA is part of the NEON Prairie Peninsula Domain (D06),
    which stretches from Kansas through Nebraska and Iowa to southern Minnesota, and
    moves east to encompass Illinois and most of Indiana. The Domain hosts four other
    NEON field sites: two aquatic and two additional terrestrial, all of which are
    located in Kansas. KONA is colocated with the KING aquatic field site and just
    5 km (~3 miles) west of the KONZ terrestrial site. The two sites provide a contrast
    between more pristine prairie at KONZ and heavily impacted agricultural land at
    KONA within the same area. Land use and land use management are key grand challenge
    themes for this Domain.'
