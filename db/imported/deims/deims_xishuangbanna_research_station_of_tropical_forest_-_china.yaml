  description: Xishuangbanna Research Station of Tropical Forest was located in Mengla
    County, Yunnan Province, China. The annual mean air temperature was 21.5 °C, with
    a minimum monthly mean temperature of 15.5°C in January. Average annual rainfall
    was 1557 mm. The dominant tree species in the forest are Pometia tomentosa,Terminalia
    myriocarpa Vaniot Huerck et Muell.-Arg.
