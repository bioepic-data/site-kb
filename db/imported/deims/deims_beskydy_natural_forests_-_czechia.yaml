  description: Three natural forest reserves – Mionší, Razula, and Salajka – represent
    current Carpathian fir-beech forests. They were historically influenced by a Walachian
    colonization that came to the Beskydy Mts. from south and affected forests by
    sheep grazing, litter raking, and gathering beech firewood. Although excess felling
    was not realized in these natural forests, species structure was affected in favour
    of fir during modern times. Since the 1930s, all three LTER sites have been left
    to spontaneous development. Beech has returned as the main species of these stands.
    Exceeding numbers of deer game populations, which represent main indirect human
    influence in these reserves, block growing out of fir seedlings considerably.
    Various ways of seedling protection are tested inside the sites; however, no selective
    interventions on advanced growth are practiced. Indispensable positive influence
    should play a gradual return of natural predators of deer game (lynx, wolf, and
    also bear) into the western Carpathians.
