  description: O Peld Sitio 17 conta com uma boa infraestrutura, embora haja necessidade
    de ampliação da mesma para o amplo aproveitamento da estrutura montada. No local
    contamos com um bom apoio do Parna Serra do Cipó, que possui uma área construída
    de mais 2000m2. O parque conta atualmente com duas casas que tem sido utilizadas
    com certa freqüência por pesquisadores. Estas estão localizadas a 800 e 1500 metros
    de altitude facilitando os estudos no gradiente altitudinal. Não há problemas
    com água, eletricidade e telefone, embora o acesso a internet seja ainda precário.
    Atualmente, há necessidade de maior entendimento por parte daquela instituição
    para com a pesquisa, uma das funções que foram o pilar para a criação das UCs
    no país. Esperamos poder ampliar esta colaboração através de reunião com os dirigentes
    locais e federais pois tanto o ICMBio quanto pesquisadores se beneficiam com a
    pesquisa. Embora o ICMBio possua veículos os mesmo não podem ser utilizados por
    terceiros, o que representa um enorme problema. Todavia, neste edital foi propiciado
    a aquisição de veículos o que é importante para este e qualquer outro projeto,
    visto que as Universidades e institutos geralmente não fornecem este apoio sem
    o pagamento de diárias para os motoristas (além do número limitado de veículos
    e motoristas). Na e APA Morro da Pedreira há mais de 100 pousadas e três bons
    hotéis. A região dista apenas 60 km do Aeroporto Internacional de Confins e 100
    km de B. Horizonte. A realização do projeto na fase I foi, por outro lado, garantida
    através da parceria estabelecida com os moradores do local, os quais estão acostumados
    com a figura do cientista. Assim, contamos com o apoio total de pousadas (Serra
    Morena, Pouso do Elefante), empresas (Cedro) e ainda da Reserva Vellozia, a qual
    forneceu apoio logístico, alojamento e laboratório para o desenvolvimento das
    atividades o projeto.
