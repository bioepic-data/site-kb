  description: The Majorca site (12,000 m2) is located at Ses Sitjoles, in the southeast
    of the island. It offers an aquifer in a Miocene reefal limestone setting, highly
    permeable, with a number of meter-scale karstic cavities. Intensive farming and
    irrigation in this area have led to over-exploitation of the water tables, which
    has caused intrusions of salt water up to 15 km from the coast, resulting in chloride
    pollution of the water tables. The experimental site includes a network of twelve
    100-m boreholes, six of which are fully cored. The site is monitored by a team
    from UMR Géosciences Montpellier.
