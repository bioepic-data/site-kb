  description: "Pallas LTER observatory is located in northern Finland, in Muonio\
    \ and Kittilä municipalities. The observatory consists of versatile research infrastructure\
    \ for monitoring and studying the atmosphere, ecosystems and their interactions.\
    \ Pallas is located 170 km north of the Arctic Circle, partly in the area of Pallas-Yllästunturi\
    \ National Park. The Finnish Meteorological Institute (FMI) has a long history\
    \ of atmospheric monitoring at Pallas: the first weather station was established\
    \ near Lake Pallasjärvi in 1935. The measurements of atmospheric composition were\
    \ started in 1991, and the Sammaltunturi station was established as a node of\
    \ the Pallas–Sodankylä Global Atmosphere Watch (GAW) station in 1994. Currently,\
    \ Pallas comprises one of the most important research infrastructures in Finland\
    \ and in the wider circumpolar region, contributing to numerous European and global\
    \ research programmes, such as GAW, ICOS, ACTRIS and EMEP. Research infrastructure\
    \ at Pallas includes also the Pallasjärvi Research Forest and a research area\
    \ of Lake Pallasjärvi catchment, locating in the immediate vicinity of the Pallas-Yllästunturi\
    \ National Park. Due to the warming effect of the Gulf Stream the observatory\
    \ area is included in the boreal forest region. However, with regard to stratospheric\
    \ meteorology, the observatory can be classified as an Arctic site. Its strategic\
    \ location, coupled with ready accessibility from all parts of the world, makes\
    \ the observatory an excellent base for studying various themes of global change\
    \ in a northern context. \r\n\r\nPallas LTER observatory is part of Pallas-Sodankylä\
    \ GAW (Global Atmosphere Watch) station which incorporates a variety of biotopes,\
    \ e.g. forests, bogs, barren mountain tops, lakes and rivers. In addition to the\
    \ Pallas site, the Pallas-Sodankylä GAW station encompasses the Arctic Space Centre\
    \ in Sodankylä (FMI-ARC). Upper-air soundings, climatological and other meteorological\
    \ measurements are made at the Sodankylä Observatory, and tropospheric air composition\
    \ and related boundary layer meteorological measurements at Pallas."
