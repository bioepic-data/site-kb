  description: The LTER site Kaunertal reaches from the glaciated peak of the Weißseespitze
    (3600 m) to the Gepatschferner, the second-biggest Austrian glacier, down to the
    community of Kaunertal. The Gepatschferner is one of the most thoroughly studied
    glaciers in Austria, with a chronology of advances and retreats that covers the
    Holocene. Comprehensive data also exist on changes in the tree line and the distribution
    of permafrost and rock glaciers. Run-off and mass balance data on the glacier
    and detailed studies on the geomorphology of the glacier forefield and the role
    of biota for sediment mobilization complement the studies in the glaciated catchment
    area. In 2023 we started a project on butterfly monitoring. In 2021 the community
    of Kaunertal created a museum dedicated to research.
