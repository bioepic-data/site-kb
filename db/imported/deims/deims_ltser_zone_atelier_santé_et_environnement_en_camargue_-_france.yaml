  description: The LTSER Zone Atelier Santé et Environnement en Camargue focuses on
    the theme of the socio-ecology of health, in coherence with human activities,
    conservation and the protection of ecosystems and biodiversity, from a “Full Health”
    perspective that goes beyond the “One-Health” approach. It brings together a diversity
    of disciplines, from environmental science to health ecology, involving collaboration
    between scientific, private, public, associative and citizen players. The interdisciplinary
    research carried out aims to characterize the operational links between man and
    nature, respond to societal health issues in the Camargue and steer the Camargue
    socio-ecosystem towards resilience and sustainability in terms of health.
  status: ACTIVE
