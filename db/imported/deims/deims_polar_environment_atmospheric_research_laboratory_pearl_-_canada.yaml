  description: The major emphasis at PEARL is on atmospheric research. The original
    purpose of the installation was to monitor stratospheric ozone, and although that
    work is still ongoing, the research has now broadened in scope to encompass the
    entire atmosphere and beyond. Current measurements include ozone and associated
    chemicals in the stratosphere as well as the troposphere, aerosols and particulates,
    radiation and fluxes and upper atmo­sphere temperatures, winds, and waves. Other
    research groups including biologists, astronomers, and geologists regularly make
    use of the nearby Eureka Weather Station as a base. Measurements are regularly
    submitted to the NDACC, TCCON, and AeroNet databases.
  status: ACTIVE
