    name: The UNESCO/UNEP the Pilica River Demonstration Site - Poland
  location:
    latitude: 51.3528
    longitude: 19.8847
    country: Poland
    elevation_meters: 227.0
  description: 'The UNESCO/UNEP demonstration project of the Pilica River is an LTSER
    platform comprising four spatial levels: the river and its catchment, the floodplains,
    and a lowland reservoir. The main activities focus on: implementation of the operational
    procedures for hydro-biomanipulation at the dam; enhancing the absorbance capacity
    of floodplain for nutrients and pollutants; identification of hot-spots for the
    eutrophication of the reservoir in the Pilica catchment; enhancing the potential
    for nutrient assimilation by small rivers and streams through restoration of plant
    buffering zones. The site covers the upstream part of the Pilica River catchment
    (above the Sulejow Reservoir) with marshes, flooded meadows, willow shrubs, arable
    land, woodlands and small streams. The site was launched in 1996 within the UNESCO-IHP
    Ecohydrology programme as a demonstration and experimental project that incorporates
    social factors and refers to management issues of complex catchment-river-reservoir
    system. Part of the project has been establishing of multi-stakeholder platform
    and permanent collaboration with local and regional decision makers.'
