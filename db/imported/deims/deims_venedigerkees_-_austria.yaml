  description: The Venedigerkees in the Hohe Tauern National Park is the easternmost
    tributary glacier to the former tongue of Obersulzbachkees. As a result of the
    strong retreat of Obersulzbachkees, the glacier disintegrated into several tributary
    glaciers, with a large lake remaining at the location of a famous serac zone,
    the 'Türkische Zeltstadt'. Mass balance of the Venedigerkees is measured since
    2011/12 with the direct or glaciological method. Furthermore, an automatic weather
    station was built between Venedigerkees and Keeskogel in 2018.
