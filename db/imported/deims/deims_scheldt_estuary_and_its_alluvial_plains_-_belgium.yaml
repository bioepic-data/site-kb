    country: Belgium
    elevation_meters: 4.84
  description: The study site starts at the mouth of the river (Vlissingen, the Netherlands)
    and extends to Gent, 160 km from the mouth, where tidal influence is stopped by
    sluices. The tributaries the Durme and the Rupel, with the Nete , Dijle and Zenne
    are also under tidal influence and are considered part of the estuary. The natural
    inundated areas around the river and the valleys up to 5m TAW are also part of
    the study system.
