  description: The P3M platform offers two special features linked to its position
    in the Mediterranean context. It is a biodiversity hot spot, in terms of both
    animal and plant biodiversity. It is also a "hot spot" for climate change, marked
    by an increase in the intensity and frequency of hydroclimatic extremes (cevenol
    episodes, flash floods, droughts, aridification, heat waves, etc.). We need a
    better understanding of the interrelationships between human activities, climatic
    phenomena, biophysical processes and biodiversity, especially as the Mediterranean
    region is subject to increasing anthropogenic pressure. These interrelationships
    are expressed differently depending on the constraints faced by the agro-ecosystems
    along the platform (mid-mountains, high plateaus, piedmonts and wine-growing hilly
    plains).
  status: ACTIVE
