  description: Tara mountain is a part of Dinaric Alps with an average height of 1200
    m above sea level and is a typical forested area located in western Serbia. Its
    forests are among the best preserved and most productive forests in Europe and
    represent the greatest natural value of Tara. The area has a temperate continental
    climate with subalpine influences. High humidity is caused by currents from the
    Drina canyon and daily mist. More than 75% of the area is covered with mixed forest
    of beech, fir and spruce. Tara is a well known refugium for many relict and endemic
    plant species among which the most valuable and recognizable is the endemic and
    relict Serbia spruce, Picea omorica (Pancic) Purkyně with very limited range to
    about only 60 ha.
