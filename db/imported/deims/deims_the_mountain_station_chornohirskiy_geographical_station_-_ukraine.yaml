  description: '"Chornohirskiy geographical station" (CHGS) by Ivan Franko National
    University of Lviv (LNU) is located at the upper part of the Prut river basin,
    at 17 km from the town Vorokhta, Ivano-Frankivsk region and is within Carpathian
    National Nature Park (48˚10̍ .45 N; 24˚34̍.32 E). The station was founded in 1978
    and is in operation by now.'
