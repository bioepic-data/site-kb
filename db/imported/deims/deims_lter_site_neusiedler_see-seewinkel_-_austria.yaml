  description: "The LTER Site Neusiedler See-Seewinkel is situated at Lake Neusiedl\
    \ in Illmitz (Austria) and is operated by the Biological Station and the Nationalpark\
    \ Neusiedler See-Seewinkel. Both institutions offer high scale experience in basic\
    \ and applied ecological research in Burgenland over the last 50 years. \r\n\r\
    \nLocated in the middle of the Neusiedler See – Seewinkel national park the Biological\
    \ station hosts a high standard chemical and microbiological laboratory for water\
    \ analysis, which has an accreditation for a variety of physico-chemical, chemical\
    \ and microbiological parameters as well as diverse sampling procedures. The Institution\
    \ provides expert opinions for water quality as well as applied cross-sectoral\
    \ research and ecosystem monitoring. \r\n\r\nThe Neusiedler See - Seewinkel National\
    \ Park is the first cross-border National Park in Austria and the first Austrian\
    \ National Park recognised by the IUCN. It covers in total about 90km² on Austrian\
    \ territory. About 50% of the area (about 4500 ha) is a Nature Reserve Zone, which\
    \ remains untouched by humans. This zone is dominated by the southernmost Austrian\
    \ part of the reed belt from Lake Neusiedl. The Conservation Zones are mainly\
    \ cultural landscapes and require landscape conservation measures and habitat\
    \ management like pasturing, mowing, cutting reed or water retention. These measures\
    \ are taken to preserve the cultural landscape and its biodiversity that has developed\
    \ over centuries. Important habitats like 160 km² of reed belt and around 40 periodically\
    \ dry soda lakes, as well as sand habitats, dry and wet meadows can be found closely\
    \ associated with vineyards, cropland, touristic infrastructure and rural settlements.\
    \ Long-term monitoring programs regarding bird populations, fish ecology or the\
    \ grazing management enable the cross-border National Park Neusiedler See - Seewinkel\
    \ to provide biological data from flora and fauna. Furthermore, all soda lakes\
    \ are monitored frequently regarding salinity, oxygen, temperature, color etc.\
    \ and biological parameters such as species diversity and quantity of macrozoobenthos.\r\
    \n\r\nThe Site is a well-known cooperation partner of local, regional, national\
    \ and international institutions, stakeholders, Universities and state offices\
    \ of Burgenland.\r\nWith several different subsites and partners (ABOL (NHM Wien),\
    \ Hydrographischer Dienst Burgenland, Medizinische Universität Wien, Universität\
    \ Wien, Umweltbundesamt), the Biological Station is able to provide long-term\
    \ data regarding meteorology, limnology, lake chemistry, entomology, botany, air\
    \ quality and carbon-fluxes.\r\nThus, the Biological Station provides bases for\
    \ decision making with regard to the development of a balanced cultural landscape."
