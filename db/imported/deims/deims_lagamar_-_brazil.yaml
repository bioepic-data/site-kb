  description: The region of Lagamar covers the coast of Paraná and south of São Paulo,
    and comprises a complex that includes estuaries, mangroves, coastal lagoons, coastal
    rivers, salt marshes, lowland and mountain forests. It is a mosaic composed of
    43 protected areas, which is the largest remnant of Atlantic Forest in the country.
    Despite this, some areas of the Lagamar went through a process of urbanization
    and agricultural expansion, which altered the natural systems on different scales.
    The areas studied are the Lauraceas State Park, the Cachoeira Natural Reserve,
    the Salto Morato Natural Reserve and the Guaraguaçu Reserve.
