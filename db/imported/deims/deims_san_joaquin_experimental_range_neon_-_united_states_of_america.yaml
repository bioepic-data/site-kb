  description: The San Joaquin Experimental range (SJER) is a terrestrial NEON field
    site located approximately 40 km (25 mi.) north of Fresno, CA. The 18.2 km2 (4500
    acre) site sits at 210-520 m (690-1700 ft.) above sea level in the foothills of
    the Sierra Nevada mountains and is hosted by the U.S. Forest Service. The area
    is mainly grassy open oak woodland and drains into the San Joaquin River basin.
    It is part of the Pacific Southwest Domain (D17), which is bounded by the Pacific
    Ocean on the west and the Sierra Nevada Mountains on the east, and encompasses
    most of California. There are four other NEON field sites in D17, including two
    additional terrestrial sites and two aquatic sites.
