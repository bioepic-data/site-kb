  description: "The Alt Pirineu Natural Park is a governmental institution owned by\
    \ the Catalan Government (Generalitat de Catalunya)\r\nThe ownership of the lands\
    \ included in the Alt Pirineu Natural Park is mainly held by Public Law organisations,\
    \ for the most part Town Councils and Entitats Municipals Descentralitzades (DME-Decentralized\
    \ Municipal Entities), who are the owners of communal forests (62% of the area).\r\
    \n36.2 % Communal Town Councils. 25,314 ha\r\n36.0 % Communal DME. 26,293 ha\r\
    \n14.8 % Large Privately Owned States. 10,324 ha\r\n9.3 % Catalan Government Generalitat\
    \ de Catalunya. 6,485 ha\r\n3.1 % Smaller Privately Owned States (smallholding).\
    \ 2,148 ha\r\n0.6 % State Government (CHE and DPH). 405 ha\r\nThe legal owner\
    \ of communal forests is the state body, but the right of exploitation of its\
    \ natural resources relies on the neighbour communal body of a village (or villages)\
    \ to which each forest belongs.\r\nPrivate ownership of the Park is shared among\
    \ a few, large privately owned areas (named “private societies”, as could be the\
    \ mountain in Tor or the states Ison-Estallo and Boavi-Broate), and the traditional\
    \ smallholding ones at the foot of valleys and lower slopes of the Pyrenean mountains.\r\
    \nFinally, the Generalitat de Catalunya is the titleholder of some forestry grounds\
    \ mostly found along the core area of the river Noguera Pallaresa."
  status: ACTIVE
