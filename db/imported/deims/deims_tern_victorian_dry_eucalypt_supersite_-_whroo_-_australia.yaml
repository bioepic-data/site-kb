  description: "The Victorian Dry Eucalypt SuperSite is a member of the Australian\
    \ SuperSite Network (SuperSites, http://www.supersites.net.au/), a facility within\
    \ the Australian Terrestrial Ecosystem Network (TERN, http://www.tern.org.au/)\
    \ and has two nodes (Whroo and Wombat). The Victorian Dry Eucalypt SuperSite -\
    \ Whroo site near Shepparton was established in 2011.  The vegetation is dominated\
    \ by two main Eucalypt species: Eucalyptus microcarpa (Grey Box) and Eucalyptus\
    \ leucoxylon (Yellow Gum). Smaller numbers of Eucalyptus sideroxylon (Ironbark)\
    \ and Acacia pycnantha (Golden Wattle) are also found on site. The surrounding\
    \ area includes the Whroo Historical area, and Rushworth State containing remnant\
    \ native vegetation.\r\n\r\nKey research objectives include: \r\n\r\n•\tWhat are\
    \ the elements of structure, composition, functions and processes of the dry eucalypt\
    \ forests of South Eastern Australia required for the sustainable management of\
    \ these ecosystems? \r\n\r\n•\tWhat is the carbon sink/source strength of a dry\
    \ sclerophyll forest and what is their contribution to Australia’s National Carbon\
    \ Inventory? \r\n\r\n•\tWhat is the magnitude of emission and/or uptake of non-CO2\
    \ greenhouse gases, such as nitrous oxide and methane of dry eucalypt forest?\
    \ \r\n\r\n•\tHow will climate variability, drought or fire influence the ecosystem\
    \ processes of dry eucalypt forest?\r\n\r\n. The site is on the lands of the Ngurai-illam-wurrung\
    \ Aboriginal people."
