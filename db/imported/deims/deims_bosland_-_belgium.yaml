  description: Bosland consists of 3 municipalities Lommel, Overpelt and Hechtel-Eksel
    with a total area of 21982ha. From this area, 9500 ha is nature and forest which
    consists largely of coniferous stands on sandy soil intermixed with remnants of
    heathland and landdunes.
