  description: Located in Jingdong County, Yunnan Province, China. The annual mean
    air temperature was 11.3 °C, with a minimum monthly mean temperature of 5.7 °C
    in January and a maximum monthly mean temperature of 15.6 °C in July. Average
    annual rainfall was 1778 mm, with 86.0% of this falling in the rainy season (May–October).
    The dominant tree species in the forest are Lithocarpus xylocarpus, Lithocarpus
    hancei, and Castanopsis wattii.
