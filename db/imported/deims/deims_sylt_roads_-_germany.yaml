  description: The Sylt Roads time series is closely related to the Helgoland Roads
    time series and comprises an almost identical parameter set. Sylt Roads was initiated
    in 1974 and is still ongoing. Its main station located in the Sylt-Romo bight
    close to List/Sylt (55.030000N; 8.460000E) is generally sampled twice a week.
    Two other stations (Entrance Koenigshafen 55.038300N; 8.438300E and Ferry Terminal
    55.015530N; 8.439900E) are sporadically sampled depending on tide and weather
    conditions. The measured parameters comprise phytoplankton, zooplankton, water
    temperature, salinity, pH, chlorophylla and nutrient (N,P, Si) analyses. The plankton
    time-series is augmented by the biological parameters gelatinous zooplankton,
    meroplankton, primary productivity, fish monitoring, macroalgae, macro- and microzoobenthos
    providing a unique opportunity to investigate longterm changes at an ecosystem
    scale.
