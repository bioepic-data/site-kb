sites:
- id: site_kb:deims-engure_marine_site_-_latvia
  name: Engure marine site - Latvia
  network_registrations:
  - network: DEIMS
    network_id: 3706b1ea-2aad-4363-bf4d-ba3ccba584e6
    network_url: https://deims.org/3706b1ea-2aad-4363-bf4d-ba3ccba584e6
    name: Engure marine site - Latvia
  location:
    latitude: 57.357
    longitude: 23.14
    country: Latvia
    elevation_meters: -10.0
  description: Western part of the Gulf of Riga (the Baltic Sea) littoral  and sublitoral
    zone. The marine site is located on the west coast of the Gulf, in the Engure
    Nature protected area. The monitoring activities are based on three transects
    which represent an open area of very similar substrate type. These transects are
    located on the tip of Mersrags, 2.5 km northwards from the port of Mersrags. Long-term
    studies of the Gulf of Riga coastal zone communities and macrophytes as the key
    component of littoral zone under natural and anthropogenic impact and possible
    threats to the littoral zone biological resources. The   SCUBA diving is used
    in marine site  assessment.
