  description: In the heart of the karstic massif of Fontaine-de-Vaucluse, LSBB enables
    research to be undertaken at scales that are usually unobtainable, ranging from
    flowing fractures (61 currently) to a continuum of 14,000 m2 (beneath 30 to 519
    m of cover rocks), with everything in between, in particular one block 5 m on
    a side and 20 m high (5 boreholes). It is thus possible to study problems of changing
    scales with a real ability for validation.
