    country: Brazil
    elevation_meters: 0.0
  description: The site is located at 23ºS and 42ºW, in the city of Arraial do Cabo,
    Rio de Janeiro state. The area is influenced by the upwelling of SACW (South Atlantic
    Central Water), from approximately 300 meters depth, with temperatures ranging
    from 13 to 18 ° C. The occurrence of this phenomenon is due to topographical features,
    meteorological and hydrological, unique in this region. This upwelling has attracted
    attention because of the great fishing productivity, motivating many studies on
    this issue, especially on the oceanographic processes involved. This has led to
    the creation of the second Marine Extractive Reserve of Brazil, the RESEX-Mar
    Arraial do Cabo. The results coming from LTER RECA contributes to the consolidation
    of Extractive Reserve, through the provision of scientific information generated
    in different studies.
