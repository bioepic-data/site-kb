  description: The Minneapolis-St. Paul LTER brings together dozens of researchers
    from the University of Minnesota, University of St. Thomas, USDA Forest Service,
    The Nature Conservancy, and Water Bar, to study how urban stressors affect the
    ecological structure and functioning of urban nature, including pollinators, urban
    forests, urban watersheds, and lakes and streams. MSP LTER researchers study how
    urban residents interact with urban nature across numerous municipalities in the
    seven-county Twin Cities Metropolitan Area. MSP LTER researchers aim to better
    understand urban ecosystems, as well as the policies and practices that shape
    them, to improve environmental outcomes for all residents.
