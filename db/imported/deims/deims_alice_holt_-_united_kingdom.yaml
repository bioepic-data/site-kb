  description: "UK ECN site.  Alice Holt forest lies in the Weald between the North\
    \ and South Downs in southern England. Alice Holt Forest Park covers 851 hectares\
    \ of mainly Corsican pine but approximately 140 ha. of original 1820 oak still\
    \ remain. The ancient forest is now a truly multi-purpose woodland where research,\
    \ conservation, timber production and recreation co-exist. The target sampling\
    \ square is located in 90 hectares of 80 year old semi-natural oak woodland.\r\
    \nGault clay dominates the underlying geology. For the past 25 years intensive\
    \ monitoring has been carried out under a variety of programs at this highly instrumented\
    \ site. The site is part of a network of such highly monitored forests across\
    \ both the UK and Europe. The Alice Holt site is owned by the Forestry Commission\
    \ and is run by Forest Research under the Integrated forest monitoring programme.\
    \ Collaboration with other research programs is actively encouraged."
