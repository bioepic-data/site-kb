  description: The Gulf of Venice is a gulf that borders modern-day Italy, Slovenia
    and Croatia, and is at the north of the Adriatic Sea between the delta of the
    Po river in northern Italy and the Istria peninsula in Croatia. The site is under
    a heavy antropic impact (nutrient loads, coastal towns, fishery, tourism maritime
    routes). In the past eutrophic events struck the ecosystem and, more recently,
    frequent mucus macro-aggregates extended in the whole basin. Study of long term
    historical time series of the biotic community in the Gulf of Venice in relation
    with the biogeochemical cycles and physical properties of sea-water have been
    conducted since the '70s.
