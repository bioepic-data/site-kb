  description: "The Asa LTER site consists of 5 subsites; the Asa Experimental Forest,\
    \ the Asa Experimental Production Forest, the FutMon-sites Sandbäcken and Ängavägen,\
    \ and the IM site Aneboda.\r\n\r\nThe Asa LTER site is situated in the nemo-boreal\
    \ forest in south-central Sweden. It consists of five areas, integrated both geographically\
    \ and thematically. The Asa Research Station has on-site permanent staff responsible\
    \ for research and monitoring activities. Field laboratories and modern equipment\
    \ are available as well as offices, lecture/meeting rooms, working rooms and lodging\
    \ nearby."
