  description: "This protected area is located at the ecotones between the boreal\
    \ forest and the subarctic tundra. The park was established as early as in 1909.\
    \ In this year, the first nature conservation law in Sweden was created. The mountainous\
    \ park has a surface of 77 km2 and covers an altitudinal gradient between 341\
    \ and 1191 m asl. The limits of the park are defined by mountain ranges and by\
    \ the Tornetraesk lake. Since 2007, the Natura 2000 site Nissuntjårro is connected\
    \ to Abisko National Park in the Southeast. This reserve covers additional 250\
    \ km2.\r\n\r\nThe Park and the Natura 2000 sites at Abisko are close to the larger\
    \ “Laponian Area” which is protected since 1996 as World Heritage by the UNESCO.\
    \ \r\nThe landscape and ecosystems in the area are mainly driven by natural ecological\
    \ processes such as permafrost. The topography is reflecting the glacial history.\
    \ Most famous example is the U-shaped glacial valley Lapporten close to Abisko.\
    \ The famous Abiskokanjon, a natural canyon that discharges into the Tornetraesk\
    \ Lake, is the habitat of rare birds and it was a major cause for installing the\
    \ national park. \r\n\r\nThe vegetation is dominated by birch forest and dwarf\
    \ shrub vegetation. It is rich in bryophytes and lichens. Here, at the oceanic\
    \ margin of the boreal zone, deciduous trees (Betula pubescens ssp. czerepanovi)\
    \ are replacing the dominance of conifers. Depressions in lowlands are typically\
    \ covered by mires and bogs. Above the tree line and especially at the mountain\
    \ Noulja och Slåttatjåkka outstanding species diversity is recorded, for such\
    \ a northern ecosystem. This is one of the most species-rich places in the Scandes\
    \ even hosting endemic species, which is quire rare up north. \r\n\r\nThe fauna\
    \ in the park is characterised by reindeer and moose. Small herbivores such as\
    \ lemmings are frequent, too. Main predators are golden eagles, brown bears, polar\
    \ fox, lynx and wolverine.\r\n\r\nThe location of the Abisko National Park at\
    \ the ecotones between two major biomes (boreal forest and tundra) in combination\
    \ with the strong impact of permafrost makes this landscape very sensitive to\
    \ climatic changes. One important biotic interaction is the regular outbreak of\
    \ moth populations (approx. every 10 years) causing total defoliation and even\
    \ above-ground die-off of birch at the landscape scale. Such gradations may increase\
    \ in the future as a consequence of less frost control on the insect populations.\
    \ If thresholds / tipping points would be surpassed, such warming effects could\
    \ cause as a paradox the southward shift of the tree line and further negative\
    \ implications for carbon pools and ecosystem services. On the other side an upward\
    \ and north-ward expansion of birch is also recorded. The future trends of ecosystem\
    \ development are unclear and protected areas will serve as a natural laboratory\
    \ to investigate ongoing changes that are relevant for the whole subarctic biome.\
    \ The fact that Abisko is the place of one of the most active and well-known ecological\
    \ research stations.\r\n\r\nThe whole region is sparsely settled by man. Local\
    \ Saami (or Lapp people) population’s economy is traditionally based on reindeer\
    \ herding. Abisko National Park is located in the centre of the largest area in\
    \ the world with an ancestral way of life based on the seasonal movement of livestock.\
    \ Only few cities exist in the far north so that light pollution is low. This\
    \ favours the observation of the frequent auroras in this place, 195 km north\
    \ of the Arctic Circle. Abisko National Park is of eminent importance for tourism\
    \ in this peripheral region. The most famous Swedish hiking trail, the Kungsleden,\
    \ starts at “Abisko Turiststation”. The major ecosystem services of the park are\
    \ related to the aesthetic value of the landscape with picturesque lakes, waterfalls\
    \ and mountains. Tourism is an important economic factor. The pastoral land use\
    \ based on reindeer by the local Saami people is a traditional and still important\
    \ factor as well. Finally, the contribution of the subarctic ecosystems to carbon\
    \ sequestration must be mentioned.\r\n\r\nThe Abisko Scientific Research Station\
    \ (ANS), managed by the Swedish Polar Research Secretariat, is one of the most\
    \ important boreal and arctic ecological research sites. Here, researchers from\
    \ many countries unite. Long-term data sets have been recorded and also EO approaches\
    \ have been implemented (Jonasson et al. 2012). The first station dates back to\
    \ 1903!\r\n\r\nJonasson, C.; Sonesson, M.; Christensen, T. R.; Callaghan, T. V.\
    \ (2012). Environmental Monitoring and Research in the Abisko Area—An Overview.\
    \ AMBIO 41: 178–186"
