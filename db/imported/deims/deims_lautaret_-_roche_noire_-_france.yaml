  description: The research station of Lautaret Garden is a set of infrastructures
    and human resources at the service of alpine environmental research, spread over
    two sites open all year round. One is located on the campus of the University
    Grenoble Alpes (dept 38), it is divided into greenhouses, arboretum, experimental
    zone. The other is located at the Lautaret pass (dept 05) at an altitude of 2100m.
    The site of altitude gathers an Alpine Botanical Garden, three buildings, an experimental
    zone and natural area. This structure provides field support for scientific projects,
    two laboratories, accommodation for 46 people, hydrology and climate data and
    also botanical expertise. It organizes, in its multimedia room and meeting rooms,
    trainings, thematic schools, conferences, seminars. The research themes developed
    mainly concern the ecology of environments in relation to climate, socio-ecosystems,
    adaptation of living organisms, the physical environment and biogeochemical cycles.
    Some projects have been carried out since 1980, others operate on a multi-year
    basis. The station also welcomes foreign researchers within the framework of the
    Transnational access.
