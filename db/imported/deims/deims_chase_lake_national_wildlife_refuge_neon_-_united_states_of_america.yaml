  description: Woodworth (WOOD) is a terrestrial NEON field site located just east
    of Woodworth, North Dakota. The land is managed by the U.S. Fish and Wildlife
    Service and the U.S. Geological Survey as part of the larger Chase Lake National
    Wildlife Refuge (NWR). WOOD is ecompassed in the heart of the Missouri Coteau,
    on a 10.4 km2 (2561 acre) Waterfowl Production Area dedicated to research by the
    U.S. Fish and Wildlife Service. NEON sampling at WOOD occurs across a sampling
    area of 11 km2 (2718 acres). The region includes a patchwork of grasslands, agricultural,
    and wetland/aquatic communities embedded in small agrarian communities. The site
    is a restored prairie located in an undulating matrix of small lakes, ponds, and
    ephemeral prairie potholes formed by glaciers 10,000 years ago. It is part of
    NEON's Northern Plains Domain (D09), which includes two other terrestrial field
    sites and two aquatic field sites.
