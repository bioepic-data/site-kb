  description: "SCI IT7222217 Foce Saccione-Bonifica Ramitelli (Campobasso)\r\nThe\
    \ site includes 1 Natura 2000 site along the central Adriatic coast, where the\
    \ last fragments of natural vegetation zonation on sand coastal dunes occur (shore\
    \ vegetation, embryo and mobile dune vegetation, annual Mediterranean grasses,\
    \ costa dunes with Juniperus spp and wet dune slacks)."
