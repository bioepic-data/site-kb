    name: LTSER Zone Atelier Loire - Mareau-aux-Prés Islands - France
  location:
    latitude: 47.8641389
    longitude: 1.783311111111
    country: France
    elevation_meters: 84.5
  description: The Mareau-aux-Prés islands, along the Loire river, are characterized
    by a multiple channel pattern, where natural limestone riffles influence the morphology
    and spatial distribution of vegetated islands, secondary channels and alluvial
    bars. Within these islands, in september 2012, fluvial management operations (FMO)
    were launched. The vegetation of the central sandy-gravelly bar (3 ha area) was
    uprooted and the bar level lowered in order to maintain the flow capacity of the
    river. A new sandy-gravelly bar appeared in spring 2013, ideal field support for
    studying long-term ecological issues. A multidisciplinary research program (‘BioMareau’
    project) is currently being conducted from 2012 to 2019, focusing on biodiversity
    recolonization and on interactions and feedbacks between biotic and abiotic compartments.
