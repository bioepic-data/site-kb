  description: The Darss-Zingster Bodden is a tideless flat brackish inner coastal
    water of the Southern Baltic Sea. It consists of 4 consecutive water basins connected
    by narrow streams. This forms a gradient of salinity from 1-14 PSU and a eutrophication
    gradient.
