  description: In 1998 a permanent plot (50 x 50 m) was established on the slope of
    the Nosal Mountain at the height of 970 m asl in 120 year old spruce stand, where
    in the 120-year-old spruce stand bulk deposition, throughfall and soil solution
    are collected. The investigations of health status of trees and floral characteristic
    have been carried out since 2001. The analyses are carried out in a certified
    laboratory of the Institute for Ecology of Industrial Areas, Katowice (Certificate
    No AB 325). The basic meteo data are taken from the monitoring station located
    at Kuźnice (about 1 kn from the plot).
