  description: 'The Jornada LTER (JORN) terrestrial NEON field site is located about
    40 km (24.9 mi.) from Las Cruces, New Mexico in the northern Chihuahuan Desert,
    the largest desert in North America. NEON samples approximately 45.7 km2 (11,293
    acres) on the Jornada Experimental Range, which is managed by the USDA and New
    Mexico State University. NEON research at this site happens alongside two other
    ecological monitoring groups: the National Science Foundation’s Long Term Ecological
    Research (LTER) network, and the USDA Agricultural Research Service. The region
    is dominated by arid grasslands and desert shrubs. JORN is encompassed within
    NEON''s Desert Southwest Domain (D14). D14 has one other terrestrial field site
    and one aquatic field site. JORN is not colocated with an aquatic site.'
