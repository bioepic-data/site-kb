  description: UK ECN site.  The River Lathkill is located in the Peak District National
    Park and is designated a Site of Special Scientific Interest (SSSI). The site
    is part of a the Peak District Dales SAC under the Habitats Directive. It is the
    only river in Britain which rises in, as well as flows through limestone for its
    entire length. The upper parts are a winterbourne, and in summer the stream issues
    from bubble springs lower down the valley. Downstream there are alternately moderately
    flowing gravelly sections and silted pools, some formed by natural tufa dams,
    others artificially. In the pools there are abundant submerged plants including
    species of Veronica, Ranunculus, Potamogeton and Callitriche, while faster sections
    are carpeted with bryophytes, some of which are nationally rare (eg. Cratoneuron
    commutatum). There are no direct discharges to the river. There are two licensed
    abstractions for fish rearing purposes and there are concerns over low flows which
    may affect water quality and the biota.
