  description: Posey Creek (POSE) is an aquatic site located on the Smithsonian Conservation
    Biology Institute land near Front Royal, VA. It is a small wadeable stream draining
    a 2 km2 (494 acre) watershed. The NEON field site is located within and hosted
    by the Smithsonian Conservation Biology Institute, a research and education institution
    run by the Smithsonian Institution. The surrounding area is characterized by second-growth
    Eastern Deciduous forest. This site is located within NEON's Mid-Atlantic Domain
    (D02), a densely populated region bounded by the Atlantic Ocean on the east and
    stretching down the Eastern Seaboard from southern New Jersey to northern Georgia.
    The Mid-Atlantic Domain includes one other aquatic site and two terrestrial sites.
    POSE is colocated with the SCBI terrestrial site.
