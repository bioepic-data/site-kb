  description: Las Tablas de Daimiel National Park (TDNP) is a floodplain wetland
    located at Central Spain in the core of La Mancha Húmeda Biosphere Reserve. Until
    the 1970s, wetland inundation was due to natural flooding of both the Gigüela
    and the Guadiana Rivers, and to the aquifer discharge (Llanura Manchega Occidental
    aquifer) as the groundwater table was close to the surface. Historically, the
    wetland´s inundation was also promoted by small water-mill dams which helped to
    increase the water-level. TDNP is the typical example of wetland degradation in
    the Mediterranean Europe, including dessication, agriculture conversion, groundwater
    overexplotitation and water quality impairing. Most importantly, aquifer overexploitation
    resulting from excessive agricultural irrigation strongly changed the ecosystem
    hydrology from a semi-permanent wetland to a highly fluctuating ecosystem with
    long periods (several years) of almost complete dryness. From the 1870s until
    the 1950s, the area was a private hunting park. It then became a National Hunting
    Reserve and later, in 1973, a National Park. It was included in the Ramsar convention
    in 1982. Its main environmental values are the large waterfowl populations, the
    European cut-sedge and the reed, and the plasticity of the ecosystem to absorb
    different threats.
