  description: "Located 2 km east of the Science Campus of the University of Poitiers,\
    \ the Hydrogeological Experimental Site (HES) occupies an area of 12 hectares\
    \ on land belonging to the University. \r\nFrom the geologic viewpoint the SEH\
    \ occupies the north flank of the “Seuil du Poitou”, a huge Mesozoic carbonate\
    \ plateau marking the transition between the Aquitaine and Paris sedimentary basins.\
    \ The studies conducted at the SEH focus mainly on the Dogger Aquifer.\r\nThe\
    \ experimental layout now comprises 35 boreholes, including two vertical and two\
    \ inclined cored holes."
