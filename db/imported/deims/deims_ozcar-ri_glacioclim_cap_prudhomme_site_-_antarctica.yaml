  description: Cap Prud'homme (CAP) is located on the coast of the Antractic Ice sheet
    (Dumont d'Urville station). Mass balance is measured alo,g 3 different stake networks
    at the camp and over 150 km inland. Meteorological information are recorded at
    2 stations. Dynamics of the ice is measured on the Astrolabe glacier. CAP is a
    part of the French Glacier Observatory GLACIOCLIM/CRYOBS-CLIM.
