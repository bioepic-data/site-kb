  description: The  site covers the whole catchment of the small river “Quillow” and
    it is called “AgroScapeLab Quillow” (https://doi.org/10.4228/zalf.7161-ft27).
    It is located in the north-east lowlands (Uckermark) which is about 90 km North
    of Berlin and has an area of about 160 km2. It’s a hummocky landscape characterized
    by gently rolling hills which are the results of glaciation during the Pleistocene.  Unconsolidated
    sediments in a complex setting dominate. The soil pattern of the Quillow catchment
    is related to topography and the heterogeneity of Pleistocenic deposits. Albic
    Luvisols, Calcaric Regosols, Calcic Luvisols and Gleyic-Colluvic Regosols can
    be found. Another result of the ice age forces are the kettle holes (little ponds)
    which developed in drainless depressions.  74 % of the land is in agricultural
    use.  Small forest patches can be found in the western and southwestern part of
    the catchment, grassland more in the eastern lowlands.  In general the area is
    only sparsely populated. The ZALF research platform is located in Dedelow (https://doi.org/10.4228/zalf-m262-ap29).
