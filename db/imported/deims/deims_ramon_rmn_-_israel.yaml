  description: 'The site is located between two bio -geographical zones arid and hyper-arid,
    the research is carried out by both sides. The arid side is characterized by remains
    of terraces from the Nabatean agriculture runoff. The main research topics that
    being studied in the site are: biodiversity, climate change, runoff hydrology.
    The arid zone is a geo hydrological ecological system which is depended on a combination
    of rainfall and runoff that creates water enriched parches that support relatively
    high biodiversity. The hyper arid zone is runoff depended system the source of
    runoff are stipe, slope consist on bare bedrock, biological activities are constructed
    in the dry riverbeds that functions as sinks for the runoff generated from the
    slopes.'
