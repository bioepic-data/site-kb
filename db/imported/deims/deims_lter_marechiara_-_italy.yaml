    name: LTER MareChiara - Italy
  location:
    latitude: 40.808
    longitude: 14.25
    country: Italy
    elevation_meters: -35.0
  description: The Gulf of Naples has an extension of ca 870 kmq and an average depth
    of 170 m. The coastal area, which is inhabited since pre-Roman age, is densely
    populated and small factories are actively growing. In the Gulf, polluted areas
    (Sarno river mouth, harbours) coexist with pristine areas, including some Protected
    Marine Areas. Research on marine organisms has started before since the beginning
    of 1800, but first ecological studies date back to the 70ies of the last century.
    The long-term monitoring station (LTER-MC, 40°49’N, 14°15’E) is located 2 nm off
    Naples city (depth ca 75 m) at the boundary between eutrophied coastal waters
    and oligotrophic Tyrrhenian waters. Larger areas of the Gulf have been sampled
    occasionally in several cruises. The MC data set represents one of the few plankton
    time series available in the Mediterranean Sea, and it is certainly one of the
    longest.
