  description: Delta Junction (DEJU) is a terrestrial NEON field site located in central
    Alaska, approximately 150 km (93 mi.) southeast of Fairbanks and 15 km (9 mi.)
    south of the community of Delta Junction. The 29.9 km2 (7390 acre) site is managed
    by the U.S. Bureau of Land Management. It sits within the Tanana Valley at an
    elevation of 440 - 485 m (1400 - 1600 ft.), 30 km (18 mi.) from the confluence
    of the Tanana and Delta Rivers. The location is bordered to the north by the White
    Mountains, to the southeast by the Granite Mountains, and to the southwest by
    the Alaska Range. DEJU is one of the four sites (three terrestrial and one aquatic)
    located in the NEON Taiga Domain (D19), which comprises Alaska’s interior and
    the Alaska Peninsula.
