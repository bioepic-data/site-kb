  description: The Niwot Ridge Mountain Research Station (NIWO) is a terrestrial site
    within the Front Range of the Rocky Mountains, 27 km (16.8 mi.) west of Boulder,
    Colorado and 6 km (3.7 mi.) east of the Continental Divide. NEON collects data
    over 13.4 km2 (3311 acres) at the site, which is on land managed by the University
    of Colorado in Boulder and the U.S. Forest Service. Sitting at 3000-3600 m (9843-11810
    ft.) in elevation, this site's climate and biota are representative of the diverse
    landscapes of the Southern Rocky Mountains. Diverse gradients allow NEON to challenge
    questions surrounding land use change, climate impacts, and disturbance processes
    at multiple elevations. NIWO is part of NEON's Southern Rockies and Colorado Plateau
    Domain (D13). D13 includes one other terrestrial site and two aquatic sites. NIWO
    is located near the COMO aquatic site.
