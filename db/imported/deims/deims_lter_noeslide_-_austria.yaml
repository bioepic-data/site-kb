    elevation_meters: 495.0
  description: Landslides (translational and rotational slides, debris flows, rock
    avalanches, rock falls, etc.) rank among the most common natural hazards in Lower
    Austria. As these processes often inherit sporadic phases of activity, it is essential
    to generate specific long-term measurement series, enabling the analysis of surface
    and sub-surface dynamics in connection with potential triggering factors. Therefore,
    in 2014 the project “NoeSLIDE – Monitoring diverse types of landslides in Lower
    Austria” was initiated. Three subsites are summarized under the parent site "LTER
    NoeSLIDE".where various types of landslide processes, Hofermühle (complex earth
    slide - earth flow), Gresten (Salcher landslide) and Brandstatt are monitored
    with "classic" as well as novel approaches.  This includes surface and subsurface
    monitoring systems. The main research aims comprise implementation of long-term
    monitoring systems (10+ years) for continuous observation of gravitational mass
    movements, testing of novel and innovative methods on multiple locations and data
    availability in a WebGIS application for simple online analyses for authorized
    users.
