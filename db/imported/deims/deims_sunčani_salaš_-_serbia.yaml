sites:
- id: site_kb:deims-sunčani_salaš_-_serbia
  name: Sunčani salaš - Serbia
  network_registrations:
  - network: DEIMS
    network_id: 5f5c850d-0036-49ac-97be-f9b314898607
    network_url: https://deims.org/5f5c850d-0036-49ac-97be-f9b314898607
    name: Sunčani salaš - Serbia
  location:
    latitude: 46.17449307
    longitude: 19.700538194
    country: Serbia
    elevation_meters: 100.0
  description: The site is a revitalized young steppe habitat patch, dominated by
    fescue (Festuca rupicola). The average altitude is around 100 m. The site is a
    grazing spot and it was recently used for the reintroduction of the European ground
    squirrel (Spermophilus citellus) to the area after 70 years. Other important species
    present at the site include Vojvodina blind mole rat (Nannospalax (leucodon) montanosyrmiensis)
    and Spring meadow saffron (Bulbocodium versicolor).
