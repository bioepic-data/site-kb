  description: 'UNDE is a terrestrial NEON sampling site located at the University
    of Notre Dame Environmental Research Center (UNDERC), found between Northern Wisconsin
    and Michigan’s Upper Peninsula on the southwestern edge of Ottawa National Forest.
    NEON samples 29.39 km2 (7262 acres) of area within UNDERC. This NEON site is very
    distinct from NEON''s other terrestrial sites in this area, Treehaven and Steigerwaldt,
    because of its minimal forest management. The landscape at the site features primarily
    second-growth mixed forest dominated by red and sugar maple, aspen, and birch.
    It also contains 30 different lakes, including the NEON aquatic site at Crampton
    lake. UNDE is located within the Great Lakes Domain (D05), which includes northern
    Ohio, Michigan, northern Wisconsin, and parts of Indiana and Illinois. D05 hosts
    four other NEON field sites: two aquatic and two terrestrial, located in Wisconsin
    and Michigan.'
