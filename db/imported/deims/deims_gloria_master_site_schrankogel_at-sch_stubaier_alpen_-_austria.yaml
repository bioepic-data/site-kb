  description: "GLORIA Master Site.The 3497m-peak Mount Schrankogel belongs to the\
    \ highest mountains of the Austrian Alps. Its northern and eastern side is surrounded\
    \ by glaciers and glacier forelands. Its southern to western faces, however, are\
    \ not interrupted by glacier\r\n\r\nEstablished in 1994 as the first comprehensive\
    \ alpine to nival long-term monitoring site for high-altitude vegetation in the\
    \ Alps, with ca. 1000 permanent plots of 1x1m arranged in transects of 30x3m or\
    \ smaller ranging from 2900m to 3450m. Main purpose is ecological climate impact\
    \ research. In 2001 it became a master site of the GLORIA network: e.g. method\
    \ development and testing for species recording in 1x1m plots for GLORIA was partly\
    \ conducted on Schrankogel. The first major resurvey of plots was made in 2004,\
    \ the second resurvey was conducted in 2014. Besides long-term monitoring, several\
    \ other research approaches were/are carried out at the Schrankogel site, such\
    \ as species and vegetation modeling, vegetation mapping, phenological studies\
    \ of alpine and nival plants, exclosure studies for grazing impacts at the lower\
    \ altitudes of the site, soil studies, snow pattern studies (two permanent snow\
    \ cameras), surface and soil-temperature measurements. In 2014, the the scope\
    \ was extended to other organism groups such as soil microbiota, soil mesofauna\
    \ (Oribatida and Collembola in particular), and surface-dwelling arthropods.\r\
    \nSite setup, resurveys, or other activities were/are supported by: the Austrian\
    \ Academy of Sciences through a national grant of the International Geosphere–Biosphere\
    \ and the UNESCO MaB Programmes, by the Austrian and through the Institute of\
    \ Mountain Research (IGF) of the Academy; by the Austrian Federal Ministry of\
    \ Science and Research; the Austrian Federal Ministry of Agriculture, Forestry,\
    \ Environment and Water Management; the Swiss MAVA Foundation; the Government\
    \ of Tyrol; the project ALARM (Assessing Large-Scale Risks for Biodiversity with\
    \ Tested Methods; No. GOCE-CT-2003-506675) in the FP-6 of the EU; the Austrian\
    \ Climate Research Programme (ACRP: GZ B368633 ACRP6 - SCHRANKOGEL_20YEARS - KR13AC6K11076).\r\
    \n\r\nFor further details on Schrankogel_GLORIA see: http://www.gloria.ac.at/?a=42&b=56"
