  description: Oksrukuyik Creek (OKSR) is an aquatic NEON field site located on the
    North Slope of Alaska. It is NEON's northernmost aquatic site. Oksrukuyik Creek
    is a wadeable stream flowing through the open tundra north of the Brooks Range
    before draining into the Sagavanirktok River. It is encompassed within a 57.8
    km2 (14,300 acre) watershed. Managed by the Bureau of Land Management, Oksrukuyik
    Creek has been a popular subject of study due to its proximity to Toolik Field
    Station, whose teams have been studying the creek for decades as part of the Arctic
    Long-Term Ecological Research Network (ARC LTER). OKSR is part of NEON’s Tundra
    Domain (D18), which includes the northern and western parts of Alaska. D18 has
    two terrestrial sites and one other aquatic site. OKSR is colocated with the TOOL
    terrestrial site and is also near the Toolik Lake (TOOK) aquatic site.
