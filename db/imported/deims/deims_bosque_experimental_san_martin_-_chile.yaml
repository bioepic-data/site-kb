  description: The site covers an area of 200 hectares of well-preserved native forest,
    which has remained unmanaged since it was donated to the University by Don Adolfo
    Woerner in the early 1970s. The Bosque San Martín Experimental Station of the
    Austral University of Chile , is probably one of the oldest long-term study sites
    in the country. Scientific research is developed from multiple disciplines such
    as biology, evolution, botany and zoology, among others, applied to forest ecology,
    climate change, functional ecology and mammalian ecology. The site has an installed
    infrastructure that also represents a permanent training resource for our undergraduate
    and graduate students.
