  description: "Kolari Field Site is a part of Natural Resources Institute Finland's\
    \ (Luke) location in Rovaniemi. It is located in northwest Finland at 67° N, close\
    \ to the Swedish border. The surrounding area consists of  northern forests and\
    \ peatlands, as well as mountains  up to 700 m a.s.l. Kolari village is approximately\
    \ 4 km, and the Muonio River is approximately 300 meters away from the station.\
    \ The Pallas-Ylläs National Park is located 30 km from station. Geographically,\
    \ the Kolari area is located between Northern Finland, Forest Lapland and Fell\
    \ Lapland. Snow covers the landscape from November to May.\r\n\r\nThe technical\
    \ staff and facilities based in Kolari support ecological research in northern\
    \ Finland, focusing on north boreal forests and peatlands as well as on fish populations\
    \ in the Tornionjoki river system. ICP Forests Level II site in Pallasjärvi and\
    \ many other Luke’s long-term forest and peatland experiments, including managed\
    \ and semi-natural reference areas (trials on tree breeding and progeny, fertilization,\
    \ northern timberline forests) are largely maintained from Kolari. Research carried\
    \ out on nature-based tourism is also supported."
