  description: Located in the Cape Horn Biosphere Reserve (UNESCO 2005), the southernmost
    part of Chile, the Omora Park has a mountain landscape covered by subantarctic
    forests and wetlands. Omora Park is a botanical garden and protected area, in
    the north of the Navarino Island, Cape Horn, Region of Magallanes, on the southern
    shore of the Beagle Channel. This park develops scientific research, education,
    philosophy, ethics and conservation of the species of the Chilean southern region.
