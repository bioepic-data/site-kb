    country: Brazil
    elevation_meters: 785.0
  description: The site consists of 13 Cerrado fragments formed by five conservation
    areas and 8 remants of semideciduous forests. All these areas are within the basin
    of the Rio Paranaiba and thus share similar ecological conditions. These areas
    have similar human interference processes with already traditional agricultural
    use, impacts of hydroelectric facilities and recent intensification of the urbanization
    process.
