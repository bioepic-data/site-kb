  description: "Mols Bjerge National Park or Nationalpark Mols Bjerge is a Danish\
    \ national park in the area known as Mols Bjerge (lit.: Mols Hills) in Syddjurs\
    \ Municipality, Central Jutland, inaugurated on the 29th of August 2009. The protected\
    \ area, measures 180 square kilometres (69 sq mi) in size. The Mols Hills, reaching\
    \ a height of 137 metres (449 ft), are centrally located in the park, and take\
    \ up 2,500 ha. \"More than half of all wild Danish plant species\" can be found\
    \ at Mols Bjerge.\r\nThe park comprise most of the southern parts of the headland\
    \ of Djursland. It is bounded on the east by the sea of Kattegat, the forests\
    \ of Kaløskovene in the west and to the south by multiple inlets, coves and plains\
    \ of glacially generated moraine. The town of Ebeltoft, along with villages and\
    \ summer house residence areas, are considered part of the park. Land in the national\
    \ park is held under both private and state ownership. Nearly 33% of the park\
    \ is cultivated and 80% of the hill area is under private ownership.\r\nMols Bjerge\
    \ National Park has a rolling and widely varying topography of woodlands and open\
    \ countryside, created with the end of the last ice age. Elevation in the park\
    \ area varies in height rising to a maximum of 137 metres (449 ft) in Mols Hills,\
    \ with many types of habitats such as heath, forests, pastures, bogs, meadows,\
    \ a variety of coastal habitats and sea"
