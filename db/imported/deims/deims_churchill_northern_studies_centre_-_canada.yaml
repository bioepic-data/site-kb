  description: Major research conducted through the CNSC include auroral research,
    climate change, climatology, greenhouse gas emissions, inland water quality, marine
    ecosystems, northern ecology, peatland and treeline dynamics, snow pack dynamics,
    and wildlife management. The centre facilitates the work of between 100 and 175
    researchers annually. In addition, the centre host citizen science research programs
    funded by Earthwatch Institute under the "Climate Change at the Arctic's Edge".
