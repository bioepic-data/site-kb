  description: The grassland site is located in the area of Muntatschinig (Monteschino)
    and comprises meadows and dry pastures at an elevation of app. 1500m a.s.l.. The
    site was first established in 2008 as a weather station and was expanded in the
    following years. In 2010 the University of Innsbruck installed an eddy covariance
    station. Nine automatic lysimeters were added to measure evapotranspiration and
    water use efficiency. Since 2012 a rain-out shelter system has been used for simulating
    spring and summer droughts. This site is one of the sites along the elevation
    transect used for grassland studies.
