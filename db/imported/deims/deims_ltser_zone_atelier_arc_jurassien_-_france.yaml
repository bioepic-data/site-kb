  description: "Socio-ecological interactions in ecosystems of mid-altitude mountains\r\
    \nThe LTSER Zone Atelier Arc Jurassien belongs to LTER-France network and is located\
    \ in eastern France.The LTSER site Jurassian Arc (ZAAJ stands for Zone atelier\
    \ Arc jurassien, in French) is designed to promote long-term interdisciplinary\
    \ research into the environment and ecosystems in relation to society issues.\
    \ It federates a network of research partnerships around interactions between\
    \ the environment, society and the dynamics of moutain socio-ecological systems.ZAAJ\
    \ helps to capitalise on field data and to analyze and promote the results from\
    \ long-term observation schemes at the interface between ecology, the environment\
    \ and society. Benefiting of more than 25 years of experience on the issue, accredited\
    \ by the CNRS Ecology and Environment Institute (INEE) in 2013, ZAAJ is a cluster\
    \ of five research units totalling 40 researchers."
