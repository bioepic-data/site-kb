  description: "Berchtesgaden National Park was established in 1978 and is the only\
    \ German national park located at the Alps. It comprises three major valleys and\
    \ covers an elevantional range from 600 to 2700 m. Ecosystems include montane\
    \ mixed forest and subalpine coniferous forest, alpine grasslands, pastures and\
    \ rocky habitats. \r\nThe Department for Research and Monitoring is linked to\
    \ the Techincal University of Munich. It conducts monitoring on climate, hydrology,\
    \ ecosystem dynamics and biodiversity. Main research topics include drivers of\
    \ natural ecosystem dynamics, human impacts on ecosystems and climate change effects\
    \ on ecosystems."
