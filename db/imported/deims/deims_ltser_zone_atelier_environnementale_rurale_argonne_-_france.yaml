  description: The LTSER Zone Atelier environnementale rurale Argonne (ZARG) belongs
    to LTER-France network and is located in north-eastern France. The ZARG project
    was created in 2021, but fully labelled in 2023. ZARG focuses on socio-environmental
    topics, such as environmental protection, sustainable development and natural
    resource management, in the social context of high rurality, with a mean density
    of population around 16 inhabitants per km². The structure involve researchers
    from French national research centers or instituts (CNRS, INRAE), six French universities,
    and a local territorial association. Research programs carried out by ZARG members
    relie on a strong implication of local authorities and socio-economical actors.
