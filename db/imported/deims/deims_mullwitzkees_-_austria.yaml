  description: "The Mullwitzkees is located in the Venediger Group in the core zone\
    \ of the National Park\r\nHohe Tauern. The upper part of the glacier (outer Mullwitzkees)\
    \ is oriented to the south.The lower part of the glacier, especially the tongue,\
    \ is oriented to West-South-West."
