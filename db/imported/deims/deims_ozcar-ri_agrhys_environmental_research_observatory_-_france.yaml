  description: The ERO AgrHyS aims at studying the response time of hydro-chemical
    fluxes to the evolution of AgroHydroSystems. An AgroHydroSystem is considered
    as a catchment that is influence by agricultural activity. The ERO AgrHyS is conducted
    by the laboratory INRA-Agrocampus Sol, Agro-hydroSystems of Rennes. Two other
    labs, Geosciences Rennes and COSTEL Rennes, are associated to the ERO AgrHyS.
    It is part of the observation set-ups of the Observatory of the Sciences of the
    Universe of Rennes OSUR.
