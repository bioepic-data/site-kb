  description: "The Desert Ecology Plot Network is located in the Simpson Desert in\
    \ central Australia.\r\n\r\nThe vegetation in the study region is dominated by\
    \ hard spinifex (Triodia basedowii E. Pritz), with scattered small woodlands of\
    \ Georgina gidgee (Acacia georginae F.M. Bailey) interspersed throughout (Figure\
    \ 9.1). The long-term plots for which data are provided as part of LTERN infrastructure\
    \ are all located within the spinifex hummock grasslands, but additional survey\
    \ plots, situated in gidgee woodlands, exist and have\r\nbeen surveyed since 2006\
    \ and are revisited whenever possible. \r\n\r\nTemporal visits are conducted annually.\r\
    \n\r\nThe Desert Ecology Plot Network was a member of Long Term Ecological Research\
    \ Network (LTERN), Australia, a facility of the Australian Government's Terrestrial\
    \ Ecosystem Research Network (TERN)."
