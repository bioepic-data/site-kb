  description: "The site is divided into two different types of environments:\r\n\
    1. Coastal marine environments. Marine coastal areas of Sardinia, in particular,\
    \ the Gulf of Asinara in the north and the Gulf of Olbia in the north-east, affected\
    \ by different types and intensities of human impact and by the resulting presence\
    \ of different environmental conditions from the point of view of water quality.\r\
    \n2. Lagoons and coastal ponds. Lagoons and coastal ponds located along the west-central\
    \ coast of Sardinia, in the Gulf of Oristano. These sites are all important wetlands\
    \ included in the Ramsar Convention, are IBA (Important Birds Area) and SIC and\
    \ ZPS. The ownership of the sites is the Regional Government of Sardinia. Fisheries\
    \ and aquaculture are generally the most important human activities, and there\
    \ are also educational and recreational activities. They are affected by various\
    \ environmental issues, mostly related to the process eutrophic."
