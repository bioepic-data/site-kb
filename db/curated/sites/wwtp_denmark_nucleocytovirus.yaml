    latitude: 57.045161
    longitude: 10.045761
  description: Danish activated-sludge wastewater treatment plant (study code AalE) in the
    23-plant long-read metagenome set of Singleton et al. 2021, reanalysed for giant viruses,
    virophages and polinton-like viruses by Lücking et al. 2026.
  evidence:
  - supports:
    - /name
    - /aliases
    - /location/country
    - /location/latitude
    - /location/longitude
    source_url: https://www.ebi.ac.uk/ena/browser/view/SAMN14825666
    source_label: ENA/NCBI BioSample SAMN14825666 (AalE_18-Q3-R2-46)
    locator: geo_loc_name and lat_lon attributes
    accessed_on: '2026-10-24'
    notes: 'Verbatim geo_loc_name is ''Denmark: Aalborg E''. The display name restores Danish
      characters / translates the compass suffix; the verbatim form is kept as an alias. All
      4 PRJNA629478 runs for code AalE carry the same lat_lon. No datum is given, and the
      point is the submitter''s plant location, not a surveyed sampling point.'
  - supports:
    - /description
    - /site_type
    source_url: https://doi.org/10.1038/s41467-021-22203-2
    source_label: Singleton et al. (2021), Nature Communications
    locator: Methods, Sample processing and DNA extractions
    accessed_on: '2026-10-24'
    notes: Fresh activated-sludge samples were received from 23 Danish WWTPs in August and
      September 2018.
  datasets:
  - title: Danish activated-sludge Illumina and Nanopore metagenomes (Singleton et al. 2021)
    url: https://www.ebi.ac.uk/ena/browser/view/PRJNA629478
    accession: PRJNA629478
    assay: Shotgun metagenomics (Illumina HiSeq and Oxford Nanopore PromethION)
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1038/s41467-021-22203-2
    - https://doi.org/10.1093/ismejo/wrag267
    - https://www.ebi.ac.uk/ena/browser/view/SAMN14825666
    notes: 'Shared 23-plant project; only runs with sample_alias prefix AalE belong to this
      plant. Nanopore run SRR11673988 (BioSample SAMN14825666, collected 2018-08-29). Illumina
      BioSamples: SAMN14825664 (2016-08-30), SAMN14825665 (2017-08-30), SAMN14825666 (2018-08-29).
      The 2016 and 2017 Illumina samples supplied differential coverage for binning. The August–September
      2018 sample is the one with long-read sequencing.'
  - title: Lücking et al. 2026 nucleocytovirus, virophage and PLV genomes and network data
    url: https://doi.org/10.5281/zenodo.17735769
    accession: 10.5281/zenodo.17735769
    assay: Viral genomes, annotations and co-occurrence network derived from metagenomes
    availability: PUBLIC
    evidence:
    - https://doi.org/10.1093/ismejo/wrag267
    - https://doi.org/10.64898/2026.05.21.726523
    - https://doi.org/10.5281/zenodo.17735769
    notes: Study-wide derived data for all 23 plants; not specific to this plant. ENA project
      PRJEB105214 is registered for the genomes but returned no public analyses or samples
      on 2026-10-24.
  variables:
  - variable_id: site_kb:variable-giant-virus-contig-recovery
    evidence:
    - https://doi.org/10.1093/ismejo/wrag267
    - https://doi.org/10.64898/2026.05.21.726523
    method: Mining of the Singleton et al. long-read/hybrid assemblies; bowtie2 short-read
      mapping and samtools per-contig coverage
    sample_context: One activated-sludge metagenome per plant (AalE_18-Q3-R2-46). Per-plant
      contig counts are in Fig. 2d; not transcribed here.
    sampling_period: August–September 2018 (Singleton et al. 2021)
  notes: Curated 2026-10-24 from Lücking et al. 2026 (https://doi.org/10.1093/ismejo/wrag267;
    preprint https://doi.org/10.64898/2026.05.21.726523) and the archived ENA inventory in
    db/raw/research/denmark_nucleocytovirus_ena.json. The paper names only Hirt and AalW in
    its text; the 23-plant identity comes from its stated source, Singleton et al. 2021, and
    PRJNA629478. Plant-level viral genome counts were not transcribed. A study association,
    not a claim of current monitoring.
