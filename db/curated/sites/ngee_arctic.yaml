- id: site_kb:ngee-arctic-utqiagvik
  name: NGEE Arctic Utqiagvik (Barrow), Alaska
  aliases:
  - NGEE Arctic Barrow
  - NGEE Arctic Utqiaġvik
  description: NGEE Arctic field location near Utqiaġvik, including research on polygonal
    tundra at the Barrow Environmental Observatory.
  location:
    country: United States
    state_province: Alaska
  network_registrations:
  - network: NGEE_ARCTIC
    network_id: https://ngee-arctic.ornl.gov/locations/ngee-arctic-utqiagvik-barrow-alaska
    network_url: https://ngee-arctic.ornl.gov/locations/ngee-arctic-utqiagvik-barrow-alaska
    name: NGEE Arctic Utqiagvik (Barrow), Alaska
  notes: Reviewed 2026-10-15 from https://ngee-arctic.ornl.gov/locations/ngee-arctic-utqiagvik-barrow-alaska
    and https://ngee-arctic.ornl.gov/summary . This is the NGEE field-location scope,
    which overlaps the broader DEIMS Barrow Arctic Research Center and Barrow Environmental
    Observatory record (deims:6b3b8511-2669-4170-8487-17e135578dad). Exact footprint
    equivalence is not established, so records are not merged and the DEIMS facility
    coordinates are not copied. It is not asserted to be identical to the NEON Utqiagvik
    site.
